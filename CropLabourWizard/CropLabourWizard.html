<!-- CropLabourWizard.html — Crop schedule calculator for SitkaGit suite -->
<!-- Tool: CropLabourWizard | Purpose: Auto-generate full cultivation timeline as calendar events per lot -->
<!-- Database Keys: "_tool_CropLabourWizard" (per-lot), "_CropLabourWizard" (top-level), "calendarEvents" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Labour Wizard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #53d8a8;
            --accent-hover: #3fb98b;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8b8;
            --border: #2a2a4a;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --warning: #f39c12;
            --input-bg: #1a1a3e;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 24px; }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .header-right { display: flex; gap: 8px; align-items: flex-end; }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }

        /* ---- Status Bar ---- */
        .status-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-bar.loaded { border-color: var(--accent); }

        /* ---- Card ---- */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
        }

        /* ---- Form (kept for future use) ---- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ---- Buttons ---- */
        .btn {
            padding: 10px 24px;
            border-radius: var(--radius);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { border-color: var(--text-secondary); }

        /* Project Crop button in the header — same height as the lot dropdown (matching its padding);
           greys out when the selected lot can't be projected */
        .btn-project { padding: 10px 12px; white-space: nowrap; }
        /* Bloom length toggle — two small stacked buttons left of Project Crop (8 / 9 weeks) */
        .bloom-toggle { display: flex; flex-direction: column; gap: 4px; }
        .bloom-btn { padding: 3px 8px; font-size: 0.7rem; white-space: nowrap; }
        .bloom-btn.active { border-color: var(--accent); color: var(--accent); font-weight: 700; }
        .header-right .form-group { margin-bottom: 0; } /* bottom-align button + dropdown in the header row */
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn:disabled:hover { border-color: var(--border); background: var(--bg-card); }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover { background: var(--danger-hover); }

        /* ---- Footer ---- */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        /* ---- Toast notification ---- */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 24px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Mobile Import Banner ---- */
        .mobile-banner {
            background: var(--bg-card);
            border: 1px solid var(--warning);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--warning);
            display: none;
            align-items: center;
            gap: 10px;
        }

        .mobile-banner.show {
            display: flex;
        }

        .mobile-banner-text {
            flex: 1;
        }

        .mobile-banner-text strong {
            display: block;
            margin-bottom: 2px;
        }

        .mobile-banner-text span {
            font-size: 0.8rem;
            opacity: 0.85;
        }

        #dbImportInput {
            display: none;
        }

        /* ---- Form Row (side-by-side fields) ---- */
        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group { flex: 1; }

        /* ---- Task List ---- */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .task-item:hover { border-color: var(--accent); }

        .task-emoji {
            font-size: 1.2rem;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-type-badge {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-date-badge {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .task-delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .task-item:hover .task-delete-btn { opacity: 1; }
        .task-delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        /* ---- Schedule Config Summary ---- */
        .config-summary {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: var(--bg-card);
            border-radius: var(--radius);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .config-summary span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .config-summary strong {
            color: var(--accent);
        }

        /* ---- Empty State ---- */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ---- Form Actions Row ---- */
        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* ---- Preview Task List ---- */
        .preview-task-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preview-task-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            row-gap: 6px;
            transition: border-color 0.2s;
        }

        .preview-task-item:hover { border-color: var(--accent); }

        .preview-task-emoji {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }

        .preview-task-info {
            flex: 1;
            min-width: 0;
        }

        .preview-task-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-task-reference {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .preview-task-reference strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* ---- Offset input group ---- */
        .preview-offset-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .preview-offset-group label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .preview-offset-group input[type="number"] {
            width: 52px;
            padding: 4px 6px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.82rem;
            text-align: center;
            transition: border-color 0.2s;
        }

        .preview-offset-group input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .preview-offset-group input[type="number"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ---- Multi-day toggle (Harvest) ---- */
        .preview-multiday-label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            color: var(--text-secondary);
            white-space: nowrap;
            cursor: pointer;
            flex-shrink: 0;
        }

        .preview-multiday-label input[type="checkbox"] {
            margin: 0;
            accent-color: var(--accent);
        }

        /* Remove number spinners */
        .preview-offset-group input[type="number"]::-webkit-inner-spinner,
        .preview-offset-group input[type="number"]::-webkit-outer-spinner {
            -webkit-appearance: none;
            margin: 0;
        }
        .preview-offset-group input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ---- Spinbox +/- Buttons ---- */
        .spinbox-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .spinbox-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--input-bg);
        }

        .spinbox-btn:active {
            transform: scale(0.92);
        }

        .spinbox-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ---- Computed date badge ---- */
        .preview-computed-date {
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 90px;
            text-align: center;
        }

        .preview-computed-date.multi {
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        /* ---- Clickable computed date — opens the custom date picker ---- */
        button.preview-computed-date.clickable {
            cursor: pointer;
            font-family: inherit;
            border: 1px solid var(--border);
            transition: border-color 0.15s, color 0.15s;
        }

        button.preview-computed-date.clickable:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Multi-day (Trim) keeps its warning border even on hover */
        button.preview-computed-date.clickable.multi {
            border-color: var(--warning);
        }

        /* ---- Custom Date Picker Popup ---- */
        .dp-popup {
            position: fixed;
            z-index: 400;
            width: 296px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.55);
            padding: 12px;
        }

        .dp-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .dp-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .dp-nav-btn {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s;
        }

        .dp-nav-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .dp-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .dp-weekday {
            font-size: 0.68rem;
            color: var(--text-secondary);
            text-align: center;
            padding: 4px 0;
            letter-spacing: 0.5px;
        }

        .dp-day {
            position: relative;
            height: 32px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-primary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.12s, color 0.12s;
        }

        .dp-day:hover {
            background: var(--input-bg);
            color: var(--accent);
        }

        .dp-day.blank {
            cursor: default;
        }

        .dp-day.blank:hover {
            background: transparent;
            color: var(--text-primary);
        }

        .dp-day.today {
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .dp-day.selected {
            background: var(--accent);
            color: var(--bg-primary);
            font-weight: 700;
        }

        /* Amber dot under days that are observed BC civic holidays */
        .dp-day.holiday::after {
            content: '';
            position: absolute;
            bottom: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--warning);
        }

        .dp-day.selected.holiday::after {
            background: var(--bg-primary);
        }

        .dp-footer {
            display: flex;
            justify-content: center;
            margin-top: 8px;
        }

        .dp-today-btn {
            border: none;
            background: none;
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .dp-today-btn:hover {
            background: var(--input-bg);
        }

        .hidden { display: none !important; }

        /* ---- Holiday flag — shown next to a task's date when it lands on an observed BC civic holiday ---- */
        .holiday-flag {
            font-size: 0.7rem;
            color: var(--warning);
            background: rgba(243, 156, 18, 0.12);
            border: 1px solid var(--warning);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: help;
        }

        /* ---- Holiday conflict banner — lists tasks that fall on BC civic holidays (notify only) ---- */
        .holiday-conflict-banner {
            background: rgba(243, 156, 18, 0.1);
            border: 1px solid var(--warning);
            border-radius: var(--radius);
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--text-primary);
        }

        .holiday-conflict-banner strong {
            color: var(--warning);
            display: block;
            margin-bottom: 4px;
            font-size: 0.82rem;
        }

        .holiday-conflict-banner ul {
            margin: 0;
            padding-left: 18px;
            color: var(--text-secondary);
        }

        .holiday-conflict-banner li {
            margin-top: 2px;
        }

        /* ---- Custom Checkbox ---- */
        .task-enabled-check {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-radius: 4px;
            background: var(--input-bg);
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all 0.2s;
        }

        .task-enabled-check:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .task-enabled-check:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--bg-primary);
            font-size: 11px;
            font-weight: 700;
        }

        .task-enabled-check:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Disabled task styling */
        .preview-task-item.disabled {
            opacity: 0.35;
        }
    </style>
</head>
<body>
    <!-- Header (lot-focused tool — Active Lot selector) -->
    <header class="header">
        <div class="header-left">
            <span class="logo">👷 Crop Labour Wizard</span>
        </div>
        <div class="header-right">
            <div class="bloom-toggle" title="Bloom length used when projecting crops (clone cut stays at harvest − 21)">
                <button type="button" id="bloom8Btn" class="btn btn-secondary bloom-btn">8 weeks</button>
                <button type="button" id="bloom9Btn" class="btn btn-secondary bloom-btn active">9 weeks</button>
            </div>
            <button type="button" class="btn btn-secondary btn-project" id="generateProjectionsBtn" disabled title="Select a lot to project its crop">🔮 Project Crop</button>
            <button type="button" class="btn btn-secondary btn-project" id="clearProjectionsBtn" disabled title="Clears all projections for the selected lot's room">🧹 Clear Projections</button>
            <div class="form-group">
                <label for="activeLot">Active Lot</label>
                <select id="activeLot">
                    <option value="">— Select a lot —</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Hidden file input for mobile DB import -->
    <input type="file" id="dbImportInput" accept=".json">

    <!-- Main Content -->
    <main class="main">
        <!-- Mobile Import Banner -->
        <div class="mobile-banner" id="mobileBanner">
            <span style="font-size:1.3rem;">📱</span>
            <div class="mobile-banner-text">
                <strong>Mobile Detected — Manual Import Required</strong>
                <span>postMessage sync is unavailable on mobile. Tap below to import your database file.</span>
            </div>
            <button type="button" class="btn btn-secondary" id="importDbBtn" style="white-space:nowrap; padding:8px 14px; font-size:0.85rem;">Import DB</button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">No database loaded. Open from SitkaTools.</span>
        </div>

        <!-- Config Form -->
        <div class="card">
            <h2 class="card-title">Schedule Config</h2>
            <form id="scheduleForm">
                <div class="form-group">
                    <label id="anchorDateLabel" for="plantingDate">Planting Date (Day 0)</label>
                    <input type="date" id="plantingDate" required>
                </div>
            </form>
        </div>

        <!-- Preview / Editable Task List (always visible) -->
        <div class="card" id="previewCard">
            <h2 class="card-title">Task Schedule</h2>
            <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:14px;">
                Adjust day offsets below. Dates update automatically.
            </p>
            <div id="previewTaskList"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-danger" id="clearFormBtn">Clear Schedule</button>
                <button type="submit" form="scheduleForm" class="btn btn-primary" id="generateBtn">Generate Schedule</button>
            </div>
        </div>

        <!-- Existing Schedule List -->
        <div class="card" id="scheduleListCard" style="display:none;">
            <h2 class="card-title">Crop Schedule</h2>
            <div id="configSummary" class="config-summary" style="display:none;"></div>
            <div id="scheduleList"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn btn-primary" id="saveDbBtn" style="display:none;">💾 Save Database</button>
            <button class="btn btn-secondary" id="closeToolBtn">Close Tool</button>
        </div>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Custom Date Picker Popup (opened by clicking a task's computed date) -->
    <div class="dp-popup" id="datePickerPopup" hidden></div>

    <script>
        // =====================================================
        // CropLabourWizard — Crop Schedule Calculator
        // Database Keys: "_tool_CropLabourWizard" (per-lot), "_CropLabourWizard" (top-level), "calendarEvents"
        // =====================================================

        const DB = {
            data: null,

            get lots() { return this.data?.lots || {} },

            ensureStructure() {
                if (!this.data) this.data = { lots: {}, rooms: {}, calendarEvents: [] };
                if (!this.data.lots) this.data.lots = {};
                if (!this.data.rooms) this.data.rooms = {};
                if (!this.data.calendarEvents) this.data.calendarEvents = [];
                return this.data;
            }
        };

        const $ = id => document.getElementById(id);

        // ---- Mobile Detection — touch screen + small viewport (low resolution) ----
        const isMobileDevice = window.innerWidth < 768 && navigator.maxTouchPoints > 0;

        // ---- Mobile: Import DB from file ----
        function handleDbImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    DB.data = parsed;
                    DB.ensureStructure();
                    buildDefaultOffsets();
                    populateLotSelector();
                    renderScheduleList();
                    updateStatusBar();
                    refreshPreview();
                    updateGenerateBtnLabel();
                    updateProjectBtnState();
                    showToast('Database imported successfully');
                } catch (err) {
                    alert('Failed to parse JSON file: ' + err.message);
                }
            };
            reader.readAsText(file);
            // Reset so the same file can be imported again
            e.target.value = '';
        }

        // ---- Mobile: Save DB as downloadable JSON file ----
        function handleDbSave() {
            DB.ensureStructure();
            const json = JSON.stringify(DB.data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });

            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const filename = `DB-${yy}-${mm}-${dd}.json`;

            // Use Web Share API on mobile (fixes iOS Safari blob URL issue)
            const file = new File([blob], filename, { type: 'application/json' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: filename })
                    .then(() => showToast('Database shared — import it in SitkaTools to sync'))
                    .catch(() => {});
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Database saved — import it in SitkaTools to sync');
            }
        }

        // ---- Task Definitions (reference + default offset) ----
        // reference: 'cloning' | 'planting' | 'flip' | 'harvest' | 'trim' (start of trim day)
        // defaultOffset: days from the reference point
        const TASK_DEFS = [
            { name: 'Cutting Clones', emoji: '✂️', taskType: 'clone_cut_prep', reference: 'cloning', defaultOffset: 0, hasToggle: true, isLocked: true },
            { name: 'Planting Clones', emoji: '🌱', taskType: 'planting', reference: 'cloning', defaultOffset: 14 },
            { name: 'Clean Clone Room and used cloning supplies', emoji: '🧼', taskType: 'clone_room_clean', reference: 'planting', defaultOffset: 1 },
            // Optional preventative IPM sprays — toggleable, off by default
            { name: 'Preventative IPM Spray (Early veg)', emoji: '🧴', taskType: 'ipm_spray_veg_early', reference: 'planting', defaultOffset: 2, hasToggle: true, defaultEnabled: false },
            { name: 'Topping', emoji: '✂️', taskType: 'topping', reference: 'planting', defaultOffset: 3 },
            { name: 'Order Preventative Insects: Swirskii, Hypoaspis, Nematode, Atheta', emoji: '🐛', taskType: 'order_ipm', reference: 'planting', defaultOffset: 7 },
            // Pre-transplant prep work done in the flower room (layout the day before; hydration & lights on transplant day)
            { name: 'Lay-out and Spike Coco Blocks for Hydrating', emoji: '🥥', taskType: 'layout_coco_blocks', reference: 'planting', defaultOffset: 9 },
            { name: 'Hydrate Coco Blocks for Transplanting', emoji: '💧', taskType: 'hydrate_coco_blocks', reference: 'planting', defaultOffset: 10 },
            { name: 'Install Undercanopy Lights and Air Socks', emoji: '💡', taskType: 'undercanopy_lights', reference: 'planting', defaultOffset: 10 },
            { name: 'Transplanting to Flower Room', emoji: '🪴', taskType: 'transplant', reference: 'planting', defaultOffset: 10 },
            // Day after transplant — plants are now in the flower room (listed after transplant so it resolves there)
            { name: 'Preventative IPM Spray (Second veg IPM)', emoji: '🧴', taskType: 'ipm_spray_veg_second', reference: 'planting', defaultOffset: 11, hasToggle: true, defaultEnabled: false },
            { name: 'Clean Vegetation Room', emoji: '🧼', taskType: 'veg_room_clean', reference: 'planting', defaultOffset: 15 },
            { name: 'Deploy IPM to Flower Room', emoji: '🛡️', taskType: 'deploy_ipm', reference: 'planting', defaultOffset: 15 },
            { name: 'Two-Node / Lollipop Prune', emoji: '🔪', taskType: 'prune', reference: 'planting', defaultOffset: 20 },
            { name: 'Flip to Flower', emoji: '🌸', taskType: 'flip', reference: 'planting', defaultOffset: 20 },
            // Bloom-relative tasks (offset from flip)
            // First day of bloom = flip day; toggleable, off by default
            { name: 'Preventative IPM Spray (Start of flower IPM)', emoji: '🧴', taskType: 'ipm_spray_flower_start', reference: 'flip', defaultOffset: 0, hasToggle: true, defaultEnabled: false },
            { name: 'Layout Trellis and Secure', emoji: '🕸️', taskType: 'trellis_layout', reference: 'flip', defaultOffset: 1 },
            // Second week of bloom; toggleable, off by default
            { name: 'Preventative IPM Spray (Second week of flower IPM)', emoji: '🧴', taskType: 'ipm_spray_flower_week2', reference: 'flip', defaultOffset: 7, hasToggle: true, defaultEnabled: false },
            { name: 'Early Flower Leaf Pick', emoji: '🍃', taskType: 'leafpick_early', reference: 'flip', defaultOffset: 21 },
            // Derived/locked — always lands at harvest START − 21 days (displayed offset from flip = bloom length − 21)
            { name: 'Cut Clones to Replace Lot', emoji: '🌿', taskType: 'clone_cut', reference: 'flip', defaultOffset: 42 },
            { name: 'Late Flower Leaf Pick', emoji: '🍂', taskType: 'leafpick_late', reference: 'flip', defaultOffset: 42 },
            // Harvest — user-editable offset from flip (default 63 days = 9 weeks bloom)
            { name: 'Harvest', emoji: '🌾', taskType: 'harvest', reference: 'flip', defaultOffset: 63 },
            // Post-harvest tasks (offset from harvest)
            { name: 'Grow-Room Clean', emoji: '🧹', taskType: 'room_clean', reference: 'harvest', defaultOffset: 1 },
            { name: 'Tank and Irrigation Line Clean', emoji: '🚿', taskType: 'tank_irrigation_clean', reference: 'harvest', defaultOffset: 2 },
            { name: 'Clean and Prepare Totes for Bucking', emoji: '🧺', taskType: 'tote_prep', reference: 'harvest', defaultOffset: 9 },
            { name: 'Dry Room Take-Down / Bucking', emoji: '📦', taskType: 'bucking', reference: 'harvest', defaultOffset: 10 },
            { name: 'Prepare Sample for Lab Testing', emoji: '🔬', taskType: 'lab_sample', reference: 'harvest', defaultOffset: 10 },
            // Day before trim starts — prep the trim room
            { name: 'Prepare Trim Room', emoji: '🧽', taskType: 'trim_room_prep', reference: 'harvest', defaultOffset: 10 },
            // Trim is multi-day (length user-selectable, default 7), offset from harvest end
            { name: 'Trim', emoji: '✂️', taskType: 'trim', reference: 'harvest', defaultOffset: 11 },
            // Post-trim tasks (offset from trim start; re-based by resolveTaskAnchor so +7/+8 land after trim ends for any length)
            { name: 'Machine Trim Smalls', emoji: '⚙️', taskType: 'machine_trim', reference: 'trim', defaultOffset: 7, hasToggle: true },
            { name: 'Clean Dry Room', emoji: '🧼', taskType: 'dry_room_clean', reference: 'trim', defaultOffset: 7 },
            { name: 'Weigh Final Dry Weight and Send Lot to Processing', emoji: '⚖️', taskType: 'weigh_ship', reference: 'trim', defaultOffset: 8 }
        ];

        // ---- postMessage Convention — receive DB from SitkaTools, send updates back ----
        DB.ensureStructure();

        function notifySitkaTools() {
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'sitkaGit_db_update',
                    payload: DB.data
                }, '*');
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data?.type === 'sitkaGit_db' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();

                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'sitkaGit_ready' }, '*');
                }

                buildDefaultOffsets();
                populateLotSelector();
                renderScheduleList();
                updateStatusBar();
                refreshPreview();
                updateGenerateBtnLabel();
                updateProjectBtnState();
                showToast('Database loaded from SitkaTools');
            }

            // Handle live DB updates (e.g., new lots created in SitkaTools, or a room's
            // projection events deleted there). Refresh selector + schedule list without
            // disrupting active form/preview editing.
            if (e.data?.type === 'sitkaGit_db_update' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();
                populateLotSelector();
                renderScheduleList();
                updateStatusBar();
                updateGenerateBtnLabel();
                updateProjectBtnState();
            }
        });

        // ---- DOM References ----
        const scheduleForm = $('scheduleForm');
        const plantingDateInput = $('plantingDate');
        const clearFormBtn = $('clearFormBtn');
        const generateBtn = $('generateBtn');
        const scheduleListCard = $('scheduleListCard');
        const scheduleListEl = $('scheduleList');
        const configSummaryEl = $('configSummary');
        const activeLotSelect = $('activeLot');
        const previewTaskList = $('previewTaskList');

        // ---- Multi-day task durations (user-editable in the preview) ----
        const DEFAULT_TRIM_DAYS = 7;      // Trim length, editable 1–30
        const DEFAULT_HARVEST_DAYS = 2;   // Harvest length when multi-day is checked
        let trimDays = DEFAULT_TRIM_DAYS;
        let harvestMultiDay = false;
        let harvestDays = DEFAULT_HARVEST_DAYS;

        // Bloom length (days from flip to harvest) used when generating/refreshing projection chains.
        // 9 weeks = 63 days (default); 8 weeks = 56 days. Clone cut stays at harvest − 21, so the
        // chain cadence remains correct for either bloom length.
        let projectionBloomDays = 63;

        function clampDuration(v, fallback) {
            const n = parseInt(v);
            return Number.isFinite(n) ? Math.max(1, Math.min(30, n)) : fallback;
        }

        // ---- Preview State: array of { def, offset } — offset is user-editable days from reference ----
        let taskOffsets = [];

        // ---- Projected Lots — unified lot abstraction ----
        // Projected lots are synthetic future crops for flowering rooms (see root Agent.MD,
        // "Crop Projection"). They are NOT in DB.lots — the source of truth is the
        // _CropLabourWizard.projectedLots map. All code paths that read DB.lots[lotId]
        // must go through these helpers so real and projected lots behave identically.
        function getProjectedLots() {
            return DB.data?._CropLabourWizard?.projectedLots || {};
        }

        function ensureProjectedLots() {
            if (!DB.data._CropLabourWizard) DB.data._CropLabourWizard = { generations: [] };
            if (!DB.data._CropLabourWizard.projectedLots) DB.data._CropLabourWizard.projectedLots = {};
            return DB.data._CropLabourWizard.projectedLots;
        }

        function isProjectedLot(lotId) {
            return !!lotId && !!getProjectedLots()[lotId];
        }

        // sourceTool used for a lot's calendar events
        function lotSourceTool(lotId) {
            return isProjectedLot(lotId) ? 'CropProjection' : 'CropLabourWizard';
        }

        // Unified lot record — real lots come from DB.lots; projected lots are synthetic
        function getLotRecord(lotId) {
            if (isProjectedLot(lotId)) {
                const p = getProjectedLots()[lotId];
                return { name: p.name, strain: p.strain || 'TBA', destRoom: p.roomName };
            }
            return DB.lots[lotId] || {};
        }

        // Unified schedule config (real: _tool_CropLabourWizard; projected: map entry .config)
        function getScheduleConfig(lotId) {
            if (!lotId) return null;
            if (isProjectedLot(lotId)) return getProjectedLots()[lotId].config || null;
            return DB.lots[lotId]?._tool_CropLabourWizard || null;
        }

        function setScheduleConfig(lotId, cfg) {
            if (isProjectedLot(lotId)) {
                ensureProjectedLots()[lotId].config = cfg;
            } else {
                DB.data.lots[lotId]._tool_CropLabourWizard = cfg;
            }
        }

        // Clear stored config. Projected lots keep their map entry (→ flagged stale in the
        // selector); real lots just lose their _tool_CropLabourWizard key.
        function clearScheduleConfig(lotId) {
            if (isProjectedLot(lotId)) {
                const p = getProjectedLots()[lotId];
                if (p) delete p.config;
            } else if (DB.lots[lotId]) {
                delete DB.lots[lotId]._tool_CropLabourWizard;
            }
        }

        // All calendar events belonging to a lot (correct sourceTool per lot type)
        function eventsForLot(lotId) {
            const tool = lotSourceTool(lotId);
            return (DB.data.calendarEvents || []).filter(ev => ev.sourceTool === tool && ev.lotId === lotId);
        }

        // A projected lot is stale when it has no calendar events (deleted by SitkaTools or cleared)
        function isStaleProjectedLot(lotId) {
            return isProjectedLot(lotId) && eventsForLot(lotId).length === 0;
        }

        // Pending-reprojection inference (display-only, never stored): a room is pending when its
        // TBA-1 map entry is absent AND at least one of TBA-2…TBA-5 is present. This arises from
        // SitkaTools' deletion hook removing only TBA-1. A full 5-entry chain is never pending,
        // even if some entries have no events (that is ordinary staleness).
        function isPendingReprojection(roomId) {
            if (!roomId) return false;
            const projLots = getProjectedLots();
            if (projLots[projectedLotId(roomId, 1)]) return false; // TBA-1 present → not pending
            for (let i = 2; i <= PROJECTION_LOT_COUNT; i++) {
                if (projLots[projectedLotId(roomId, i)]) return true;
            }
            return false;
        }

        // Stale for display purposes: no events, OR the lot's room is pending reprojection —
        // surviving TBA-2…TBA-5 await renumbering, so they get the ⚠️ indicator even though
        // their events still exist.
        function isStaleOrPending(lotId) {
            if (isStaleProjectedLot(lotId)) return true;
            const p = getProjectedLots()[lotId];
            return !!(p && isPendingReprojection(p.roomId));
        }

        // ---- Populate Lot Selector ----
        // Lots are grouped by destination (flower) room. Each room that has lots
        // assigned gets an unselectable divider ("↓ Room Name"), with its lots listed
        // below in order of age (oldest first). Lots without a flower room go last.
        function populateLotSelector() {
            const sel = $('activeLot');
            if (!sel) return;
            const prevValue = sel.value;
            sel.innerHTML = '<option value="">— Select a lot —</option>';

            const rooms = DB.data.rooms || {};
            const lots = DB.lots;
            const projLots = getProjectedLots();

            // Group lot IDs by their resolved flower room (real + projected)
            const groups = new Map();   // roomId -> { real: [lotId], proj: [lotId] }
            const unassigned = [];
            for (const lotId of Object.keys(lots)) {
                const roomId = resolveFlowerRoom(lotId, rooms);
                if (roomId && rooms[roomId]) {
                    if (!groups.has(roomId)) groups.set(roomId, { real: [], proj: [] });
                    groups.get(roomId).real.push(lotId);
                } else {
                    unassigned.push(lotId);
                }
            }

            // Projected lots group by their room — a room with only projected lots still gets a divider
            for (const lotId of Object.keys(projLots)) {
                const roomId = projLots[lotId].roomId;
                if (roomId && rooms[roomId]) {
                    if (!groups.has(roomId)) groups.set(roomId, { real: [], proj: [] });
                    groups.get(roomId).proj.push(lotId);
                }
            }

            // Oldest lot first (by createdDate; lot ID breaks ties)
            const byAge = (a, b) =>
                (lots[a]?.createdDate || '').localeCompare(lots[b]?.createdDate || '') ||
                a.localeCompare(b);

            const addDivider = label => {
                const opt = document.createElement('option');
                opt.textContent = `↓ ${label}`;
                opt.disabled = true;
                sel.appendChild(opt);
            };

            const addLotOption = lotId => {
                const lot = lots[lotId] || {};
                const opt = document.createElement('option');
                opt.value = lotId;
                opt.textContent = `${lotId} — ${lot.name || 'Unnamed'} (${lot.strain || '?'})`;
                sel.appendChild(opt);
            };

            // Room dividers in alphabetical order of room name.
            // Real lots first (by age), then the room's projected lots in chain order.
            [...groups.keys()]
                .sort((a, b) => (rooms[a].name || '').localeCompare(rooms[b].name || ''))
                .forEach(roomId => {
                    const g = groups.get(roomId);
                    addDivider(rooms[roomId].name || roomId);
                    g.real.sort(byAge).forEach(addLotOption);
                    g.proj.sort((a, b) => projLots[a].index - projLots[b].index).forEach(lotId => {
                        const p = projLots[lotId];
                        const opt = document.createElement('option');
                        opt.value = lotId;
                        opt.textContent = `🔮 ${p.name}${isStaleOrPending(lotId) ? ' ⚠️' : ''}`;
                        sel.appendChild(opt);
                    });
                });

            // Lots with no flower room assignment go last
            if (unassigned.length) {
                addDivider('Unassigned');
                unassigned.sort(byAge).forEach(addLotOption);
            }

            // Restore the previous selection if that lot is still in the list
            if (prevValue && [...sel.options].some(o => o.value === prevValue)) sel.value = prevValue;
        }

        // ---- Build task offsets from defaults (called on init / lot change) ----
        function buildDefaultOffsets() {
            taskOffsets = TASK_DEFS.map(def => ({
                def,
                offset: def.defaultOffset ?? 0,
                // Toggleable tasks default to their def's defaultEnabled (off for the IPM sprays);
                // non-toggleable tasks are always on.
                enabled: def.hasToggle ? (def.defaultEnabled !== false) : true
            }));
        }

        // ---- Restore task offsets to match an already-generated schedule ----
        // When a lot with an existing schedule is selected, recompute each task's day
        // offset so its preview date exactly matches the stored calendar event. This lets
        // the user tweak and overwrite from the current (generated) state rather than
        // starting from defaults. The anchor dates are reconstructed from the "defining"
        // tasks' event dates — planting / flip / harvest / trim have no toggle, so they're
        // always present in a generated schedule. Must run after updateFormFromStoredConfig
        // (so trimDays / harvestMultiDay / harvestDays reflect the stored config).
        function applyStoredScheduleToOffsets(lotId) {
            const config = getScheduleConfig(lotId);
            if (!config) return;

            // Gather this lot's generated events keyed by taskType (sourceTool depends on lot type)
            const eventsByType = {};
            for (const ev of eventsForLot(lotId)) {
                eventsByType[ev.taskType] = ev;
            }
            if (Object.keys(eventsByType).length === 0) return;

            const dateOf = t => eventsByType[t]?.date || null;

            // Infer clone state from whether the (toggleable) clone-cut-prep task was generated,
            // and reflect it in the preview toggle so refreshPreview agrees.
            const clonesEnabled = !!eventsByType['clone_cut_prep'];
            const clonePrepEntry = taskOffsets.find(e => e.def.taskType === 'clone_cut_prep');
            if (clonePrepEntry) clonePrepEntry.enabled = clonesEnabled;

            // topDate = the date in the top picker (cloning date when clones enabled, planting otherwise)
            const topDate = config.plantingDate;

            // Reconstruct anchor dates from the defining tasks' event dates (default fallbacks if missing)
            const P = clonesEnabled ? (dateOf('planting') || computeTaskDate(topDate, 14)) : topDate; // planting
            const F = dateOf('flip') || computeTaskDate(P, 20);                                       // flip
            const H = dateOf('harvest') || computeTaskDate(F, 63);                                     // harvest start
            const harvestEnd = (config.harvestMultiDay && config.harvestDays > 1)
                ? computeTaskDate(H, config.harvestDays - 1) : H;                                      // harvest end
            const T = dateOf('trim') || computeTaskDate(harvestEnd, 11);                               // trim start

            const anchors = { cloning: topDate, planting: P, flip: F, harvest: H, harvestEnd, trim: T };

            // Set each task's offset so its computed date equals the stored event date
            for (const entry of taskOffsets) {
                const def = entry.def;
                const ev = eventsByType[def.taskType];
                // Toggleable tasks absent from a generated schedule were disabled at generation time
                if (def.hasToggle && !ev) entry.enabled = false;
                if (!ev) continue; // task absent from schedule — keep default

                // When clones disabled, planting is locked to Day 0
                if (def.taskType === 'planting' && !clonesEnabled) {
                    entry.offset = 0;
                    continue;
                }

                const anchorDate = resolveTaskAnchor(anchors, def.reference);
                entry.offset = daysBetween(anchorDate, ev.date);
            }
        }

        // ---- Reference date labels ----
        const REF_LABELS = {
            cloning: 'Cloning',
            planting: 'Planting',
            flip: 'Flip to Flower',
            harvest: 'Harvest',
            trim: 'Trim Start'
        };

        // ---- Compute anchor dates from config ----
        // topDate: the date from the top picker (cloning date when clones enabled, planting date otherwise)
        // clonesEnabled: whether Cutting Clones is toggled on
        // plantingOffset: days from cloning to planting (only used when clonesEnabled)
        // flipOffset: days from planting to flip (defaults to 20)
        // harvestOffset: days from flip to harvest (defaults to 63 = 9 weeks bloom)
        // trimOffset: days from harvest to the start of trim (defaults to 11)
        function computeAnchors(topDate, flipOffset = 20, clonesEnabled = false, plantingOffset = 14, harvestOffset = 63, trimOffset = 11, multiDayHarvest = false, hDays = 1) {
            const addDays = (dateStr, days) => {
                const d = new Date(dateStr + 'T00:00:00');
                d.setDate(d.getDate() + days);
                return d.toISOString().split('T')[0];
            };

            const cloningDate = topDate;
            const plantingDate = clonesEnabled ? addDays(topDate, plantingOffset) : topDate;
            const flipDate = addDays(plantingDate, flipOffset);
            const harvestDate = addDays(flipDate, harvestOffset);
            // Harvest end — same as start unless multi-day is checked
            const harvestEndDate = multiDayHarvest ? addDays(harvestDate, Math.max(0, hDays - 1)) : harvestDate;
            // Trim starts after harvest ends
            const trimDate = addDays(harvestEndDate, trimOffset);

            return { cloning: cloningDate, planting: plantingDate, flip: flipDate, harvest: harvestDate, harvestEnd: harvestEndDate, trim: trimDate };
        }

        // ---- Compute a task's date from its reference anchor + offset ----
        function computeTaskDate(anchorDateStr, offset) {
            const d = new Date(anchorDateStr + 'T00:00:00');
            d.setDate(d.getDate() + offset);
            return d.toISOString().split('T')[0];
        }

        // Resolve the anchor date a task's offset is measured from.
        // - 'harvest' reference → harvest END (post-harvest tasks and trim run after
        //   harvest finishes; identical to start when single-day)
        // - 'trim' reference → re-based: post-trim offsets are defined assuming a
        //   7-day trim, so shift the anchor by (actual length − 7)
        function resolveTaskAnchor(anchors, ref) {
            if (ref === 'harvest') return anchors.harvestEnd;
            if (ref === 'trim') return computeTaskDate(anchors.trim, trimDays - DEFAULT_TRIM_DAYS);
            return anchors[ref];
        }

        // End date for multi-day tasks (null for single-day)
        function taskEndDate(def, startDate, isEnabled) {
            if (!isEnabled) return null;
            if (def.taskType === 'trim') return trimDays > 1 ? computeTaskDate(startDate, trimDays - 1) : null;
            if (def.taskType === 'harvest' && harvestMultiDay) return harvestDays > 1 ? computeTaskDate(startDate, harvestDays - 1) : null;
            return null;
        }

        // Whether a task renders as multi-day (drives the amber "multi" badge style)
        function isMultiDayTask(def) {
            if (def.taskType === 'trim') return true;
            if (def.taskType === 'harvest') return harvestMultiDay;
            return false;
        }

        // =====================================================
        // CropLabourWizard — BC Civic Holidays Module
        // 11 statutory holidays per the BC Employment Standards Act.
        // Every date is a pure function of its year — no external data.
        // All date math uses local-time Date constructors (never UTC).
        // =====================================================
        const Holidays = {
            // Add/subtract days (returns a new Date)
            addDays(d, n) {
                return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
            },

            // Nth occurrence of a weekday in a month (n is 1-based)
            nthWeekday(y, m, weekday, n) {
                const first = new Date(y, m, 1).getDay();
                return new Date(y, m, 1 + ((weekday - first + 7) % 7) + (n - 1) * 7);
            },

            // Victoria Day — the last Monday strictly before May 25 (per BC ESA).
            // Start from May 24 and walk back to the previous Monday.
            victoriaDay(y) {
                const d = new Date(y, 4, 24);
                while (d.getDay() !== 1) d.setDate(d.getDate() - 1);
                return d;
            },

            // Observed-date shift — applies ONLY to fixed-date holidays:
            // if the nominal date falls on Saturday or Sunday, observed on the following Monday.
            observed(d) {
                const dow = d.getDay();
                if (dow === 6) return this.addDays(d, 2); // Sat → Mon
                if (dow === 0) return this.addDays(d, 1); // Sun → Mon
                return d;
            },

            // Easter Sunday — Gregorian computus (Meeus–Jones–Butcher algorithm)
            easterSunday(y) {
                const a = y % 19, b = Math.floor(y / 100), c = y % 100;
                const d = Math.floor(b / 4), e = b % 4;
                const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
                const h = (19 * a + b - d - g + 15) % 30;
                const i = Math.floor(c / 4), k = c % 4;
                const l = (32 + 2 * e + 2 * i - h - k) % 7;
                const m = Math.floor((a + 11 * h + 22 * l) / 451);
                const month = Math.floor((h + l - 7 * m + 114) / 31); // 3 = March, 4 = April
                return new Date(y, month - 1, ((h + l - 7 * m + 114) % 31) + 1);
            },

            // The 11 BC civic holidays for a given year.
            // Returns [{ name, date (observed), nominalDate (only when shifted), rule }]
            getForYear(y) {
                const easter = this.easterSunday(y);
                const defs = [
                    { name: "New Year's Day", rule: 'Jan 1; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 0, 1)), nominalDate: new Date(y, 0, 1) },
                    { name: 'Family Day', rule: 'Third Monday in February', date: this.nthWeekday(y, 1, 1, 3), nominalDate: null },
                    { name: 'Good Friday', rule: 'Two days before Easter Sunday', date: this.addDays(easter, -2), nominalDate: null },
                    { name: 'Victoria Day', rule: 'Last Monday strictly before May 25', date: this.victoriaDay(y), nominalDate: null },
                    { name: 'Canada Day', rule: 'Jul 1; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 6, 1)), nominalDate: new Date(y, 6, 1) },
                    { name: 'BC Day (Civic Holiday)', rule: 'First Monday in August', date: this.nthWeekday(y, 7, 1, 1), nominalDate: null },
                    { name: 'Labour Day', rule: 'First Monday in September', date: this.nthWeekday(y, 8, 1, 1), nominalDate: null },
                    { name: 'National Day for Truth and Reconciliation', rule: 'Sep 30; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 8, 30)), nominalDate: new Date(y, 8, 30) },
                    { name: 'Thanksgiving', rule: 'Second Monday in October', date: this.nthWeekday(y, 9, 1, 2), nominalDate: null },
                    { name: 'Remembrance Day', rule: 'Nov 11; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 10, 11)), nominalDate: new Date(y, 10, 11) },
                    { name: 'Christmas Day', rule: 'Dec 25; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 11, 25)), nominalDate: new Date(y, 11, 25) }
                ];

                return defs.map(def => {
                    const shifted = def.nominalDate && localDateStr(def.nominalDate) !== localDateStr(def.date);
                    return {
                        name: def.name,
                        date: localDateStr(def.date),          // observed date — the day off
                        nominalDate: shifted ? localDateStr(def.nominalDate) : null,
                        rule: def.rule
                    };
                });
            },

            // Look up a holiday by its observed date string ("YYYY-MM-DD"). Returns the holiday or null.
            forDate(dateStr) {
                const y = parseInt(dateStr.slice(0, 4), 10);
                return this.getForYear(y).find(h => h.date === dateStr) || null;
            }
        };

        // ---- Utility: local date string (avoids UTC shift from toISOString) ----
        function localDateStr(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        // ---- Utility: weekday names (local time; index matches Date.getDay()) ----
        const WEEKDAYS_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const WEEKDAYS_MIN = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

        // Short weekday name for an ISO date string (e.g. "2026-09-15" → "Tue")
        function weekdayShort(dateStr) {
            if (!dateStr) return '';
            return WEEKDAYS_SHORT[new Date(dateStr + 'T00:00:00').getDay()];
        }

        // Whole days from date a to date b (local time; rounding is DST-safe)
        function daysBetween(aStr, bStr) {
            const a = new Date(aStr + 'T00:00:00');
            const b = new Date(bStr + 'T00:00:00');
            return Math.round((b - a) / 86400000);
        }

        // ---- Holiday helpers for task dates ----
        // Returns the holiday if any day in [start, end] (inclusive) is an observed BC civic holiday.
        function holidayInRange(startStr, endStr) {
            const end = endStr || startStr;
            let d = new Date(startStr + 'T00:00:00');
            const last = new Date(end + 'T00:00:00');
            while (d <= last) {
                const h = Holidays.forDate(localDateStr(d));
                if (h) return h;
                d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
            }
            return null;
        }

        // Small amber chip shown next to a task's date when it lands on an observed holiday.
        function holidayFlagHtml(holiday) {
            if (!holiday) return '';
            const title = holiday.nominalDate
                ? `${holiday.name} — BC civic holiday (observed ${holiday.date}; nominal date ${holiday.nominalDate} falls on a weekend)`
                : `${holiday.name} — BC civic holiday (${holiday.rule})`;
            return `<span class="holiday-flag" title="${title}">🏛️ Holiday</span>`;
        }

        // =====================================================
        // Custom Date Picker — popup calendar opened by clicking a task's computed date.
        // Picking a day adjusts that task's day offset by the delta (same cascade rules
        // as the +/- spinbox). BC civic holidays are marked with an amber dot.
        // Single shared popup element (#datePickerPopup) — no per-row popups.
        // =====================================================
        const DatePicker = {
            el: null,
            anchorEl: null,
            onSelectCb: null,
            selectedStr: null,
            viewYear: 0,
            viewMonth: 0, // 0-based
            _holidayCache: {},

            init() { this.el = $('datePickerPopup'); },

            open(anchorEl, selectedStr, onSelect) {
                this.anchorEl = anchorEl;
                this.onSelectCb = onSelect;
                this.selectedStr = selectedStr || '';
                const now = new Date();
                if (selectedStr) {
                    const [y, m] = selectedStr.split('-').map(Number);
                    this.viewYear = y;
                    this.viewMonth = m - 1;
                } else {
                    this.viewYear = now.getFullYear();
                    this.viewMonth = now.getMonth();
                }
                this.render();
                this.el.hidden = false;
                this.position();

                document.addEventListener('mousedown', this._onDocMouseDown);
                document.addEventListener('keydown', this._onDocKeydown);
                window.addEventListener('scroll', this._onReposition, true);
                window.addEventListener('resize', this._onReposition);
            },

            close() {
                if (this.el.hidden) return;
                this.el.hidden = true;
                document.removeEventListener('mousedown', this._onDocMouseDown);
                document.removeEventListener('keydown', this._onDocKeydown);
                window.removeEventListener('scroll', this._onReposition, true);
                window.removeEventListener('resize', this._onReposition);
            },

            // Note: these are detached event listeners — reference DatePicker explicitly,
            // since `this` inside arrow functions does not bind to the object.
            _onDocMouseDown: (e) => {
                if (!DatePicker.el.hidden && !DatePicker.el.contains(e.target) && e.target !== DatePicker.anchorEl) {
                    DatePicker.close();
                }
            },

            _onDocKeydown: (e) => {
                if (e.key === 'Escape') DatePicker.close();
            },

            _onReposition: () => { if (!DatePicker.el.hidden) DatePicker.position(); },

            // Anchor the popup to the clicked badge; flip above it near the bottom edge
            position() {
                const rect = this.anchorEl.getBoundingClientRect();
                const pw = this.el.offsetWidth;
                const ph = this.el.offsetHeight;
                const left = Math.min(Math.max(8, rect.right - pw), window.innerWidth - pw - 8);
                let top = rect.bottom + 6;
                if (top + ph > window.innerHeight - 8) top = Math.max(8, rect.top - ph - 6);
                this.el.style.left = left + 'px';
                this.el.style.top = top + 'px';
            },

            _holidaysForYear(y) {
                if (!this._holidayCache[y]) {
                    const map = {};
                    for (const h of Holidays.getForYear(y)) map[h.date] = h;
                    this._holidayCache[y] = map;
                }
                return this._holidayCache[y];
            },

            render() {
                const y = this.viewYear;
                const m = this.viewMonth;
                const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                const firstDow = new Date(y, m, 1).getDay();
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                const todayStr = localDateStr(new Date());
                const holMap = this._holidaysForYear(y);

                let html = `
                    <div class="dp-header">
                        <button type="button" class="dp-nav-btn" data-dp-nav="-1" title="Previous month">‹</button>
                        <span class="dp-title">${MONTHS[m]} ${y}</span>
                        <button type="button" class="dp-nav-btn" data-dp-nav="1" title="Next month">›</button>
                    </div>
                    <div class="dp-grid">
                        ${WEEKDAYS_MIN.map(w => `<span class="dp-weekday">${w}</span>`).join('')}
                `;

                for (let i = 0; i < firstDow; i++) html += '<span class="dp-day blank"></span>';

                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = localDateStr(new Date(y, m, d));
                    const cls = ['dp-day'];
                    if (dateStr === this.selectedStr) cls.push('selected');
                    if (dateStr === todayStr) cls.push('today');
                    const hol = holMap[dateStr];
                    if (hol) cls.push('holiday');
                    const title = hol
                        ? ` title="${escapeHtml(hol.name)} — BC civic holiday${hol.nominalDate ? ' (observed; nominal date ' + hol.nominalDate + ')' : ''}"`
                        : '';
                    html += `<button type="button" class="${cls.join(' ')}" data-dp-date="${dateStr}"${title}>${d}</button>`;
                }

                html += `
                    </div>
                    <div class="dp-footer">
                        <button type="button" class="dp-today-btn" data-dp-today>Today</button>
                    </div>
                `;
                this.el.innerHTML = html;

                // Month navigation
                this.el.querySelectorAll('[data-dp-nav]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const delta = parseInt(btn.dataset.dpNav, 10);
                        this.viewMonth += delta;
                        if (this.viewMonth < 0) { this.viewMonth = 11; this.viewYear--; }
                        if (this.viewMonth > 11) { this.viewMonth = 0; this.viewYear++; }
                        this.render();
                        this.position();
                    });
                });

                // Day selection — close, then hand the picked date to the caller
                this.el.querySelectorAll('[data-dp-date]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const picked = btn.dataset.dpDate;
                        const cb = this.onSelectCb;
                        this.close();
                        if (cb) cb(picked);
                    });
                });

                // Jump to the current month
                const todayBtn = this.el.querySelector('[data-dp-today]');
                if (todayBtn) {
                    todayBtn.addEventListener('click', () => {
                        const now = new Date();
                        this.viewYear = now.getFullYear();
                        this.viewMonth = now.getMonth();
                        this.render();
                        this.position();
                    });
                }
            }
        };

        // ---- Re-render preview whenever config changes ----
        function refreshPreview() {
            // A re-render replaces the DOM — close any open date picker so it doesn't anchor to a stale node
            DatePicker.close();

            const plantingDate = plantingDateInput.value;

            if (!plantingDate) {
                previewTaskList.innerHTML = '<div class="empty-state">Set a date to see the schedule.</div>';
                return;
            }

            // Determine if clones are enabled
            const clonePrepEntry = taskOffsets.find(e => e.def.taskType === 'clone_cut_prep');
            const clonesEnabled = clonePrepEntry?.enabled !== false;

            // Get planting offset (only matters when clones are enabled)
            const plantingEntry = taskOffsets.find(e => e.def.taskType === 'planting');
            const plantingOffset = plantingEntry ? plantingEntry.offset : 14;

            // Get the actual flip offset from taskOffsets (may differ from default 20)
            const flipEntry = taskOffsets.find(e => e.def.taskType === 'flip');
            const flipOffset = flipEntry ? flipEntry.offset : 20;

            // Get the actual harvest offset from taskOffsets (may differ from default 63)
            const harvestEntry = taskOffsets.find(e => e.def.taskType === 'harvest');
            const harvestOffset = harvestEntry ? harvestEntry.offset : 63;

            // Get the actual trim offset from taskOffsets (may differ from default 11) — anchors post-trim tasks
            const trimEntry = taskOffsets.find(e => e.def.taskType === 'trim');
            const trimOffset = trimEntry ? trimEntry.offset : 11;

            // Update date picker label based on clone state
            const anchorLabel = $('anchorDateLabel');
            if (anchorLabel) {
                anchorLabel.textContent = clonesEnabled ? 'Cloning Date (Day 0)' : 'Planting Date (Day 0)';
            }

            const anchors = computeAnchors(plantingDate, flipOffset, clonesEnabled, plantingOffset, harvestOffset, trimOffset, harvestMultiDay, harvestDays);

            previewTaskList.innerHTML = '';
            const listWrapper = document.createElement('div');
            listWrapper.className = 'preview-task-list';

            // Tasks whose computed date lands on an observed BC civic holiday (notify only)
            const holidayConflicts = [];

            taskOffsets.forEach((entry, idx) => {
                const def = entry.def;
                const isEnabled = entry.enabled !== false;

                // Determine display reference, label, offset, and locked state
                let displayRef = def.reference;
                let displayLabel = REF_LABELS[displayRef] || displayRef;
                let effectiveOffset = entry.offset;
                let isLockedDisplay = def.isLocked;

                // When clones disabled, planting becomes Day 0 (locked, references planting anchor)
                if (def.taskType === 'planting' && !clonesEnabled) {
                    displayRef = 'planting';
                    displayLabel = REF_LABELS[displayRef];
                    effectiveOffset = 0;
                    isLockedDisplay = true;
                }

                // Clone cut is derived — always harvest start − 21 days (locked; follows bloom length)
                if (def.taskType === 'clone_cut') {
                    displayRef = 'flip';
                    displayLabel = REF_LABELS[displayRef];
                    effectiveOffset = harvestOffset - 21;
                    isLockedDisplay = true;
                }

                // Compute date from anchor + offset (anchor accounts for multi-day harvest/trim)
                const anchorDate = resolveTaskAnchor(anchors, displayRef);
                let startDate = computeTaskDate(anchorDate, effectiveOffset);
                // Clone cut derives from harvest START (not end): always harvest − 21 days
                if (def.taskType === 'clone_cut') {
                    startDate = computeTaskDate(anchors.harvest, -21);
                }
                let endDate = taskEndDate(def, startDate, isEnabled);

                // Build display date string with weekday (e.g. "2026-09-15 · Tue")
                const displayDate = endDate
                    ? `${startDate} (${weekdayShort(startDate)}) → ${endDate} (${weekdayShort(endDate)})`
                    : `${startDate} · ${weekdayShort(startDate)}`;

                // Holiday check — notify only, never auto-reschedule
                const holiday = isEnabled ? holidayInRange(startDate, endDate) : null;

                const item = document.createElement('div');
                item.className = 'preview-task-item' + (isEnabled ? '' : ' disabled');

                const offsetInputId = `offset_${idx}`;
                const checkInputId = `check_${idx}`;

                // Checkbox for tasks with toggle
                const checkboxHtml = def.hasToggle
                    ? `<input type="checkbox" class="task-enabled-check" id="${checkInputId}" ${isEnabled ? 'checked' : ''} data-idx="${idx}" title="Enable/disable this task" />`
                    : '';

                // Offset input: editable unless it's locked or disabled
                let offsetGroupHtml = '';
                if (isLockedDisplay) {
                    offsetGroupHtml = `
                        <div class="preview-offset-group">
                            <label>Day</label>
                            <button type="button" class="spinbox-btn minus" data-target="${offsetInputId}" disabled title="Locked">−</button>
                            <input type="number" id="${offsetInputId}" value="${effectiveOffset}" disabled title="Locked to this day" />
                            <button type="button" class="spinbox-btn plus" data-target="${offsetInputId}" disabled title="Locked">+</button>
                        </div>
                    `;
                } else {
                    const minVal = def.defaultOffset && def.defaultOffset < 0 ? '-30' : '0';
                    offsetGroupHtml = `
                        <div class="preview-offset-group">
                            <label for="${offsetInputId}">Days:</label>
                            <button type="button" class="spinbox-btn minus" data-target="${offsetInputId}" ${!isEnabled ? 'disabled' : ''} title="Decrease by 1">−</button>
                            <input type="number" id="${offsetInputId}" value="${entry.offset}" min="${minVal}" max="200" data-idx="${idx}" ${!isEnabled ? 'disabled' : ''} />
                            <button type="button" class="spinbox-btn plus" data-target="${offsetInputId}" ${!isEnabled ? 'disabled' : ''} title="Increase by 1">+</button>
                        </div>
                    `;
                }

                // Offset label: show sign for negative offsets
                const offsetLabel = effectiveOffset >= 0 ? `+${effectiveOffset}d` : `${effectiveOffset}d`;

                // Computed-date badge — clickable (opens the date picker) unless locked or disabled
                const canPickDate = isEnabled && !isLockedDisplay;
                const dateBadgeCls = `preview-computed-date${isMultiDayTask(def) ? ' multi' : ''}`;
                const dateBadgeHtml = canPickDate
                    ? `<button type="button" class="${dateBadgeCls} clickable" data-idx="${idx}" data-date="${startDate}" title="Click to pick a date">${displayDate}</button>`
                    : `<span class="${dateBadgeCls}" ${!isEnabled ? 'style="opacity:0.4"' : ''} ${isLockedDisplay ? `title="${def.taskType === 'clone_cut' ? 'Derived — harvest start − 21 days' : 'Locked to Day 0'}"` : ''}>${displayDate}</span>`;

                // Duration controls — Trim length (always) and Harvest multi-day toggle + length
                let durationControlsHtml = '';
                if (def.taskType === 'trim' && isEnabled) {
                    durationControlsHtml = `
                        <div class="preview-offset-group" title="Trim length in days">
                            <label>Length:</label>
                            <button type="button" class="spinbox-btn minus" data-target="trimDaysInput">−</button>
                            <input type="number" id="trimDaysInput" value="${trimDays}" min="1" max="30" />
                            <button type="button" class="spinbox-btn plus" data-target="trimDaysInput">+</button>
                        </div>
                    `;
                } else if (def.taskType === 'harvest' && isEnabled) {
                    durationControlsHtml = `
                        <label class="preview-multiday-label" title="Span Harvest across multiple days — downstream tasks start after harvest ends">
                            <input type="checkbox" id="harvestMultiCheck" ${harvestMultiDay ? 'checked' : ''} /> Multi-day
                        </label>
                        <div class="preview-offset-group" title="Harvest length in days (when multi-day)">
                            <label>Length:</label>
                            <button type="button" class="spinbox-btn minus" data-target="harvestDaysInput" ${!harvestMultiDay ? 'disabled' : ''}>−</button>
                            <input type="number" id="harvestDaysInput" value="${harvestDays}" min="1" max="30" ${!harvestMultiDay ? 'disabled' : ''} />
                            <button type="button" class="spinbox-btn plus" data-target="harvestDaysInput" ${!harvestMultiDay ? 'disabled' : ''}>+</button>
                        </div>
                    `;
                }

                item.innerHTML = `
                    ${checkboxHtml}
                    <span class="preview-task-emoji">${def.emoji}</span>
                    <div class="preview-task-info">
                        <div class="preview-task-name">${escapeHtml(def.name)}</div>
                        <div class="preview-task-reference"><strong>${offsetLabel}</strong> from ${displayLabel}</div>
                    </div>
                    ${offsetGroupHtml}
                    ${durationControlsHtml}
                    ${dateBadgeHtml}
                    ${holidayFlagHtml(holiday)}
                `;

                listWrapper.appendChild(item);
