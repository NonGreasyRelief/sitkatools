<!-- CropLabourWizard.html — Crop schedule calculator for SitkaGit suite -->
<!-- Tool: CropLabourWizard | Purpose: Auto-generate full cultivation timeline as calendar events per lot -->
<!-- Database Keys: "_tool_CropLabourWizard" (per-lot), "_CropLabourWizard" (top-level), "calendarEvents" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Labour Wizard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #53d8a8;
            --accent-hover: #3fb98b;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8b8;
            --border: #2a2a4a;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --warning: #f39c12;
            --input-bg: #1a1a3e;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 24px; }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .header-right { display: flex; gap: 8px; align-items: flex-end; }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            max-width: 640px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }

        /* ---- Status Bar ---- */
        .status-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-bar.loaded { border-color: var(--accent); }

        /* ---- Card ---- */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
        }

        /* ---- Form (kept for future use) ---- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ---- Buttons ---- */
        .btn {
            padding: 10px 24px;
            border-radius: var(--radius);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { border-color: var(--text-secondary); }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover { background: var(--danger-hover); }

        /* ---- Footer ---- */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        /* ---- Toast notification ---- */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 24px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Mobile Import Banner ---- */
        .mobile-banner {
            background: var(--bg-card);
            border: 1px solid var(--warning);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--warning);
            display: none;
            align-items: center;
            gap: 10px;
        }

        .mobile-banner.show {
            display: flex;
        }

        .mobile-banner-text {
            flex: 1;
        }

        .mobile-banner-text strong {
            display: block;
            margin-bottom: 2px;
        }

        .mobile-banner-text span {
            font-size: 0.8rem;
            opacity: 0.85;
        }

        #dbImportInput {
            display: none;
        }

        /* ---- Form Row (side-by-side fields) ---- */
        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group { flex: 1; }

        /* ---- Task List ---- */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .task-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s;
        }

        .task-item:hover { border-color: var(--accent); }

        .task-emoji {
            font-size: 1.2rem;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .task-info {
            flex: 1;
            min-width: 0;
        }

        .task-name {
            font-size: 0.9rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .task-type-badge {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .task-date-badge {
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .task-delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .task-item:hover .task-delete-btn { opacity: 1; }
        .task-delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        /* ---- Schedule Config Summary ---- */
        .config-summary {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding: 10px 14px;
            background: var(--bg-card);
            border-radius: var(--radius);
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .config-summary span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .config-summary strong {
            color: var(--accent);
        }

        /* ---- Empty State ---- */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ---- Form Actions Row ---- */
        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        /* ---- Preview Task List ---- */
        .preview-task-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .preview-task-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .preview-task-item:hover { border-color: var(--accent); }

        .preview-task-emoji {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }

        .preview-task-info {
            flex: 1;
            min-width: 0;
        }

        .preview-task-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .preview-task-reference {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .preview-task-reference strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* ---- Offset input group ---- */
        .preview-offset-group {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .preview-offset-group label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .preview-offset-group input[type="number"] {
            width: 52px;
            padding: 4px 6px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.82rem;
            text-align: center;
            transition: border-color 0.2s;
        }

        .preview-offset-group input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .preview-offset-group input[type="number"]:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Remove number spinners */
        .preview-offset-group input[type="number"]::-webkit-inner-spinner,
        .preview-offset-group input[type="number"]::-webkit-outer-spinner {
            -webkit-appearance: none;
            margin: 0;
        }
        .preview-offset-group input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ---- Spinbox +/- Buttons ---- */
        .spinbox-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--bg-card);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .spinbox-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--input-bg);
        }

        .spinbox-btn:active {
            transform: scale(0.92);
        }

        .spinbox-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ---- Computed date badge ---- */
        .preview-computed-date {
            font-size: 0.78rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            min-width: 90px;
            text-align: center;
        }

        .preview-computed-date.multi {
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .hidden { display: none !important; }

        /* ---- Holiday flag — shown next to a task's date when it lands on an observed BC civic holiday ---- */
        .holiday-flag {
            font-size: 0.7rem;
            color: var(--warning);
            background: rgba(243, 156, 18, 0.12);
            border: 1px solid var(--warning);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            cursor: help;
        }

        /* ---- Holiday conflict banner — lists tasks that fall on BC civic holidays (notify only) ---- */
        .holiday-conflict-banner {
            background: rgba(243, 156, 18, 0.1);
            border: 1px solid var(--warning);
            border-radius: var(--radius);
            padding: 10px 14px;
            margin-bottom: 12px;
            font-size: 0.8rem;
            color: var(--text-primary);
        }

        .holiday-conflict-banner strong {
            color: var(--warning);
            display: block;
            margin-bottom: 4px;
            font-size: 0.82rem;
        }

        .holiday-conflict-banner ul {
            margin: 0;
            padding-left: 18px;
            color: var(--text-secondary);
        }

        .holiday-conflict-banner li {
            margin-top: 2px;
        }

        /* ---- Custom Checkbox ---- */
        .task-enabled-check {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-radius: 4px;
            background: var(--input-bg);
            cursor: pointer;
            flex-shrink: 0;
            position: relative;
            transition: all 0.2s;
        }

        .task-enabled-check:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .task-enabled-check:checked::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--bg-primary);
            font-size: 11px;
            font-weight: 700;
        }

        .task-enabled-check:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Disabled task styling */
        .preview-task-item.disabled {
            opacity: 0.35;
        }
    </style>
</head>
<body>
    <!-- Header (lot-focused tool — Active Lot selector) -->
    <header class="header">
        <div class="header-left">
            <span class="logo">👷 Crop Labour Wizard</span>
        </div>
        <div class="header-right">
            <div class="form-group">
                <label for="activeLot">Active Lot</label>
                <select id="activeLot">
                    <option value="">— Select a lot —</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Hidden file input for mobile DB import -->
    <input type="file" id="dbImportInput" accept=".json">

    <!-- Main Content -->
    <main class="main">
        <!-- Mobile Import Banner -->
        <div class="mobile-banner" id="mobileBanner">
            <span style="font-size:1.3rem;">📱</span>
            <div class="mobile-banner-text">
                <strong>Mobile Detected — Manual Import Required</strong>
                <span>postMessage sync is unavailable on mobile. Tap below to import your database file.</span>
            </div>
            <button type="button" class="btn btn-secondary" id="importDbBtn" style="white-space:nowrap; padding:8px 14px; font-size:0.85rem;">Import DB</button>
        </div>

        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">No database loaded. Open from SitkaTools.</span>
        </div>

        <!-- Config Form -->
        <div class="card">
            <h2 class="card-title">Schedule Config</h2>
            <form id="scheduleForm">
                <div class="form-group">
                    <label id="anchorDateLabel" for="plantingDate">Planting Date (Day 0)</label>
                    <input type="date" id="plantingDate" required>
                </div>
            </form>
        </div>

        <!-- Preview / Editable Task List (always visible) -->
        <div class="card" id="previewCard">
            <h2 class="card-title">Task Schedule</h2>
            <p style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:14px;">
                Adjust day offsets below. Dates update automatically.
            </p>
            <div id="previewTaskList"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-danger" id="clearFormBtn">Clear Schedule</button>
                <button type="submit" form="scheduleForm" class="btn btn-primary" id="generateBtn">Generate Schedule</button>
            </div>
        </div>

        <!-- Existing Schedule List -->
        <div class="card" id="scheduleListCard" style="display:none;">
            <h2 class="card-title">Crop Schedule</h2>
            <div id="configSummary" class="config-summary" style="display:none;"></div>
            <div id="scheduleList"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn btn-primary" id="saveDbBtn" style="display:none;">💾 Save Database</button>
            <button class="btn btn-secondary" id="closeToolBtn">Close Tool</button>
        </div>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // =====================================================
        // CropLabourWizard — Crop Schedule Calculator
        // Database Keys: "_tool_CropLabourWizard" (per-lot), "_CropLabourWizard" (top-level), "calendarEvents"
        // =====================================================

        const DB = {
            data: null,

            get lots() { return this.data?.lots || {} },

            ensureStructure() {
                if (!this.data) this.data = { lots: {}, rooms: {}, calendarEvents: [] };
                if (!this.data.lots) this.data.lots = {};
                if (!this.data.rooms) this.data.rooms = {};
                if (!this.data.calendarEvents) this.data.calendarEvents = [];
                return this.data;
            }
        };

        const $ = id => document.getElementById(id);

        // ---- Mobile Detection — touch screen + small viewport (low resolution) ----
        const isMobileDevice = window.innerWidth < 768 && navigator.maxTouchPoints > 0;

        // ---- Mobile: Import DB from file ----
        function handleDbImport(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                try {
                    const parsed = JSON.parse(ev.target.result);
                    DB.data = parsed;
                    DB.ensureStructure();
                    buildDefaultOffsets();
                    populateLotSelector();
                    renderScheduleList();
                    updateStatusBar();
                    refreshPreview();
                    updateGenerateBtnLabel();
                    showToast('Database imported successfully');
                } catch (err) {
                    alert('Failed to parse JSON file: ' + err.message);
                }
            };
            reader.readAsText(file);
            // Reset so the same file can be imported again
            e.target.value = '';
        }

        // ---- Mobile: Save DB as downloadable JSON file ----
        function handleDbSave() {
            DB.ensureStructure();
            const json = JSON.stringify(DB.data, null, 2);
            const blob = new Blob([json], { type: 'application/json' });

            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const filename = `DB-${yy}-${mm}-${dd}.json`;

            // Use Web Share API on mobile (fixes iOS Safari blob URL issue)
            const file = new File([blob], filename, { type: 'application/json' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: filename })
                    .then(() => showToast('Database shared — import it in SitkaTools to sync'))
                    .catch(() => {});
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Database saved — import it in SitkaTools to sync');
            }
        }

        // ---- Task Definitions (reference + default offset) ----
        // reference: 'cloning' | 'planting' | 'flip' | 'harvest'
        // defaultOffset: days from the reference point
        const TASK_DEFS = [
            { name: 'Cutting Clones', emoji: '✂️', taskType: 'clone_cut_prep', reference: 'cloning', defaultOffset: 0, hasToggle: true, isLocked: true },
            { name: 'Planting Clones', emoji: '🌱', taskType: 'planting', reference: 'cloning', defaultOffset: 14 },
            { name: 'Topping', emoji: '✂️', taskType: 'topping', reference: 'planting', defaultOffset: 3 },
            { name: 'Order Preventative Insects: Swirskii, Hypoaspis, Nematode, Atheta', emoji: '🐛', taskType: 'order_ipm', reference: 'planting', defaultOffset: 7 },
            { name: 'Transplanting to Flower Room', emoji: '🪴', taskType: 'transplant', reference: 'planting', defaultOffset: 14 },
            { name: 'Deploy IPM to Flower Room', emoji: '🛡️', taskType: 'deploy_ipm', reference: 'planting', defaultOffset: 15 },
            { name: 'Two-Node / Lollipop Prune', emoji: '🔪', taskType: 'prune', reference: 'planting', defaultOffset: 20 },
            { name: 'Flip to Flower', emoji: '🌸', taskType: 'flip', reference: 'planting', defaultOffset: 21 },
            // Bloom-relative tasks (offset from flip)
            { name: 'Early Flower Leaf Pick', emoji: '🍃', taskType: 'leafpick_early', reference: 'flip', defaultOffset: 21 },
            { name: 'Cutting Clones to Replace Lot', emoji: '🌿', taskType: 'clone_cut', reference: 'flip', defaultOffset: 42 },
            { name: 'Late Flower Leaf Pick', emoji: '🍂', taskType: 'leafpick_late', reference: 'flip', defaultOffset: 42 },
            // Harvest — user-editable offset from flip (default 56 days = 8 weeks bloom)
            { name: 'Harvest', emoji: '🌾', taskType: 'harvest', reference: 'flip', defaultOffset: 56 },
            // Post-harvest tasks (offset from harvest)
            { name: 'Grow-Room Clean', emoji: '🧹', taskType: 'room_clean', reference: 'harvest', defaultOffset: 1 },
            { name: 'Dry Room Take-Down / Bucking', emoji: '📦', taskType: 'bucking', reference: 'harvest', defaultOffset: 10 },
            { name: 'Prepare Sample for Lab Testing', emoji: '🔬', taskType: 'lab_sample', reference: 'harvest', defaultOffset: 10 },
            // Trim is multi-day (7 days), offset from harvest
            { name: 'Trim', emoji: '✂️', taskType: 'trim', reference: 'harvest', defaultOffset: 11, isMultiDay: true }
        ];

        // ---- postMessage Convention — receive DB from SitkaTools, send updates back ----
        DB.ensureStructure();

        function notifySitkaTools() {
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'sitkaGit_db_update',
                    payload: DB.data
                }, '*');
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data?.type === 'sitkaGit_db' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();

                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'sitkaGit_ready' }, '*');
                }

                buildDefaultOffsets();
                populateLotSelector();
                renderScheduleList();
                updateStatusBar();
                refreshPreview();
                updateGenerateBtnLabel();
                showToast('Database loaded from SitkaTools');
            }

            // Handle live DB updates (e.g., new lots created in SitkaTools)
            // Only refresh the lot selector to avoid disrupting active editing
            if (e.data?.type === 'sitkaGit_db_update' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();
                populateLotSelector();
                updateStatusBar();
            }
        });

        // ---- DOM References ----
        const scheduleForm = $('scheduleForm');
        const plantingDateInput = $('plantingDate');
        const clearFormBtn = $('clearFormBtn');
        const generateBtn = $('generateBtn');
        const scheduleListCard = $('scheduleListCard');
        const scheduleListEl = $('scheduleList');
        const configSummaryEl = $('configSummary');
        const activeLotSelect = $('activeLot');
        const previewTaskList = $('previewTaskList');

        // Trim is fixed at 7 days
        const TRIM_DAYS = 7;

        // ---- Preview State: array of { def, offset } — offset is user-editable days from reference ----
        let taskOffsets = [];

        // ---- Populate Lot Selector ----
        function populateLotSelector() {
            const sel = $('activeLot');
            if (!sel) return;
            sel.innerHTML = '<option value="">— Select a lot —</option>';
            for (const [id, lot] of Object.entries(DB.lots)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = `${id} — ${lot.name || 'Unnamed'} (${lot.strain || '?'})`;
                sel.appendChild(opt);
            }
        }

        // ---- Build task offsets from defaults (called on init / lot change) ----
        function buildDefaultOffsets() {
            taskOffsets = TASK_DEFS.map(def => ({
                def,
                offset: def.defaultOffset ?? 0,
                enabled: def.hasToggle !== undefined ? (def.hasToggle === true ? true : true) : true
            }));
        }

        // ---- Reference date labels ----
        const REF_LABELS = {
            cloning: 'Cloning',
            planting: 'Planting',
            flip: 'Flip to Flower',
            harvest: 'Harvest'
        };

        // ---- Compute anchor dates from config ----
        // topDate: the date from the top picker (cloning date when clones enabled, planting date otherwise)
        // clonesEnabled: whether Cutting Clones is toggled on
        // plantingOffset: days from cloning to planting (only used when clonesEnabled)
        // flipOffset: days from planting to flip (defaults to 21)
        // harvestOffset: days from flip to harvest (defaults to 56 = 8 weeks bloom)
        function computeAnchors(topDate, flipOffset = 21, clonesEnabled = false, plantingOffset = 14, harvestOffset = 56) {
            const addDays = (dateStr, days) => {
                const d = new Date(dateStr + 'T00:00:00');
                d.setDate(d.getDate() + days);
                return d.toISOString().split('T')[0];
            };

            const cloningDate = topDate;
            const plantingDate = clonesEnabled ? addDays(topDate, plantingOffset) : topDate;
            const flipDate = addDays(plantingDate, flipOffset);
            const harvestDate = addDays(flipDate, harvestOffset);

            return { cloning: cloningDate, planting: plantingDate, flip: flipDate, harvest: harvestDate };
        }

        // ---- Compute a task's date from its reference anchor + offset ----
        function computeTaskDate(anchorDateStr, offset) {
            const d = new Date(anchorDateStr + 'T00:00:00');
            d.setDate(d.getDate() + offset);
            return d.toISOString().split('T')[0];
        }

        // =====================================================
        // CropLabourWizard — BC Civic Holidays Module
        // 11 statutory holidays per the BC Employment Standards Act.
        // Every date is a pure function of its year — no external data.
        // All date math uses local-time Date constructors (never UTC).
        // =====================================================
        const Holidays = {
            // Add/subtract days (returns a new Date)
            addDays(d, n) {
                return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
            },

            // Nth occurrence of a weekday in a month (n is 1-based)
            nthWeekday(y, m, weekday, n) {
                const first = new Date(y, m, 1).getDay();
                return new Date(y, m, 1 + ((weekday - first + 7) % 7) + (n - 1) * 7);
            },

            // Victoria Day — the last Monday strictly before May 25 (per BC ESA).
            // Start from May 24 and walk back to the previous Monday.
            victoriaDay(y) {
                const d = new Date(y, 4, 24);
                while (d.getDay() !== 1) d.setDate(d.getDate() - 1);
                return d;
            },

            // Observed-date shift — applies ONLY to fixed-date holidays:
            // if the nominal date falls on Saturday or Sunday, observed on the following Monday.
            observed(d) {
                const dow = d.getDay();
                if (dow === 6) return this.addDays(d, 2); // Sat → Mon
                if (dow === 0) return this.addDays(d, 1); // Sun → Mon
                return d;
            },

            // Easter Sunday — Gregorian computus (Meeus–Jones–Butcher algorithm)
            easterSunday(y) {
                const a = y % 19, b = Math.floor(y / 100), c = y % 100;
                const d = Math.floor(b / 4), e = b % 4;
                const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
                const h = (19 * a + b - d - g + 15) % 30;
                const i = Math.floor(c / 4), k = c % 4;
                const l = (32 + 2 * e + 2 * i - h - k) % 7;
                const m = Math.floor((a + 11 * h + 22 * l) / 451);
                const month = Math.floor((h + l - 7 * m + 114) / 31); // 3 = March, 4 = April
                return new Date(y, month - 1, ((h + l - 7 * m + 114) % 31) + 1);
            },

            // The 11 BC civic holidays for a given year.
            // Returns [{ name, date (observed), nominalDate (only when shifted), rule }]
            getForYear(y) {
                const easter = this.easterSunday(y);
                const defs = [
                    { name: "New Year's Day", rule: 'Jan 1; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 0, 1)), nominalDate: new Date(y, 0, 1) },
                    { name: 'Family Day', rule: 'Third Monday in February', date: this.nthWeekday(y, 1, 1, 3), nominalDate: null },
                    { name: 'Good Friday', rule: 'Two days before Easter Sunday', date: this.addDays(easter, -2), nominalDate: null },
                    { name: 'Victoria Day', rule: 'Last Monday strictly before May 25', date: this.victoriaDay(y), nominalDate: null },
                    { name: 'Canada Day', rule: 'Jul 1; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 6, 1)), nominalDate: new Date(y, 6, 1) },
                    { name: 'BC Day (Civic Holiday)', rule: 'First Monday in August', date: this.nthWeekday(y, 7, 1, 1), nominalDate: null },
                    { name: 'Labour Day', rule: 'First Monday in September', date: this.nthWeekday(y, 8, 1, 1), nominalDate: null },
                    { name: 'National Day for Truth and Reconciliation', rule: 'Sep 30; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 8, 30)), nominalDate: new Date(y, 8, 30) },
                    { name: 'Thanksgiving', rule: 'Second Monday in October', date: this.nthWeekday(y, 9, 1, 2), nominalDate: null },
                    { name: 'Remembrance Day', rule: 'Nov 11; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 10, 11)), nominalDate: new Date(y, 10, 11) },
                    { name: 'Christmas Day', rule: 'Dec 25; observed on the following Monday if it falls on a weekend', date: this.observed(new Date(y, 11, 25)), nominalDate: new Date(y, 11, 25) }
                ];

                return defs.map(def => {
                    const shifted = def.nominalDate && localDateStr(def.nominalDate) !== localDateStr(def.date);
                    return {
                        name: def.name,
                        date: localDateStr(def.date),          // observed date — the day off
                        nominalDate: shifted ? localDateStr(def.nominalDate) : null,
                        rule: def.rule
                    };
                });
            },

            // Look up a holiday by its observed date string ("YYYY-MM-DD"). Returns the holiday or null.
            forDate(dateStr) {
                const y = parseInt(dateStr.slice(0, 4), 10);
                return this.getForYear(y).find(h => h.date === dateStr) || null;
            }
        };

        // ---- Utility: local date string (avoids UTC shift from toISOString) ----
        function localDateStr(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        // ---- Holiday helpers for task dates ----
        // Returns the holiday if any day in [start, end] (inclusive) is an observed BC civic holiday.
        function holidayInRange(startStr, endStr) {
            const end = endStr || startStr;
            let d = new Date(startStr + 'T00:00:00');
            const last = new Date(end + 'T00:00:00');
            while (d <= last) {
                const h = Holidays.forDate(localDateStr(d));
                if (h) return h;
                d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
            }
            return null;
        }

        // Small amber chip shown next to a task's date when it lands on an observed holiday.
        function holidayFlagHtml(holiday) {
            if (!holiday) return '';
            const title = holiday.nominalDate
                ? `${holiday.name} — BC civic holiday (observed ${holiday.date}; nominal date ${holiday.nominalDate} falls on a weekend)`
                : `${holiday.name} — BC civic holiday (${holiday.rule})`;
            return `<span class="holiday-flag" title="${title}">🏛️ Holiday</span>`;
        }

        // ---- Re-render preview whenever config changes ----
        function refreshPreview() {
            const plantingDate = plantingDateInput.value;

            if (!plantingDate) {
                previewTaskList.innerHTML = '<div class="empty-state">Set a date to see the schedule.</div>';
                return;
            }

            // Determine if clones are enabled
            const clonePrepEntry = taskOffsets.find(e => e.def.taskType === 'clone_cut_prep');
            const clonesEnabled = clonePrepEntry?.enabled !== false;

            // Get planting offset (only matters when clones are enabled)
            const plantingEntry = taskOffsets.find(e => e.def.taskType === 'planting');
            const plantingOffset = plantingEntry ? plantingEntry.offset : 14;

            // Get the actual flip offset from taskOffsets (may differ from default 21)
            const flipEntry = taskOffsets.find(e => e.def.taskType === 'flip');
            const flipOffset = flipEntry ? flipEntry.offset : 21;

            // Get the actual harvest offset from taskOffsets (may differ from default 56)
            const harvestEntry = taskOffsets.find(e => e.def.taskType === 'harvest');
            const harvestOffset = harvestEntry ? harvestEntry.offset : 56;

            // Update date picker label based on clone state
            const anchorLabel = $('anchorDateLabel');
            if (anchorLabel) {
                anchorLabel.textContent = clonesEnabled ? 'Cloning Date (Day 0)' : 'Planting Date (Day 0)';
            }

            const anchors = computeAnchors(plantingDate, flipOffset, clonesEnabled, plantingOffset, harvestOffset);

            previewTaskList.innerHTML = '';
            const listWrapper = document.createElement('div');
            listWrapper.className = 'preview-task-list';

            // Tasks whose computed date lands on an observed BC civic holiday (notify only)
            const holidayConflicts = [];

            taskOffsets.forEach((entry, idx) => {
                const def = entry.def;
                const isEnabled = entry.enabled !== false;

                // Determine display reference, label, offset, and locked state
                let displayRef = def.reference;
                let displayLabel = REF_LABELS[displayRef] || displayRef;
                let effectiveOffset = entry.offset;
                let isLockedDisplay = def.isLocked;

                // When clones disabled, planting becomes Day 0 (locked, references planting anchor)
                if (def.taskType === 'planting' && !clonesEnabled) {
                    displayRef = 'planting';
                    displayLabel = REF_LABELS[displayRef];
                    effectiveOffset = 0;
                    isLockedDisplay = true;
                }

                // Compute date from anchor + offset
                const anchorDate = anchors[displayRef];
                let startDate = computeTaskDate(anchorDate, effectiveOffset);
                let endDate = null;

                if (def.isMultiDay && isEnabled) {
                    const d = new Date(startDate + 'T00:00:00');
                    d.setDate(d.getDate() + TRIM_DAYS - 1);
                    endDate = d.toISOString().split('T')[0];
                }

                // Build display date string
                const displayDate = endDate ? `${startDate} → ${endDate}` : startDate;

                // Holiday check — notify only, never auto-reschedule
                const holiday = isEnabled ? holidayInRange(startDate, endDate) : null;

                const item = document.createElement('div');
                item.className = 'preview-task-item' + (isEnabled ? '' : ' disabled');

                const offsetInputId = `offset_${idx}`;
                const checkInputId = `check_${idx}`;

                // Checkbox for tasks with toggle
                const checkboxHtml = def.hasToggle
                    ? `<input type="checkbox" class="task-enabled-check" id="${checkInputId}" ${isEnabled ? 'checked' : ''} data-idx="${idx}" title="Enable/disable this task" />`
                    : '';

                // Offset input: editable unless it's locked or disabled
                let offsetGroupHtml = '';
                if (isLockedDisplay) {
                    offsetGroupHtml = `
                        <div class="preview-offset-group">
                            <label>Day</label>
                            <button type="button" class="spinbox-btn minus" data-target="${offsetInputId}" disabled title="Locked">−</button>
                            <input type="number" id="${offsetInputId}" value="${effectiveOffset}" disabled title="Locked to this day" />
                            <button type="button" class="spinbox-btn plus" data-target="${offsetInputId}" disabled title="Locked">+</button>
                        </div>
                    `;
                } else {
                    const minVal = def.defaultOffset && def.defaultOffset < 0 ? '-30' : '0';
                    offsetGroupHtml = `
                        <div class="preview-offset-group">
                            <label for="${offsetInputId}">Days:</label>
                            <button type="button" class="spinbox-btn minus" data-target="${offsetInputId}" ${!isEnabled ? 'disabled' : ''} title="Decrease by 1">−</button>
                            <input type="number" id="${offsetInputId}" value="${entry.offset}" min="${minVal}" max="200" data-idx="${idx}" ${!isEnabled ? 'disabled' : ''} />
                            <button type="button" class="spinbox-btn plus" data-target="${offsetInputId}" ${!isEnabled ? 'disabled' : ''} title="Increase by 1">+</button>
                        </div>
                    `;
                }

                // Offset label: show sign for negative offsets
                const offsetLabel = effectiveOffset >= 0 ? `+${effectiveOffset}d` : `${effectiveOffset}d`;

                item.innerHTML = `
                    ${checkboxHtml}
                    <span class="preview-task-emoji">${def.emoji}</span>
                    <div class="preview-task-info">
                        <div class="preview-task-name">${escapeHtml(def.name)}</div>
                        <div class="preview-task-reference"><strong>${offsetLabel}</strong> from ${displayLabel}</div>
                    </div>
                    ${offsetGroupHtml}
                    <span class="preview-computed-date${def.isMultiDay ? ' multi' : ''}" ${!isEnabled ? 'style="opacity:0.4"' : ''}>${displayDate}</span>
                    ${holidayFlagHtml(holiday)}
                `;

                listWrapper.appendChild(item);

                // Collect holiday conflicts for the summary banner
                if (holiday) {
                    holidayConflicts.push({ name: def.name, emoji: def.emoji, date: displayDate, holiday });
                }
            });

            previewTaskList.appendChild(listWrapper);

            // Holiday conflict summary — notify only, never auto-reschedule
            const banner = document.createElement('div');
            if (holidayConflicts.length > 0) {
                banner.className = 'holiday-conflict-banner';
                const items = holidayConflicts.map(c =>
                    `<li>${c.emoji} ${escapeHtml(c.name)} — <strong>${c.date}</strong> falls on ${escapeHtml(c.holiday.name)}${c.holiday.nominalDate ? ` (observed; nominal date ${c.holiday.nominalDate})` : ''}</li>`
                ).join('');
                banner.innerHTML = `<strong>⚠️ ${holidayConflicts.length} task${holidayConflicts.length > 1 ? 's' : ''} fall${holidayConflicts.length > 1 ? '' : 's'} on a BC civic holiday</strong><ul>${items}</ul>`;
            } else {
                banner.className = 'hidden';
                banner.innerHTML = '';
            }
            previewTaskList.appendChild(banner);

            // Attach live-update listeners to all offset inputs
            listWrapper.querySelectorAll('input[type="number"]').forEach(input => {
                input.addEventListener('input', () => {
                    const i = parseInt(input.dataset.idx);
                    taskOffsets[i].offset = parseInt(input.value) || 0;
                    // Re-render to update computed dates and labels
                    refreshPreview();
                });
            });

            // Attach listeners to enable/disable checkboxes
            listWrapper.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', () => {
                    const i = parseInt(checkbox.dataset.idx);
                    taskOffsets[i].enabled = checkbox.checked;
                    // Re-render to update disabled state and styling
                    refreshPreview();
                });
            });

            // Attach spinbox +/- button handlers
            listWrapper.querySelectorAll('.spinbox-btn[data-target]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const inputId = btn.dataset.target;
                    const input = document.getElementById(inputId);
                    if (!input || input.disabled) return;
                    const delta = btn.classList.contains('plus') ? 1 : -1;
                    const min = parseFloat(input.min) || -30;
                    const max = parseFloat(input.max) || 200;
                    let val = parseInt(input.value) || 0;
                    val = Math.max(min, Math.min(max, val + delta));
                    input.value = val;
                    // Trigger the input event to update state and re-render
                    input.dispatchEvent(new Event('input'));
                });
            });
        }

        // ---- Update Generate Button Label ----
        function updateGenerateBtnLabel() {
            const lotId = activeLotSelect.value;
            const hasSchedule = lotId && DB.lots[lotId]?._tool_CropLabourWizard;
            generateBtn.textContent = hasSchedule ? 'Overwrite Schedule' : 'Generate Schedule';
        }

        // ---- Lot Selector Change Handler ----
        activeLotSelect.addEventListener('change', () => {
            renderScheduleList();
            updateFormFromStoredConfig();
            buildDefaultOffsets();
            refreshPreview();
            updateGenerateBtnLabel();
        });

        // ---- Update Form from Stored Config ----
        function updateFormFromStoredConfig() {
            const lotId = activeLotSelect.value;
            if (!lotId) return;

            const config = DB.lots[lotId]?._tool_CropLabourWizard;
            if (config) {
                plantingDateInput.value = config.plantingDate || '';
            }
        }

        // ---- Auto-refresh preview when planting date changes ----
        plantingDateInput.addEventListener('input', () => refreshPreview());

        // ---- Reconcile: Remove existing CropLabourWizard events for a lot ----
        function reconcileLotSchedule(lotId) {
            DB.data.calendarEvents = DB.data.calendarEvents.filter(ev => {
                if (ev.sourceTool === 'CropLabourWizard' && ev.lotId === lotId) {
                    return false; // Remove stale events for this lot
                }
                return true;
            });
        }

        // ---- Generate Schedule (uses current offsets to compute final dates) ----
        scheduleForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const lotId = activeLotSelect.value;
            if (!lotId) {
                alert('Please select a lot first.');
                return;
            }

            const plantingDate = plantingDateInput.value;

            if (!plantingDate) {
                alert('Please set a planting date.');
                return;
            }

            DB.ensureStructure();

            // Reconcile: remove existing schedule for this lot
            reconcileLotSchedule(lotId);

            // Determine if clones are enabled
            const clonePrepEntry = taskOffsets.find(e => e.def.taskType === 'clone_cut_prep');
            const clonesEnabled = clonePrepEntry?.enabled !== false;

            // Get planting offset (only matters when clones are enabled)
            const plantingEntry = taskOffsets.find(e => e.def.taskType === 'planting');
            const plantingOffset = plantingEntry ? plantingEntry.offset : 14;

            // Get the actual flip offset from taskOffsets (may differ from default 21)
            const flipEntry = taskOffsets.find(e => e.def.taskType === 'flip');
            const flipOffset = flipEntry ? flipEntry.offset : 21;

            // Get the actual harvest offset from taskOffsets (may differ from default 56)
            const harvestEntry = taskOffsets.find(e => e.def.taskType === 'harvest');
            const harvestOffset = harvestEntry ? harvestEntry.offset : 56;
            const anchors = computeAnchors(plantingDate, flipOffset, clonesEnabled, plantingOffset, harvestOffset);

            // Build calendar events from current offsets (skip disabled tasks)
            const newEvents = [];
            for (const entry of taskOffsets) {
                // Skip disabled tasks
                if (entry.enabled === false) continue;

                const def = entry.def;

                // Determine effective reference and offset
                let anchorRef = def.reference;
                let effectiveOffset = entry.offset;

                // When clones disabled, planting is at Day 0 from planting anchor
                if (def.taskType === 'planting' && !clonesEnabled) {
                    anchorRef = 'planting';
                    effectiveOffset = 0;
                }

                const anchorDate = anchors[anchorRef];
                const startDate = computeTaskDate(anchorDate, effectiveOffset);

                const event = {
                    date: startDate,
                    title: `${def.emoji} ${def.name} — ${lotId}`,
                    sourceTool: 'CropLabourWizard',
                    lotId: lotId,
                    taskType: def.taskType
                };

                // Multi-day events get endDate
                if (def.isMultiDay) {
                    const d = new Date(startDate + 'T00:00:00');
                    d.setDate(d.getDate() + TRIM_DAYS - 1);
                    event.endDate = d.toISOString().split('T')[0];
                }

                newEvents.push(event);
            }

            // Append to calendarEvents
            DB.data.calendarEvents.push(...newEvents);

            // Store config per-lot
            DB.data.lots[lotId]._tool_CropLabourWizard = {
                plantingDate: plantingDate,
                trimDays: TRIM_DAYS,
                taskCount: newEvents.length,
                generatedAt: new Date().toISOString()
            };

            // Update top-level metadata
            if (!DB.data._CropLabourWizard) {
                DB.data._CropLabourWizard = { generations: [] };
            }
            DB.data._CropLabourWizard.generations.push({
                lotId: lotId,
                plantingDate: plantingDate,
                trimDays: TRIM_DAYS,
                taskCount: newEvents.length,
                generatedAt: new Date().toISOString()
            });

            // Re-render
            renderScheduleList();
            updateStatusBar();
            updateGenerateBtnLabel();

            // Notify SitkaTools via postMessage
            notifySitkaTools();

            // Holiday conflicts — notify only, never auto-reschedule
            const conflictEvents = newEvents.filter(ev => holidayInRange(ev.date, ev.endDate));
            let toastMsg = `Schedule generated — ${newEvents.length} tasks for ${lotId}`;
            if (conflictEvents.length > 0) {
                toastMsg += ` · ⚠️ ${conflictEvents.length} on a BC civic holiday`;
            }
            showToast(toastMsg);
        });

        // ---- Clear Schedule — remove all CropLabourWizard events for the selected lot ----
        clearFormBtn.addEventListener('click', () => {
            const lotId = activeLotSelect.value;

            if (!lotId) {
                showToast('Select a lot first');
                return;
            }

            // Check if there are any events to clear
            const existingCount = DB.data.calendarEvents.filter(
                ev => ev.sourceTool === 'CropLabourWizard' && ev.lotId === lotId
            ).length;

            if (existingCount === 0) {
                showToast('No schedule to clear for this lot');
                return;
            }

            // Remove all CropLabourWizard events for this lot
            DB.data.calendarEvents = DB.data.calendarEvents.filter(
                ev => !(ev.sourceTool === 'CropLabourWizard' && ev.lotId === lotId)
            );

            // Clear per-lot config
            if (DB.lots[lotId]?._tool_CropLabourWizard) {
                delete DB.lots[lotId]._tool_CropLabourWizard;
            }

            // Notify SitkaTools so the calendar refreshes
            notifySitkaTools();

            // Reset form state
            buildDefaultOffsets();
            refreshPreview();
            renderScheduleList();
            updateGenerateBtnLabel();

            showToast(`Cleared ${existingCount} schedule events from ${lotId}`);
        });

        // ---- Render Schedule List ----
        function renderScheduleList() {
            const lotId = activeLotSelect.value;

            if (!lotId) {
                scheduleListCard.style.display = 'none';
                return;
            }

            // Get stored config
            const config = DB.lots[lotId]?._tool_CropLabourWizard;

            if (!config) {
                scheduleListCard.style.display = 'none';
                return;
            }

            scheduleListCard.style.display = 'block';

            // Show config summary
            configSummaryEl.style.display = 'flex';
            configSummaryEl.innerHTML = `
                <span>📅 Anchor: <strong>${config.plantingDate}</strong></span>
                <span>✂️ Trim: <strong>${config.trimDays} days</strong></span>
                <span>📋 Tasks: <strong>${config.taskCount || '?'}</strong></span>
            `;

            // Get calendar events for this lot from CropLabourWizard
            const lotEvents = (DB.data.calendarEvents || []).filter(
                ev => ev.sourceTool === 'CropLabourWizard' && ev.lotId === lotId
            ).sort((a, b) => a.date.localeCompare(b.date));

            if (lotEvents.length === 0) {
                scheduleListEl.innerHTML = '<div class="empty-state">No tasks found. Schedule may have been cleared.</div>';
                return;
            }

            scheduleListEl.innerHTML = '';
            const listWrapper = document.createElement('div');
            listWrapper.className = 'task-list';

            lotEvents.forEach((ev, idx) => {
                const item = document.createElement('div');
                item.className = 'task-item';

                const displayDate = ev.endDate && ev.endDate !== ev.date
                    ? `${ev.date} → ${ev.endDate}`
                    : ev.date;

                // Holiday check — notify only, never auto-reschedule
                const holiday = holidayInRange(ev.date, ev.endDate);

                // Extract emoji from title
                const emojiMatch = ev.title.match(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic}\uFE0F?)\s*/su);
                const emoji = emojiMatch ? emojiMatch[1] : '📋';
                const nameWithoutEmoji = ev.title.replace(emoji + ' ', '');

                item.innerHTML = `
                    <span class="task-emoji">${emoji}</span>
                    <div class="task-info">
                        <div class="task-name">${escapeHtml(nameWithoutEmoji)}</div>
                        <span class="task-type-badge">${escapeHtml(ev.taskType || '')}</span>
                    </div>
                    <span class="task-date-badge">${displayDate}</span>
                    ${holidayFlagHtml(holiday)}
                    <button class="task-delete-btn" title="Delete entire schedule for this lot">✕</button>
                `;

                listWrapper.appendChild(item);
            });

            scheduleListEl.appendChild(listWrapper);

            // Attach delete handlers (deletes ENTIRE schedule for the lot)
            scheduleListEl.querySelectorAll('.task-delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    deleteLotSchedule(lotId);
                });
            });
        }

        // ---- Delete Lot Schedule ----
        function deleteLotSchedule(lotId) {
            const taskCount = getLotTaskCount(lotId);
            if (!confirm(`Delete the entire crop schedule for ${lotId}?\nThis will remove all ${taskCount} tasks from the calendar.`)) return;

            DB.ensureStructure();

            // Remove all CropLabourWizard events for this lot
            reconcileLotSchedule(lotId);

            // Clear per-lot config
            if (DB.data.lots[lotId]?._tool_CropLabourWizard) {
                delete DB.data.lots[lotId]._tool_CropLabourWizard;
            }

            // Remove generation record
            if (DB.data._CropLabourWizard?.generations) {
                DB.data._CropLabourWizard.generations = DB.data._CropLabourWizard.generations.filter(
                    g => g.lotId !== lotId
                );
            }

            // Notify SitkaTools via postMessage
            notifySitkaTools();

            renderScheduleList();
            updateStatusBar();
            showToast(`Schedule deleted for ${lotId}`);
        }

        function getLotTaskCount(lotId) {
            return (DB.data.calendarEvents || []).filter(
                ev => ev.sourceTool === 'CropLabourWizard' && ev.lotId === lotId
            ).length;
        }

        // ---- Update Status Bar ----
        function updateStatusBar() {
            const statusBar = $('statusBar');
            const statusText = $('statusText');
            if (!statusBar || !statusText) return;

            if (!DB.data) {
                statusBar.className = 'status-bar';
                statusText.textContent = 'No database loaded. Open from SitkaTools.';
                return;
            }

            statusBar.className = 'status-bar loaded';
            const lotCount = Object.keys(DB.lots).length;
            const scheduledLots = Object.values(DB.lots).filter(l => l._tool_CropLabourWizard).length;
            statusText.textContent = `Database loaded — ${lotCount} lots, ${scheduledLots} with schedules`;
        }

        // ---- Close Tool ----
        $('closeToolBtn').addEventListener('click', () => window.close());

        // ---- Mobile UI Setup ----
        if (isMobileDevice) {
            // Show mobile import banner at top
            $('mobileBanner').classList.add('show');
            // Show save database button in footer
            $('saveDbBtn').style.display = 'inline-block';

            // Wire up import button
            $('importDbBtn').addEventListener('click', () => {
                $('dbImportInput').click();
            });
            $('dbImportInput').addEventListener('change', handleDbImport);

            // Wire up save button
            $('saveDbBtn').addEventListener('click', handleDbSave);
        }

        // ---- Toast ----
        function showToast(msg) {
            const toast = $('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ---- Utility ----
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---- Start ----
        function init() {
            // Set default planting date to today
            plantingDateInput.value = new Date().toISOString().split('T')[0];

            buildDefaultOffsets();
            populateLotSelector();
            renderScheduleList();
            updateStatusBar();
            refreshPreview();
        }
        init();
    </script>
</body>
</html>
