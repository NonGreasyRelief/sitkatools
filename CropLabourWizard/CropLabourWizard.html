                // Collect holiday conflicts for the summary banner
                if (holiday) {
                    holidayConflicts.push({ name: def.name, emoji: def.emoji, date: displayDate, holiday });
                }
            });

            previewTaskList.appendChild(listWrapper);

            // Holiday conflict summary — notify only, never auto-reschedule
            const banner = document.createElement('div');
            if (holidayConflicts.length > 0) {
                banner.className = 'holiday-conflict-banner';
                const items = holidayConflicts.map(c =>
                    `<li>${c.emoji} ${escapeHtml(c.name)} — <strong>${c.date}</strong> falls on ${escapeHtml(c.holiday.name)}${c.holiday.nominalDate ? ` (observed; nominal date ${c.holiday.nominalDate})` : ''}</li>`
                ).join('');
                banner.innerHTML = `<strong>⚠️ ${holidayConflicts.length} task${holidayConflicts.length > 1 ? 's' : ''} fall${holidayConflicts.length > 1 ? '' : 's'} on a BC civic holiday</strong><ul>${items}</ul>`;
            } else {
                banner.className = 'hidden';
                banner.innerHTML = '';
            }
            previewTaskList.appendChild(banner);

            // Attach live-update listeners to all offset inputs
            listWrapper.querySelectorAll('input[type="number"][data-idx]').forEach(input => {
                input.addEventListener('input', () => {
                    const i = parseInt(input.dataset.idx);
                    taskOffsets[i].offset = parseInt(input.value) || 0;
                    // Re-render to update computed dates and labels
                    refreshPreview();
                });
            });

            // Trim length spinbox
            const trimDaysInput = listWrapper.querySelector('#trimDaysInput');
            if (trimDaysInput) {
                trimDaysInput.addEventListener('input', () => {
                    trimDays = clampDuration(trimDaysInput.value, trimDays);
                    refreshPreview();
                });
            }

            // Harvest multi-day toggle + length
            const harvestMultiCheck = listWrapper.querySelector('#harvestMultiCheck');
            if (harvestMultiCheck) {
                harvestMultiCheck.addEventListener('change', () => {
                    harvestMultiDay = harvestMultiCheck.checked;
                    refreshPreview();
                });
            }
            const harvestDaysInput = listWrapper.querySelector('#harvestDaysInput');
            if (harvestDaysInput && !harvestDaysInput.disabled) {
                harvestDaysInput.addEventListener('input', () => {
                    harvestDays = clampDuration(harvestDaysInput.value, harvestDays);
                    refreshPreview();
                });
            }

            // Attach listeners to enable/disable checkboxes (scoped — the harvest multi-day checkbox has no data-idx)
            listWrapper.querySelectorAll('input.task-enabled-check').forEach(checkbox => {
                checkbox.addEventListener('change', () => {
                    const i = parseInt(checkbox.dataset.idx);
                    taskOffsets[i].enabled = checkbox.checked;
                    // Re-render to update disabled state and styling
                    refreshPreview();
                });
            });

            // Attach spinbox +/- button handlers
            listWrapper.querySelectorAll('.spinbox-btn[data-target]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const inputId = btn.dataset.target;
                    const input = document.getElementById(inputId);
                    if (!input || input.disabled) return;
                    const delta = btn.classList.contains('plus') ? 1 : -1;
                    const min = parseFloat(input.min) || -30;
                    const max = parseFloat(input.max) || 200;
                    let val = parseInt(input.value) || 0;
                    val = Math.max(min, Math.min(max, val + delta));
                    input.value = val;
                    // Trigger the input event to update state and re-render
                    input.dispatchEvent(new Event('input'));
                });
            });

            // Attach date-picker handlers to clickable computed-date badges.
            // Picking a day adjusts this task's offset by the delta — same cascade rules as the spinbox.
            listWrapper.querySelectorAll('.preview-computed-date.clickable').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const i = parseInt(btn.dataset.idx);
                    const entry = taskOffsets[i];
                    const currentStart = btn.dataset.date;
                    DatePicker.open(btn, currentStart, (picked) => {
                        const delta = daysBetween(currentStart, picked);
                        if (delta === 0) return;
                        // Same clamp rules as the +/- spinbox
                        const min = entry.def.defaultOffset && entry.def.defaultOffset < 0 ? -30 : 0;
                        const max = 200;
                        entry.offset = Math.max(min, Math.min(max, entry.offset + delta));
                        refreshPreview();
                    });
                });
            });
        }

        // ---- Update Generate Button Label ----
        function updateGenerateBtnLabel() {
            const lotId = activeLotSelect.value;
            const hasSchedule = lotId && getScheduleConfig(lotId);
            generateBtn.textContent = hasSchedule ? 'Overwrite Schedule' : 'Generate Schedule';
        }

        // ---- Lot Selector Change Handler ----
        activeLotSelect.addEventListener('change', () => {
            renderScheduleList();
            updateFormFromStoredConfig();
            buildDefaultOffsets();
            applyStoredScheduleToOffsets(activeLotSelect.value);
            refreshPreview();
            updateGenerateBtnLabel();
            updateProjectBtnState();
        });

        // ---- Update Form from Stored Config ----
        function updateFormFromStoredConfig() {
            const lotId = activeLotSelect.value;
            const config = getScheduleConfig(lotId);

            if (config) {
                plantingDateInput.value = config.plantingDate || '';
                trimDays = clampDuration(config.trimDays, DEFAULT_TRIM_DAYS);
                harvestMultiDay = !!config.harvestMultiDay;
                harvestDays = clampDuration(config.harvestDays, DEFAULT_HARVEST_DAYS);
            } else {
                // No stored schedule — reset durations to defaults
                trimDays = DEFAULT_TRIM_DAYS;
                harvestMultiDay = false;
                harvestDays = DEFAULT_HARVEST_DAYS;
                // Suggested cloning day defaults to the lot's created date (real lots only)
                const lot = isProjectedLot(lotId) ? null : (DB.lots[lotId] || null);
                if (lot && lot.createdDate) plantingDateInput.value = lot.createdDate;
            }
        }

        // ---- Auto-refresh preview when planting date changes ----
        plantingDateInput.addEventListener('input', () => refreshPreview());

        // ---- Reconcile: Remove existing schedule events for a lot (sourceTool depends on lot type) ----
        function reconcileLotSchedule(lotId) {
            const tool = lotSourceTool(lotId);
            DB.data.calendarEvents = DB.data.calendarEvents.filter(ev => {
                if (ev.sourceTool === tool && ev.lotId === lotId) {
                    return false; // Remove stale events for this lot
                }
                return true;
            });
        }

        // =====================================================
        // Crop Projection — 5-lot chain per flowering room (see root Agent.MD)
        // Lot Day 0 = the form's anchor date (the clone-cut date when cloning is enabled).
        // Chain rule: Lot(k+1) Day 0 = Lot(k) harvest START − 21 days.
        // =====================================================

        const PROJECTION_LOT_COUNT = 5;

        // Projected lot IDs are room-scoped: `{roomId}-TBA-{index}` (e.g. "G1B6-TBA-01").
        // The room code in the ID keeps each room's chain from colliding with another
        // room's, and the TBA marker distinguishes them from real lots.
        function projectedLotId(roomId, index) {
            return `${roomId}-TBA-${String(index).padStart(2, '0')}`;
        }

        // Task types whose dates move with the bloom length (everything from flip onward, except
        // flip itself). Pre-flip tasks stay anchored to Day 0.
        const BLOOM_DEPENDENT_TASKS = new Set([
            'ipm_spray_flower_start', 'trellis_layout', 'ipm_spray_flower_week2',
            'leafpick_early', 'clone_cut', 'leafpick_late', 'harvest',
            'room_clean', 'tank_irrigation_clean', 'tote_prep', 'bucking', 'lab_sample',
            'trim_room_prep', 'trim', 'machine_trim', 'dry_room_clean', 'weigh_ship'
        ]);

        // Default offsets without touching the live preview state (taskOffsets).
        // The harvest offset is set to bloomDays so a fresh lot uses the selected bloom length.
        function defaultOffsetsSnapshot(bloomDays = 63) {
            return TASK_DEFS.map(def => ({
                def,
                offset: def.taskType === 'harvest' ? bloomDays : (def.defaultOffset ?? 0),
                // Mirror the manual-preview defaults: toggleable tasks follow defaultEnabled
                // (the IPM sprays stay off in fresh projections)
                enabled: def.hasToggle ? (def.defaultEnabled !== false) : true
            }));
        }

        // Build + persist a full schedule for a lot from explicit offsets and durations.
        // Shared by the Generate button (real & projected lots) and projection chain generation.
        function generateLotSchedule(lotId, day0, offsets, durations) {
            const d = durations || { trimDays, harvestMultiDay, harvestDays };

            const clonePrepEntry = offsets.find(e => e.def.taskType === 'clone_cut_prep');
            const clonesEnabled = clonePrepEntry?.enabled !== false;
            const plantingEntry = offsets.find(e => e.def.taskType === 'planting');
            const plantingOffset = plantingEntry ? plantingEntry.offset : 14;
            const flipEntry = offsets.find(e => e.def.taskType === 'flip');
            const flipOffset = flipEntry ? flipEntry.offset : 20;
            const harvestEntry = offsets.find(e => e.def.taskType === 'harvest');
            const harvestOffset = harvestEntry ? harvestEntry.offset : 63;
            const trimEntry = offsets.find(e => e.def.taskType === 'trim');
            const trimOffset = trimEntry ? trimEntry.offset : 11;

            const anchors = computeAnchors(day0, flipOffset, clonesEnabled, plantingOffset, harvestOffset, trimOffset, d.harvestMultiDay, d.harvestDays);

            // Projected lots emit CropProjection events tagged with their room (SitkaTools uses
            // roomId to delete a room's projections when a real lot takes the slot)
            const isProjected = isProjectedLot(lotId);
            const projRoomId = isProjected ? getProjectedLots()[lotId].roomId : null;

            const newEvents = [];
            for (const entry of offsets) {
                // Skip disabled tasks
                if (entry.enabled === false) continue;

                const def = entry.def;

                // Determine effective reference and offset
                let anchorRef = def.reference;
                let effectiveOffset = entry.offset;

                // When clones disabled, planting is at Day 0 from planting anchor
                if (def.taskType === 'planting' && !clonesEnabled) {
                    anchorRef = 'planting';
                    effectiveOffset = 0;
                }

                const anchorDate = resolveTaskAnchor(anchors, anchorRef);
                let startDate = computeTaskDate(anchorDate, effectiveOffset);

                // Clone cut is derived — always harvest start − 21 days (follows bloom length)
                if (def.taskType === 'clone_cut') {
                    startDate = computeTaskDate(anchors.harvest, -21);
                }

                const event = {
                    date: startDate,
                    title: buildEventTitle(def, lotId),
                    sourceTool: isProjected ? 'CropProjection' : 'CropLabourWizard',
                    lotId: lotId,
                    taskType: def.taskType
                };
                if (projRoomId) event.roomId = projRoomId;

                // Multi-day events get endDate (Trim always; Harvest when multi-day is checked)
                let endDate = null;
                if (def.taskType === 'trim' && d.trimDays > 1) endDate = computeTaskDate(startDate, d.trimDays - 1);
                else if (def.taskType === 'harvest' && d.harvestMultiDay && d.harvestDays > 1) endDate = computeTaskDate(startDate, d.harvestDays - 1);
                if (endDate) event.endDate = endDate;

                newEvents.push(event);
            }

            // Append to calendarEvents
            DB.data.calendarEvents.push(...newEvents);

            // Store config (real lot: _tool_CropLabourWizard; projected lot: map entry .config)
            const config = {
                plantingDate: day0,
                trimDays: d.trimDays,
                harvestMultiDay: d.harvestMultiDay,
                harvestDays: d.harvestDays,
                taskCount: newEvents.length,
                generatedAt: new Date().toISOString()
            };
            setScheduleConfig(lotId, config);
            return { events: newEvents, config };
        }

        // Re-anchor one projected lot so its Day 0 = day0. Lots with existing events are
        // shifted by the delta (preserving every per-task offset); when bloomDays is provided,
        // bloom-dependent tasks additionally shift to enforce that bloom length (overriding any
        // custom bloom). Stale lots (no events) are regenerated fresh from defaults at their new position.
        function reAnchorProjectedLot(roomId, index, day0, bloomDays) {
            const lotId = projectedLotId(roomId, index);
            const entry = getProjectedLots()[lotId];
            if (!entry) return;

            const events = eventsForLot(lotId);
            const oldDay0 = entry.config?.plantingDate;

            if (events.length === 0) {
                // Stale — fresh generation from defaults at the new Day 0
                generateLotSchedule(lotId, day0, defaultOffsetsSnapshot(bloomDays), {
                    trimDays: DEFAULT_TRIM_DAYS, harvestMultiDay: false, harvestDays: DEFAULT_HARVEST_DAYS
                });
                return;
            }

            // Day-0 shift (applied to every event) — preserves per-task offsets from Day 0.
            const delta = oldDay0 ? daysBetween(oldDay0, day0) : 0;

            // Bloom adjustment (applied only to bloom-dependent tasks) — makes the new bloom length
            // take effect. 0 when bloomDays is not provided (e.g., manual-edit cascade).
            let deltaBloom = 0;
            if (bloomDays != null) {
                const flipEv = events.find(ev => ev.taskType === 'flip');
                const harvestEv = events.find(ev => ev.taskType === 'harvest');
                if (flipEv && harvestEv) {
                    deltaBloom = bloomDays - daysBetween(flipEv.date, harvestEv.date);
                }
            }

            for (const ev of events) {
                const shift = delta + (BLOOM_DEPENDENT_TASKS.has(ev.taskType) ? deltaBloom : 0);
                if (shift === 0) continue;
                ev.date = computeTaskDate(ev.date, shift);
                if (ev.endDate) ev.endDate = computeTaskDate(ev.endDate, shift);
            }

            // Update stored config's anchor (keep the other fields)
            entry.config = Object.assign({}, entry.config, {
                plantingDate: day0,
                generatedAt: new Date().toISOString()
            });
        }

        // Re-project lots fromIndex..5 forward in the chain: each lot's new Day 0 =
        // previous lot's harvest start − 21 (read from its current events).
        function cascadeProjections(roomId, fromIndex, bloomDays) {
            for (let i = fromIndex; i <= PROJECTION_LOT_COUNT; i++) {
                const prevEvents = eventsForLot(projectedLotId(roomId, i - 1));
                const prevHarvest = prevEvents.find(ev => ev.taskType === 'harvest');
                if (!prevHarvest) continue; // previous lot has no schedule — nothing to chain from
                reAnchorProjectedLot(roomId, i, computeTaskDate(prevHarvest.date, -21), bloomDays);
            }
        }

        // The NEWEST real lot in a room — the one with the latest createdDate (the crop that most
        // recently came into the room). This is the lot projections anchor off, and the specific lot
        // that must have a generated schedule before Project Crop is available. Returns the lotId,
        // or null if the room has no real lots. Ties / missing dates fall back to assignedLots order.
        function newestRealLotId(roomId) {
            const room = (DB.data.rooms || {})[roomId];
            if (!room) return null;
            let bestId = null, bestDate = '';
            for (const lotId of room.assignedLots || []) {
                if (isProjectedLot(lotId)) continue;
                const d = (DB.lots[lotId] || {}).createdDate || '';
                if (!bestId || d.localeCompare(bestDate) >= 0) { bestId = lotId; bestDate = d; }
            }
            return bestId;
        }

        // Resolve the Lot-1 anchor + gate for a room's projection chain. Projections anchor off the
        // NEWEST real lot in the room (latest createdDate) — specifically its "Cut Clones to Replace
        // Lot" (clone_cut) day, or its start day (Day 0 / plantingDate) if it has no clone_cut event.
        // The gate: that newest lot MUST have a generated schedule; if it doesn't (or the room has no
        // real lots), returns null and Project Crop stays disabled. Returns { lotId, anchorDate } or null.
        function resolveProjectionAnchor(roomId) {
            const lotId = newestRealLotId(roomId);
            if (!lotId) return null;
            const events = eventsForLot(lotId);
            if (events.length === 0) return null; // newest lot not scheduled yet — gate fails
            const cut = events.find(ev => ev.taskType === 'clone_cut');
            let anchorDate = cut ? cut.date : null;
            if (!anchorDate) {
                const cfg = getScheduleConfig(lotId);
                anchorDate = cfg ? cfg.plantingDate : null; // start day / Day 0 fallback
            }
            if (!anchorDate) return null;
            return { lotId, anchorDate };
        }

        // Generate/refresh the full 5-lot projection chain for a flowering room.
        // Lot 1 anchors to the NEWEST real lot's "Cut Clones to Replace Lot" (clone_cut) day —
        // or that lot's start day if it has no clone_cut event. Gated: that specific newest lot
        // must have a generated schedule, else there is nothing to anchor off.
        // Never auto-runs — only via the Project Crop button.
        function generateProjectionsForRoom(roomId) {
            const room = (DB.data.rooms || {})[roomId];
            if (!room) return;
            if (!room.isFlowering) {
                alert(`"${room.name}" is not flagged as a flowering room.`);
                return;
            }

            // Gate: the room's newest real lot must have a generated schedule to anchor off.
            const anchor = resolveProjectionAnchor(roomId);
            if (!anchor) {
                const newestLotId = newestRealLotId(roomId);
                showToast(`🔮 "${room.name}"'s newest lot${newestLotId ? ` (${newestLotId})` : ''} needs a generated schedule before Project Crop`);
                return;
            }

            DB.ensureStructure();
            const map = ensureProjectedLots();

            // Ensure all 5 map entries exist (keep existing entries — never prune)
            for (let i = 1; i <= PROJECTION_LOT_COUNT; i++) {
                const lotId = projectedLotId(roomId, i);
                if (!map[lotId]) {
                    map[lotId] = { name: `${roomId}-TBA-${String(i).padStart(2, '0')}`, roomId, roomName: room.name, strain: 'TBA', index: i };
                } else {
                    map[lotId].roomName = room.name; // keep in sync if the room was renamed
                }
            }

            // Lot 1 anchor: the newest real lot's clone_cut day (or its start day if no clone_cut)
            reAnchorProjectedLot(roomId, 1, anchor.anchorDate, projectionBloomDays);
            cascadeProjections(roomId, 2, projectionBloomDays);

            populateLotSelector();
            renderScheduleList();
            updateStatusBar();
            updateGenerateBtnLabel();
            updateProjectBtnState();
            refreshPreview();
            notifySitkaTools();
            showToast(`🔮 Projections generated — ${PROJECTION_LOT_COUNT} lots for ${room.name} (${projectionBloomDays / 7}-week bloom)`);
        }

        // A lot's effective "Tank and Irrigation Line Clean" date — the last room-prep task, i.e. when
        // the room is ready for the next crop to be transplanted in. Reads the actual event; falls back
        // to harvest end + 2 (the task's default offset) if the task is missing or disabled.
        function effectiveIrrigationClean(lotId) {
            const events = eventsForLot(lotId);
            const irr = events.find(ev => ev.taskType === 'tank_irrigation_clean');
            if (irr) return irr.date;
            const h = events.find(ev => ev.taskType === 'harvest');
            if (h) return computeTaskDate(h.endDate || h.date, 2);
            return null;
        }

        // Short display date for warning text (e.g. "2026-03-14" → "Mar 14")
        const SHORT_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        function shortDate(dateStr) {
            if (!dateStr) return '?';
            const d = new Date(dateStr + 'T00:00:00');
            return SHORT_MONTHS[d.getMonth()] + ' ' + d.getDate();
        }

        // Late-arrival push-back plan for a pending room's reprojection. Pure — reads only, writes nothing.
        // After the rename pass, slot i will hold current TBA-(i+1). For each slot 1..4 we ensure its
        // transplant lands at least 1 day after the previous lot's irrigation-clean (room readiness). A
        // lot already late enough (planned delay absorbs it) stays put; otherwise it is pushed back by the
        // minimum delta. Stale / position-less lots are regenerated at the required position. Slot 5 is fresh.
        // Returns an array of per-slot plans, or null if the real lot has no usable irrigation-clean anchor.
        function computeReprojectionPushes(roomId, newRealLotId) {
            const startIrr = effectiveIrrigationClean(newRealLotId);
            if (!startIrr) return null;

            const plan = [];
            let prevIrr = startIrr;

            for (let i = 1; i <= PROJECTION_LOT_COUNT - 1; i++) {
                const currentLotId = projectedLotId(roomId, i + 1); // lot that will move into slot i
                const requiredTransplant = computeTaskDate(prevIrr, 1);
                const events = eventsForLot(currentLotId);

                let currentTransplant = null;
                if (events.length > 0) {
                    const tEv = events.find(ev => ev.taskType === 'transplant');
                    if (tEv) currentTransplant = tEv.date;
                    else {
                        const cfg = getProjectedLots()[currentLotId]?.config;
                        if (cfg?.plantingDate) currentTransplant = computeTaskDate(cfg.plantingDate, 24);
                    }
                }
                const lotIrr = effectiveIrrigationClean(currentLotId);

                if (!currentTransplant || !lotIrr) {
                    // Stale or position-less — regenerate fresh at the required position
                    const day0 = computeTaskDate(requiredTransplant, -24);
                    plan.push({ index: i, currentLotId, action: 'regen', delta: null, transplantBefore: null, transplantAfter: requiredTransplant, day0 });
                    prevIrr = computeTaskDate(day0, 34 + projectionBloomDays + 2);
                    continue;
                }

                const delta = daysBetween(currentTransplant, requiredTransplant);
                if (delta > 0) {
                    const day0 = computeTaskDate(requiredTransplant, -24);
                    plan.push({ index: i, currentLotId, action: 'push', delta, transplantBefore: currentTransplant, transplantAfter: requiredTransplant, day0 });
                    prevIrr = computeTaskDate(lotIrr, delta); // pushed forward by the same delta
                } else {
                    plan.push({ index: i, currentLotId, action: 'keep', delta: 0, transplantBefore: currentTransplant, transplantAfter: currentTransplant, day0: null });
                    prevIrr = lotIrr; // unchanged — its planned delay absorbs the push
                }
            }

            // Slot 5 — fresh lot at the required position
            const requiredTransplant5 = computeTaskDate(prevIrr, 1);
            plan.push({ index: PROJECTION_LOT_COUNT, currentLotId: null, action: 'fresh', delta: null, transplantBefore: null, transplantAfter: requiredTransplant5, day0: computeTaskDate(requiredTransplant5, -24) });

            return plan;
        }

        // The irrigation-clean date a lot's schedule WOULD have, computed from explicit form state
        // (day0 + offsets + durations) without writing any events. Mirrors generateLotSchedule's
        // anchor math for the tank_irrigation_clean task: harvest reference → harvest END + offset;
        // falls back to harvest end + 2 when the task is disabled/absent (same as effectiveIrrigationClean).
        function simulatedIrrigationClean(day0, offsets, durations) {
            const d = durations || { trimDays, harvestMultiDay, harvestDays };

            const clonePrepEntry = offsets.find(e => e.def.taskType === 'clone_cut_prep');
            const clonesEnabled = clonePrepEntry?.enabled !== false;
            const plantingEntry = offsets.find(e => e.def.taskType === 'planting');
            const plantingOffset = plantingEntry ? plantingEntry.offset : 14;
            const flipEntry = offsets.find(e => e.def.taskType === 'flip');
            const flipOffset = flipEntry ? flipEntry.offset : 20;
            const harvestEntry = offsets.find(e => e.def.taskType === 'harvest');
            const harvestOffset = harvestEntry ? harvestEntry.offset : 63;
            const trimEntry = offsets.find(e => e.def.taskType === 'trim');
            const trimOffset = trimEntry ? trimEntry.offset : 11;

            const anchors = computeAnchors(day0, flipOffset, clonesEnabled, plantingOffset, harvestOffset, trimOffset, d.harvestMultiDay, d.harvestDays);

            const irrEntry = offsets.find(e => e.def.taskType === 'tank_irrigation_clean');
            if (irrEntry && irrEntry.enabled !== false) {
                return computeTaskDate(anchors.harvestEnd, irrEntry.offset);
            }
            // Task disabled/absent — same fallback as effectiveIrrigationClean
            return computeTaskDate(anchors.harvestEnd, 2);
        }

        // Forward push plan for overwriting a projected lot's schedule. Pure — reads only, writes nothing.
        // The gate is room readiness ONLY: each later lot's transplant must land at least 1 day after
        // the previous lot's irrigation-clean. A lot earlier than that is pushed forward by the minimum
        // delta; a lot already late enough stays put (its planned delay absorbs the push) and stops the
        // cascade through it. Stale / position-less lots are regenerated at the required position.
        // Later lots are NEVER pulled backward — if the overwrite leaves extra slack, they stay where
        // they are (Project Crop re-tightens the full chain). prevIrr = the edited lot's NEW simulated
        // irrigation-clean date (computed before its events are rewritten, since the plan must exist
        // before any mutation). Returns a per-slot plan array ({ index, action: 'push'|'keep'|'regen',
        // delta, day0, … }) for slots fromIndex..5, or [] when no push is needed.
        function computeForwardPushPlan(roomId, fromIndex, prevIrr) {
            if (!prevIrr || fromIndex > PROJECTION_LOT_COUNT) return [];

            const plan = [];

            for (let i = fromIndex; i <= PROJECTION_LOT_COUNT; i++) {
                const currentLotId = projectedLotId(roomId, i);
                const requiredTransplant = computeTaskDate(prevIrr, 1);
                const events = eventsForLot(currentLotId);

                let currentTransplant = null;
                if (events.length > 0) {
                    const tEv = events.find(ev => ev.taskType === 'transplant');
                    if (tEv) currentTransplant = tEv.date;
                    else {
                        const cfg = getProjectedLots()[currentLotId]?.config;
                        if (cfg?.plantingDate) currentTransplant = computeTaskDate(cfg.plantingDate, 24);
                    }
                }
                const lotIrr = effectiveIrrigationClean(currentLotId);

                if (!currentTransplant || !lotIrr) {
                    // Stale or position-less — regenerate fresh at the required position
                    const day0 = computeTaskDate(requiredTransplant, -24);
                    plan.push({ index: i, currentLotId, action: 'regen', delta: null, transplantBefore: null, transplantAfter: requiredTransplant, day0 });
                    prevIrr = computeTaskDate(day0, 34 + projectionBloomDays + 2);
                    continue;
                }

                const delta = daysBetween(currentTransplant, requiredTransplant);
                if (delta > 0) {
                    const day0 = computeTaskDate(requiredTransplant, -24);
                    plan.push({ index: i, currentLotId, action: 'push', delta, transplantBefore: currentTransplant, transplantAfter: requiredTransplant, day0 });
                    prevIrr = computeTaskDate(lotIrr, delta); // pushed forward by the same delta
                } else {
                    plan.push({ index: i, currentLotId, action: 'keep', delta: 0, transplantBefore: currentTransplant, transplantAfter: currentTransplant, day0: null });
                    prevIrr = lotIrr; // unchanged — its planned delay absorbs the push
                }
            }

            return plan;
        }

        // Reproject a pending room: shift the surviving chain down one slot (TBA-2→TBA-1, …, TBA-5→TBA-4)
        // and generate one fresh TBA-5. The rename pass runs LOW → HIGH (i = 2 up to 5) so every target
        // slot is already free — TBA-1 is absent by the pending precondition, and each later slot was just
        // vacated by the previous rename. Renamed lots keep their dates/offsets verbatim; only IDs change.
        // The real lot's schedule is a gate only — its dates are never read.
        function reprojectRoom(roomId) {
            const room = (DB.data.rooms || {})[roomId];
            if (!room) return;
            if (!isPendingReprojection(roomId)) {
                showToast(`🔁 "${room.name}" isn't pending reprojection — use Project Crop instead`);
                return;
            }

            // Gate: the room's active real lot (first non-projected in assignedLots) must have a CLW schedule
            let activeRealLotId = null;
            for (const lotId of room.assignedLots || []) {
                if (!isProjectedLot(lotId)) { activeRealLotId = lotId; break; }
            }
            if (!activeRealLotId || eventsForLot(activeRealLotId).length === 0) {
                showToast(`🔁 Generate a schedule for ${activeRealLotId || "the room's new lot"} first — reprojection needs it`);
                return;
            }

            DB.ensureStructure();
            const map = ensureProjectedLots();

            // Late-arrival push-back: compute the per-slot plan BEFORE mutating anything, so a cancelled
            // warning leaves the chain completely untouched.
            const plan = computeReprojectionPushes(roomId, activeRealLotId);
            if (plan) {
                const affected = plan.filter(s => s.action === 'push' || s.action === 'regen');
                if (affected.length > 0) {
                    const firstPushed = plan.find(s => s.action === 'push');
                    const headlineDelta = firstPushed ? firstPushed.delta : Math.max(0, ...plan.filter(s => typeof s.delta === 'number').map(s => s.delta));
                    let msg = `⚠️ The new lot (${activeRealLotId}) arrived late — its room cleaning lands too close to the next transplant.\n\n`;
                    msg += `This will push back the schedule of the next lot by ${headlineDelta} day${headlineDelta === 1 ? '' : 's'}.\n\n`;
                    for (const s of plan) {
                        const label = `TBA-${String(s.index).padStart(2, '0')}`;
                        if (s.action === 'push') msg += `${label}: +${s.delta}d (${shortDate(s.transplantBefore)} → ${shortDate(s.transplantAfter)})\n`;
                        else if (s.action === 'regen') msg += `${label}: rebuilt — transplants ${shortDate(s.transplantAfter)}\n`;
                        else if (s.action === 'keep') msg += `${label}: unchanged (planned delay absorbs it)\n`;
                        else if (s.action === 'fresh') msg += `${label}: new — transplants ${shortDate(s.transplantAfter)}\n`;
                    }
                    msg += `\nApply these changes?`;
                    if (!confirm(msg)) return; // cancel → no changes at all
                }
            }

            // Rename pass, low → high (i = 2 up to 5): target slot i−1 is always free.
            for (let i = 2; i <= PROJECTION_LOT_COUNT; i++) {
                const oldId = projectedLotId(roomId, i);
                const entry = map[oldId];
                if (!entry) continue; // gap in the chain — skip; top-up below refills the tail
                const newId = projectedLotId(roomId, i - 1);

                // Map key + name + index (selector sorts by index)
                delete map[oldId];
                entry.name = newId;
                entry.index = i - 1;
                map[newId] = entry;

                // Events: lotId + the lot-ID token embedded in each stored title
                for (const ev of DB.data.calendarEvents || []) {
                    if (ev.sourceTool === 'CropProjection' && ev.lotId === oldId) {
                        ev.lotId = newId;
                        if (typeof ev.title === 'string') ev.title = ev.title.split(oldId).join(newId);
                    }
                }
            }

            // Apply the push-back plan: shift/regenerate slots 1..4 to their target Day 0. Without
            // bloomDays, reAnchorProjectedLot shifts every event by (targetDay0 − oldDay0) — exactly the
            // planned delta — or regenerates a stale lot fresh at the target. "keep" slots are untouched.
            if (plan) {
                for (const s of plan) {
                    if ((s.action === 'push' || s.action === 'regen') && s.day0) {
                        reAnchorProjectedLot(roomId, s.index, s.day0);
                    }
                }
            }

            // Top up: fresh TBA-5 at the plan's computed Day 0 (walk-down fallback if no plan).
            let day0 = null;
            if (plan) {
                const fresh = plan.find(s => s.index === PROJECTION_LOT_COUNT);
                if (fresh && fresh.day0) day0 = fresh.day0;
            }
            if (!day0) {
                // Fallback: highest-indexed surviving lot's harvest start − 21 (today as last resort)
                day0 = localDateStr(new Date());
                for (let i = PROJECTION_LOT_COUNT - 1; i >= 1; i--) {
                    const h = eventsForLot(projectedLotId(roomId, i)).find(ev => ev.taskType === 'harvest');
                    if (h) { day0 = computeTaskDate(h.date, -21); break; }
                }
            }

            const tba5Id = projectedLotId(roomId, PROJECTION_LOT_COUNT);
            if (!map[tba5Id]) {
                map[tba5Id] = { name: tba5Id, roomId, roomName: room.name, strain: 'TBA', index: PROJECTION_LOT_COUNT };
            }
            generateLotSchedule(tba5Id, day0, defaultOffsetsSnapshot(projectionBloomDays), {
                trimDays: DEFAULT_TRIM_DAYS, harvestMultiDay: false, harvestDays: DEFAULT_HARVEST_DAYS
            });

            populateLotSelector();
            renderScheduleList();
            updateStatusBar();
            updateGenerateBtnLabel();
            updateProjectBtnState();
            refreshPreview();
            notifySitkaTools();

            const pushCount = plan ? plan.filter(s => s.action === 'push' || s.action === 'regen').length : 0;
            const maxDelta = plan ? Math.max(0, ...plan.filter(s => typeof s.delta === 'number').map(s => s.delta)) : 0;
            const pushNote = pushCount > 0 ? `, ${pushCount} lot${pushCount === 1 ? '' : 's'} pushed back up to ${maxDelta}d` : '';
            showToast(`🔁 Reprojected ${room.name} — chain shifted down, fresh TBA-05 added${pushNote} (${projectionBloomDays / 7}-week bloom)`);
        }

        // True reset for one room: delete ALL of its CropProjection events (matched by roomId) and
        // remove every {roomId}-TBA-* map entry. The next "Project Crop" starts from a fresh chain.
        // The confirmation dialog lives in the UI layer (button handler), not here.
        function clearAllProjectionsForRoom(roomId) {
            if (!DB.data || !roomId) return { deletedEvents: 0, removedEntries: 0 };
            const result = { deletedEvents: 0, removedEntries: 0 };

            // 1. Delete all of the room's projection events (roomId is always present on them)
            if (Array.isArray(DB.data.calendarEvents)) {
                const before = DB.data.calendarEvents.length;
                DB.data.calendarEvents = DB.data.calendarEvents.filter(ev =>
                    !(ev.sourceTool === 'CropProjection' && ev.roomId === roomId)
                );
                result.deletedEvents = before - DB.data.calendarEvents.length;
            }

            // 2. Remove every {roomId}-TBA-* map entry (prefix match — covers any index)
            const clw = DB.data._CropLabourWizard;
            if (clw && clw.projectedLots) {
                for (const lotId of Object.keys(clw.projectedLots)) {
                    if (lotId.startsWith(`${roomId}-TBA-`)) {
                        delete clw.projectedLots[lotId];
                        result.removedEntries++;
                    }
                }
            }

            if (result.deletedEvents > 0 || result.removedEntries > 0) {
                populateLotSelector();
                renderScheduleList();
                updateStatusBar();
                updateGenerateBtnLabel();
                updateProjectBtnState();
                refreshPreview();
                notifySitkaTools();
            }
            return result;
        }

        // ---- Build event title: "Room code-Strain name#Lot number, task" ----
        // The room code depends on which phase of the crop cycle the task belongs to:
        //   - Cutting Clones (clone prep) & Clean Clone Room and used cloning supplies → lot's cloning room
        //   - Tasks before Transplanting to Flower Room → lot's veg room
        //   - Transplant and everything after (incl. post-trim tasks) → lot's destination (flower) room
        function roomCodeForName(roomName) {
            if (!roomName) return null;
            const byName = Object.entries(DB.data.rooms || {}).find(([, r]) => r.name === roomName);
            return byName ? byName[0] : null;
        }

        // Resolve the lot's destination (flower) room: prefer a room that has this lot
        // assigned to it, otherwise fall back to the lot's destRoom field.
        function resolveFlowerRoom(lotId, rooms) {
            for (const [roomId, room] of Object.entries(rooms)) {
                if ((room.assignedLots || []).includes(lotId)) return roomId;
            }
            return roomCodeForName(getLotRecord(lotId).destRoom);
        }

        function getLotRoomCode(lotId, taskType) {
            // Projected lots have no veg/cloning rooms — every task happens in the flower room
            if (isProjectedLot(lotId)) return getProjectedLots()[lotId].roomId;

            const lot = DB.lots[lotId] || {};
            const rooms = DB.data.rooms || {};

            // Clone prep and clone-room clean happen in the cloning room
            if (taskType === 'clone_cut_prep' || taskType === 'clone_room_clean') {
                return roomCodeForName(lot.cloningRoom);
            }

            // Veg-room clean happens in the veg room (after plants have moved out)
            if (taskType === 'veg_room_clean') {
                return roomCodeForName(lot.vegRoom);
            }

            // Undercanopy lights & air socks are installed in the flower room — prepped on
            // transplant day so they're ready when plants arrive. It's listed before
            // transplant in TASK_DEFS for chronological display, but it's a flower-room task.
            if (taskType === 'undercanopy_lights') {
                return resolveFlowerRoom(lotId, rooms);
            }

            // Coco blocks are laid out/spiked (day before) and hydrated (transplant day) in the
            // flower room so they're ready when plants arrive. Listed before
            // transplant in TASK_DEFS for chronological display, but they're flower-room tasks.
            if (taskType === 'layout_coco_blocks' || taskType === 'hydrate_coco_blocks') {
                return resolveFlowerRoom(lotId, rooms);
            }

            // Everything before transplanting to flower happens in the veg room
            const defIdx = TASK_DEFS.findIndex(d => d.taskType === taskType);
            const transplantIdx = TASK_DEFS.findIndex(d => d.taskType === 'transplant');
            if (defIdx !== -1 && transplantIdx !== -1 && defIdx < transplantIdx) {
                return roomCodeForName(lot.vegRoom);
            }

            // Transplant and everything after happens in the destination (flower) room
            return resolveFlowerRoom(lotId, rooms);
        }

        function buildEventTitle(def, lotId) {
            // Projected lots: the lotId already encodes room + "TBA" + index (e.g. "B66DG1-TBA-01"),
            // so use it directly — prepending the room code would repeat it twice in the title.
            if (isProjectedLot(lotId)) {
                return `${def.emoji} ${lotId}, ${def.name}`;
            }
            const lot = getLotRecord(lotId);
            const roomCode = getLotRoomCode(lotId, def.taskType);
            const strain = (lot.strain || '').trim();
            let prefix;
            if (roomCode && strain) prefix = `${roomCode}-${strain}#${lotId}`;
            else if (roomCode) prefix = `${roomCode}#${lotId}`;
            else if (strain) prefix = `${strain}#${lotId}`;
            else prefix = lotId;
            return `${def.emoji} ${prefix}, ${def.name}`;
        }

        // ---- Generate Schedule (uses current offsets to compute final dates) ----
        scheduleForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const lotId = activeLotSelect.value;
            if (!lotId) {
                alert('Please select a lot first.');
                return;
            }

            const plantingDate = plantingDateInput.value;

            if (!plantingDate) {
                alert('Please set a planting date.');
                return;
            }

            DB.ensureStructure();

            // Projected lot: compute the forward push plan BEFORE mutating anything, so a cancelled
            // warning leaves the chain completely untouched (same guarantee as reprojection). The gate
            // is room readiness only — later lots are pushed forward solely when their transplant
            // would land before this lot's new irrigation-clean + 1 day; they are never pulled back.
            const projEntry = isProjectedLot(lotId) ? getProjectedLots()[lotId] : null;
            let pushPlan = null;
            if (projEntry) {
                const newIrr = simulatedIrrigationClean(plantingDate, taskOffsets, { trimDays, harvestMultiDay, harvestDays });
                pushPlan = computeForwardPushPlan(projEntry.roomId, projEntry.index + 1, newIrr);
                const affected = pushPlan.filter(s => s.action === 'push' || s.action === 'regen');
                if (affected.length > 0) {
                    const firstPushed = pushPlan.find(s => s.action === 'push');
                    const headlineDelta = firstPushed ? firstPushed.delta : Math.max(0, ...pushPlan.filter(s => typeof s.delta === 'number').map(s => s.delta));
                    let msg = `⚠️ Overwriting ${lotId} delays the room's availability — its cleaning now lands too close to the next transplant.\n\n`;
                    msg += `This will push forward the schedule of the next lot by ${headlineDelta} day${headlineDelta === 1 ? '' : 's'}.\n\n`;
                    for (const s of pushPlan) {
                        const label = `TBA-${String(s.index).padStart(2, '0')}`;
                        if (s.action === 'push') msg += `${label}: +${s.delta}d (${shortDate(s.transplantBefore)} → ${shortDate(s.transplantAfter)})\n`;
                        else if (s.action === 'regen') msg += `${label}: rebuilt — transplants ${shortDate(s.transplantAfter)}\n`;
                        else msg += `${label}: unchanged (planned delay absorbs it)\n`;
                    }
                    msg += `\nApply these changes?`;
                    if (!confirm(msg)) return; // cancel → no changes at all
                }
            }

            // Reconcile: remove existing schedule for this lot
            reconcileLotSchedule(lotId);

            // Build + persist events from current offsets (shared with projection generation)
            const { events: newEvents, config } = generateLotSchedule(lotId, plantingDate, taskOffsets, {
                trimDays, harvestMultiDay, harvestDays
            });

            // Log generation for real lots (projected lots are tracked in the map instead)
            if (!isProjectedLot(lotId)) {
                if (!DB.data._CropLabourWizard) DB.data._CropLabourWizard = { generations: [] };
                DB.data._CropLabourWizard.generations.push({ lotId, ...config });
            }

            // Apply the forward push plan (if any): shift/regenerate later lots to their target Day 0.
            // Without bloomDays, reAnchorProjectedLot shifts every event by the uniform delta —
            // per-task offsets preserved. "keep" slots are untouched; the chain may drift from its
            // nominal cadence when the overwrite leaves extra slack (Project Crop re-tightens it).
            if (pushPlan && projEntry) {
                for (const s of pushPlan) {
                    if ((s.action === 'push' || s.action === 'regen') && s.day0) {
                        reAnchorProjectedLot(projEntry.roomId, s.index, s.day0);
                    }
                }
            }

            // Re-render
            renderScheduleList();
            updateStatusBar();
            updateGenerateBtnLabel();
            updateProjectBtnState();

            // Notify SitkaTools via postMessage
            notifySitkaTools();

            // Holiday conflicts — notify only, never auto-reschedule
            const conflictEvents = newEvents.filter(ev => holidayInRange(ev.date, ev.endDate));
            let toastMsg = `Schedule generated — ${newEvents.length} tasks for ${lotId}`;
            if (pushPlan) {
                const pushCount = pushPlan.filter(s => s.action === 'push' || s.action === 'regen').length;
                if (pushCount > 0) {
                    const maxDelta = Math.max(0, ...pushPlan.filter(s => typeof s.delta === 'number').map(s => s.delta));
                    toastMsg += `, ${pushCount} future lot${pushCount === 1 ? '' : 's'} pushed forward (up to ${maxDelta}d)`;
                }
            }
            if (conflictEvents.length > 0) {
                toastMsg += ` · ⚠️ ${conflictEvents.length} on a BC civic holiday`;
            }
            showToast(toastMsg);
        });

        // Resolve the flower room a lot's projections would target. Returns { roomId, room, disabledReason }.
        // disabledReason is null when the lot can be projected; otherwise it explains why the button is greyed out.
        function resolveProjectionRoom(lotId) {
            if (!lotId) return { roomId: null, room: null, disabledReason: 'Select a lot first' };

            // Projected lots carry their room; real lots resolve via assignment/destRoom
            let roomId = null;
            if (isProjectedLot(lotId)) {
                roomId = getProjectedLots()[lotId].roomId;
            } else {
                roomId = resolveFlowerRoom(lotId, DB.data.rooms || {});
            }
            const room = roomId ? (DB.data.rooms || {})[roomId] : null;
            if (!room) return { roomId: null, room: null, disabledReason: 'This lot has no flower room — projections need a room.' };
            if (!room.isFlowering) return { roomId, room, disabledReason: `"${room.name}" is not flagged as a flowering room. Enable the flag in SitkaTools' Room Manager first.` };

            return { roomId, room, disabledReason: null };
        }

        // Grey out / enable the Project Crop button based on whether the selected lot can be projected.
        // When the resolved room is pending reprojection, the label swaps to "🔁 Reproject" and the
        // button stays disabled (with an explanatory tooltip) until the room's active real lot has a
        // generated CLW schedule — then it runs reprojectRoom instead of generateProjectionsForRoom.
        // Otherwise ("🔮 Project Crop") the button is disabled until the room's NEWEST real lot
        // (latest createdDate) has a generated schedule — projections anchor off that lot's clone-cut day.
        function updateProjectBtnState() {
            const btn = $('generateProjectionsBtn');
            if (!btn) return;
            const { roomId, disabledReason } = resolveProjectionRoom(activeLotSelect.value);

            if (roomId && isPendingReprojection(roomId)) {
                btn.textContent = '🔁 Reproject';
                let activeRealLotId = null;
                for (const lotId of (DB.data.rooms[roomId].assignedLots || [])) {
                    if (!isProjectedLot(lotId)) { activeRealLotId = lotId; break; }
                }
                const gated = !activeRealLotId || eventsForLot(activeRealLotId).length === 0;
                btn.disabled = gated;
                btn.title = gated
                    ? `Reproject is available once ${activeRealLotId || "the room's new lot"} has a generated schedule`
                    : 'Shift the surviving TBA chain down one slot and generate a fresh TBA-05';
            } else {
                btn.textContent = '🔮 Project Crop';
                const anchor = roomId ? resolveProjectionAnchor(roomId) : null;
                btn.disabled = !!disabledReason || !anchor;
                const newestLotId = roomId ? newestRealLotId(roomId) : null;
                btn.title = disabledReason
                    || (!anchor
                        ? `Project Crop is available once the room's newest lot${newestLotId ? ` (${newestLotId})` : ''} has a generated schedule`
                        : 'Generate the 5-lot projection chain for this lot\'s room');
            }

            // Keep the Clear Projections button in sync (same resolved-room state)
            updateClearProjectionsBtnState();
        }

        // Enable / grey out the Clear Projections button: enabled only when the resolved flowering
        // room has at least one projected map entry or projection event.
        function updateClearProjectionsBtnState() {
            const btn = $('clearProjectionsBtn');
            if (!btn) return;
            const { roomId, disabledReason } = resolveProjectionRoom(activeLotSelect.value);
            if (disabledReason || !roomId) {
                btn.disabled = true;
                btn.title = disabledReason || 'Select a lot to clear its room\'s projections';
                return;
            }
            const map = getProjectedLots();
            const hasEntry = Object.keys(map).some(id => id.startsWith(`${roomId}-TBA-`));
            const hasEvent = (DB.data.calendarEvents || []).some(ev => ev.sourceTool === 'CropProjection' && ev.roomId === roomId);
            btn.disabled = !(hasEntry || hasEvent);
            btn.title = btn.disabled
                ? `No projections to clear for "${(DB.data.rooms[roomId] || {}).name || roomId}"`
                : `Delete ALL projections (events + map entries) for ${(DB.data.rooms[roomId] || {}).name || roomId}`;
        }

        // ---- Bloom length toggle (8 / 9 weeks) — applies to projection chain generation only ----
        const bloom8Btn = $('bloom8Btn');
        const bloom9Btn = $('bloom9Btn');
        function setProjectionBloom(days) {
            projectionBloomDays = days;
            bloom8Btn.classList.toggle('active', days === 56);
            bloom9Btn.classList.toggle('active', days === 63);
        }
        bloom8Btn.addEventListener('click', () => setProjectionBloom(56));
        bloom9Btn.addEventListener('click', () => setProjectionBloom(63));

        // ---- Project Crop / Reproject — one button, two modes (button lives in the header) ----
        // Pending room → reprojectRoom (shift chain down + fresh TBA-5); otherwise generateProjectionsForRoom.
        $('generateProjectionsBtn').addEventListener('click', () => {
            const { roomId, disabledReason } = resolveProjectionRoom(activeLotSelect.value);
            if (disabledReason) {
                alert(disabledReason);
                return;
            }

            if (isPendingReprojection(roomId)) reprojectRoom(roomId);
            else generateProjectionsForRoom(roomId);
        });

        // ---- Clear Projections — true reset of the selected lot's room (confirm first) ----
        $('clearProjectionsBtn').addEventListener('click', () => {
            const { roomId, disabledReason } = resolveProjectionRoom(activeLotSelect.value);
            if (disabledReason || !roomId) return;

            const roomName = (DB.data.rooms[roomId] || {}).name || roomId;
            if (!confirm(`Clear ALL projections for "${roomName}"?\n\nThis deletes every projected crop event and all TBA map entries for the room. The next "Project Crop" starts from a completely fresh chain.`)) return;

            const selectedLot = activeLotSelect.value;
            const wasProjected = isProjectedLot(selectedLot); // capture before the wipe removes the entry
            const res = clearAllProjectionsForRoom(roomId);

            // If the currently selected lot was one of the wiped projected lots, reset the form
            if (wasProjected) {
                activeLotSelect.value = '';
                buildDefaultOffsets();
                updateFormFromStoredConfig();
                refreshPreview();
                renderScheduleList();
                updateGenerateBtnLabel();
                updateProjectBtnState();
                updateClearProjectionsBtnState();
            }

            showToast(`🧹 Cleared ${res.deletedEvents} projection event${res.deletedEvents === 1 ? '' : 's'} and ${res.removedEntries} TBA entr${res.removedEntries === 1 ? 'y' : 'ies'} for ${roomName}`);
        });

        // ---- Clear Schedule — remove all CropLabourWizard events for the selected lot ----
        clearFormBtn.addEventListener('click', () => {
            const lotId = activeLotSelect.value;

            if (!lotId) {
                showToast('Select a lot first');
                return;
            }

            // Check if there are any events to clear
            const existingCount = eventsForLot(lotId).length;

            if (existingCount === 0) {
                showToast('No schedule to clear for this lot');
                return;
            }

            // Remove all schedule events for this lot (sourceTool depends on lot type)
            reconcileLotSchedule(lotId);

            // Clear stored config (projected lots keep their map entry → flagged stale)

            // Notify SitkaTools so the calendar refreshes
            notifySitkaTools();

            // Reset form state
            buildDefaultOffsets();
            refreshPreview();
            renderScheduleList();
            updateGenerateBtnLabel();
            updateProjectBtnState();

            showToast(`Cleared ${existingCount} schedule events from ${lotId}`);
        });

        // ---- Render Schedule List ----
        function renderScheduleList() {
            const lotId = activeLotSelect.value;

            if (!lotId) {
                scheduleListCard.style.display = 'none';
                return;
            }

            // Get stored config (real lot or projected lot)
            const config = getScheduleConfig(lotId);

            if (!config) {
                scheduleListCard.style.display = 'none';
                return;
            }

            scheduleListCard.style.display = 'block';

            // Show config summary
            configSummaryEl.style.display = 'flex';
            configSummaryEl.innerHTML = `
                <span>📅 Anchor: <strong>${config.plantingDate}${config.plantingDate ? ' · ' + weekdayShort(config.plantingDate) : ''}</strong></span>
                <span>✂️ Trim: <strong>${config.trimDays || DEFAULT_TRIM_DAYS} days</strong></span>
                ${config.harvestMultiDay ? `<span>🌾 Harvest: <strong>${config.harvestDays || DEFAULT_HARVEST_DAYS} days</strong></span>` : ''}
                <span>📋 Tasks: <strong>${config.taskCount || '?'}</strong></span>
            `;

            // Get calendar events for this lot (sourceTool depends on lot type)
            const lotEvents = eventsForLot(lotId).sort((a, b) => a.date.localeCompare(b.date));

            if (lotEvents.length === 0) {
                scheduleListEl.innerHTML = '<div class="empty-state">No tasks found. Schedule may have been cleared.</div>';
                return;
            }

            scheduleListEl.innerHTML = '';
            const listWrapper = document.createElement('div');
            listWrapper.className = 'task-list';

            lotEvents.forEach((ev, idx) => {
                const item = document.createElement('div');
                item.className = 'task-item';

                const displayDate = ev.endDate && ev.endDate !== ev.date
                    ? `${ev.date} (${weekdayShort(ev.date)}) → ${ev.endDate} (${weekdayShort(ev.endDate)})`
                    : `${ev.date} · ${weekdayShort(ev.date)}`;

                // Holiday check — notify only, never auto-reschedule
                const holiday = holidayInRange(ev.date, ev.endDate);

                // Extract emoji from title
                const emojiMatch = ev.title.match(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic}\uFE0F?)\s*/su);
                const emoji = emojiMatch ? emojiMatch[1] : '📋';
                const nameWithoutEmoji = ev.title.replace(emoji + ' ', '');

                item.innerHTML = `
                    <span class="task-emoji">${emoji}</span>
                    <div class="task-info">
                        <div class="task-name">${escapeHtml(nameWithoutEmoji)}</div>
                        <span class="task-type-badge">${escapeHtml(ev.taskType || '')}</span>
                    </div>
                    <span class="task-date-badge">${displayDate}</span>
                    ${holidayFlagHtml(holiday)}
                    <button class="task-delete-btn" title="Delete entire schedule for this lot">✕</button>
                `;

                listWrapper.appendChild(item);
            });

            scheduleListEl.appendChild(listWrapper);

            // Attach delete handlers (deletes ENTIRE schedule for the lot)
            scheduleListEl.querySelectorAll('.task-delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    deleteLotSchedule(lotId);
                });
            });
        }

        // ---- Delete Lot Schedule ----
        function deleteLotSchedule(lotId) {
            const taskCount = getLotTaskCount(lotId);
            if (!confirm(`Delete the entire crop schedule for ${lotId}?\nThis will remove all ${taskCount} tasks from the calendar.`)) return;

            DB.ensureStructure();

            // Remove all schedule events for this lot (sourceTool depends on lot type)
            reconcileLotSchedule(lotId);

            // Clear stored config (projected lots keep their map entry → flagged stale)
            clearScheduleConfig(lotId);

            // Remove generation record
            if (DB.data._CropLabourWizard?.generations) {
                DB.data._CropLabourWizard.generations = DB.data._CropLabourWizard.generations.filter(
                    g => g.lotId !== lotId
                );
            }

            // Notify SitkaTools via postMessage
            notifySitkaTools();

            renderScheduleList();
            updateStatusBar();
            showToast(`Schedule deleted for ${lotId}`);
        }

        function getLotTaskCount(lotId) {
            return eventsForLot(lotId).length;
        }

        // ---- Update Status Bar ----
        function updateStatusBar() {
            const statusBar = $('statusBar');
            const statusText = $('statusText');
            if (!statusBar || !statusText) return;

            if (!DB.data) {
                statusBar.className = 'status-bar';
                statusText.textContent = 'No database loaded. Open from SitkaTools.';
                return;
            }

            statusBar.className = 'status-bar loaded';
            const lotCount = Object.keys(DB.lots).length;
            const scheduledLots = Object.values(DB.lots).filter(l => l._tool_CropLabourWizard).length;
            let statusMsg = `Database loaded — ${lotCount} lots, ${scheduledLots} with schedules`;

            // Projection summary (flowering rooms + projected lots, stale flagged).
            // Pending-reprojection lots (TBA-1 deleted, TBA-2…5 surviving) count as stale here.
            const floweringRooms = Object.values(DB.data.rooms || {}).filter(r => r.isFlowering).length;
            const projIds = Object.keys(getProjectedLots());
            const staleCount = projIds.filter(isStaleOrPending).length;
            if (floweringRooms > 0 || projIds.length > 0) {
                statusMsg += ` · 🌸 ${floweringRooms} flowering room${floweringRooms === 1 ? '' : 's'} · 🔮 ${projIds.length} projected${staleCount ? ` (${staleCount} stale)` : ''}`;
            }
            statusText.textContent = statusMsg;
        }

        // ---- Close Tool ----
        $('closeToolBtn').addEventListener('click', () => window.close());

        // ---- Mobile UI Setup ----
        if (isMobileDevice) {
            // Show mobile import banner at top
            $('mobileBanner').classList.add('show');
            // Show save database button in footer
            $('saveDbBtn').style.display = 'inline-block';

            // Wire up import button
            $('importDbBtn').addEventListener('click', () => {
                $('dbImportInput').click();
            });
            $('dbImportInput').addEventListener('change', handleDbImport);

            // Wire up save button
            $('saveDbBtn').addEventListener('click', handleDbSave);
        }

        // ---- Toast ----
        function showToast(msg) {
            const toast = $('toast');
            if (!toast) return;
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ---- Utility ----
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---- Start ----
        function init() {
            DatePicker.init();

            // Set default planting date to today
            plantingDateInput.value = new Date().toISOString().split('T')[0];

            buildDefaultOffsets();
            populateLotSelector();
            renderScheduleList();
            updateStatusBar();
            refreshPreview();
            updateProjectBtnState();
        }
        init();
    </script>
</body>
</html>
