    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // =====================================================
        // DailyWizard — Daily task list builder & floor view
        // Database Keys: "_DailyWizard" (read/write — task lists and chore hours), "calendarEvents" (read-only),
        //                "_EmployeeWizard.employees" (read-only — roster names for the hours log)
        // 🌐 Language picker: the screen in English, French, Spanish, Vietnamese or Chinese, plus translated task
        //    names and steps (task.translations / step.translations — English stays the master)
        // Stage 3: + task editor (add/edit) and full embedded emoji picker
        // Stage 4: + task detail view, inline step editing, step pictures
        // =====================================================

        const DB = {
            data: null,
            fileName: '',

            get lots() { return this.data?.lots || {}; },
            get rooms() { return this.data?.rooms || {}; },
            get buildings() { return this.data?.buildings || {}; },
            get calendarEvents() { return this.data?.calendarEvents || []; },
            get dailyBuildings() { return this.data?._DailyWizard?.buildings || {}; },

            ensureStructure() {
                if (!this.data) this.data = { lots: {}, rooms: {}, buildings: {}, calendarEvents: [] };
                if (!this.data.lots) this.data.lots = {};
                if (!this.data.rooms) this.data.rooms = {};
                if (!this.data.buildings) this.data.buildings = {};
                if (!this.data.calendarEvents) this.data.calendarEvents = [];
                if (!this.data._DailyWizard) this.data._DailyWizard = { buildings: {} };
                if (!this.data._DailyWizard.buildings) this.data._DailyWizard.buildings = {};
                return this.data;
            },

            // Sync all in-memory changes before export.
            // DailyWizard writes directly to DB.data on every mutation,
            // so no extra flush is needed — but the method exists as convention.
            sync() {
                this.ensureStructure();
                return this.data;
            }
        };

        const $ = id => document.getElementById(id);

        // ---- 🌐 Language (user decision 2026-10-17) ----
        // English is the master: the DB holds every task name and step in English, and every other tool reads that.
        // Translations the manager writes sit next to it and only change what this screen shows:
        //   task.translations = { fr: 'Arroser les plantes', … }   step.translations = { fr: 'Vérifier…', … }
        // A name or step with no translation in the chosen language shows the English, tagged "EN".
        // The screen's own words come from UI_TEXT (at the end of this script), keyed by the English text. The choice
        // lasts while this window is open (no browser storage).
        const LANGS = [
            { code: 'en', name: 'English', locale: 'en-CA' },
            { code: 'fr', name: 'Français', locale: 'fr-CA' },
            { code: 'es', name: 'Español', locale: 'es' },
            { code: 'vi', name: 'Tiếng Việt', locale: 'vi' },
            { code: 'zh', name: '中文（简体）', locale: 'zh-CN' }
        ];
        let LANG = 'en';
        const langInfo = (code = LANG) => LANGS.find(l => l.code === code) || LANGS[0];
        const uiLocale = () => LANG === 'en' ? [] : langInfo().locale;   // English keeps the browser's own date format
        // The screen's text in the chosen language; {name} placeholders are filled from vars
        function T(en, vars) {
            let s = (LANG !== 'en' && UI_TEXT[en]?.[LANG]) || en;
            if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => vars[k] != null ? String(vars[k]) : m);
            return s;
        }
        const taskName = task => (LANG !== 'en' && task?.translations?.[LANG]) || task?.name || '';
        const stepText = step => (LANG !== 'en' && step?.translations?.[LANG]) || step?.text || '';
        // A task (name) or step (text) that has English but nothing yet in the chosen language
        const needsTranslation = obj => LANG !== 'en' && !!(obj?.name || obj?.text) && !obj?.translations?.[LANG];
        function enChip() {
            const c = document.createElement('span');
            c.className = 'chip chip-en';
            c.textContent = 'EN';
            c.title = T('Not translated yet — showing English');
            return c;
        }
        // Set or clear one language's translation on a task or step (an empty map is dropped)
        function setTranslation(obj, lang, value) {
            if (value) (obj.translations || (obj.translations = {}))[lang] = value;
            else if (obj.translations) {
                delete obj.translations[lang];
                if (!Object.keys(obj.translations).length) delete obj.translations;
            }
        }
        // The fixed text in the page (data-t: text, data-t-ph: placeholder); the English is kept in the attribute
        function applyStaticText() {
            document.documentElement.lang = langInfo().locale;
            for (const el of document.querySelectorAll('[data-t]')) {
                if (!el.dataset.t) el.dataset.t = el.textContent.trim();
                el.textContent = T(el.dataset.t);
            }
            for (const el of document.querySelectorAll('[data-t-ph]')) {
                if (!el.dataset.tPh) el.dataset.tPh = el.placeholder;
                el.placeholder = T(el.dataset.tPh);
            }
            // The tablet banner comes from the shared working-copy snippet (the same in every tool), so it's
            // translated from here rather than in the snippet
            const banner = $('workCopyBanner');
            if (banner?.firstChild?.nodeType === Node.TEXT_NODE) banner.firstChild.nodeValue = T('📋 Using the database open in SitkaTools. ');
            if ($('workCopyGoBack')) $('workCopyGoBack').textContent = T('Go back to SitkaTools to save');
        }
        function setLanguage(code) {
            if (!LANGS.some(l => l.code === code) || code === LANG) return;
            // A step being typed is saved first, in the language it was started in
            if (document.activeElement?.classList?.contains('step-text-input')) document.activeElement.blur();
            LANG = code;
            $('langSelect').value = code;
            applyStaticText();
            renderAll();
            if ($('detailOverlay').classList.contains('open')) renderDetail();
            if ($('editorOverlay').classList.contains('open')) relabelEditor();
            if ($('emojiPanel').style.display !== 'none') { buildEmojiTabs(); renderEmojiGrid(); }
            if (hoursCtx) {
                const who = $('hoursWho');
                if (who.options[0]) who.options[0].textContent = T('— Pick your name —');
                if (who.options.length > 1) who.options[who.options.length - 1].textContent = T('Someone else (not on the roster)…');
                renderHours();
            }
            if (doneCtx) {
                if ($('doneWho').options[0]) $('doneWho').options[0].textContent = T('— Pick the floor manager —');
                $('doneWhoNote').textContent = floorManagers().everyone ? T('No floor managers are set yet (Labour & Cost Wizard → employee → Floor manager), so everyone on the roster is listed.') : '';
                renderDone();
            }
        }

        // ---- Date helpers (local time, YYYY-MM-DD) ----
        function dateToStr(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dd}`;
        }

        function todayStr() { return dateToStr(new Date()); }

        // Parse YYYY-MM-DD into a local Date (avoids UTC off-by-one from new Date(str)).
        function parseDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        function selectedDateStr() {
            return $('dateInput').value || todayStr();
        }

        // The date shown follows today while it is still the one set automatically: a tablet left
        // open overnight moves to the new day. A hand-picked date is left alone.
        let autoDate = null; // the date last set automatically
        function rollToToday() {
            const today = todayStr();
            if (!autoDate || today === autoDate || $('dateInput').value !== autoDate) return;
            autoDate = today;
            $('dateInput').value = today;
            renderAll();
        }

        // ---- Toast ----
        let toastTimer = null;
        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // True once a DB has arrived (postMessage delivery or file import).
        // Needed because ensureStructure() makes DB.data truthy from load time.
        let dbLoaded = false;

        // ---- Check-offs — saved per building and day; each new day starts blank ----
        //   _DailyWizard.buildings[<id>].checks[<YYYY-MM-DD>][<item>] = { at, by }
        //   item: a daily task's code, or 'ev:<event id>' for a calendar row ("today's part is done" — ✅ Mark done
        //   is what finishes a crop / equipment task)
        // Saved in the building's own file with its chore hours. Anyone may tick or untick with one tap; the tick
        // records when and on which device. Rows of events that belong to no building (All Buildings → Unassigned)
        // have no file to go in, so their ticks stay in this page only (sessionChecks).
        const sessionChecks = {};   // `${dateStr}:${eventItemKey}` → true

        // Where a row's tick is kept: { buildingId, item } (saved) or { session } (page only)
        function checkSpotForTask(buildingId, code) { return { buildingId, item: code }; }
        function checkSpotForEvent(ev, dateStr) {
            const buildingId = ev.id ? buildingForEvent(ev) : null;
            return buildingId ? { buildingId, item: `ev:${ev.id}` } : { session: `${dateStr}:${eventItemKey(ev, dateStr)}` };
        }
        function isChecked(spot, dateStr) {
            if (spot.session) return !!sessionChecks[spot.session];
            return !!DB.dailyBuildings[spot.buildingId]?.checks?.[dateStr]?.[spot.item];
        }
        function setChecked(spot, dateStr, on) {
            if (spot.session) {
                if (on) sessionChecks[spot.session] = true;
                else delete sessionChecks[spot.session];
                return;
            }
            const buildings = DB.ensureStructure()._DailyWizard.buildings;
            const b = buildings[spot.buildingId] || (buildings[spot.buildingId] = { tasks: [] });
            if (on) {
                const day = (b.checks || (b.checks = {}))[dateStr] || (b.checks[dateStr] = {});
                day[spot.item] = { at: new Date().toISOString(), by: DeviceView.building || 'office' };
            } else if (b.checks?.[dateStr]) {
                delete b.checks[dateStr][spot.item];
                if (!Object.keys(b.checks[dateStr]).length) delete b.checks[dateStr];
                if (!Object.keys(b.checks).length) delete b.checks;
            }
            notifySitkaTools();
        }
        // Ticks on a day, in the buildings shown (null = every building) plus this page's unsaved ones
        function checkoffCountForDate(dateStr, bids = null) {
            let n = Object.keys(sessionChecks).filter(k => k.startsWith(dateStr + ':')).length;
            for (const [bid, b] of Object.entries(DB.dailyBuildings)) {
                if (!bids || bids.includes(bid)) n += Object.keys(b?.checks?.[dateStr] || {}).length;
            }
            return n;
        }
        const shownBuildings = () => { const sel = $('buildingSelect').value; return sel === 'ALL' ? null : [sel]; };

        // ---- postMessage Convention — receive DB from SitkaTools, send updates back ----
        DB.ensureStructure();

        // ---- Building device view (root CLAUDE.md → "Building Device View") ----
        // SitkaTools sends `view: { building }` with the DB: the building's id on a building device, null on the
        // office (or with a single-file DB). A building device sees only its own building — the rooms in it and the
        // lots whose current room or flower room is in it — and only what it can save; office-only tools (schedules,
        // plans) don't run there at all. Display only: the DB keeps everything. Every tool has this same snippet
        // except OFFICE_ONLY. `var` (not const) so the message handlers can use it however early they run.
        var DeviceView = {
            OFFICE_ONLY: false,   // true: this whole tool is office work a building device couldn't save
            building: null,
            // Take the view sent with a DB message. True when this tool is office-only and this is a building device.
            take(msg) {
                if (msg && Object.prototype.hasOwnProperty.call(msg, 'view')) this.building = msg.view?.building || null;
                if (!this.OFFICE_ONLY || !this.building) return false;
                this.showOfficeOnly(msg?.payload?.buildings?.[this.building]?.name || this.building);
                return true;
            },
            buildingOfRoomName(name) {
                const target = String(name || '').trim().toLowerCase();
                if (!target) return null;
                for (const room of Object.values(DB.data?.rooms || {})) {
                    if (room && String(room.name || '').trim().toLowerCase() === target) return room.buildingId || null;
                }
                return null;
            },
            lotVisible(lotId) {
                if (!this.building) return true;
                const lot = DB.data?.lots?.[lotId];
                return !!lot && (this.buildingOfRoomName(lot.currentRoom) === this.building || this.buildingOfRoomName(lot.destRoom) === this.building);
            },
            roomVisible(roomId) {
                return !this.building || DB.data?.rooms?.[roomId]?.buildingId === this.building;
            },
            showOfficeOnly(buildingName) {
                if (document.getElementById('officeOnlyCover')) return;
                const wrap = document.createElement('div');
                wrap.id = 'officeOnlyCover';
                wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10001; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; padding: 24px;';
                wrap.innerHTML = `
                    <div style="max-width: 440px; text-align: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 32px;">
                        <div style="font-size: 2.5rem; margin-bottom: 12px;">🏢</div>
                        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);">Office only</div>
                        <div style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;">
                            This tool is run from the office. This device is set up for <strong data-building></strong>.</div>
                        <button type="button" style="background: var(--accent); color: var(--bg-primary); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">Close Tool</button>
                    </div>`;
                wrap.querySelector('[data-building]').textContent = buildingName;
                wrap.querySelector('button').addEventListener('click', () => window.close());
                document.body.appendChild(wrap);
            }
        };

        // ---- Shared working copy (ROADMAP Phase 1 — tablets) ----
        // Every tool is served from the same site, so they share browser storage. SitkaTools keeps the open DB in
        // IndexedDB ('sitkatools' → 'work'). When this tool is opened as a plain tab (tablets, where the popup /
        // postMessage hand-off doesn't work) it loads the DB from there, writes its changes back, and every open
        // tab refreshes through a BroadcastChannel. Saving always happens in SitkaTools ("Go back to SitkaTools to
        // save" in the banner), and tools only run through SitkaTools — opened by themselves they say so.
        // `var` (not const) so notifySitkaTools() can check it safely however early it runs.
        var WorkCopy = {
            TOOL: 'DailyWizard',
            LIVE: true,          // this tool handles live 'sitkaGit_db_update' messages without a full reload
            MAX_AGE: 12 * 60 * 60 * 1000,
            inUse: false,            // the DB in this tab came from the shared copy
            gotDb: false,            // SitkaTools delivered the DB by postMessage
            channel: ('BroadcastChannel' in window) ? new BroadcastChannel('sitkatools-db') : null,
            _open() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('sitkatools', 3);
                    req.onupgradeneeded = () => {
                        for (const name of ['folders', 'settings', 'work']) {
                            if (!req.result.objectStoreNames.contains(name)) req.result.createObjectStore(name, { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            async read() {
                try {
                    const idb = await this._open();
                    const row = await new Promise((resolve, reject) => {
                        const r = idb.transaction('work', 'readonly').objectStore('work').get('current');
                        r.onsuccess = () => resolve(r.result);
                        r.onerror = () => reject(r.error);
                    });
                    idb.close();
                    const copy = row && row.value;
                    return copy && copy.db && (Date.now() - copy.at) < this.MAX_AGE ? copy : null;
                } catch (_) {
                    return null;
                }
            },
            async write(db) {
                try {
                    const idb = await this._open();
                    await new Promise((resolve, reject) => {
                        const tx = idb.transaction('work', 'readwrite');
                        const store = tx.objectStore('work');
                        const r = store.get('current');
                        r.onsuccess = () => {
                            const prev = (r.result && r.result.value) || {};
                            store.put({ key: 'current', value: { ...prev, db, at: Date.now(), unsaved: true, from: this.TOOL } });
                        };
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                    });
                    idb.close();
                    if (this.channel) this.channel.postMessage({ type: 'db-updated', from: this.TOOL });
                } catch (_) { /* storage unavailable — changes stay in this tab */ }
            },
            // Delete the copy unless it holds changes nobody has saved yet
            async forgetIfSaved() {
                try {
                    const idb = await this._open();
                    await new Promise((resolve, reject) => {
                        const tx = idb.transaction('work', 'readwrite');
                        const store = tx.objectStore('work');
                        const r = store.get('current');
                        r.onsuccess = () => { if (r.result && r.result.value && r.result.value.unsaved === false) store.delete('current'); };
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                    });
                    idb.close();
                } catch (_) { /* ignore */ }
            },
            // Hand the latest changes to SitkaTools, ask it to have the user save, and switch to its tab
            async goBackToSave() {
                await this.write(DB.data);
                if (this.channel) this.channel.postMessage({ type: 'save-request', from: this.TOOL });
                try { if (window.opener && !window.opener.closed) window.opener.focus(); } catch (_) { /* not allowed */ }
                setTimeout(() => {
                    if (document.visibilityState !== 'visible') return; // switched tabs
                    const msg = 'Switch to the SitkaTools tab — it is waiting for you to save.';
                    if (typeof showToast === 'function') showToast(msg);
                    else alert(msg);
                }, 600);
            },
            showOpenFromSitka() {
                const wrap = document.createElement('div');
                wrap.id = 'openFromSitka';
                wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10000; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; padding: 24px;';
                wrap.innerHTML = `
                    <div style="max-width: 440px; text-align: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 32px;">
                        <div style="font-size: 2.5rem; margin-bottom: 12px;">🌿</div>
                        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);">Open this tool from SitkaTools</div>
                        <div style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;">
                            Tools get their database from SitkaTools. Open SitkaTools, load your database, then open this tool from there.</div>
                        <a href="../SitkaTools/SitkaTools.html" style="display: inline-block; background: var(--accent); color: var(--bg-primary); padding: 12px 24px; border-radius: 8px; font-weight: 700; text-decoration: none;">Open SitkaTools</a>
                    </div>`;
                document.body.appendChild(wrap);
            },
            // Hand the DB (and the device view sent with it) to this tool's own "DB arrived from SitkaTools" message handler
            apply(db, initial, view) {
                if (!initial && JSON.stringify(db) === JSON.stringify(DB.data) && (view?.building || null) === DeviceView.building) return;
                const type = (initial || !this.LIVE) ? 'sitkaGit_db' : 'sitkaGit_db_update';
                window.dispatchEvent(new MessageEvent('message', { data: { type, payload: db, view } }));
            },
            async start() {
                const copy = await this.read();
                if (!copy) {
                    // Opened by itself with no SitkaTools open on this device: tools only run through SitkaTools
                    if (!window.opener) this.showOpenFromSitka();
                    return;
                }
                this.inUse = true;
                this.apply(copy.db, true, copy.view);
                const banner = document.createElement('div');
                banner.id = 'workCopyBanner';
                banner.textContent = '📋 Using the database open in SitkaTools. ';
                banner.style.cssText = 'background: var(--bg-card); color: var(--text-primary); border-bottom: 1px solid var(--accent); padding: 8px 16px; font-size: 0.85rem; text-align: center;';
                const back = document.createElement('button');
                back.type = 'button';
                back.id = 'workCopyGoBack';
                back.textContent = 'Go back to SitkaTools to save';
                back.style.cssText = 'background: var(--accent); color: var(--bg-primary); border: none; border-radius: 6px; padding: 6px 12px; margin-left: 6px; font-weight: 700; cursor: pointer; font-size: inherit;';
                back.addEventListener('click', () => this.goBackToSave());
                banner.appendChild(back);
                document.body.insertBefore(banner, document.body.firstChild);
            }
        };
        window.addEventListener('message', (e) => {
            if (e.isTrusted && e.data?.type === 'sitkaGit_db' && window.opener && e.source === window.opener) WorkCopy.gotDb = true;
        });
        if (!window.opener) WorkCopy.start();
        else setTimeout(() => { if (!WorkCopy.gotDb) WorkCopy.start(); }, 1500);
        if (WorkCopy.channel) {
            WorkCopy.channel.addEventListener('message', async (e) => {
                // SitkaTools closed with everything saved: finish forgetting the copy (it may not get to)
                if (e.data?.type === 'sitka-closing') {
                    if (!e.data.unsaved) WorkCopy.forgetIfSaved();
                    return;
                }
                if (!WorkCopy.inUse || e.data?.type !== 'db-updated' || e.data.from === WorkCopy.TOOL) return;
                const copy = await WorkCopy.read();
                if (copy) WorkCopy.apply(copy.db, false, copy.view);
            });
        }

        // postMessage target origin: our own origin when served over http(s) (ROADMAP 0.4).
        // file:// pages have opaque origins, so they can only be reached with '*'.
        const SITKA_MSG_ORIGIN = (location.protocol === 'file:' || location.origin === 'null') ? '*' : location.origin;

        // ---- Lost link to SitkaTools ----
        // A popup's changes reach SitkaTools only by postMessage. If SitkaTools is reloaded or closed while this
        // window stays open, they would go nowhere while this window still looked fine. SitkaTools answers a
        // message from a window it didn't open with 'sitkaGit_not_linked'; this window checks on every change and
        // whenever it gets the focus, and then covers the page: reopen the tool from SitkaTools. Tablet tabs save
        // through the shared working copy, so it never applies to them.
        var LinkLost = {
            dismissed: false,
            timer: null,
            applies() { return WorkCopy.gotDb && !WorkCopy.inUse; },
            openerGone() { try { return !window.opener || window.opener.closed; } catch (_) { return true; } },
            // Before a change is sent: false (and the cover) when SitkaTools is gone
            canSend() {
                if (!this.applies() || !this.openerGone()) return true;
                this.show(true);
                return false;
            },
            // Is SitkaTools still there, and does it still know this window?
            check() {
                if (!this.applies() || this.dismissed) return;
                if (this.openerGone()) { this.show(false); return; }
                try { window.opener.postMessage({ type: 'sitkaGit_ping' }, SITKA_MSG_ORIGIN); } catch (_) { /* gone */ }
            },
            // lostChange: a change was just made that SitkaTools didn't get
            show(lostChange) {
                if (!lostChange && this.dismissed) return;
                this.dismissed = false;
                let wrap = document.getElementById('linkLost');
                if (!wrap) {
                    wrap = document.createElement('div');
                    wrap.id = 'linkLost';
                    wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10002; background: rgba(10, 10, 25, 0.92); display: flex; align-items: center; justify-content: center; padding: 24px;';
                    wrap.innerHTML = `
                        <div style="max-width: 460px; text-align: center; background: var(--bg-secondary); border: 2px solid var(--warning); border-radius: 12px; padding: 28px;">
                            <div style="font-size: 2.5rem; margin-bottom: 10px;">⚠️</div>
                            <div data-title style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);"></div>
                            <div data-text style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;"></div>
                            <button type="button" data-close style="background: var(--accent); color: var(--bg-primary); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;">Close this window</button>
                            <div style="margin-top: 14px;"><button type="button" data-keep style="background: none; border: none; color: var(--text-secondary); text-decoration: underline; cursor: pointer; font-size: 0.85rem;">Keep it open to look (changes here won't be saved)</button></div>
                        </div>`;
                    wrap.querySelector('[data-close]').addEventListener('click', () => window.close());
                    wrap.querySelector('[data-keep]').addEventListener('click', () => { this.dismissed = true; wrap.style.display = 'none'; });
                    document.body.appendChild(wrap);
                }
                wrap.querySelector('[data-title]').textContent = lostChange ? 'SitkaTools didn’t get your last change' : 'This window lost its link to SitkaTools';
                wrap.querySelector('[data-text]').textContent = 'SitkaTools was reloaded or closed after it opened this window, so changes made here can’t be saved. ' +
                    'Close this window and open the tool again from SitkaTools' + (lostChange ? ', then make your last change again.' : '.');
                wrap.style.display = 'flex';
            }
        };
        window.addEventListener('message', (e) => {
            if (!e.isTrusted || !window.opener || e.source !== window.opener) return;
            // From the first DB on: notice SitkaTools closing even while nothing is being changed
            if (e.data?.type === 'sitkaGit_db' && !LinkLost.timer) {
                LinkLost.timer = setInterval(() => { if (LinkLost.applies() && !LinkLost.dismissed && LinkLost.openerGone()) LinkLost.show(false); }, 3000);
            }
            if (e.data?.type === 'sitkaGit_not_linked' && LinkLost.applies()) LinkLost.show(e.data.about === 'sitkaGit_db_update');
        });
        window.addEventListener('focus', () => LinkLost.check());
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') LinkLost.check(); });

        function notifySitkaTools() {
            if (typeof LinkLost !== 'undefined' && !LinkLost.canSend()) return;   // SitkaTools is gone (cover shown)
            if (WorkCopy && WorkCopy.inUse) WorkCopy.write(DB.data);
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'sitkaGit_db_update',
                    payload: DB.data
                }, SITKA_MSG_ORIGIN);
            }
        }

        window.addEventListener('message', (e) => {
            // Only trust the SitkaTools window that opened this tool (ROADMAP 0.4)
            // Real messages must come from the SitkaTools window that opened us; untrusted events are this
            // page's own shared-copy loader (WorkCopy.apply)
            if (e.isTrusted && (!window.opener || e.source !== window.opener)) return;
            // Initial DB delivery from SitkaTools
            if (e.data?.type === 'sitkaGit_db' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();
                DeviceView.take(e.data);
                dbLoaded = true;

                // Acknowledge receipt so SitkaTools stops retrying
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'sitkaGit_ready' }, SITKA_MSG_ORIGIN);
                }

                renderAll();
                syncOpenDetail();
                if (hoursCtx) renderHours();
                if (doneCtx) renderDone();
                showToast(T('Database loaded from SitkaTools'));
            }

            // Live DB updates pushed by SitkaTools — refresh non-disruptively
            // (check-off state and any open editor are left untouched).
            if (e.data?.type === 'sitkaGit_db_update' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();
                DeviceView.take(e.data);
                dbLoaded = true;
                renderAll();
                syncOpenDetail(); // keep an open detail view consistent (non-disruptive)
                if (hoursCtx) renderHours();
                if (doneCtx) renderDone();   // the floor manager's name and initials being drawn are left alone
            }
        });

        // ---- Reset Day — clear the selected date's check-offs in the buildings shown ----
        function resetDay() {
            const date = selectedDateStr(), bids = shownBuildings();
            const count = checkoffCountForDate(date, bids);
            if (!count) return;
            if (!confirm(T('Clear all {n} check-off(s) for {date}?', { n: count, date: shortDate(date) }))) return;
            for (const k of Object.keys(sessionChecks)) {
                if (k.startsWith(date + ':')) delete sessionChecks[k];
            }
            let saved = false;
            for (const [bid, b] of Object.entries(DB.dailyBuildings)) {
                if ((bids && !bids.includes(bid)) || !b?.checks?.[date]) continue;
                delete b.checks[date];
                if (!Object.keys(b.checks).length) delete b.checks;
                saved = true;
            }
            if (saved) notifySitkaTools();
            renderAll();
        }

        // ---- Rendering ----

        // Building selector: All Buildings + every DB building + orphaned
        // _DailyWizard buildings (⚠️ suffix) so the manager can review/delete them.
        function populateBuildingSelector() {
            const sel = $('buildingSelect');
            const prev = sel.value;
            sel.innerHTML = '';

            const d = DB.ensureStructure();
            const buildings = d.buildings || {};

            // A building device shows only its own building (DeviceView)
            const own = DeviceView.building;
            sel.disabled = !!(own && buildings[own]);
            if (sel.disabled) {
                const opt = document.createElement('option');
                opt.value = own;
                opt.textContent = `${own} — ${buildings[own]?.name || T('Unnamed')}`;
                sel.appendChild(opt);
                sel.value = own;
                return;
            }

            const allOpt = document.createElement('option');
            allOpt.value = 'ALL';
            allOpt.textContent = T('— All Buildings —');
            sel.appendChild(allOpt);

            for (const [id, b] of Object.entries(buildings)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = `${id} — ${b?.name || T('Unnamed')}`;
                sel.appendChild(opt);
            }

            // Orphaned: task list exists but the building was deleted from the DB
            for (const id of Object.keys(d._DailyWizard.buildings)) {
                if (!buildings[id]) {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = `${id} — ${T('⚠️ not in database')}`;
                    sel.appendChild(opt);
                }
            }

            // Restore previous selection if it still exists
            if ([...sel.options].some(o => o.value === prev)) {
                sel.value = prev;
            }
        }

        function updateStatusBar() {
            const bar = $('statusBar');
            const text = $('statusText');

            if (!dbLoaded) {
                bar.classList.remove('loaded');
                text.textContent = T('No database loaded. Waiting for SitkaTools…');
            } else {
                bar.classList.add('loaded');
                const n = Object.keys(DB.buildings).length;
                const dateStr = selectedDateStr();
                const sel = $('buildingSelect').value;

                // Task counts (calendar events excluded) — combined across
                // buildings in All Buildings mode, single building otherwise.
                let taskCount = 0, doneCount = 0;
                const bids = sel === 'ALL' ? Object.keys(DB.buildings) : [sel];
                for (const bid of bids) {
                    const tasks = tasksForBuilding(bid, dateStr);
                    taskCount += tasks.length;
                    doneCount += tasks.filter(t => isChecked(checkSpotForTask(bid, t.code), dateStr)).length;
                }

                text.textContent = T(n === 1 ? '🏢 {n} building · 📝 {tasks} today · ✅ {done}/{tasks} done' : '🏢 {n} buildings · 📝 {tasks} today · ✅ {done}/{tasks} done', { n, tasks: taskCount, done: doneCount });
            }

            // Reset Day is disabled when nothing is checked for the selected date
            $('resetDayBtn').disabled = checkoffCountForDate(selectedDateStr(), shownBuildings()) === 0;
        }

        // ---- Recurrence & event attribution (CLAUDE.md "Recurrence Rules" /
        //      "Calendar Event Attribution") ----

        // A task appears when its weekday is in `days` OR its day-of-month is in `monthDays`.
        function taskOccursOn(task, dateStr) {
            const d = parseDate(dateStr);
            return (task.days || []).includes(d.getDay()) ||
                   (task.monthDays || []).includes(d.getDate());
        }

        function tasksForBuilding(buildingId, dateStr) {
            const list = DB.dailyBuildings[buildingId]?.tasks || [];
            return list.filter(t => taskOccursOn(t, dateStr));
        }

        // CropLabourWizard taskType → lot room phase rules (for event attribution)
        const CLW_CLONE_ROOM_TYPES = ['clone_cut_prep', 'clone_room_clean'];
        const CLW_VEG_ROOM_TYPES = ['planting', 'ipm_spray_veg_early', 'topping', 'order_ipm', 'veg_room_clean'];

        function buildingForEvent(ev) {
            const d = DB.ensureStructure();
            // 1. Direct roomId (CropProjection / EquipmentWizard events)
            if (ev.roomId && d.rooms[ev.roomId]) {
                return d.rooms[ev.roomId].buildingId || null;
            }
            // 2. lotId → resolve the lot's physical room via CLW phase rules
            if (ev.lotId && d.lots[ev.lotId]) {
                const lot = d.lots[ev.lotId];
                let roomName = null;
                // Explicit roomPhase (written by CropLabourWizard when the recipe task
                // specifies one) wins over the known-type lists below.
                if (ev.roomPhase === 'cloning') roomName = lot.cloningRoom;
                else if (ev.roomPhase === 'veg') roomName = lot.vegRoom;
                else if (ev.roomPhase === 'flower') roomName = lot.destRoom;
                else if (CLW_CLONE_ROOM_TYPES.includes(ev.taskType)) roomName = lot.cloningRoom;
                else if (CLW_VEG_ROOM_TYPES.includes(ev.taskType)) roomName = lot.vegRoom;
                else roomName = lot.destRoom; // everything else, incl. transplant & post-transplant
                for (const r of Object.values(d.rooms)) {
                    if (r && r.name === roomName) return r.buildingId || null;
                }
                // Fallback: the lot has exactly one resolvable room across all its
                // room fields → attribute there (covers lots with only one room set).
                const names = [...new Set([lot.cloningRoom, lot.vegRoom, lot.destRoom].filter(Boolean))];
                if (names.length === 1) {
                    for (const r of Object.values(d.rooms)) {
                        if (r && r.name === names[0]) return r.buildingId || null;
                    }
                }
            }
            // 3. Last resort: CLW event titles carry a room-ID prefix when the lot's
            //    room was known at generation time ("🧼 B66DG2-Strain#123, Task" or
            //    "💡 B66DG2#123, ..."). If the lot record is gone (deleted) but its
            //    events remain, use that prefix — validated against DB.rooms so only
            //    real room IDs ever match.
            const m = (ev.title || '').match(/^[^\p{L}\p{N}]*([A-Za-z0-9]+)[-#]/u);
            if (m && d.rooms[m[1]]) return d.rooms[m[1]].buildingId || null;
            // 4. Unattributable → null
            return null;
        }

        // Events on a date: multi-day events span [date, endDate] inclusive
        // (YYYY-MM-DD strings compare lexicographically).
        function eventsOnDate(dateStr) {
            return DB.calendarEvents.filter(ev => {
                if (!ev.date) return false;
                const end = ev.endDate || ev.date;
                return dateStr >= ev.date && dateStr <= end;
            });
        }

        // Stable session key for an event row's check-off.
        function eventItemKey(ev, dateStr) {
            return `${ev.sourceTool || ''}|${ev.lotId || ev.roomId || ''}|${dateStr}|${ev.title || ''}`;
        }

        // Identity of an event independent of its start date (for dedup).
        function eventIdentity(ev) {
            return `${ev.sourceTool || ''}|${ev.lotId || ev.roomId || ''}|${ev.title || ''}`;
        }

        // Short display date for chips: "Fri 25 Sep".
        const SHORT_DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
        const SHORT_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        function shortDate(str) {
            const d = parseDate(str);
            if (LANG !== 'en') return d.toLocaleDateString(langInfo().locale, { weekday: 'short', day: 'numeric', month: 'short' });
            return `${SHORT_DAYS[d.getDay()]} ${d.getDate()} ${SHORT_MONTHS[d.getMonth()]}`;
        }

        // Upcoming events: start strictly after the selected date, deduped by
        // identity (a multi-day event already shown in "Scheduled today" won't
        // reappear), sorted by start date. Returns at most `limit`.
        function upcomingEvents(dateStr, limit) {
            const seen = new Set();
            const list = DB.calendarEvents.filter(ev => {
                if (!ev.date || ev.date <= dateStr) return false;
                const id = eventIdentity(ev);
                if (seen.has(id)) return false;
                seen.add(id);
                return true;
            });
            list.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.title || '').localeCompare(b.title || ''));
            return list.slice(0, limit);
        }

        // Split a leading emoji off an event title (same pattern as GeneralEvent).
        function eventEmojiAndText(title) {
            const t = title || '';
            const m = t.match(/^(\p{Emoji_Presentation}|\p{Extended_Pictographic}\uFE0F?)\s*(.*)$/su);
            if (m) return { emoji: m[1], text: m[2] || t };
            return { emoji: '📌', text: t };
        }

        // ---- Row builders ----

        function makeCheck(spot, dateStr) {
            const wrap = document.createElement('label');
            wrap.className = 'task-check';
            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = isChecked(spot, dateStr);
            cb.addEventListener('change', () => {
                setChecked(spot, dateStr, cb.checked);   // saved in the building's file (see "Check-offs")
                renderAll();
            });
            wrap.appendChild(cb);
            return wrap;
        }

        // prevCode / nextCode: the codes of the rows shown just above / below this one (null at the ends)
        function makeTaskRow(buildingId, task, prevCode, nextCode, allowMove) {
            const dateStr = selectedDateStr();
            const spot = checkSpotForTask(buildingId, task.code);
            const row = document.createElement('div');
            row.className = 'task-row' + (isChecked(spot, dateStr) ? ' done' : '');

            row.appendChild(makeCheck(spot, dateStr));

            const emoji = document.createElement('span');
            emoji.className = 'task-emoji';
            emoji.textContent = task.emoji || '📋';
            row.appendChild(emoji);

            const name = document.createElement('span');
            name.className = 'task-name';
            name.textContent = taskName(task);
            row.appendChild(name);
            if (needsTranslation(task)) row.appendChild(enChip());

            const codeChip = document.createElement('span');
            codeChip.className = 'chip chip-code';
            codeChip.textContent = task.code;
            row.appendChild(codeChip);

            // Tapping anywhere on the row body (except the checkbox / move buttons)
            // opens the task's detail view (CLAUDE.md "Task Rows").
            row.addEventListener('click', (e) => {
                if (e.target.closest('.task-check') || e.target.closest('.move-btns') || e.target.closest('.hours-btn')) return;
                openTaskDetail(buildingId, task.code);
            });

            const staffChip = document.createElement('span');
            staffChip.className = 'chip';
            staffChip.textContent = `👥 ${task.staff ?? 1}`;
            row.appendChild(staffChip);

            const minChip = document.createElement('span');
            minChip.className = 'chip';
            minChip.textContent = `⏱ ${T('{m}m', { m: task.minutes ?? 0 })}`;
            row.appendChild(minChip);

            row.appendChild(makeHoursButton({ kind: 'chore', buildingId, code: task.code, date: dateStr }));

            if (allowMove) {
                const moveBtns = document.createElement('div');
                moveBtns.className = 'move-btns';
                const up = document.createElement('button');
                up.type = 'button';
                up.className = 'move-btn';
                up.textContent = '▲';
                up.disabled = !prevCode;
                up.title = T('Move up');
                up.addEventListener('click', () => moveTask(buildingId, task.code, prevCode));
                const down = document.createElement('button');
                down.type = 'button';
                down.className = 'move-btn';
                down.textContent = '▼';
                down.disabled = !nextCode;
                down.title = T('Move down');
                down.addEventListener('click', () => moveTask(buildingId, task.code, nextCode));
                moveBtns.appendChild(up);
                moveBtns.appendChild(down);
                row.appendChild(moveBtns);
            }

            return row;
        }

        // CropLabourWizard's labour estimate on a crop event — per day, like a daily task's staff/minutes
        function eventEstimate(ev) {
            if (!Number.isInteger(ev.estMinutes) || ev.estMinutes <= 0) return null;
            return { staff: Number.isInteger(ev.estStaff) && ev.estStaff >= 1 ? ev.estStaff : 1, minutes: ev.estMinutes };
        }

        // 30 → "30m", 90 → "1h 30m", 480 → "8h" (crop tasks run for hours)
        function fmtMinutes(m) {
            const h = Math.floor(m / 60), r = m % 60;
            return h ? (r ? T('{h}h {m}m', { h, m: r }) : T('{h}h', { h })) : T('{m}m', { m: r });
        }

        // mode: 'today' (default) — checkable row for the selected date.
        //       'upcoming' — read-only row with a date chip, no checkbox.
        function makeEventRow(ev, mode = 'today') {
            const { emoji, text } = eventEmojiAndText(ev.title);

            const row = document.createElement('div');

            if (mode === 'upcoming' || mode === 'open') {
                row.className = 'task-row' + (mode === 'upcoming' ? ' upcoming' : ' still-open');
                const spacer = document.createElement('span');
                spacer.className = 'task-check';
                spacer.setAttribute('aria-hidden', 'true');
                row.appendChild(spacer);
            } else {
                const dateStr = selectedDateStr();
                const spot = checkSpotForEvent(ev, dateStr);
                row.className = 'task-row' + (isChecked(spot, dateStr) ? ' done' : '');
                row.appendChild(makeCheck(spot, dateStr));
            }

            const em = document.createElement('span');
            em.className = 'task-emoji';
            em.textContent = emoji;
            row.appendChild(em);

            const name = document.createElement('span');
            name.className = 'task-name readonly';
            name.textContent = text || ev.title || T('(untitled event)');
            row.appendChild(name);

            // Crop tasks carry CropLabourWizard's labour estimate (per day) — same chips as daily tasks
            const est = eventEstimate(ev);
            if (est) {
                const staffChip = document.createElement('span');
                staffChip.className = 'chip';
                staffChip.textContent = `👥 ${est.staff}`;
                staffChip.title = T('Staff needed (estimate)');
                row.appendChild(staffChip);

                const minChip = document.createElement('span');
                minChip.className = 'chip';
                minChip.textContent = `⏱ ${fmtMinutes(est.minutes)}`;
                minChip.title = T('Estimated time for the day');
                row.appendChild(minChip);
            }

            if (mode === 'upcoming') {
                const chip = document.createElement('span');
                chip.className = 'chip chip-date';
                chip.textContent = shortDate(ev.date);
                row.appendChild(chip);
            } else if (HOURS_TOOLS.includes(ev.sourceTool) && ev.id) {
                if (mode === 'open') {
                    const due = ev.endDate || ev.date;
                    const late = Math.round((parseDate(selectedDateStr()) - parseDate(due)) / 86400000);
                    const chip = document.createElement('span');
                    chip.className = 'chip chip-overdue';
                    chip.textContent = T(late === 1 ? 'due {date} · {n} day overdue' : 'due {date} · {n} days overdue', { date: shortDate(due), n: late });
                    row.appendChild(chip);
                }
                // Crop and equipment tasks: hours go on the event's labour_map (see "⏱ Hours"), and the floor
                // manager signs them off as done (see "✅ Mark done")
                const buildingId = buildingForEvent(ev);
                if (buildingId) {
                    row.appendChild(makeHoursButton({ kind: 'event', buildingId, eventId: ev.id, date: selectedDateStr() }));
                    row.appendChild(makeDoneButton(ev, buildingId));
                }
            }

            return row;
        }

        // Reorder a task within its building's array (definition mutation → sync).
        // Swaps the two tasks by code: the row shown next to it may not be its neighbour in the
        // full list when some tasks don't run on the selected date.
        function moveTask(buildingId, code, otherCode) {
            const tasks = DB.dailyBuildings[buildingId]?.tasks;
            if (!tasks) return;
            const i = tasks.findIndex(t => t.code === code);
            const j = tasks.findIndex(t => t.code === otherCode);
            if (i === -1 || j === -1 || i === j) return;
            [tasks[i], tasks[j]] = [tasks[j], tasks[i]];
            notifySitkaTools();
            renderAll();
        }

        // "Scheduled today" divider + event rows (omitted when there are none).
        function appendEventsSection(parent, events) {
            if (!events.length) return;
            const div = document.createElement('div');
            div.className = 'section-divider';
            div.textContent = T('Scheduled today ({n})', { n: events.length });
            parent.appendChild(div);
            for (const ev of events) parent.appendChild(makeEventRow(ev));
        }

        // "⏰ Still open" divider + this building's crop and equipment tasks that ended before the selected date and
        // aren't done yet, oldest first, so hours can still be logged on them (on the selected day) until the floor
        // manager marks them done. Single-building view only. The 10 oldest show; the rest fold under "+ N more".
        let showAllOpen = false;
        const OPEN_SHOWN = 10;
        function stillOpenEvents(dateStr, buildingId) {
            return DB.calendarEvents
                .filter(ev => HOURS_TOOLS.includes(ev.sourceTool) && ev.id && ev.date && ev.completed !== true &&
                    (ev.endDate || ev.date) < dateStr && buildingForEvent(ev) === buildingId)
                .sort((a, b) => (a.endDate || a.date).localeCompare(b.endDate || b.date) || (a.title || '').localeCompare(b.title || ''));
        }
        function appendStillOpenSection(parent, dateStr, buildingId) {
            const evs = stillOpenEvents(dateStr, buildingId);
            if (!evs.length) return;
            const div = document.createElement('div');
            div.className = 'section-divider overdue';
            div.textContent = T('⏰ Still open ({n})', { n: evs.length });
            div.title = T('Tasks whose day has passed and that the floor manager hasn’t marked done yet');
            parent.appendChild(div);
            for (const ev of showAllOpen ? evs : evs.slice(0, OPEN_SHOWN)) parent.appendChild(makeEventRow(ev, 'open'));
            if (evs.length > OPEN_SHOWN) {
                const more = document.createElement('button');
                more.type = 'button';
                more.className = 'btn btn-secondary open-more';
                more.textContent = showAllOpen ? T('Show fewer') : T('+ {n} more', { n: evs.length - OPEN_SHOWN });
                more.addEventListener('click', () => { showAllOpen = !showAllOpen; renderAll(); });
                parent.appendChild(more);
            }
        }

        // "Upcoming" divider + the next calendar events after the selected date
        // (read-only, no check-offs). Omitted when there are none.
        function appendUpcomingSection(parent, dateStr, buildingId, limit = 5) {
            let evs = upcomingEvents(dateStr, Infinity);
            if (buildingId !== 'ALL') evs = evs.filter(ev => buildingForEvent(ev) === buildingId);
            evs = evs.slice(0, limit);
            if (!evs.length) return;
            const div = document.createElement('div');
            div.className = 'section-divider';
            div.textContent = T('Upcoming ({n})', { n: evs.length });
            parent.appendChild(div);
            for (const ev of evs) parent.appendChild(makeEventRow(ev, 'upcoming'));
        }

        let editorEmoji = '📋';
        let emojiActiveTab = 0;

        function buildEmojiTabs() {
            const tabs = $('emojiTabs');
            tabs.innerHTML = '';
            EMOJI_CATEGORIES.forEach((cat, i) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'emoji-tab' + (i === emojiActiveTab ? ' on' : '');
                b.textContent = T(cat.label);
                // stopPropagation: this handler rebuilds the tab list (removing the clicked
                // button from the DOM), which would otherwise make the document-level
                // outside-click check see a detached target and close the panel.
                b.addEventListener('click', (e) => { e.stopPropagation(); emojiActiveTab = i; buildEmojiTabs(); renderEmojiGrid(); });
                tabs.appendChild(b);
            });
        }

        function renderEmojiGrid() {
            const grid = $('emojiGrid');
            grid.innerHTML = '';
            const q = $('emojiSearch').value.trim().toLowerCase();
            // With a search query, match across ALL categories; otherwise show the active tab.
            const cats = q ? EMOJI_CATEGORIES : [EMOJI_CATEGORIES[emojiActiveTab]];
            let count = 0;
            for (const cat of cats) {
                for (const [ch, kw] of cat.items) {
                    if (q && !(kw.includes(q) || ch.toLowerCase().includes(q))) continue;
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'emoji-cell';
                    b.textContent = ch;
                    b.title = kw.split(' ')[0];
                    b.addEventListener('click', () => { setEditorEmoji(ch); closeEmojiPanel(); });
                    grid.appendChild(b);
                    count++;
                }
            }
            if (!count) {
                const div = document.createElement('div');
                div.className = 'muted-line';
                div.textContent = T('No matching emoji.');
                grid.appendChild(div);
            }
        }

        function setEditorEmoji(ch) { editorEmoji = ch; $('emojiCurrentBtn').textContent = ch; }

        function openEmojiPanel() {
            $('emojiPanel').style.display = '';
            $('emojiSearch').value = '';
            buildEmojiTabs();
            renderEmojiGrid();
        }
