<!-- DailyWizard.html — Daily task list builder & floor view for SitkaGit suite -->
<!-- Tool: DailyWizard | Purpose: Per-building daily to-do lists + that day's calendar events, with tablet-friendly check-off UI -->
<!-- Database Keys: "_DailyWizard" (top-level, read/write), "calendarEvents" (read-only) -->
<!-- Status: Complete (Stage 5 of 5) — polish & verification. See CLAUDE.md in this directory. -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyWizard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #53d8a8;
            --accent-hover: #3fb98b;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8b8;
            --border: #2a2a4a;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --warning: #f39c12;
            --input-bg: #1a1a3e;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header (sticky) ---- */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .header-right {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ---- Form controls ---- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="date"], input[type="text"], input[type="number"] {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 0.9rem;
            font-family: inherit;
            min-height: 48px; /* tablet touch target */
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* ---- Buttons ---- */
        .btn {
            border: none;
            border-radius: var(--radius);
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            min-height: 48px; /* tablet touch target */
            transition: background 0.15s ease;
        }

        .btn-primary { background: var(--accent); color: #08301f; }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }

        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: var(--danger-hover); }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* Header buttons (Load / Export) — ≥48px touch target */
        .db-btn { padding: 8px 12px; min-height: 48px; font-size: 0.85rem; }

        /* ---- Main content ---- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        /* ---- Status bar ---- */
        .status-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .status-bar.loaded { border-color: var(--accent); }

        /* ---- Task rows (core tablet UI) ---- */
        .task-row {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            margin-bottom: 8px;
            min-height: 64px;
        }

        .task-row.done {
            background: rgba(83, 216, 168, 0.07);
            border-color: rgba(83, 216, 168, 0.35);
        }

        /* Large checkbox — 48×48 touch target, ~32px visual box */
        .task-check {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .task-check input {
            -webkit-appearance: none;
            appearance: none;
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-radius: 6px;
            background: var(--input-bg);
            cursor: pointer;
            display: grid;
            place-content: center;
        }

        .task-check input:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .task-check input:checked::after {
            content: '✓';
            font-size: 1.25rem;
            font-weight: 700;
            color: #08301f;
        }

        .task-emoji { font-size: 1.5rem; flex-shrink: 0; }

        .task-name {
            flex: 1;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .task-row.done .task-name {
            color: var(--text-secondary);
            text-decoration: line-through;
        }

        /* ---- Chips ---- */
        .chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .chip-code {
            font-family: 'Consolas', 'Menlo', monospace;
            letter-spacing: 1px;
        }

        /* ---- Move buttons (single-building mode) ---- */
        .move-btns { display: flex; gap: 4px; flex-shrink: 0; }

        .move-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            width: 48px;
            height: 48px; /* tablet touch target */
            font-size: 0.9rem;
            cursor: pointer;
        }

        .move-btn:hover:not(:disabled) { background: var(--border); color: var(--text-primary); }
        .move-btn:disabled { opacity: 0.35; cursor: not-allowed; }

        /* ---- Section divider ("Scheduled today") ---- */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0 12px;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ---- Building section (All Buildings view) ---- */
        .building-section { margin-bottom: 28px; }

        .building-section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .building-section-header.muted { color: var(--text-secondary); }

        /* ---- Add Task bar (single-building mode) ---- */
        .add-task-bar { margin-bottom: 14px; }
        .add-task-bar .btn { min-height: 48px; }

        /* ---- Muted inline note (empty day lines) ---- */
        .muted-line {
            color: var(--text-secondary);
            font-size: 0.9rem;
            padding: 12px 4px;
        }

        /* ---- Read-only row name (calendar events) ---- */
        .task-name.readonly { cursor: default; }

        /* ---- Upcoming section (next calendar events, read-only) ---- */
        .task-row.upcoming { opacity: 0.85; }
        .chip-date {
            font-family: 'Consolas', 'Menlo', monospace;
            letter-spacing: 0.5px;
        }

        /* ---- Overlay header / body / footer ---- */
        .overlay-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }

        .overlay-title { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

        .overlay-body {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .editor-card {
            width: 100%;
            max-width: 560px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
        }

        .overlay-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
        }

        /* ---- Editor form extras ---- */
        .editor-row { display: flex; gap: 16px; }
        .editor-row .form-group { flex: 1; }

        .weekday-pills { display: flex; gap: 8px; flex-wrap: wrap; }

        .pill {
            min-width: 48px;
            min-height: 48px;
            padding: 8px 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-secondary);
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
        }

        .pill.on { background: var(--accent); border-color: var(--accent); color: #08301f; }

        .preset-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .chip-btn { cursor: pointer; min-height: 48px; display: inline-flex; align-items: center; } /* tablet touch target */
        .chip-btn:hover { border-color: var(--accent); color: var(--text-primary); }

        /* ---- Emoji picker ---- */
        .emoji-picker { position: relative; }

        .emoji-current {
            font-size: 1.6rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 14px;
            min-height: 48px;
            cursor: pointer;
            color: var(--text-primary);
        }

        .emoji-panel {
            position: absolute;
            top: calc(100% + 6px);
            left: 0;
            z-index: 50;
            width: min(380px, calc(100vw - 72px));
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 12px;
        }

        .emoji-panel input { width: 100%; margin-bottom: 10px; }

        .emoji-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }

        .emoji-tab {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-family: inherit;
            cursor: pointer;
            min-height: 48px; /* tablet touch target */
        }

        .emoji-tab.on { background: var(--accent); border-color: var(--accent); color: #08301f; font-weight: 600; }

        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(48px, 1fr));
            gap: 2px;
            max-height: 260px;
            overflow-y: auto;
        }

        .emoji-cell {
            font-size: 1.35rem;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            padding: 4px;
            min-width: 48px; /* tablet touch target */
            min-height: 48px; /* tablet touch target */
        }

        .emoji-cell:hover { background: var(--border); }

        /* ---- Task detail view (Stage 4) ---- */
        .detail-header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .detail-emoji { font-size: 2rem; flex-shrink: 0; }

        .detail-name {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-primary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .detail-summary {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .summary-line { font-size: 0.95rem; }

        .steps-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .steps-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
        }

        .step-row {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 10px;
        }

        .step-top { display: flex; align-items: center; gap: 10px; }

        .step-num {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
        }

        .step-text { flex: 1; font-size: 0.95rem; cursor: pointer; min-width: 0; min-height: 48px; display: flex; align-items: center; } /* tablet touch target */
        .step-text.placeholder { color: var(--text-secondary); font-style: italic; }

        .step-text-input { flex: 1; min-width: 0; }

        .step-actions { display: flex; gap: 4px; flex-shrink: 0; }

        .step-btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .step-btn:hover:not(:disabled) { background: var(--border); color: var(--text-primary); }
        .step-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .step-btn.danger { color: var(--danger); }

        .step-img-wrap { margin-top: 10px; }

        .step-img {
            max-width: 100%;
            max-height: 280px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: block;
        }

        .chip.missing { color: var(--text-secondary); }
        /* 🌐 A name or step with no translation in the chosen language shows the English, tagged "EN" */
        .chip.chip-en { border-style: dashed; color: var(--text-secondary); font-size: 0.7rem; letter-spacing: 0.5px; }
        .step-en-ref { font-size: 0.85rem; color: var(--text-secondary); margin: 6px 0 0 40px; }

        .overlay-footer.spread { justify-content: space-between; }

        /* ---- ⏱ Hours on chores ---- */
        .hours-btn { min-height: 48px; min-width: 48px; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .hours-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text-primary); }
        .hours-btn.logged { color: var(--accent); border-color: var(--accent); }
        .hours-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .hours-wrap { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
        .hours-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .hours-sub { color: var(--text-secondary); font-size: 0.9rem; }
        .hours-entry { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-primary); flex-wrap: wrap; }
        .hours-entry.removed { opacity: 0.55; }
        .hours-entry.removed .who, .hours-entry.removed .hrs { text-decoration: line-through; }
        .hours-entry .who { flex: 1; min-width: 120px; font-weight: 600; }
        .hours-entry .hrs { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
        .hours-entry .when { flex-basis: 100%; font-size: 0.78rem; color: var(--text-secondary); }
        .hours-entry svg { width: 96px; height: 30px; background: #fff; border-radius: 4px; flex-shrink: 0; }
        .hours-del { min-width: 44px; min-height: 44px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); color: var(--danger); font-size: 1rem; cursor: pointer; }
        .hours-total { font-size: 0.9rem; color: var(--text-secondary); text-align: right; }
        .hours-pad { width: 100%; height: 150px; background: #fff; border-radius: var(--radius); touch-action: none; cursor: crosshair; display: block; }
        #hoursOther, #hoursWage { margin-top: 8px; }
        .hours-card input, .hours-card select { min-height: 48px; padding: 10px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--input-bg); color: var(--text-primary); font-family: inherit; font-size: 1rem; }
        .hours-note { font-size: 0.82rem; color: var(--text-secondary); max-width: 60%; }

        /* ---- ✅ Mark done + ⏰ Still open ---- */
        .done-btn { min-height: 48px; min-width: 48px; padding: 6px 12px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--bg-card); color: var(--text-secondary); font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .done-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text-primary); }
        .done-btn.done { color: var(--accent); border-color: var(--accent); }
        .done-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .chip.chip-overdue { color: var(--warning); border-color: rgba(243, 156, 18, 0.5); }
        .section-divider.overdue { color: var(--warning); }
        .task-row.still-open { box-shadow: inset 3px 0 0 var(--warning); }
        .open-more { align-self: flex-start; margin: 4px 0 10px; }
        .done-who-note { max-width: none; }
        #doneStatus .hours-entry .btn { margin-left: auto; }

        /* ---- Empty state ---- */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .empty-state .empty-icon { font-size: 3rem; }
        .empty-state .empty-title { font-size: 1.15rem; font-weight: 600; color: var(--text-primary); }
        .empty-state .empty-sub { font-size: 0.9rem; max-width: 420px; line-height: 1.5; }

        /* ---- Footer (sticky) ---- */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        /* ---- Toast ---- */
        .toast {
            position: fixed;
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 300;
            max-width: 90vw;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Overlay base (detail view / editor — later stages) ---- */
        .overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 200;
            display: none;
            flex-direction: column;
        }

        .overlay.open { display: flex; }

        /* ---- Narrow screens: stack header controls gracefully ---- */
        @media (max-width: 768px) {
            .header { padding: 10px 14px; }
            .main { padding: 14px; }
            .footer { padding: 10px 14px; }
            .task-name { white-space: normal; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <span class="logo">📋 DailyWizard</span>
        <div class="header-right">
            <div class="form-group">
                <label for="langSelect" data-t>🌐 Language</label>
                <select id="langSelect"></select>
            </div>
            <div class="form-group">
                <label for="buildingSelect" data-t>Building</label>
                <select id="buildingSelect">
                    <option value="ALL">— All Buildings —</option>
                </select>
            </div>
            <div class="form-group">
                <label for="dateInput" data-t>📅 Date</label>
                <input type="date" id="dateInput">
            </div>
        </div>
    </header>


    <!-- Main Content -->
    <main class="main">
        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">No database loaded.</span>
        </div>

        <!-- Day list (task rows + scheduled events) — rendered by JS -->
        <div id="listContainer"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <button class="btn btn-secondary" id="resetDayBtn" disabled data-t>Reset Day</button>
        <button class="btn btn-secondary" id="closeToolBtn" data-t>Close Tool</button>
    </footer>

    <!-- Task Editor Overlay (add / edit) -->
    <div class="overlay" id="editorOverlay">
        <header class="overlay-header">
            <button type="button" class="btn btn-secondary" id="editorBackBtn">←</button>
            <span class="overlay-title" id="editorTitle">Add Task</span>
            <span style="width:44px;"></span>
        </header>
        <div class="overlay-body">
            <div class="card editor-card">
                <!-- Emoji picker -->
                <div class="form-group">
                    <label data-t>Emoji</label>
                    <div class="emoji-picker" id="emojiPicker">
                        <button type="button" class="emoji-current" id="emojiCurrentBtn">📋</button>
                        <div class="emoji-panel" id="emojiPanel" style="display:none;">
                            <input type="text" id="emojiSearch" placeholder="Search (water, clean, gloves…)" data-t-ph>
                            <div class="emoji-tabs" id="emojiTabs"></div>
                            <div class="emoji-grid" id="emojiGrid"></div>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="taskNameInput" data-t>Name *</label>
                    <input type="text" id="taskNameInput" placeholder="e.g., Water plants" data-t-ph>
                </div>
