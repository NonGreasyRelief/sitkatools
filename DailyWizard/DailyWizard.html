        // ---- Emoji picker (embedded data, no network) ----
        let editorEmoji = '📋';
        let emojiActiveTab = 0;

        function buildEmojiTabs() {
            const tabs = $('emojiTabs');
            tabs.innerHTML = '';
            EMOJI_CATEGORIES.forEach((cat, i) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'emoji-tab' + (i === emojiActiveTab ? ' on' : '');
                b.textContent = cat.label;
                // stopPropagation: this handler rebuilds the tab list (removing the clicked
                // button from the DOM), which would otherwise make the document-level
                // outside-click check see a detached target and close the panel.
                b.addEventListener('click', (e) => { e.stopPropagation(); emojiActiveTab = i; buildEmojiTabs(); renderEmojiGrid(); });
                tabs.appendChild(b);
            });
        }

        function renderEmojiGrid() {
            const grid = $('emojiGrid');
            grid.innerHTML = '';
            const q = $('emojiSearch').value.trim().toLowerCase();
            // With a search query, match across ALL categories; otherwise show the active tab.
            const cats = q ? EMOJI_CATEGORIES : [EMOJI_CATEGORIES[emojiActiveTab]];
            let count = 0;
            for (const cat of cats) {
                for (const [ch, kw] of cat.items) {
                    if (q && !(kw.includes(q) || ch.toLowerCase().includes(q))) continue;
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'emoji-cell';
                    b.textContent = ch;
                    b.title = kw.split(' ')[0];
                    b.addEventListener('click', () => { setEditorEmoji(ch); closeEmojiPanel(); });
                    grid.appendChild(b);
                    count++;
                }
            }
            if (!count) {
                const div = document.createElement('div');
                div.className = 'muted-line';
                div.textContent = 'No matching emoji.';
                grid.appendChild(div);
            }
        }

        function setEditorEmoji(ch) { editorEmoji = ch; $('emojiCurrentBtn').textContent = ch; }

        function openEmojiPanel() {
            $('emojiPanel').style.display = '';
            $('emojiSearch').value = '';
            buildEmojiTabs();
            renderEmojiGrid();
        }

        function closeEmojiPanel() { $('emojiPanel').style.display = 'none'; }

        // ---- Task editor (add / edit) ----
        const CODE_ALPHABET = 'abcdefghjkmnpqrstuvwxyz23456789';
        let editorBuildingId = null;
        let editorTaskCode = null; // null = new task

        // Random 4-char code, globally unique across all buildings (regenerate on collision).
        function generateTaskCode() {
            const d = DB.ensureStructure();
            const used = new Set();
            for (const b of Object.values(d._DailyWizard.buildings)) {
                for (const t of (b.tasks || [])) if (t.code) used.add(t.code);
            }
            let code;
            do {
                code = '';
                for (let i = 0; i < 4; i++) code += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
            } while (used.has(code));
            return code;
        }

        function openTaskEditor(buildingId, code) {
            editorBuildingId = buildingId;
            editorTaskCode = code || null;
            const task = editorTaskCode
                ? (DB.dailyBuildings[buildingId]?.tasks || []).find(t => t.code === editorTaskCode)
                : null;

            $('editorTitle').textContent = task ? `Edit Task — ${task.name}` : 'Add Task';
            setEditorEmoji(task?.emoji || '📋');
            $('taskNameInput').value = task?.name || '';
            $('taskMinutesInput').value = task?.minutes ?? 30;
            $('taskStaffInput').value = task?.staff ?? 1;
            $('monthDaysInput').value = (task?.monthDays || []).join(', ');

            // Weekday pills — display order Mon → Sun, values 1..6,0; default all on for new tasks
            const days = new Set(task?.days || [0, 1, 2, 3, 4, 5, 6]);
            const pills = $('weekdayPills');
            pills.innerHTML = '';
            const order = [1, 2, 3, 4, 5, 6, 0];
            const labels = { 1: 'Mon', 2: 'Tue', 3: 'Wed', 4: 'Thu', 5: 'Fri', 6: 'Sat', 0: 'Sun' };
            for (const d of order) {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'pill' + (days.has(d) ? ' on' : '');
                b.textContent = labels[d];
                b.dataset.day = d;
                b.addEventListener('click', () => b.classList.toggle('on'));
                pills.appendChild(b);
            }

            closeEmojiPanel();
            $('editorOverlay').classList.add('open');
            $('taskNameInput').focus();
        }

        function closeTaskEditor() {
            $('editorOverlay').classList.remove('open');
            closeEmojiPanel();
            editorBuildingId = null;
            editorTaskCode = null;
        }

        // Parse a comma-separated list of 1–31, deduplicated and sorted.
        function parseMonthDays(str) {
            const out = new Set();
            for (const part of String(str).split(',')) {
                const n = parseInt(part.trim(), 10);
                if (!Number.isNaN(n) && n >= 1 && n <= 31) out.add(n);
            }
            return [...out].sort((a, b) => a - b);
        }

        function saveTaskFromEditor() {
            const name = $('taskNameInput').value.trim();
            const minutes = parseInt($('taskMinutesInput').value, 10);
            const staff = parseInt($('taskStaffInput').value, 10);
            const days = [...document.querySelectorAll('#weekdayPills .pill.on')]
                .map(b => Number(b.dataset.day)).sort((a, b) => a - b);
            const monthDays = parseMonthDays($('monthDaysInput').value);

            // Validation (CLAUDE.md "Task Editor")
            if (!name) { showToast('Task name is required'); return; }
            if (Number.isNaN(minutes) || minutes < 5) { showToast('Estimated time must be at least 5 minutes'); return; }
            if (Number.isNaN(staff) || staff < 1) { showToast('Staff required must be at least 1'); return; }
            if (!days.length && !monthDays.length) { showToast('Pick at least one weekday or one day-of-month'); return; }

            const d = DB.ensureStructure();
            if (!d._DailyWizard.buildings[editorBuildingId]) d._DailyWizard.buildings[editorBuildingId] = { tasks: [] };
            const tasks = d._DailyWizard.buildings[editorBuildingId].tasks;
            const wasEdit = !!editorTaskCode;

            if (wasEdit) {
                const task = tasks.find(t => t.code === editorTaskCode);
                if (task) {
                    task.emoji = editorEmoji;
                    task.name = name;
                    task.minutes = minutes;
                    task.staff = staff;
                    task.days = days;
                    task.monthDays = monthDays;
                    // steps preserved — edited in the detail view (Stage 4)
                }
            } else {
                tasks.push({ code: generateTaskCode(), emoji: editorEmoji, name, minutes, staff, days, monthDays, steps: [] });
            }

            notifySitkaTools(); // definition mutation → sync back to SitkaTools
            closeTaskEditor();
            renderAll();
            showToast(wasEdit ? 'Task updated' : 'Task added');
        }

        // ---- Task detail view & step pictures (Stage 4) ----
        let detailBuildingId = null;
        let detailTaskCode = null;

        const DAY_LABELS = { 0: 'Sun', 1: 'Mon', 2: 'Tue', 3: 'Wed', 4: 'Thu', 5: 'Fri', 6: 'Sat' };

        function ordinal(n) {
            if (n % 100 >= 11 && n % 100 <= 13) return n + 'th';
            switch (n % 10) {
                case 1: return n + 'st';
                case 2: return n + 'nd';
                case 3: return n + 'rd';
                default: return n + 'th';
            }
        }

        // Plain-language recurrence (CLAUDE.md "Task Detail View"):
        // "Every day" / "Mon, Wed, Fri" / "1st & 15th of each month", joined with "and".
        function describeRecurrence(task) {
            const days = [...(task.days || [])];
            const monthDays = [...(task.monthDays || [])].sort((a, b) => a - b);
            const parts = [];
            if (days.length === 7) parts.push('Every day');
            else if (days.length) {
                const order = [1, 2, 3, 4, 5, 6, 0]; // display order Mon → Sun
                parts.push(order.filter(d => days.includes(d)).map(d => DAY_LABELS[d]).join(', '));
            }
            if (monthDays.length) {
                const list = monthDays.map(ordinal);
                const head = list.slice(0, -1).join(', ');
                parts.push(`${head ? head + ' & ' : ''}${list[list.length - 1]} of each month`);
            }
            return parts.join(' and ');
        }

        // ---- Step pictures: pics/{code}_{n}.{ext}, 1-based position, probe png→jpg→webp ----
        const STEP_IMG_EXTS = ['png', 'jpg', 'webp'];
        const stepImageCache = {}; // `${code}_${n}` → ext | null (null = probed, missing)

        function probeStepImage(code, n, bust, cb) {
            const key = `${code}_${n}`;
            let i = 0;
            const tryNext = () => {
                if (i >= STEP_IMG_EXTS.length) { stepImageCache[key] = null; cb(null); return; }
                const ext = STEP_IMG_EXTS[i++];
                const img = new Image();
                const q = bust ? `?t=${Date.now()}` : '';
                img.onload = () => { stepImageCache[key] = ext; cb(ext); };
                img.onerror = tryNext;
                img.src = `pics/${code}_${n}.${ext}${q}`;
            };
            tryNext();
        }

        function makeStepImageWrap(code, n) {
            const wrap = document.createElement('div');
            wrap.className = 'step-img-wrap';
            const key = `${code}_${n}`;
            const fill = (ext) => {
                wrap.innerHTML = '';
                if (ext) {
                    const img = document.createElement('img');
                    img.className = 'step-img';
                    img.src = `pics/${code}_${n}.${ext}`;
                    img.alt = `${code}_${n}`;
                    wrap.appendChild(img);
                } else {
                    const chip = document.createElement('span');
                    chip.className = 'chip missing';
                    chip.textContent = `🖼 ${code}_${n}.png not found`;
                    wrap.appendChild(chip);
                }
            };
            if (key in stepImageCache) fill(stepImageCache[key]);
            else {
                const chip = document.createElement('span');
                chip.className = 'chip missing';
                chip.textContent = `🖼 ${code}_${n}.png …`;
                wrap.appendChild(chip);
                probeStepImage(code, n, false, (ext) => { if (wrap.isConnected) fill(ext); });
            }
            return wrap;
        }

        function getDetailTask() {
            return detailBuildingId && detailTaskCode
                ? (DB.dailyBuildings[detailBuildingId]?.tasks || []).find(t => t.code === detailTaskCode)
                : null;
        }

        function openTaskDetail(buildingId, code) {
            const task = (DB.dailyBuildings[buildingId]?.tasks || []).find(t => t.code === code);
            if (!task) return;
            detailBuildingId = buildingId;
            detailTaskCode = code;
            renderDetail();
            $('detailOverlay').classList.add('open');
        }

        function closeTaskDetail() {
            $('detailOverlay').classList.remove('open');
            detailBuildingId = null;
            detailTaskCode = null;
        }

        // Keep an open detail view consistent with a freshly delivered DB
        // (closes itself if its task no longer exists). Skipped while a step's text is being
        // typed — re-rendering would wipe it; finishing the edit re-renders with the fresh DB.
        function syncOpenDetail() {
            if (!$('detailOverlay').classList.contains('open')) return;
            if (document.querySelector('#stepsList .step-text-input')) return;
            renderDetail();
        }

        function renderDetail() {
            const task = getDetailTask();
            if (!task) { closeTaskDetail(); return; }

            $('detailEmoji').textContent = task.emoji || '📋';
            $('detailName').textContent = task.name;
            $('detailCode').textContent = task.code;

            // Summary block: labour + plain-language recurrence
            const sum = $('detailSummary');
            sum.innerHTML = '';
            const staff = task.staff ?? 1, minutes = task.minutes ?? 0;
            const labour = document.createElement('div');
            labour.className = 'summary-line';
            labour.textContent = `👥 ${staff} · ⏱ ${minutes}m · ≈ ${((staff * minutes) / 60).toFixed(1)} h labour`;
            sum.appendChild(labour);
            const rec = document.createElement('div');
            rec.className = 'summary-line';
            rec.textContent = `🔁 ${describeRecurrence(task) || 'Never'}`;
            sum.appendChild(rec);

            renderStepsList(task);
        }

        function makeStepRow(task, index) {
            const steps = task.steps;
            const n = index + 1; // pictures are positionally bound (1-based)

            const row = document.createElement('div');
            row.className = 'step-row';

            const top = document.createElement('div');
            top.className = 'step-top';

            const num = document.createElement('span');
            num.className = 'step-num';
            num.textContent = n;
            top.appendChild(num);

            const text = document.createElement('span');
            text.className = 'step-text' + (steps[index].text ? '' : ' placeholder');
            text.textContent = steps[index].text || '(tap to add instruction)';
            text.addEventListener('click', () => beginStepEdit(row, task, index));
            top.appendChild(text);

            const actions = document.createElement('div');
            actions.className = 'step-actions';
            const mkBtn = (label, title, disabled, danger, fn) => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'step-btn' + (danger ? ' danger' : '');
                b.textContent = label;
                b.title = title;
                b.disabled = disabled;
                b.addEventListener('click', fn);
                actions.appendChild(b);
            };
            const bid = detailBuildingId, code = task.code;
            mkBtn('▲', 'Move step up', index === 0, false, () => moveStep(bid, code, index, -1));
            mkBtn('▼', 'Move step down', index === steps.length - 1, false, () => moveStep(bid, code, index, +1));
            mkBtn('🗑', 'Delete step', false, true, () => deleteStep(bid, code, index));
            top.appendChild(actions);

            row.appendChild(top);
            row.appendChild(makeStepImageWrap(task.code, n));
            return row;
        }

        // Tap-to-edit: swap the text span for an input; commit on Enter/blur, discard on Escape.
        function beginStepEdit(rowEl, task, index) {
            if (rowEl.querySelector('.step-text-input')) return;
            const textEl = rowEl.querySelector('.step-text');
            if (!textEl) return;

            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'step-text-input';
            input.value = task.steps[index].text || '';
            input.placeholder = 'Step instruction…';

            const bid = detailBuildingId, code = task.code;
            let done = false;
            const finish = (commit) => {
                if (done) return;
                done = true;
                if (commit) {
                    const v = input.value.trim();
                    // Look the task up again: a live DB update while typing replaced the `task` captured above
                    const step = (DB.dailyBuildings[bid]?.tasks || []).find(t => t.code === code)?.steps?.[index];
                    if (!step) showToast('Step not saved — the task was changed elsewhere');
                    else if (v !== (step.text || '')) {
                        step.text = v;
                        notifySitkaTools(); // step mutation → sync
                        showToast(v ? 'Step updated' : 'Step text cleared');
                    }
                }
                renderDetail();
            };
            input.addEventListener('blur', () => finish(true));
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                else if (e.key === 'Escape') finish(false);
            });

            textEl.replaceWith(input);
            input.focus();
        }

        function renderStepsList(task) {
            const list = $('stepsList');
            list.innerHTML = '';
            const steps = task.steps || [];
            steps.forEach((s, i) => list.appendChild(makeStepRow(task, i)));
            if (!steps.length) list.appendChild(mutedLine('No steps yet — add the first one below.'));

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'btn btn-secondary';
            addBtn.style.minHeight = '48px';
            addBtn.textContent = '+ Add Step';
            const bid = detailBuildingId, code = task.code;
            addBtn.addEventListener('click', () => {
                const cur = findStepTask(bid, code);
                if (!cur) { renderDetail(); return; } // task gone (changed elsewhere) — the view closes
                cur.steps = cur.steps || [];
                cur.steps.push({ text: '' });
                notifySitkaTools();
                renderDetail();
                const rows = document.querySelectorAll('#stepsList .step-row');
                const last = rows[rows.length - 1];
                if (last) beginStepEdit(last, cur, cur.steps.length - 1);
            });
            list.appendChild(addBtn);
        }

        // Step buttons look their task up again by building + code when tapped: while a step's text
        // is being typed, a live DB update doesn't re-render this view (syncOpenDetail), so the task
        // it was drawn from may no longer be the one in DB.data.
        function findStepTask(bid, code) {
            return (DB.dailyBuildings[bid]?.tasks || []).find(t => t.code === code) || null;
        }

        function moveStep(bid, code, index, dir) {
            const steps = findStepTask(bid, code)?.steps || [];
            const j = index + dir;
            if (index >= steps.length || j < 0 || j >= steps.length) { renderDetail(); return; }
            [steps[index], steps[j]] = [steps[j], steps[index]];
            notifySitkaTools(); // pictures are positionally bound — they follow the step
            renderDetail();
        }

        function deleteStep(bid, code, index) {
            const task = findStepTask(bid, code);
            if (!task?.steps?.[index]) { renderDetail(); return; } // task or step gone (changed elsewhere)
            task.steps.splice(index, 1);
            notifySitkaTools();
            renderDetail();
            showToast('Step deleted');
        }

        // 🔄 Refresh images: clear this task's probe cache and re-probe with a
        // cache-busting query string (picks up pictures added since first load).
        function refreshStepImages() {
            const task = getDetailTask();
            if (!task) return;
            const steps = task.steps || [];
            if (!steps.length) { showToast('No steps to refresh'); return; }
            for (const k of Object.keys(stepImageCache)) if (k.startsWith(task.code + '_')) delete stepImageCache[k];
            let remaining = steps.length;
            steps.forEach((s, i) => {
                probeStepImage(task.code, i + 1, true, () => {
                    remaining--;
                    if (remaining === 0 && $('detailOverlay').classList.contains('open') && getDetailTask()?.code === task.code) {
                        renderDetail();
                        showToast('Step pictures refreshed');
                    }
                });
            });
        }

        function deleteCurrentTask() {
            const task = getDetailTask();
            if (!task) return;
            if (!confirm(`Delete task "${task.name}" (${task.code})?\nThis removes it from _DailyWizard.`)) return;
            const tasks = DB.dailyBuildings[detailBuildingId]?.tasks || [];
            const i = tasks.findIndex(t => t.code === detailTaskCode);
            if (i !== -1) tasks.splice(i, 1);
            for (const k of Object.keys(stepImageCache)) if (k.startsWith(task.code + '_')) delete stepImageCache[k];
            notifySitkaTools(); // definition mutation → sync
            closeTaskDetail();
            renderAll();
            showToast('Task deleted');
        }

        // ---- ⏱ Hours on chores and on crop / equipment tasks (ROADMAP Phase 1 "Labour in DailyWizard") ----
        // Staff log who worked on a row, for how long, and sign it with drawn initials, on the day.
        //  • Chores: stored with the building's task list, so they save in that building's own file:
        //      _DailyWizard.buildings[<id>].labour[<YYYY-MM-DD>][<task code>] = [entry, …]
        //  • Crop (CropLabourWizard) and equipment (EquipmentWizard) tasks: added to the event's own labour_map —
        //      calendarEvents[].labour_map[<YYYY-MM-DD>] = [entry, …] — the field EmployeeWizard's Tasks tab edits and
        //      the Reports read. It's a floor field, so a building device's entries save in its own file as an
        //      overlay (SitkaTools DbSplit).
        //   entry = { employee | temp (+ wage when typed), hours, initials: { name, strokes }, at, by }
        // A building device can remove an entry it logged today (a same-day correction). After that only the office
        // can, and the removed entry is kept on record in the building's adjustments log
        // (_DailyWizard.buildings[<id>].adjustments), so the hours themselves stay clean for every tool that reads them.
        // Check-offs stay session-only, as before.
        const HOURS_TOOLS = ['CropLabourWizard', 'EquipmentWizard'];
        let hoursCtx = null;   // { kind: 'chore' | 'event', buildingId, date, code | eventId } while the hours view is open
        let padStrokes = [];   // the initials being drawn: [[x, y, x, y, …], …], normalized 0–1

        const ctxEvent = ctx => ctx?.kind === 'event' ? DB.calendarEvents.find(e => e.id === ctx.eventId) || null : null;
        const ctxTask = ctx => ctx?.kind === 'chore' ? (DB.dailyBuildings[ctx.buildingId]?.tasks || []).find(t => t.code === ctx.code) || null : null;
        // The live entry list for a row and day; create = make the path when it's missing
        function ctxEntries(ctx, create = false) {
            if (ctx.kind === 'event') {
                const ev = ctxEvent(ctx);
                if (!ev) return [];
                if (!create) return Array.isArray(ev.labour_map?.[ctx.date]) ? ev.labour_map[ctx.date] : [];
                if (!ev.labour_map) ev.labour_map = {};
                return ev.labour_map[ctx.date] || (ev.labour_map[ctx.date] = []);
            }
            const b = DB.dailyBuildings[ctx.buildingId];
            if (!create) return b?.labour?.[ctx.date]?.[ctx.code] || [];
            const day = (b.labour || (b.labour = {}))[ctx.date] || (b.labour[ctx.date] = {});
            return day[ctx.code] || (day[ctx.code] = []);
        }
        // Drop the containers a removal left empty
        function ctxTidy(ctx) {
            if (ctx.kind === 'event') {
                const ev = ctxEvent(ctx);
                if (ev?.labour_map && !(ev.labour_map[ctx.date] || []).length) {
                    delete ev.labour_map[ctx.date];
                    if (!Object.keys(ev.labour_map).length) delete ev.labour_map;
                }
                return;
            }
            const labour = DB.dailyBuildings[ctx.buildingId]?.labour;
            if (!labour?.[ctx.date]) return;
            if (!(labour[ctx.date][ctx.code] || []).length) delete labour[ctx.date][ctx.code];
            if (!Object.keys(labour[ctx.date]).length) delete labour[ctx.date];
        }
        // Office removals on record for this row and day
        const ctxRemoved = ctx => (DB.dailyBuildings[ctx.buildingId]?.adjustments || [])
            .filter(a => a.entry && a.date === ctx.date && (ctx.kind === 'event' ? a.eventId === ctx.eventId : a.code === ctx.code));
        const liveHours = list => list.filter(e => e && !e.removedAt).reduce((s, e) => s + (Number(e.hours) || 0), 0);
        function fmtHoursShort(h) { const t = Math.round(h * 60), hh = Math.floor(t / 60), mm = t % 60; return hh ? (mm ? `${hh}h ${mm}m` : `${hh}h`) : `${mm}m`; }
        // Every entry carries an id, so the office's and a building's hours merge entry by entry (SitkaTools)
        function newLabourId() {
            const bytes = crypto.getRandomValues(new Uint8Array(10));
            return 'le_' + Array.from(bytes, b => CODE_ALPHABET[b % CODE_ALPHABET.length]).join('');
        }
        function rosterNames() { return Object.keys(DB.data?._EmployeeWizard?.employees || {}).sort((a, b) => a.localeCompare(b)); }
        const loggedToday = e => !!e?.at && dateToStr(new Date(e.at)) === todayStr();
        // Office: any entry. Building device: an entry it logged itself, today.
        const canRemoveEntry = e => !e.removedAt && (!DeviceView.building || (loggedToday(e) && (!e.by || e.by === DeviceView.building)));

        function makeHoursButton(ctx) {
            const h = liveHours(ctxEntries(ctx));
            const future = ctx.date > todayStr();
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'hours-btn' + (h > 0 ? ' logged' : '');
            btn.textContent = h > 0 ? `⏱ ${fmtHoursShort(h)}` : '⏱ Log';
            btn.title = future ? 'Hours can only be logged for today or earlier' : h > 0 ? 'Hours logged on this — tap to review or add' : 'Log who worked on this and for how long';
            btn.disabled = future;
            btn.addEventListener('click', (e) => { e.stopPropagation(); openHours(ctx); });
            return btn;
        }

        function openHours(ctx) {
            if (ctx.date > todayStr() || !(ctx.kind === 'chore' ? ctxTask(ctx) : ctxEvent(ctx))) return;
            hoursCtx = { ...ctx };
            const who = $('hoursWho');
            who.innerHTML = '';
            const add = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; who.appendChild(o); };
            add('', '— Pick your name —');
            for (const n of rosterNames()) add(n, n);
            add('__other', 'Someone else (not on the roster)…');
            for (const id of ['hoursOther', 'hoursWage']) { $(id).value = ''; $(id).hidden = true; }
            $('hoursH').value = '';
            $('hoursM').value = '';
            padStrokes = [];
            renderHours();
            $('hoursOverlay').classList.add('open');
            sizePad();
        }

        function closeHours() {
            $('hoursOverlay').classList.remove('open');
            hoursCtx = null;
            padStrokes = [];
        }

        function renderHours() {
            if (!hoursCtx) return;
            const ctx = hoursCtx;
            let title, est;
            if (ctx.kind === 'chore') {
                const task = ctxTask(ctx);
                if (!task) { closeHours(); return; }
                title = `${task.emoji || '📋'} ${task.name}`;
                est = { staff: task.staff ?? 1, minutes: task.minutes ?? 0 };
            } else {
                const ev = ctxEvent(ctx);
                if (!ev) { closeHours(); return; }
                const { emoji, text } = eventEmojiAndText(ev.title);
                title = `${emoji} ${text || ev.title || 'Task'}`;
                est = eventEstimate(ev);
            }
            $('hoursTitle').textContent = `⏱ ${title}`;
            $('hoursSub').textContent = `${DB.buildings[ctx.buildingId]?.name || ctx.buildingId} · ${shortDate(ctx.date)}${ctx.date === todayStr() ? ' (today)' : ''} · ` +
                (est ? `estimate 👥 ${est.staff} × ${fmtMinutes(est.minutes)}` : 'no estimate') +
                (ctx.kind === 'event' ? ' · these hours also show in the Labour & Cost Wizard’s Tasks tab' : '');
            const list = $('hoursList');
            list.innerHTML = '';
            const entries = ctxEntries(ctx), removed = ctxRemoved(ctx);
            if (!entries.length && !removed.length) list.appendChild(mutedLine('No hours logged for this day yet.'));
            entries.forEach((e, i) => list.appendChild(makeHoursEntry(e, i, null)));
            removed.forEach(a => list.appendChild(makeHoursEntry(a.entry || {}, -1, a)));
            const total = liveHours(entries);
            $('hoursTotal').textContent = total > 0 ? `Total ${fmtHoursShort(total)}${est ? ` · estimate ${fmtHoursShort(est.staff * est.minutes / 60)}` : ''}` : '';
            $('hoursNote').textContent = DeviceView.building
                ? 'You can remove an entry on the day you logged it. After that, ask the office.'
                : 'Office: an entry removed after its day is kept on record.';
        }

        // One entry; `removal` is its record in the adjustments log when the office removed it
        function makeHoursEntry(e, index, removal) {
            const row = document.createElement('div');
            row.className = 'hours-entry' + (removal || e.removedAt ? ' removed' : '');
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = `${e.employee || e.temp || '?'}${e.temp != null ? ' (not on roster)' : ''}`;
            const hrs = document.createElement('span');
            hrs.className = 'hrs';
            hrs.textContent = fmtHoursShort(Number(e.hours) || 0);
            row.append(who, hrs);
            if (e.initials?.strokes?.length) row.appendChild(initialsSvg(e.initials));
            if (!removal && index >= 0 && canRemoveEntry(e)) {
                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'hours-del';
                del.textContent = '✕';
                del.title = 'Remove this entry';
                del.addEventListener('click', () => removeHours(index));
                row.appendChild(del);
            }
            const when = document.createElement('span');
            when.className = 'when';
            const stamp = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
            const parts = [e.at ? `Logged ${stamp(e.at)}` : 'Entered in the Labour & Cost Wizard'];
            if (e.editedAt) parts.push(`signed for ${fmtHoursShort(Number(e.signedHours) || 0)}, changed in the Labour & Cost Wizard ${stamp(e.editedAt)}`);
            const gone = removal?.at || e.removedAt;
            if (gone) parts.push(`removed by the office ${stamp(gone)}`);
            when.textContent = parts.join(' · ');
            row.appendChild(when);
            return row;
        }

        function initialsSvg(ini) {
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('viewBox', '0 0 100 30');
            svg.setAttribute('preserveAspectRatio', 'none');
            svg.setAttribute('role', 'img');
            svg.setAttribute('aria-label', `Initials of ${ini?.name || 'unknown'}`);
            for (const st of ini?.strokes || []) {
                const pts = [];
                for (let i = 0; i + 1 < st.length; i += 2) pts.push(`${(st[i] * 100).toFixed(1)},${(st[i + 1] * 30).toFixed(1)}`);
                if (pts.length === 1) pts.push(pts[0]);
                const pl = document.createElementNS(ns, 'polyline');
                pl.setAttribute('points', pts.join(' '));
                pl.setAttribute('fill', 'none');
                pl.setAttribute('stroke', '#111');
                pl.setAttribute('stroke-width', '2');
                pl.setAttribute('stroke-linecap', 'round');
                pl.setAttribute('stroke-linejoin', 'round');
                pl.setAttribute('vector-effect', 'non-scaling-stroke');
                svg.appendChild(pl);
            }
            return svg;
        }

        // Initials pads: pointer strokes, stored normalized (0–1) so they draw at any size. Two pads — the hours
        // view's ('hoursPad' → padStrokes) and the Mark done sign-off's ('donePad' → doneStrokes).
        const padStrokesOf = id => id === 'donePad' ? doneStrokes : padStrokes;
        function sizePad(id = 'hoursPad') {
            const c = $(id), r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
            c.width = Math.max(1, Math.round(r.width * dpr));
            c.height = Math.max(1, Math.round(r.height * dpr));
            drawPad(id);
        }
        function drawPad(id = 'hoursPad') {
            const c = $(id), ctx = c.getContext('2d'), dpr = window.devicePixelRatio || 1;
            ctx.clearRect(0, 0, c.width, c.height);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2.5 * dpr;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            for (const st of padStrokesOf(id)) {
                if (st.length < 2) continue;
                ctx.beginPath();
                ctx.moveTo(st[0] * c.width, st[1] * c.height);
                for (let i = 2; i + 1 < st.length; i += 2) ctx.lineTo(st[i] * c.width, st[i + 1] * c.height);
                if (st.length === 2) ctx.lineTo(st[0] * c.width + 0.5, st[1] * c.height + 0.5);
                ctx.stroke();
            }
        }
        function wirePad(id = 'hoursPad') {
            const c = $(id);
            let stroke = null;
            const at = (e) => {
                const r = c.getBoundingClientRect();
                return [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))];
            };
            c.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                try { c.setPointerCapture(e.pointerId); } catch (_) { /* older browsers */ }
                const [x, y] = at(e);
                stroke = [+x.toFixed(3), +y.toFixed(3)];
                padStrokesOf(id).push(stroke);
                drawPad(id);
            });
            c.addEventListener('pointermove', (e) => {
                if (!stroke) return;
                const [x, y] = at(e);
                if (Math.hypot(x - stroke[stroke.length - 2], y - stroke[stroke.length - 1]) < 0.006) return;   // keep strokes small
                stroke.push(+x.toFixed(3), +y.toFixed(3));
                drawPad(id);
            });
            const end = () => { stroke = null; };
            c.addEventListener('pointerup', end);
            c.addEventListener('pointercancel', end);
        }

        function addHours() {
            if (!hoursCtx) return;
            const ctx = hoursCtx;
            const whoVal = $('hoursWho').value, isTemp = whoVal === '__other';
            const name = isTemp ? $('hoursOther').value.trim() : whoVal;
            if (!name) { showToast(isTemp ? 'Type the name of who worked on it' : 'Pick who worked on it'); return; }
            const h = Math.max(0, parseInt($('hoursH').value, 10) || 0), m = Math.max(0, parseInt($('hoursM').value, 10) || 0);
            const hours = h + m / 60;
            if (hours <= 0) { showToast('Enter the hours and minutes worked'); return; }
            if (hours > 16) { showToast('That’s more than 16 hours — check the entry'); return; }
            if (!padStrokes.length) { showToast('Draw your initials to sign the entry'); return; }
            const wage = isTemp ? parseFloat($('hoursWage').value) : NaN;
            if (ctx.kind === 'chore' && !DB.ensureStructure()._DailyWizard.buildings[ctx.buildingId]) return;
            ctxEntries(ctx, true).push({
                id: newLabourId(),
                ...(isTemp ? { temp: name, ...(wage > 0 ? { wage: Math.round(wage * 100) / 100 } : {}) } : { employee: name }),
                hours: Math.round(hours * 1000) / 1000,
                initials: { name, strokes: padStrokes.map(st => st.slice()) },
                at: new Date().toISOString(),
                by: DeviceView.building || 'office'
            });
            notifySitkaTools();
            $('hoursWho').value = '';
            for (const id of ['hoursOther', 'hoursWage']) { $(id).value = ''; $(id).hidden = true; }
            $('hoursH').value = '';
            $('hoursM').value = '';
            padStrokes = [];
            drawPad();
            renderHours();
            renderAll();
            showToast(`Logged ${fmtHoursShort(hours)} for ${name}`);
        }

        function removeHours(index) {
            if (!hoursCtx) return;
            const ctx = hoursCtx;
            const list = ctxEntries(ctx);
            const e = list[index];
            if (!e || !canRemoveEntry(e)) return;
            if (!confirm(`Remove ${fmtHoursShort(Number(e.hours) || 0)} logged by ${e.employee || e.temp}?`)) return;
            const sameDay = loggedToday(e);
            list.splice(index, 1);
            if (!sameDay) {
                // A later office correction stays on record (with the building, in its own file)
                const buildings = DB.ensureStructure()._DailyWizard.buildings;
                const b = buildings[ctx.buildingId] || (buildings[ctx.buildingId] = { tasks: [] });
                (b.adjustments || (b.adjustments = [])).push({
                    at: new Date().toISOString(), by: DeviceView.building || 'office', date: ctx.date,
                    ...(ctx.kind === 'event' ? { eventId: ctx.eventId, title: ctxEvent(ctx)?.title || '' } : { code: ctx.code }),
                    entry: e
                });
            }
            ctxTidy(ctx);
            notifySitkaTools();
            renderHours();
            renderAll();
            showToast(sameDay ? 'Entry removed' : 'Entry removed — kept on record as an office adjustment');
        }

        // ---- ✅ Mark done — the floor manager signs a crop / equipment task off as done ----
        // Sets the event's `completed` (the field SitkaTools' event panel and EmployeeWizard's Tasks tab also set)
        // and records the sign-off next to it:
        //   completedBy = { name, initials: { name, strokes }, at, by, day }
        // Both are floor fields, so a building device saves them in its own file (SitkaTools DbSplit). The floor
        // managers are the roster employees ticked "Floor manager" in EmployeeWizard (everyone when none is).
        // Reopening follows the hours rules: a building device may reopen a sign-off it made today; the office any,
        // and one reopened after its day is kept on record in the building's adjustments log.
        let doneCtx = null;     // { eventId, buildingId } while the Mark done view is open
        let doneStrokes = [];   // the floor manager's initials being drawn
        const doneEvent = () => doneCtx ? DB.calendarEvents.find(e => e.id === doneCtx.eventId) || null : null;
        const deviceName = by => by === 'office' ? 'the office' : `the ${DB.buildings[by]?.name || by} device`;
        const doneStamp = iso => new Date(iso).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });

        function floorManagers() {
            const emps = DB.data?._EmployeeWizard?.employees || {};
            const flagged = Object.keys(emps).filter(n => emps[n]?.floorManager === true).sort((a, b) => a.localeCompare(b));
            return flagged.length ? { names: flagged, everyone: false } : { names: rosterNames(), everyone: true };
        }
        const canReopen = ev => !DeviceView.building ||
            (!!ev.completedBy?.at && dateToStr(new Date(ev.completedBy.at)) === todayStr() && ev.completedBy.by === DeviceView.building);

        function makeDoneButton(ev, buildingId) {
            const done = ev.completed === true, sign = ev.completedBy;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'done-btn' + (done ? ' done' : '');
            btn.textContent = done ? '✅ Done' : '✍️ Mark done';
            btn.title = done ? (sign?.name ? `Signed off by ${sign.name}${sign.at ? ', ' + doneStamp(sign.at) : ''}` : 'Marked done in SitkaTools or the Labour & Cost Wizard (not signed)')
                : 'Floor manager: sign this task off as done';
            btn.disabled = !done && selectedDateStr() > todayStr();
            btn.addEventListener('click', (e) => { e.stopPropagation(); openDone(ev.id, buildingId); });
            return btn;
        }

        function openDone(eventId, buildingId) {
            if (!DB.calendarEvents.some(e => e.id === eventId)) return;
            doneCtx = { eventId, buildingId };
            doneStrokes = [];
            const fm = floorManagers();
            const who = $('doneWho');
            who.innerHTML = '';
            const add = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; who.appendChild(o); };
            add('', '— Pick the floor manager —');
            for (const n of fm.names) add(n, n);
            $('doneWhoNote').textContent = fm.everyone ? 'No floor managers are set yet (Labour & Cost Wizard → employee → Floor manager), so everyone on the roster is listed.' : '';
            renderDone();
            $('doneOverlay').classList.add('open');
            sizePad('donePad');
        }

        function closeDone() {
            $('doneOverlay').classList.remove('open');
            doneCtx = null;
            doneStrokes = [];
        }

        function renderDone() {
            const ev = doneEvent();
            if (!ev) { if (doneCtx) closeDone(); return; }
            const { emoji, text } = eventEmojiAndText(ev.title);
            $('doneTitle').textContent = `✅ ${emoji} ${text || ev.title || 'Task'}`;
            const due = ev.endDate && ev.endDate !== ev.date ? `${shortDate(ev.date)} – ${shortDate(ev.endDate)}` : shortDate(ev.date);
            $('doneSub').textContent = `${DB.buildings[doneCtx.buildingId]?.name || doneCtx.buildingId} · due ${due}`;
            const status = $('doneStatus');
            status.innerHTML = '';
            const done = ev.completed === true;
            $('doneForm').hidden = done;
            $('doneBtn').hidden = done;
            if (!done) {
                status.appendChild(mutedLine('Not done yet. The floor manager picks their name and draws their initials to sign it off.'));
                $('doneNote').textContent = 'Signing it off takes it off ⏰ Still open. Hours can still be logged on it.';
                return;
            }
            const sign = ev.completedBy;
            const row = document.createElement('div');
            row.className = 'hours-entry';
            const who = document.createElement('span');
            who.className = 'who';
            who.textContent = sign?.name ? `✅ Signed off by ${sign.name}` : '✅ Marked done in SitkaTools or the Labour & Cost Wizard';
            row.appendChild(who);
            if (sign?.initials?.strokes?.length) row.appendChild(initialsSvg(sign.initials));
            if (canReopen(ev)) {
                const reopen = document.createElement('button');
                reopen.type = 'button';
                reopen.className = 'btn btn-secondary';
                reopen.id = 'doneReopenBtn';
                reopen.textContent = 'Reopen';
                reopen.addEventListener('click', reopenDone);
                row.appendChild(reopen);
            }
            const when = document.createElement('span');
            when.className = 'when';
            when.textContent = sign?.at ? `${doneStamp(sign.at)} on ${deviceName(sign.by)}` : 'Not signed';
            row.appendChild(when);
            status.appendChild(row);
            $('doneNote').textContent = DeviceView.building
                ? 'You can reopen a sign-off on the day it was made. After that, ask the office.'
                : 'Office: a sign-off reopened after its day is kept on record.';
        }

        function markDone() {
            const ev = doneEvent();
            if (!ev || ev.completed === true || selectedDateStr() > todayStr()) return;
            const name = $('doneWho').value;
            if (!name) { showToast('Pick the floor manager'); return; }
            if (!doneStrokes.length) { showToast('The floor manager draws their initials to sign it off'); return; }
            ev.completed = true;
            ev.completedBy = {
                name, initials: { name, strokes: doneStrokes.map(st => st.slice()) },
                at: new Date().toISOString(), by: DeviceView.building || 'office', day: selectedDateStr()
            };
            notifySitkaTools();
            closeDone();
            renderAll();
            showToast(`Marked done — signed off by ${name}`);
        }

        function reopenDone() {
            const ev = doneEvent();
            if (!ev || ev.completed !== true || !canReopen(ev)) return;
            const sign = ev.completedBy;
            const { text } = eventEmojiAndText(ev.title);
            if (!confirm(`Reopen “${text || ev.title || 'this task'}”?${sign?.name ? ` The sign-off by ${sign.name} is removed.` : ''}`)) return;
            const sameDay = !!sign?.at && dateToStr(new Date(sign.at)) === todayStr();
            ev.completed = false;
            delete ev.completedBy;
            if (!sameDay) {
                // A later office correction stays on record (with the building, in its own file)
                const buildings = DB.ensureStructure()._DailyWizard.buildings;
                const b = buildings[doneCtx.buildingId] || (buildings[doneCtx.buildingId] = { tasks: [] });
                (b.adjustments || (b.adjustments = [])).push({
                    at: new Date().toISOString(), by: DeviceView.building || 'office', date: sign?.day || selectedDateStr(),
                    eventId: ev.id, title: ev.title || '', reopened: sign || null
                });
            }
            notifySitkaTools();
            renderDone();
            renderAll();
            showToast(sameDay ? 'Reopened' : 'Reopened — the sign-off is kept on record as an office adjustment');
        }

        // ---- Views ----

        function renderBuildingView(container, buildingId, dateStr) {
            const b = DB.buildings[buildingId];
            const allTasks = DB.dailyBuildings[buildingId]?.tasks || [];
            const tasks = allTasks.filter(t => taskOccursOn(t, dateStr));
            const events = eventsOnDate(dateStr).filter(ev => buildingForEvent(ev) === buildingId);

            // + Add Task bar (single-building mode only; editor lands in Stage 3)
            const addBar = document.createElement('div');
            addBar.className = 'add-task-bar';
            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'btn btn-primary';
            addBtn.textContent = '+ Add Task';
            addBtn.addEventListener('click', () => openTaskEditor(buildingId));
            addBar.appendChild(addBtn);
            container.appendChild(addBar);

            if (allTasks.length === 0) {
                container.appendChild(mutedLine(`No daily tasks defined for ${b?.name || buildingId} yet.`));
            } else if (tasks.length === 0) {
                container.appendChild(mutedLine('No daily tasks scheduled for this date.'));
            } else {
                tasks.forEach((t, i) => container.appendChild(makeTaskRow(buildingId, t, tasks[i - 1]?.code || null, tasks[i + 1]?.code || null, true)));
            }

            appendStillOpenSection(container, dateStr, buildingId);
            appendEventsSection(container, events);
            appendUpcomingSection(container, dateStr, buildingId);
        }

        function renderAllBuildings(container, dateStr) {
            const dayEvents = eventsOnDate(dateStr);

            for (const [bid, b] of Object.entries(DB.buildings)) {
                const section = document.createElement('div');
                section.className = 'building-section';

                const tasks = tasksForBuilding(bid, dateStr);
                const done = tasks.filter(t => isChecked(checkSpotForTask(bid, t.code), dateStr)).length;
                const events = dayEvents.filter(ev => buildingForEvent(ev) === bid);

                const header = document.createElement('div');
                header.className = 'building-section-header';
                const label = document.createElement('span');
                label.textContent = `🏢 ${b?.name || bid}`;
                const chip = document.createElement('span');
                chip.className = 'chip';
                chip.textContent = `✅ ${done}/${tasks.length}`;
                header.appendChild(label);
                header.appendChild(chip);
                section.appendChild(header);

                if (tasks.length === 0) {
                    section.appendChild(mutedLine('No daily tasks for this date.'));
                } else {
                    tasks.forEach(t => section.appendChild(makeTaskRow(bid, t, null, null, false)));
                }

                appendEventsSection(section, events);
                container.appendChild(section);
            }

            // 📌 Unassigned / General — unattributable events (never silently dropped)
            const unassigned = dayEvents.filter(ev => !buildingForEvent(ev));
            if (unassigned.length) {
                const section = document.createElement('div');
                section.className = 'building-section';
                const header = document.createElement('div');
                header.className = 'building-section-header muted';
                header.textContent = '📌 Unassigned / General';
                section.appendChild(header);
                for (const ev of unassigned) section.appendChild(makeEventRow(ev));
                container.appendChild(section);
            }

            // Upcoming — next calendar events across all buildings (incl. unassigned)
            appendUpcomingSection(container, dateStr, 'ALL');
        }

        function renderList() {
            const container = $('listContainer');
            container.innerHTML = '';

            if (!dbLoaded) {
                // Empty state: no DB loaded
                const div = document.createElement('div');
                div.className = 'empty-state';
                div.innerHTML = `
                    <div class="empty-icon">📂</div>
                    <div class="empty-title">No database loaded</div>
                    <div class="empty-sub">Waiting for SitkaTools to deliver the database…</div>
                `;
                container.appendChild(div);
                return;
            }

            const dateStr = selectedDateStr();
            const sel = $('buildingSelect').value;
            if (sel === 'ALL') renderAllBuildings(container, dateStr);
            else renderBuildingView(container, sel, dateStr);
        }

        function renderAll() {
            populateBuildingSelector();
            updateStatusBar();
            renderList();
        }

        // ---- Init ----
        function init() {
            autoDate = todayStr();
            $('dateInput').value = autoDate;

            $('buildingSelect').addEventListener('change', renderAll);
            $('dateInput').addEventListener('change', renderAll);
            // Move to the new day past midnight: tab shown again, window focused, or once a minute
            document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') rollToToday(); });
            window.addEventListener('focus', rollToToday);
            setInterval(rollToToday, 60000);
            $('resetDayBtn').addEventListener('click', resetDay);
            $('closeToolBtn').addEventListener('click', () => window.close());

            // Task editor + emoji picker
            $('emojiCurrentBtn').addEventListener('click', () => {
                const panel = $('emojiPanel');
                if (panel.style.display === 'none') openEmojiPanel(); else closeEmojiPanel();
            });
            $('emojiSearch').addEventListener('input', renderEmojiGrid);
            $('editorBackBtn').addEventListener('click', closeTaskEditor);
            $('editorCancelBtn').addEventListener('click', closeTaskEditor);
            $('editorSaveBtn').addEventListener('click', saveTaskFromEditor);
            document.querySelectorAll('#monthDayPresets .chip-btn').forEach(b => {
                b.addEventListener('click', () => { $('monthDaysInput').value = b.dataset.preset; });
            });
            // Click outside the picker closes the panel. composedPath() is used instead of
            // contains(e.target) because a handler may remove the clicked element from the
            // DOM mid-dispatch (e.g., tab rebuild), which would break contains().
            document.addEventListener('click', (e) => {
                if (!e.composedPath().includes($('emojiPicker'))) closeEmojiPanel();
            });

            // Task detail view + step pictures
            $('detailBackBtn').addEventListener('click', closeTaskDetail);
            $('editTaskBtn').addEventListener('click', () => {
                const bid = detailBuildingId, code = detailTaskCode;
                closeTaskDetail();
                openTaskEditor(bid, code); // pre-filled edit mode (Stage 3)
            });
            $('deleteTaskBtn').addEventListener('click', deleteCurrentTask);
            $('refreshImagesBtn').addEventListener('click', refreshStepImages);

            // ⏱ Hours on chores
            wirePad();
            $('hoursBackBtn').addEventListener('click', closeHours);
            $('hoursAddBtn').addEventListener('click', addHours);
            $('hoursPadClear').addEventListener('click', () => { padStrokes = []; drawPad(); });
            $('hoursWho').addEventListener('change', () => {
                const other = $('hoursWho').value === '__other';
                $('hoursOther').hidden = !other;
                $('hoursWage').hidden = !other;
                if (other) $('hoursOther').focus();
            });
            window.addEventListener('resize', () => { if (hoursCtx) sizePad(); });

            // ✅ Mark done
            wirePad('donePad');
            $('doneBackBtn').addEventListener('click', closeDone);
            $('doneBtn').addEventListener('click', markDone);
            $('donePadClear').addEventListener('click', () => { doneStrokes = []; drawPad('donePad'); });
            window.addEventListener('resize', () => { if (doneCtx) sizePad('donePad'); });

            renderAll();
        }

        init();
    </script>
</body>
</html>
