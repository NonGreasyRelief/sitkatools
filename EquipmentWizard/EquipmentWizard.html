<!-- EquipmentWizard.html — Cyclical equipment maintenance scheduler for SitkaGit suite -->
<!-- Tool: EquipmentWizard | Purpose: Auto-populate calendar with recurring maintenance events per room -->
<!-- Database Keys: "_EquipmentWizard" (top-level), "calendarEvents" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Wizard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #53d8a8;
            --accent-hover: #3fb98b;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8b8;
            --border: #2a2a4a;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --warning: #f39c12;
            --input-bg: #1a1a3e;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 24px; }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .header-right { display: flex; gap: 8px; align-items: flex-end; }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        /* ---- Status Bar ---- */
        .status-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-bar.loaded { border-color: var(--accent); }

        .status-badge {
            background: var(--bg-card);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent);
        }

        /* ---- Card ---- */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
        }

        /* ---- Form ---- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group { flex: 1; }

        /* ---- Buttons ---- */
        .btn {
            padding: 10px 24px;
            border-radius: var(--radius);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { border-color: var(--text-secondary); }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover { background: var(--danger-hover); }

        .btn-small {
            padding: 6px 14px;
            font-size: 0.8rem;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        /* ---- Equipment List ---- */
        .equipment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .equipment-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .equipment-item:hover { border-color: var(--accent); }

        .equipment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .equipment-header:hover { background: rgba(83, 216, 168, 0.05); }

        .equipment-emoji {
            font-size: 1.3rem;
            flex-shrink: 0;
            width: 32px;
            text-align: center;
        }

        .equipment-info {
            flex: 1;
            min-width: 0;
        }

        .equipment-name {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .equipment-type-badge {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .equipment-details {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .power-edit { margin-bottom: 14px; }

        .equipment-task-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .equipment-delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .equipment-item:hover .equipment-delete-btn { opacity: 1; }
        .equipment-delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        /* ---- Sub-tasks (expandable section within equipment) ---- */
        .equipment-body {
            display: none;
            border-top: 1px solid var(--border);
            padding: 16px;
        }

        .equipment-body.open { display: block; }

        .subtask-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .subtask-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subtask-emoji {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .subtask-info {
            flex: 1;
            min-width: 0;
        }

        .subtask-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .subtask-interval {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .subtask-start {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .subtask-edit-btn {
            background: none;
            border: none;
            color: var(--warning);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .subtask-delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .subtask-item:hover .subtask-edit-btn { opacity: 1; }
        .subtask-item:hover .subtask-delete-btn { opacity: 1; }
        .subtask-edit-btn:hover { background: rgba(243, 156, 18, 0.2); }
        .subtask-delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        /* ---- Add Sub-task Form (inside equipment body) ---- */
        .add-subtask-form {
            background: var(--input-bg);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .add-subtask-form .form-group:last-child { margin-bottom: 0; }

        /* ---- Calendar Events Preview List ---- */
        .event-preview-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 360px;
            overflow-y: auto;
        }

        .event-preview-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .event-preview-date {
            font-size: 0.8rem;
            color: var(--accent);
            background: var(--input-bg);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 600;
        }

        .event-preview-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-preview-equipment {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* ---- Footer ---- */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        /* ---- Toast notification ---- */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 24px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Responsive Form Rows ---- */
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }

        /* ---- Empty State ---- */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ---- Section Divider ---- */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .section-divider span {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ---- Scrollbar Styling ---- */
        .event-preview-list::-webkit-scrollbar { width: 6px; }
        .event-preview-list::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 3px; }
        .event-preview-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .event-preview-list::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* ---- Emoji Picker Row ---- */
        .emoji-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .emoji-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            border: 2px solid transparent;
            background: var(--input-bg);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-btn:hover {
            background: var(--bg-card);
            border-color: var(--border);
        }

        .emoji-btn.selected {
            border-color: var(--accent);
            background: rgba(83, 216, 168, 0.15);
        }

        /* ---- Additional Maintenance Tracker ---- */
        .tracker-section {
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .tracker-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .tracker-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .tracker-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .tracker-date {
            font-size: 0.78rem;
            color: var(--warning);
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 600;
        }

        .tracker-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tracker-delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .tracker-item:hover .tracker-delete-btn { opacity: 1; }
        .tracker-delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        .add-tracker-form {
            background: var(--input-bg);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 12px;
        }

        .add-tracker-form .form-group:last-child { margin-bottom: 0; }

        .tracker-list::-webkit-scrollbar { width: 4px; }
        .tracker-list::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 2px; }
        .tracker-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>
    <!-- Header (room-focused tool — Active Room selector) -->
    <header class="header">
        <div class="header-left">
            <span class="logo">🔧 Equipment Wizard</span>
        </div>
        <div class="header-right">
            <div class="form-group">
                <label for="activeRoom">Active Room</label>
                <select id="activeRoom">
                    <option value="">— Select a room —</option>
                </select>
            </div>
        </div>
    </header>


    <!-- Main Content -->
    <main class="main">
        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">No database loaded. Open from SitkaTools.</span>
        </div>

        <!-- Add Equipment Form -->
        <div class="card">
            <h2 class="card-title">Add Equipment</h2>
            <form id="equipmentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="equipmentType">Equipment Type</label>
                        <select id="equipmentType">
                            <option value="">— Select type —</option>
                            <optgroup label="Dehumidifier">
                                <option value="Dehumidifier">Dehumidifier</option>
                            </optgroup>
                            <optgroup label="Air Conditioner">
                                <option value="Air Conditioner">Air Conditioner</option>
                            </optgroup>
                            <optgroup label="Plumbing">
                                <option value="Plumbing">Plumbing</option>
                            </optgroup>
                            <optgroup label="Irrigation">
                                <option value="Irrigation Layout">Irrigation Layout</option>
                                <option value="Dripper System">Dripper System</option>
                            </optgroup>
                            <optgroup label="Infrastructure">
                                <option value="Table">Table</option>
                                <option value="HVAC Unit">HVAC Unit</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="equipmentName">Equipment Name / Label</label>
                        <input type="text" id="equipmentName" placeholder="e.g., Dehumidifier #1, North Wall AC" required autocomplete="off">
                    </div>
                </div>
                <div id="dehumidifierFields" style="display:none;">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="equipmentSerial">Serial Number</label>
                            <input type="text" id="equipmentSerial" placeholder="e.g., SN-2024-00123" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="equipmentFilterSize">Filter Size</label>
                            <input type="text" id="equipmentFilterSize" placeholder="e.g., 12x12x1 in" autocomplete="off">
                        </div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="equipmentWatts">⚡ Power draw (watts)</label>
                        <input type="number" id="equipmentWatts" min="0" step="1" inputmode="numeric" placeholder="e.g., 1200 — for the power estimate">
                    </div>
                    <div class="form-group">
                        <label for="equipmentUnits">How many units</label>
                        <input type="number" id="equipmentUnits" min="1" step="1" inputmode="numeric" value="1">
                    </div>
                    <div class="form-group">
                        <label for="equipmentHours">Runs about (hours a day)</label>
                        <input type="number" id="equipmentHours" min="0" max="24" step="0.5" inputmode="decimal" value="12">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Equipment</button>
                </div>
            </form>
        </div>

        <!-- Equipment Inventory List -->
        <div class="card" id="equipmentListCard" style="display:none;">
            <h2 class="card-title">Equipment Inventory</h2>
            <div class="equipment-list" id="equipmentList"></div>
        </div>

        <!-- Calendar Events Preview (always visible) -->
        <div class="card" id="previewCard">
            <h2 class="card-title">Upcoming Maintenance Events <span id="previewCount" style="font-weight:400; font-size:0.85rem; color:var(--text-secondary);"></span></h2>
            <div class="event-preview-list" id="previewList"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div style="display:flex; gap:8px; align-items:center;">
            <button class="btn btn-secondary" id="closeToolBtn">Close Tool</button>
        </div>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // =====================================================
        // EquipmentWizard — Cyclical Equipment Maintenance Scheduler
        // Database Keys: "_EquipmentWizard" (top-level), "calendarEvents"
        // =====================================================

        // ---- Stable event IDs (ROADMAP 0.2) ----
        // Every calendar event carries a unique `id`. New events get a random id; events from files
        // saved before ids existed get one derived from their content, so every device that loads the
        // same file assigns the same id to the same event. (Function declarations only — these run from
        // ensureStructure() before later top-level consts are initialised.)
        function newEventId() {
            const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
            const bytes = crypto.getRandomValues(new Uint8Array(10));
            return 'ev_' + Array.from(bytes, b => alphabet[b % alphabet.length]).join('');
        }

        // cyrb53 — fast non-cryptographic 53-bit string hash
        function contentHash(str) {
            let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
            for (let i = 0; i < str.length; i++) {
                const ch = str.charCodeAt(i);
                h1 = Math.imul(h1 ^ ch, 2654435761);
                h2 = Math.imul(h2 ^ ch, 1597334677);
            }
            h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
            h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
            return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
        }

        // Keep existing ids; derive missing or duplicate ones from the event's content
        function ensureEventIds(events) {
            const used = new Set();
            for (const ev of events) {
                if (typeof ev.id === 'string' && ev.id && !used.has(ev.id)) {
                    used.add(ev.id);
                    continue;
                }
                const base = 'ev_' + contentHash([ev.sourceTool, ev.lotId, ev.roomId, ev.equipmentId,
                    ev.taskType, ev.date, ev.endDate, ev.title].join('|'));
                let id = base;
                for (let n = 2; used.has(id); n++) id = `${base}-${n}`;
                ev.id = id;
                used.add(id);
            }
        }

        // ---- Keep annotations across schedule regeneration (ROADMAP 0.3) ----
        // Regenerating rebuilds this tool's events from scratch. Fields added on top of a generated
        // event — its id, completion tick, EmployeeWizard labour hours, and the notes/time fields edited
        // in SitkaTools' event panel — are copied onto the matching replacement event.
        function eventAnnotationKeys() {
            return ['id', 'completed', 'completedBy', 'labour_map', 'startTime', 'endTime', 'notes', 'status', 'assignedTo', 'estimatedHours'];
        }

        // True when an event holds work records that regenerating it would destroy
        function hasWorkRecords(ev) {
            return ev.completed === true || (ev.labour_map && Object.keys(ev.labour_map).length > 0);
        }

        // Copy annotations from `previous` events onto `fresh` ones with the same keyOf(ev).
        // Returns the previous events that found no replacement.
        function carryOverAnnotations(previous, fresh, keyOf) {
            const byKey = new Map();
            for (const ev of previous) {
                const k = keyOf(ev);
                if (!byKey.has(k)) byKey.set(k, []);
                byKey.get(k).push(ev);
            }
            for (const ev of fresh) {
                const old = byKey.get(keyOf(ev))?.shift();
                if (!old) continue;
                for (const key of eventAnnotationKeys()) {
                    if (old[key] !== undefined) ev[key] = old[key];
                }
            }
            return [...byKey.values()].flat();
        }

        const DB = {
            data: null,

            get rooms() { return this.data?.rooms || {}; },

            ensureStructure() {
                if (!this.data) this.data = { lots: {}, rooms: {}, calendarEvents: [] };
                if (!this.data.lots) this.data.lots = {};
                if (!this.data.rooms) this.data.rooms = {};
                if (!this.data.calendarEvents) this.data.calendarEvents = [];
                ensureEventIds(this.data.calendarEvents);
                if (!this.data._EquipmentWizard) {
                    this.data._EquipmentWizard = { rooms: {} };
                }
                if (!this.data._EquipmentWizard.rooms || typeof this.data._EquipmentWizard.rooms !== 'object') this.data._EquipmentWizard.rooms = {};   // review G11
                return this.data;
            }
        };

        const $ = id => document.getElementById(id);
        // Names, serials, titles and dates are typed or come from the shared file: escaped into the page (review I2)
        const escapeHtml = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

        // ---- Utility: unique ID generator ----
        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        // ---- Utility: a Date as YYYY-MM-DD in local time (never UTC — after 4–5 pm in BC that's tomorrow) ----
        function localDateStr(d) {
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        // ---- Utility: today as YYYY-MM-DD ----
        function todayStr() {
            return localDateStr(new Date());
        }

        // ---- Utility: add months to a date string ----
        // Clamped to the target month's last day: Jan 31 + 1 month = Feb 28 (29), not Mar 3.
        function addMonths(dateStr, months) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const lastDay = new Date(y, m - 1 + months + 1, 0).getDate();
            return localDateStr(new Date(y, m - 1 + months, Math.min(d, lastDay)));
        }

        // ---- Utility: add days to a date string ----
        function addDays(dateStr, days) {
            const [y, m, d] = dateStr.split('-').map(Number);
            return localDateStr(new Date(y, m - 1, d + days));
        }

        // ---- postMessage Convention ----
        DB.ensureStructure();

        // ---- Building device view (root CLAUDE.md → "Building Device View") ----
        // SitkaTools sends `view: { building }` with the DB: the building's id on a building device, null on the
        // office (or with a single-file DB). A building device sees only its own building — the rooms in it and the
        // lots whose current room or flower room is in it — and only what it can save; office-only tools (schedules,
        // plans) don't run there at all. Display only: the DB keeps everything. Every tool has this same snippet
        // except OFFICE_ONLY. `var` (not const) so the message handlers can use it however early they run.
        var DeviceView = {
            OFFICE_ONLY: true,   // true: this whole tool is office work a building device couldn't save
            building: null,
            split: false,        // split files are open (Main + building files): only a building's own device saves its file
            // Take the view sent with a DB message. True when this tool is office-only and this is a building device.
            take(msg) {
                if (msg && Object.prototype.hasOwnProperty.call(msg, 'view')) { this.building = msg.view?.building || null; this.split = !!msg.view?.split; }
                if (!this.OFFICE_ONLY || !this.building) return false;
                this.showOfficeOnly(msg?.payload?.buildings?.[this.building]?.name || this.building);
                return true;
            },
            buildingOfRoomName(name) {
                const target = String(name || '').trim().toLowerCase();
                if (!target) return null;
                for (const room of Object.values(DB.data?.rooms || {})) {
                    if (room && String(room.name || '').trim().toLowerCase() === target) return room.buildingId || null;
                }
                return null;
            },
            lotVisible(lotId) {
                if (!this.building) return true;
                const lot = DB.data?.lots?.[lotId];
                return !!lot && (this.buildingOfRoomName(lot.currentRoom) === this.building || this.buildingOfRoomName(lot.destRoom) === this.building);
            },
            roomVisible(roomId) {
                return !this.building || DB.data?.rooms?.[roomId]?.buildingId === this.building;
            },
            showOfficeOnly(buildingName) {
                if (document.getElementById('officeOnlyCover')) return;
                const wrap = document.createElement('div');
                wrap.id = 'officeOnlyCover';
                wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10001; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; padding: 24px;';
                wrap.innerHTML = `
                    <div style="max-width: 440px; text-align: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 32px;">
                        <div style="font-size: 2.5rem; margin-bottom: 12px;">🏢</div>
                        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);">Office only</div>
                        <div style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;">
                            This tool is run from the office. This device is set up for <strong data-building></strong>.</div>
                        <button type="button" style="background: var(--accent); color: var(--bg-primary); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">Close Tool</button>
                    </div>`;
                wrap.querySelector('[data-building]').textContent = buildingName;
                wrap.querySelector('button').addEventListener('click', () => window.close());
                document.body.appendChild(wrap);
            }
        };

        // ---- Shared working copy (ROADMAP Phase 1 — tablets) ----
        // Every tool is served from the same site, so they share browser storage. SitkaTools keeps the open DB in
        // IndexedDB ('sitkatools' → 'work'). When this tool is opened as a plain tab (tablets, where the popup /
        // postMessage hand-off doesn't work) it loads the DB from there, writes its changes back, and every open
        // tab refreshes through a BroadcastChannel. Saving always happens in SitkaTools ("Go back to SitkaTools to
        // save" in the banner), and tools only run through SitkaTools — opened by themselves they say so.
        // `var` (not const) so notifySitkaTools() can check it safely however early it runs.
        var WorkCopy = {
            TOOL: 'EquipmentWizard',
            LIVE: true,          // this tool handles live 'sitkaGit_db_update' messages without a full reload
            inUse: false,            // the DB in this tab came from the shared copy
            gotDb: false,            // SitkaTools delivered the DB by postMessage
            channel: ('BroadcastChannel' in window) ? new BroadcastChannel('sitkatools-db') : null,
            _open() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('sitkatools', 3);
                    req.onupgradeneeded = () => {
                        for (const name of ['folders', 'settings', 'work']) {
                            if (!req.result.objectStoreNames.contains(name)) req.result.createObjectStore(name, { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            async read() {
                try {
                    const idb = await this._open();
                    const row = await new Promise((resolve, reject) => {
                        const r = idb.transaction('work', 'readonly').objectStore('work').get('current');
                        r.onsuccess = () => resolve(r.result);
                        r.onerror = () => reject(r.error);
                    });
                    idb.close();
                    const copy = row && row.value;
                    return copy && copy.db ? copy : null;   // however old: SitkaTools keeps an unsaved session until it's saved or discarded
                } catch (_) {
                    return null;
                }
            },
            async write(db) {
                try {
                    const idb = await this._open();
                    await new Promise((resolve, reject) => {
                        const tx = idb.transaction('work', 'readwrite');
                        const store = tx.objectStore('work');
                        const r = store.get('current');
                        r.onsuccess = () => {
                            const prev = (r.result && r.result.value) || {};
                            store.put({ key: 'current', value: { ...prev, db, at: Date.now(), unsaved: true, from: this.TOOL } });
                        };
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                    });
                    idb.close();
                    if (this.channel) this.channel.postMessage({ type: 'db-updated', from: this.TOOL });
                } catch (_) { /* storage unavailable — changes stay in this tab */ }
            },
            // Delete the copy unless it holds changes nobody has saved yet
            async forgetIfSaved() {
                try {
                    const idb = await this._open();
                    await new Promise((resolve, reject) => {
                        const tx = idb.transaction('work', 'readwrite');
                        const store = tx.objectStore('work');
                        const r = store.get('current');
                        r.onsuccess = () => { if (r.result && r.result.value && r.result.value.unsaved === false) store.delete('current'); };
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                    });
                    idb.close();
                } catch (_) { /* ignore */ }
            },
            // Hand the latest changes to SitkaTools, ask it to have the user save, and switch to its tab
            async goBackToSave() {
                await this.write(DB.data);
                if (this.channel) this.channel.postMessage({ type: 'save-request', from: this.TOOL });
                try { if (window.opener && !window.opener.closed) window.opener.focus(); } catch (_) { /* not allowed */ }
                setTimeout(() => {
                    if (document.visibilityState !== 'visible') return; // switched tabs
                    const msg = 'Switch to the SitkaTools tab — it is waiting for you to save.';
                    if (typeof showToast === 'function') showToast(msg);
                    else alert(msg);
                }, 600);
            },
            showOpenFromSitka() {
                const wrap = document.createElement('div');
                wrap.id = 'openFromSitka';
                wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10000; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; padding: 24px;';
                wrap.innerHTML = `
                    <div style="max-width: 440px; text-align: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 32px;">
                        <div style="font-size: 2.5rem; margin-bottom: 12px;">🌿</div>
                        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);">Open this tool from SitkaTools</div>
                        <div style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;">
                            Tools get their database from SitkaTools. Open SitkaTools, load your database, then open this tool from there.</div>
                        <a href="../SitkaTools/SitkaTools.html" style="display: inline-block; background: var(--accent); color: var(--bg-primary); padding: 12px 24px; border-radius: 8px; font-weight: 700; text-decoration: none;">Open SitkaTools</a>
                    </div>`;
                document.body.appendChild(wrap);
            },
            // Hand the DB (and the device view sent with it) to this tool's own "DB arrived from SitkaTools" message handler
            apply(db, initial, view) {
                if (!initial && JSON.stringify(db) === JSON.stringify(DB.data) && (view?.building || null) === DeviceView.building) return;
                const type = (initial || !this.LIVE) ? 'sitkaGit_db' : 'sitkaGit_db_update';
                window.dispatchEvent(new MessageEvent('message', { data: { type, payload: db, view } }));
            },
            async start() {
                const copy = await this.read();
                if (!copy) {
                    // Opened by itself with no SitkaTools open on this device: tools only run through SitkaTools
                    if (!window.opener) this.showOpenFromSitka();
                    return;
                }
                this.inUse = true;
                this.apply(copy.db, true, copy.view);
                const banner = document.createElement('div');
                banner.id = 'workCopyBanner';
                banner.textContent = '📋 Using the database open in SitkaTools. ';
                banner.style.cssText = 'background: var(--bg-card); color: var(--text-primary); border-bottom: 1px solid var(--accent); padding: 8px 16px; font-size: 0.85rem; text-align: center;';
                const back = document.createElement('button');
                back.type = 'button';
                back.id = 'workCopyGoBack';
                back.textContent = 'Go back to SitkaTools to save';
                back.style.cssText = 'background: var(--accent); color: var(--bg-primary); border: none; border-radius: 6px; padding: 6px 12px; margin-left: 6px; font-weight: 700; cursor: pointer; font-size: inherit;';
                back.addEventListener('click', () => this.goBackToSave());
                banner.appendChild(back);
                document.body.insertBefore(banner, document.body.firstChild);
            }
        };
        window.addEventListener('message', (e) => {
            if (e.isTrusted && e.data?.type === 'sitkaGit_db' && window.opener && e.source === window.opener) WorkCopy.gotDb = true;
        });
        if (!window.opener) WorkCopy.start();
        else setTimeout(() => { if (!WorkCopy.gotDb) WorkCopy.start(); }, 1500);
        if (WorkCopy.channel) {
            WorkCopy.channel.addEventListener('message', async (e) => {
                // SitkaTools closed with everything saved: finish forgetting the copy (it may not get to)
                if (e.data?.type === 'sitka-closing') {
                    if (!e.data.unsaved) WorkCopy.forgetIfSaved();
                    return;
                }
                if (!WorkCopy.inUse || e.data?.type !== 'db-updated' || e.data.from === WorkCopy.TOOL) return;
                const copy = await WorkCopy.read();
                if (copy) WorkCopy.apply(copy.db, false, copy.view);
            });
        }

        // postMessage target origin: our own origin when served over http(s) (ROADMAP 0.4).
        // file:// pages have opaque origins, so they can only be reached with '*'.
        const SITKA_MSG_ORIGIN = (location.protocol === 'file:' || location.origin === 'null') ? '*' : location.origin;

        // ---- Lost link to SitkaTools ----
        // A popup's changes reach SitkaTools only by postMessage. If SitkaTools is reloaded or closed while this
        // window stays open, they would go nowhere while this window still looked fine. SitkaTools answers a
        // message from a window it didn't open with 'sitkaGit_not_linked'; this window checks on every change and
        // whenever it gets the focus, and then covers the page: reopen the tool from SitkaTools. Tablet tabs save
        // through the shared working copy, so it never applies to them.
        var LinkLost = {
            dismissed: false,
            timer: null,
            applies() { return WorkCopy.gotDb && !WorkCopy.inUse; },
            openerGone() { try { return !window.opener || window.opener.closed; } catch (_) { return true; } },
            // Before a change is sent: false (and the cover) when SitkaTools is gone
            canSend() {
                if (!this.applies() || !this.openerGone()) return true;
                this.show(true);
                return false;
            },
            // Is SitkaTools still there, and does it still know this window?
            check() {
                if (!this.applies() || this.dismissed) return;
                if (this.openerGone()) { this.show(false); return; }
                try { window.opener.postMessage({ type: 'sitkaGit_ping' }, SITKA_MSG_ORIGIN); } catch (_) { /* gone */ }
            },
            // lostChange: a change was just made that SitkaTools didn't get
            show(lostChange) {
                if (!lostChange && this.dismissed) return;
                this.dismissed = false;
                let wrap = document.getElementById('linkLost');
                if (!wrap) {
                    wrap = document.createElement('div');
                    wrap.id = 'linkLost';
                    wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10002; background: rgba(10, 10, 25, 0.92); display: flex; align-items: center; justify-content: center; padding: 24px;';
                    wrap.innerHTML = `
                        <div style="max-width: 460px; text-align: center; background: var(--bg-secondary); border: 2px solid var(--warning); border-radius: 12px; padding: 28px;">
                            <div style="font-size: 2.5rem; margin-bottom: 10px;">⚠️</div>
                            <div data-title style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);"></div>
                            <div data-text style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;"></div>
                            <button type="button" data-close style="background: var(--accent); color: var(--bg-primary); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;">Close this window</button>
                            <div style="margin-top: 14px;"><button type="button" data-keep style="background: none; border: none; color: var(--text-secondary); text-decoration: underline; cursor: pointer; font-size: 0.85rem;">Keep it open to look (changes here won't be saved)</button></div>
                        </div>`;
                    wrap.querySelector('[data-close]').addEventListener('click', () => window.close());
                    wrap.querySelector('[data-keep]').addEventListener('click', () => { this.dismissed = true; wrap.style.display = 'none'; });
                    document.body.appendChild(wrap);
                }
                wrap.querySelector('[data-title]').textContent = lostChange ? 'SitkaTools didn’t get your last change' : 'This window lost its link to SitkaTools';
                wrap.querySelector('[data-text]').textContent = 'SitkaTools was reloaded or closed after it opened this window, so changes made here can’t be saved. ' +
                    'Close this window and open the tool again from SitkaTools' + (lostChange ? ', then make your last change again.' : '.');
                wrap.style.display = 'flex';
            }
        };
        window.addEventListener('message', (e) => {
            if (!e.isTrusted || !window.opener || e.source !== window.opener) return;
            // From the first DB on: notice SitkaTools closing even while nothing is being changed
            if (e.data?.type === 'sitkaGit_db' && !LinkLost.timer) {
                LinkLost.timer = setInterval(() => { if (LinkLost.applies() && !LinkLost.dismissed && LinkLost.openerGone()) LinkLost.show(false); }, 3000);
            }
            if (e.data?.type === 'sitkaGit_not_linked' && LinkLost.applies()) LinkLost.show(e.data.about === 'sitkaGit_db_update');
        });
        window.addEventListener('focus', () => LinkLost.check());
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') LinkLost.check(); });

        // ---- The same tool open twice ----
        // Two tabs of the same tool on the shared working copy (a tablet) each hold their own copy of the database, and
        // the one that saves last undoes the other's changes (review A12). The newer one covers itself: close it and use
        // the one already open (user decision 2026-10-26). Only windows on the shared copy take part: a popup saves to the
        // SitkaTools that opened it, which doesn't open a second window of a tool (review A9), and popups of another
        // SitkaTools (the office PC opening SitkaTools as a building too) don't share a copy. They find each other on a
        // BroadcastChannel; the cover lifts by itself if the other one closes. Identical in every tool (WorkCopy.TOOL).
        var OpenTwice = {
            channel: ('BroadcastChannel' in window) ? new BroadcastChannel('sitkatools-tools') : null,
            id: Math.random().toString(36).slice(2, 10) + Date.now().toString(36),
            since: Date.now(),
            covered: false,
            answered: false,
            timer: null,
            name() { return ({ EmployeeWizard: 'Labour & Cost Wizard' })[WorkCopy.TOOL] || WorkCopy.TOOL; },
            // Is window `m` older than this one? (opened earlier; the id breaks a tie)
            isOlder(m) { return m.since < this.since || (m.since === this.since && m.id < this.id); },
            start() {
                if (!this.channel) return;
                this.channel.addEventListener('message', (e) => {
                    const m = e.data || {};
                    if (m.tool !== WorkCopy.TOOL || m.id === this.id) return;
                    // A newer window of this tool asks who's here: an older one that is in use answers
                    if (m.type === 'here?' && WorkCopy.inUse && !this.covered && !this.isOlder(m)) this.channel.postMessage({ type: 'here', tool: WorkCopy.TOOL, id: this.id, since: this.since, to: m.id });
                    if (m.type === 'here' && m.to === this.id && WorkCopy.inUse && this.isOlder(m)) { this.answered = true; this.cover(); }
                    if (m.type === 'gone' && this.covered) this.ask();   // the other one closed: check again
                });
                window.addEventListener('pagehide', () => { try { this.channel.postMessage({ type: 'gone', tool: WorkCopy.TOOL, id: this.id }); } catch (_) { /* closing */ } });
                window.addEventListener('focus', () => { if (this.covered) this.ask(); });
                // Ask once this window is on the shared copy (a tablet tab at once; a popup only if its DB never came)
                let tries = 0;
                const wait = setInterval(() => { if (WorkCopy.inUse) { clearInterval(wait); this.ask(); } else if (++tries > 40) clearInterval(wait); }, 250);
            },
            ask() {
                this.answered = false;
                this.channel.postMessage({ type: 'here?', tool: WorkCopy.TOOL, id: this.id, since: this.since });
                if (!this.covered) return;
                clearTimeout(this.timer);
                this.timer = setTimeout(() => { if (!this.answered) this.uncover(); }, 600);   // nobody older answered: this one is free
            },
            cover() {
                this.covered = true;
                let wrap = document.getElementById('openTwice');
                if (!wrap) {
                    wrap = document.createElement('div');
                    wrap.id = 'openTwice';
                    wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10003; background: rgba(10, 10, 25, 0.94); display: flex; align-items: center; justify-content: center; padding: 24px;';
                    wrap.innerHTML = `
                        <div style="max-width: 460px; text-align: center; background: var(--bg-secondary); border: 2px solid var(--warning); border-radius: 12px; padding: 28px;">
                            <div style="font-size: 2.5rem; margin-bottom: 10px;">⚠️</div>
                            <div data-title style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);"></div>
                            <div data-text style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;"></div>
                            <button type="button" data-close style="background: var(--accent); color: var(--bg-primary); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;">Close this window</button>
                        </div>`;
                    wrap.querySelector('[data-close]').addEventListener('click', () => window.close());
                    document.body.appendChild(wrap);
                }
                wrap.querySelector('[data-title]').textContent = `${this.name()} is already open in another window`;
                wrap.querySelector('[data-text]').textContent = 'Two windows of the same tool would undo each other’s changes. Close this one (or this tab) and use the window that’s already open.';
                wrap.style.display = 'flex';
            },
            uncover() {
                this.covered = false;
                const wrap = document.getElementById('openTwice');
                if (wrap) wrap.style.display = 'none';
            }
        };
        OpenTwice.start();

        function notifySitkaTools() {
            if (typeof LinkLost !== 'undefined' && !LinkLost.canSend()) return;   // SitkaTools is gone (cover shown)
            if (WorkCopy && WorkCopy.inUse) WorkCopy.write(DB.data);
            if (window.opener && !window.opener.closed) {
                const message = {
                    type: 'sitkaGit_db_update',
                    payload: DB.data
                };
                window.opener.postMessage(message, SITKA_MSG_ORIGIN);
            } else {
                console.warn('[EquipmentWizard] Could not notify SitkaTools - opener closed or unavailable');
            }
        }

        window.addEventListener('message', (e) => {
            // Only trust the SitkaTools window that opened this tool (ROADMAP 0.4)
            // Real messages must come from the SitkaTools window that opened us; untrusted events are this
            // page's own shared-copy loader (WorkCopy.apply)
            if (e.isTrusted && (!window.opener || e.source !== window.opener)) return;
            if (e.data?.type === 'sitkaGit_db' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'sitkaGit_ready' }, SITKA_MSG_ORIGIN);
                }
                if (DeviceView.take(e.data)) return; // office only — no resync from a building device
                populateRoomSelector();
                renderEquipmentList();
                updateStatusBar();
                // On every load: purge all EquipmentWizard events and regenerate from ALL rooms
                syncAllRooms();
                showToast('Database loaded — calendar synced across all rooms');
            }

            // Live DB updates — SitkaTools' DB changed (SitkaTools itself or another tool). Take the new DB and
            // refresh the view only: no resync and never notifySitkaTools(), or the windows would ping-pong.
            // The selected room is kept, and the equipment list (with its half-filled task / Repair Log forms)
            // is only rebuilt when this room's equipment actually changed.
            if (e.data?.type === 'sitkaGit_db_update' && e.data.payload) {
                const roomId = getActiveRoomId();
                const before = JSON.stringify(DB.data?._EquipmentWizard?.rooms?.[roomId]?.equipment || []);
                DB.data = e.data.payload;
                DB.ensureStructure();
                if (DeviceView.take(e.data)) return; // office only
                populateRoomSelector();
                const roomNow = getActiveRoomId();
                const after = JSON.stringify(DB.data._EquipmentWizard?.rooms?.[roomNow]?.equipment || []);
                if (roomNow !== roomId || after !== before) renderEquipmentList();
                if (roomNow) renderPreview();   // room names show in the event titles
                updateStatusBar();
            }
        });

        // ---- Expanded State Tracking ----
        const expandedSet = new Set();

        // ---- DOM References ----
        const activeRoomSelect = $('activeRoom');
        const equipmentForm = $('equipmentForm');
        const equipmentTypeSelect = $('equipmentType');
        const equipmentNameInput = $('equipmentName');
        const dehumidifierFieldsDiv = $('dehumidifierFields');
        const equipmentListCard = $('equipmentListCard');
        const equipmentListEl = $('equipmentList');
        const previewCard = $('previewCard');
        const previewListEl = $('previewList');
        const previewCountEl = $('previewCount');

        // ---- Toggle Dehumidifier Fields ----
        equipmentTypeSelect.addEventListener('change', () => {
            const type = equipmentTypeSelect.value;
            dehumidifierFieldsDiv.style.display = type === 'Dehumidifier' ? 'block' : 'none';
        });

        // ---- Populate Room Selector ----
        function populateRoomSelector() {
            const sel = $('activeRoom');
            if (!sel) return;
            const prevValue = sel.value;
            sel.innerHTML = '<option value="">— Select a room —</option>';
            for (const [id, room] of Object.entries(DB.rooms)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = `${id} — ${room.name || 'Unnamed Room'}`;
                sel.appendChild(opt);
            }
            // Keep the selected room while it still exists (live DB updates repopulate this list)
            if (prevValue && DB.rooms[prevValue]) sel.value = prevValue;
        }

        // ---- Active Room for this tool ----
        function getActiveRoomId() {
            return activeRoomSelect.value;
        }

        // ---- Get equipment list for a room ----
        function getRoomEquipment(roomId) {
            if (!DB.data._EquipmentWizard?.rooms?.[roomId]) {
                DB.data._EquipmentWizard.rooms[roomId] = { equipment: [] };
            }
            return DB.data._EquipmentWizard.rooms[roomId].equipment || [];
        }

        // Regenerated maintenance events are matched to the previous ones by equipment + task + date, so
        // renaming a task or changing its emoji keeps its history. Events saved before `taskId` existed
        // fall back to equipment + title + date: their title is mapped to the task whose fresh events carry it.
        // Returns the keyOf function for carryOverAnnotations(previous, fresh, keyOf).
        function equipmentEventKey(fresh) {
            const taskOfTitle = new Map(fresh.map(ev => [`${ev.equipmentId}|${ev.title}`, ev.taskId]));
            return ev => `${ev.equipmentId}|${ev.taskId || taskOfTitle.get(`${ev.equipmentId}|${ev.title}`) || 'title:' + ev.title}|${ev.date}`;
        }

        // Previous events with no regenerated match are dropped — except completed / labour-tracked
        // occurrences of equipment that still exists, which stay on the calendar as maintenance history.
        function retainedHistory(unmatched) {
            return unmatched.filter(ev => hasWorkRecords(ev) && DB.rooms[ev.roomId] &&
                (DB.data._EquipmentWizard?.rooms?.[ev.roomId]?.equipment || []).some(eq => eq.id === ev.equipmentId));
        }

        // A done visit kept as history (its date no longer matches, after a start or interval edit) covers its period: the
        // occurrence that period now has isn't regenerated as a second, overdue visit (review G9). A period runs from
        // one occurrence of the task to the next.
        function dropCoveredOccurrences(fresh, history) {
            const byTask = new Map();
            for (const ev of fresh) { const k = `${ev.equipmentId}|${ev.taskId}`; (byTask.get(k) || byTask.set(k, []).get(k)).push(ev); }
            for (const list of byTask.values()) list.sort((a, b) => a.date.localeCompare(b.date));
            const drop = new Set();
            for (const h of history) {
                const list = h.taskId ? byTask.get(`${h.equipmentId}|${h.taskId}`) || [] : [];
                for (let i = 0; i < list.length; i++) {
                    const next = list[i + 1]?.date || '9999-12-31';
                    if (list[i].date <= h.date && h.date < next) { if (!hasWorkRecords(list[i])) drop.add(list[i]); break; }
                }
            }
            return fresh.filter(ev => !drop.has(ev));
        }

        // ---- Sync ALL rooms: purge every EquipmentWizard event, regenerate from all rooms ----
        function syncAllRooms() {
            // Purge ALL existing EquipmentWizard events across every room
            const previous = DB.data.calendarEvents.filter(ev => ev.sourceTool === 'EquipmentWizard');
            DB.data.calendarEvents = DB.data.calendarEvents.filter(ev => ev.sourceTool !== 'EquipmentWizard');

            let totalEvents = 0;
            const fresh = [];
            for (const roomId of Object.keys(DB.rooms)) {
                const events = computeCalendarEvents(roomId);
                fresh.push(...events);
                totalEvents += events.length;
            }
            const history = retainedHistory(carryOverAnnotations(previous, fresh, equipmentEventKey(fresh)));
            DB.data.calendarEvents.push(...dropCoveredOccurrences(fresh, history), ...history);

            // Update preview for active room
            const activeRoom = getActiveRoomId();
            if (activeRoom) {
                renderPreview(computeCalendarEvents(activeRoom));
            }

            notifySitkaTools();
        }

        // ---- Auto-sync: purge old room events, regenerate, update preview, notify ----
        function autoSyncCalendar(roomId) {
            if (!roomId) roomId = getActiveRoomId();
            if (!roomId) return;

            // Purge all existing EquipmentWizard events for this room
            const previous = DB.data.calendarEvents.filter(ev => ev.sourceTool === 'EquipmentWizard' && ev.roomId === roomId);
            reconcileRoomSchedule(roomId);

            // Compute and append fresh events, keeping ids / completion / labour from the previous ones
            const events = computeCalendarEvents(roomId);
            const history = retainedHistory(carryOverAnnotations(previous, events, equipmentEventKey(events)));
            DB.data.calendarEvents.push(...dropCoveredOccurrences(events, history), ...history);

            // Update preview
            renderPreview(events);

            // Notify SitkaTools
            notifySitkaTools();
        }

        // ---- Render Preview List ----
        function renderPreview(events) {
            if (!events) events = computeCalendarEvents(getActiveRoomId());
            events.sort((a, b) => a.date.localeCompare(b.date));

            previewCountEl.textContent = `(${events.length} events)`;
            previewListEl.innerHTML = '';

            if (events.length === 0) {
                previewListEl.innerHTML = '<div class="empty-state">No scheduled maintenance tasks yet. Add tasks to equipment above.</div>';
                return;
            }

            events.forEach(ev => {
                const item = document.createElement('div');
                item.className = 'event-preview-item';
                const parts = ev.title.split(' — ');
                const equipBadge = parts[1] || '';

                item.innerHTML = `
                    <span class="event-preview-date">${escapeHtml(ev.date)}</span>
                    <span class="event-preview-text">${escapeHtml(ev.title)}</span>
                    <span class="event-preview-equipment">${escapeHtml(equipBadge)}</span>
                `;
                previewListEl.appendChild(item);
            });
        }

        // ---- Render Equipment List ----
        function renderEquipmentList() {
            const roomId = getActiveRoomId();
            if (!roomId) {
                equipmentListCard.style.display = 'none';
                previewListEl.innerHTML = '<div class="empty-state">Select a room to see scheduled maintenance.</div>';
                previewCountEl.textContent = '';
                return;
            }

            const equipment = getRoomEquipment(roomId);

            if (equipment.length === 0) {
                equipmentListCard.style.display = 'block';
                equipmentListEl.innerHTML = '<div class="empty-state">No equipment added yet. Use the form above to add your first item.</div>';
                renderPreview([]);
                return;
            }

            equipmentListCard.style.display = 'block';

            // Capture which items are currently expanded
            const beforeExpand = new Set();
            equipmentListEl.querySelectorAll('.equipment-body.open').forEach(body => {
                const m = body.id.match(/eqBody_(\d+)/);
                if (m) beforeExpand.add(parseInt(m[1]));
            });

            equipmentListEl.innerHTML = '';
            equipment.forEach((eq, idx) => {
                const item = document.createElement('div');
                item.className = 'equipment-item';

                const emoji = eq.emoji || '🔧';
                const taskCount = eq.tasks?.length || 0;

                // Build dehumidifier details badge
                let dehumDetails = '';
                if (eq.type === 'Dehumidifier') {
                    const parts = [];
                    if (eq.serialNumber) parts.push(`SN: ${eq.serialNumber}`);
                    if (eq.filterSize) parts.push(`Filter: ${eq.filterSize}`);
                    if (parts.length > 0) {
                        dehumDetails = `<div class="equipment-details">${escapeHtml(parts.join(' · '))}</div>`;
                    }
                }

                item.innerHTML = `
                    <div class="equipment-header" data-idx="${idx}">
                        <span class="equipment-emoji">${escapeHtml(emoji)}</span>
                        <div class="equipment-info">
                            <div class="equipment-name">${escapeHtml(eq.name)}</div>
                            ${eq.type ? `<span class="equipment-type-badge">${escapeHtml(eq.type)}</span>` : ''}
                            ${dehumDetails}
                            <div class="equipment-details equipment-power" id="eqPower_${idx}">${powerSummary(eq.power)}</div>
                        </div>
                        <span class="equipment-task-count">${taskCount} task${taskCount !== 1 ? 's' : ''}</span>
                        <button class="equipment-delete-btn" data-idx="${idx}" title="Remove equipment">✕</button>
                    </div>
                    <div class="equipment-body" id="eqBody_${idx}">
                        <div class="tracker-title">⚡ Power use — for the electricity estimate</div>
                        <div class="form-row power-edit" data-idx="${idx}">
                            <div class="form-group"><label>Watts per unit</label><input type="number" class="eq-watts" min="0" step="1" inputmode="numeric" value="${escapeHtml(eq.power?.watts ?? '')}" placeholder="not set"></div>
                            <div class="form-group"><label>Units</label><input type="number" class="eq-units" min="1" step="1" inputmode="numeric" value="${escapeHtml(eq.power?.units ?? 1)}"></div>
                            <div class="form-group"><label>Hours a day</label><input type="number" class="eq-hours" min="0" max="24" step="0.5" inputmode="decimal" value="${escapeHtml(eq.power?.hoursPerDay ?? 12)}"></div>
                        </div>
                        <div class="subtask-list" id="subtaskList_${idx}"></div>

                        <!-- Scheduled Maintenance Header -->
                        <div class="tracker-title">Scheduled Maintenance</div>
                        <div class="add-subtask-form">
                            <form class="add-subtask-inner" data-idx="${idx}">
                                <div class="form-group">
                                    <label>Task Name</label>
                                    <input type="text" class="subtask-name-input" placeholder="e.g., Replace filter, Tighten connections" required autocomplete="off">
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Interval</label>
                                        <div style="display:flex; gap:8px;">
                                            <input type="number" class="subtask-interval-value" min="1" value="30" style="flex:1; -webkit-appearance: textfield; -moz-appearance: textfield; appearance: textfield;" required>
                                            <select class="subtask-interval-unit" style="flex:1;">
                                                <option value="days">Days</option>
                                                <option value="months">Months</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Start Date</label>
                                        <input type="date" class="subtask-start-date" value="${todayStr()}" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Emoji</label>
                                    <div class="emoji-row">
                                        <button type="button" class="emoji-btn selected" data-emoji="🔧">🔧</button>
                                        <button type="button" class="emoji-btn" data-emoji="🧹">🧹</button>
                                        <button type="button" class="emoji-btn" data-emoji="🌀">🌀</button>
                                        <button type="button" class="emoji-btn" data-emoji="💧">💧</button>
                                        <button type="button" class="emoji-btn" data-emoji="❄️">❄️</button>
                                        <button type="button" class="emoji-btn" data-emoji="🌡️">🌡️</button>
                                        <button type="button" class="emoji-btn" data-emoji="⚙️">⚙️</button>
                                        <button type="button" class="emoji-btn" data-emoji="🔍">🔍</button>
                                        <button type="button" class="emoji-btn" data-emoji="🛠️">🛠️</button>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="button" class="btn btn-secondary btn-small subtask-cancel-edit" hidden>Cancel</button>
                                    <button type="submit" class="btn btn-primary btn-small subtask-submit-btn">Add Task</button>
                                </div>
                            </form>
                        </div>

                        <!-- Repair Log -->
                        <div class="tracker-section" style="margin-top: 16px;">
                            <div class="tracker-title">Repair Log</div>
                            <div class="tracker-list" id="trackerList_${idx}"></div>
                            <div class="add-tracker-form">
                                <form class="add-tracker-inner" data-idx="${idx}">
                                    <div class="form-row">
                                        <div class="form-group" style="flex:2;">
                                            <label>Description</label>
                                            <input type="text" class="tracker-name-input" placeholder="e.g., Compressor replaced" required autocomplete="off">
                                        </div>
                                        <div class="form-group" style="flex:1;">
                                            <label>Date</label>
                                            <input type="date" class="tracker-date-input" value="${todayStr()}" required>
                                        </div>
                                    </div>
                                    <div class="form-actions">
                                        <button type="submit" class="btn btn-primary btn-small">Log Entry</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                `;

                equipmentListEl.appendChild(item);

                // Restore expanded state for this item
                const body = $(`eqBody_${idx}`);
                if (expandedSet.has(idx) || beforeExpand.has(idx)) {
                    body.classList.add('open');
                }

                // Render subtasks
                const subtaskList = $(`subtaskList_${idx}`);
                if (eq.tasks && eq.tasks.length > 0) {
                    eq.tasks.forEach((task, tIdx) => {
                        const taskEl = document.createElement('div');
                        taskEl.className = 'subtask-item';
                        taskEl.innerHTML = `
                            <span class="subtask-emoji">${escapeHtml(task.emoji || '🔧')}</span>
                            <div class="subtask-info">
                                <div class="subtask-name">${escapeHtml(task.name)}</div>
                                <div class="subtask-interval">Every ${escapeHtml(task.intervalValue)} ${escapeHtml(task.intervalUnit)}</div>
                            </div>
                            <span class="subtask-start">Start: ${escapeHtml(task.startDate)}</span>
                            <button class="subtask-edit-btn" data-eq-idx="${idx}" data-task-idx="${tIdx}" title="Edit task">✎</button>
                            <button class="subtask-delete-btn" data-eq-idx="${idx}" data-task-idx="${tIdx}" title="Remove task">✕</button>
                        `;
                        subtaskList.appendChild(taskEl);
                    });
                }

                // Render additional maintenance tracker entries
                const trackerList = $(`trackerList_${idx}`);
                if (eq.additionalMaintenance && eq.additionalMaintenance.length > 0) {
                    const sorted = [...eq.additionalMaintenance].sort((a, b) => b.date.localeCompare(a.date));
                    sorted.forEach((entry, sIdx) => {
                        const entryEl = document.createElement('div');
                        entryEl.className = 'tracker-item';
                        entryEl.innerHTML = `
                            <span class="tracker-date">${escapeHtml(entry.date)}</span>
                            <span class="tracker-name">${escapeHtml(entry.name)}</span>
                            <button class="tracker-delete-btn" data-eq-idx="${idx}" data-tracker-id="${escapeHtml(entry.id)}" title="Remove entry">✕</button>
                        `;
                        trackerList.appendChild(entryEl);
                    });
                }
            });

            // ⚡ Power edits: saved straight away (no schedule change, so no calendar resync)
            equipmentListEl.querySelectorAll('.power-edit').forEach(row => {
                row.querySelectorAll('input').forEach(inp => inp.addEventListener('change', () => {
                    const eq = getRoomEquipment(roomId)[Number(row.dataset.idx)];
                    if (!eq) return;
                    const power = readPower(row.querySelector('.eq-watts').value, row.querySelector('.eq-units').value, row.querySelector('.eq-hours').value);
                    if (power) eq.power = power; else delete eq.power;
                    $(`eqPower_${row.dataset.idx}`).textContent = powerSummary(eq.power);
                    notifySitkaTools();
                    showToast(power ? `Power saved for "${eq.name}"` : `Power cleared for "${eq.name}"`);
                }));
            });

            // Bind expand/collapse headers
            equipmentListEl.querySelectorAll('.equipment-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    if (e.target.closest('.equipment-delete-btn') || e.target.closest('.subtask-edit-btn')) return;
                    const idx = parseInt(header.dataset.idx);
                    const body = $(`eqBody_${idx}`);
                    body.classList.toggle('open');
                    if (body.classList.contains('open')) {
                        expandedSet.add(idx);
                    } else {
                        expandedSet.delete(idx);
                    }
                });
            });

            // Bind equipment delete buttons
            equipmentListEl.querySelectorAll('.equipment-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.idx);
                    deleteEquipment(idx);
                });
            });

            // Bind subtask edit buttons
            equipmentListEl.querySelectorAll('.subtask-edit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const eqIdx = parseInt(btn.dataset.eqIdx);
                    const taskIdx = parseInt(btn.dataset.taskIdx);
                    loadTaskIntoForm(eqIdx, taskIdx);
                });
            });

            // Bind subtask delete buttons
            equipmentListEl.querySelectorAll('.subtask-delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const eqIdx = parseInt(btn.dataset.eqIdx);
                    const taskIdx = parseInt(btn.dataset.taskIdx);
                    deleteSubtask(eqIdx, taskIdx);
                });
            });

            // Bind add subtask forms
            equipmentListEl.querySelectorAll('.add-subtask-inner').forEach(form => {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const idx = parseInt(form.dataset.idx);
                    addSubtask(idx, form);
                });
            });

            // Cancel editing a task — rebuilds the list, so every task form is back to "Add Task"
            equipmentListEl.querySelectorAll('.subtask-cancel-edit').forEach(btn => {
                btn.addEventListener('click', () => renderEquipmentList());
            });

            // Bind emoji buttons in subtask forms
            equipmentListEl.querySelectorAll('.emoji-row').forEach(row => {
                row.querySelectorAll('.emoji-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        row.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    });
                });
            });

            // Bind tracker delete buttons
            equipmentListEl.querySelectorAll('.tracker-delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const eqIdx = parseInt(btn.dataset.eqIdx);
