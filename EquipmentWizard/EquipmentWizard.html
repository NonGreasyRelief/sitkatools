                    const trackerId = btn.dataset.trackerId;
                    deleteTrackerEntry(eqIdx, trackerId);
                });
            });

            // Bind add tracker forms
            equipmentListEl.querySelectorAll('.add-tracker-inner').forEach(form => {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const idx = parseInt(form.dataset.idx);
                    addTrackerEntry(idx, form);
                });
            });
        }

        // ---- ⚡ Power use (for the Labour & Cost Wizard's electricity estimate) ----
        // equipment.power = { watts, units, hoursPerDay }: watts per unit, how many units, hours a day it runs.
        // Estimated use = watts × units × hours ÷ 1000 kWh a day. No watts = no power entry.
        function readPower(watts, units, hours) {
            const w = parseFloat(watts);
            if (!(w > 0)) return null;
            const u = Math.max(1, Math.round(parseFloat(units) || 1));
            const h = Math.min(24, Math.max(0, parseFloat(hours)));
            return { watts: w, units: u, hoursPerDay: Number.isFinite(h) ? h : 12 };
        }
        function powerSummary(power) {
            if (!power?.watts) return '⚡ Power not set';
            const kwh = power.watts * (power.units || 1) * (power.hoursPerDay ?? 12) / 1000;
            return `⚡ ${power.watts.toLocaleString()} W${power.units > 1 ? ` × ${power.units}` : ''} · ${power.hoursPerDay ?? 12} h/day ≈ ${kwh.toLocaleString(undefined, { maximumFractionDigits: 1 })} kWh/day`;
        }

        // ---- Add Equipment ----
        equipmentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const roomId = getActiveRoomId();
            if (!roomId) {
                showToast('Please select a room first.');
                return;
            }

            const type = equipmentTypeSelect.value;
            const name = equipmentNameInput.value.trim();
            if (!name) {
                showToast('Please enter an equipment name.');
                return;
            }

            const eqEmoji = getEmojiForType(type);

            // Capture dehumidifier-specific fields
            const serialNumber = type === 'Dehumidifier' ? $('equipmentSerial').value.trim() : undefined;
            const filterSize = type === 'Dehumidifier' ? $('equipmentFilterSize').value.trim() : undefined;

            const equipment = getRoomEquipment(roomId);
            const power = readPower($('equipmentWatts').value, $('equipmentUnits').value, $('equipmentHours').value);
            equipment.push({
                id: uid(),
                type: type,
                name: name,
                emoji: eqEmoji,
                installedDate: todayStr(),
                serialNumber: serialNumber || undefined,
                filterSize: filterSize || undefined,
                ...(power ? { power } : {}),
                tasks: [],
                additionalMaintenance: []
            });

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;

            equipmentNameInput.value = '';
            equipmentTypeSelect.value = '';
            $('equipmentSerial').value = '';
            $('equipmentFilterSize').value = '';
            $('equipmentWatts').value = '';
            $('equipmentUnits').value = '1';
            $('equipmentHours').value = '12';
            renderEquipmentList();
            autoSyncCalendar(roomId);
            showToast(`Added "${name}" to room`);
        });

        // ---- Load Task Into Form (for editing) ----
        function loadTaskIntoForm(eqIdx, taskIdx) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq || !eq.tasks || !eq.tasks[taskIdx]) return;

            const task = eq.tasks[taskIdx];

            // Find the add-subtask form for this equipment item
            const body = $(`eqBody_${eqIdx}`);
            if (!body) return;

            // Ensure the body is expanded so the user can see the form
            body.classList.add('open');
            expandedSet.add(eqIdx);

            // Populate form fields
            const form = body.querySelector('.add-subtask-inner');
            if (!form) return;

            // Remember which task is being edited, so submitting replaces it in place (same id) even when
            // its name changes
            form.dataset.editTaskId = task.id || '';
            form.querySelector('.subtask-submit-btn').textContent = 'Update Task';
            form.querySelector('.subtask-cancel-edit').hidden = false;

            form.querySelector('.subtask-name-input').value = task.name;
            form.querySelector('.subtask-interval-value').value = task.intervalValue;
            form.querySelector('.subtask-interval-unit').value = task.intervalUnit;
            form.querySelector('.subtask-start-date').value = task.startDate;

            // Select the matching emoji button
            const emojiRow = form.querySelector('.emoji-row');
            if (emojiRow) {
                emojiRow.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
                const match = emojiRow.querySelector(`.emoji-btn[data-emoji="${task.emoji}"]`);
                if (match) {
                    match.classList.add('selected');
                } else {
                    emojiRow.querySelector('.emoji-btn')?.classList.add('selected');
                }
            }

            // Scroll the form into view
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });

            showToast(`Editing "${task.name}" — submit to update`);
        }

        // ---- Get emoji for equipment type ----
        function getEmojiForType(type) {
            const map = {
                'Dehumidifier': '💧',
                'Air Conditioner': '❄️',
                'Plumbing': '🔩',
                'Irrigation Layout': '🚿',
                'Dripper System': '💦',
                'Table': '🪵',
                'HVAC Unit': '🌀'
            };
            return map[type] || '🔧';
        }

        // ---- Delete Equipment ----
        function deleteEquipment(idx) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[idx];
            if (!eq) return;

            // One misclick on ✕ would lose the tasks, Repair Log and every completed visit — confirm first
            const taskCount = eq.tasks?.length || 0;
            const repairCount = eq.additionalMaintenance?.length || 0;
            const visitCount = DB.data.calendarEvents.filter(ev =>
                ev.sourceTool === 'EquipmentWizard' && ev.equipmentId === eq.id && hasWorkRecords(ev)).length;
            if (!confirm(`Remove "${eq.name}" from this room?\n\n` +
                `This also removes its ${taskCount} maintenance task(s), ${repairCount} Repair Log entr${repairCount === 1 ? 'y' : 'ies'} ` +
                `and ${visitCount} completed or labour-tracked visit(s) from the calendar.\n\nThis cannot be undone.`)) return;

            const removed = equipment.splice(idx, 1)[0];

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            renderEquipmentList();
            autoSyncCalendar(roomId);
            showToast(`Removed "${removed?.name}"`);
        }

        // ---- Add Sub-task ----
        function addSubtask(eqIdx, form) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const nameInput = form.querySelector('.subtask-name-input');
            const intervalValueInput = form.querySelector('.subtask-interval-value');
            const intervalUnitSelect = form.querySelector('.subtask-interval-unit');
            const startDateInput = form.querySelector('.subtask-start-date');
            const emojiRow = form.querySelector('.emoji-row');
            const selectedEmojiBtn = emojiRow?.querySelector('.emoji-btn.selected');

            const name = nameInput.value.trim();
            if (!name) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq) return;

            if (!eq.tasks) eq.tasks = [];

            // The task loaded with ✎ is replaced in place (it may have been renamed); otherwise a task with
            // the same name is replaced instead of duplicated. A replaced task keeps its id, so its
            // calendar history carries over.
            const editId = form.dataset.editTaskId;
            const editIdx = editId ? eq.tasks.findIndex(t => t.id === editId) : -1;
            const existingIdx = editIdx >= 0 ? editIdx : eq.tasks.findIndex(t => t.name === name);
            const isNew = existingIdx === -1;

            const newTask = {
                id: (!isNew && eq.tasks[existingIdx].id) || uid(),
                name: name,
                intervalValue: parseInt(intervalValueInput.value),
                intervalUnit: intervalUnitSelect.value,
                startDate: startDateInput.value || todayStr(),
                emoji: selectedEmojiBtn?.dataset.emoji || '🔧'
            };

            if (isNew) {
                eq.tasks.push(newTask);
            } else {
                eq.tasks[existingIdx] = newTask;
            }

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            renderEquipmentList();
            autoSyncCalendar(roomId);
            showToast(isNew ? `Added task "${name}"` : `Updated task "${name}"`);
        }

        // ---- Delete Sub-task ----
        function deleteSubtask(eqIdx, taskIdx) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq || !eq.tasks) return;

            const removed = eq.tasks.splice(taskIdx, 1)[0];

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            renderEquipmentList();
            autoSyncCalendar(roomId);
            showToast(`Removed task "${removed?.name}"`);
        }

        // ---- Add Tracker Entry ----
        function addTrackerEntry(eqIdx, form) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const nameInput = form.querySelector('.tracker-name-input');
            const dateInput = form.querySelector('.tracker-date-input');

            const name = nameInput.value.trim();
            if (!name) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq) return;

            if (!eq.additionalMaintenance) eq.additionalMaintenance = [];
            eq.additionalMaintenance.push({
                id: uid(),
                name: name,
                date: dateInput.value || todayStr()
            });

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            notifySitkaTools();
            renderEquipmentList();
            showToast(`Logged "${name}"`);
        }

        // ---- Delete Tracker Entry ----
        function deleteTrackerEntry(eqIdx, trackerId) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq || !eq.additionalMaintenance) return;

            const before = eq.additionalMaintenance.length;
            eq.additionalMaintenance = eq.additionalMaintenance.filter(e => e.id !== trackerId);

            if (eq.additionalMaintenance.length === before) {
                showToast('Entry not found.');
                return;
            }

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            notifySitkaTools();
            renderEquipmentList();
            showToast('Removed entry');
        }

        // ---- Compute Calendar Events for a Single Equipment Item ----
        function computeEquipmentEvents(eq, roomId) {
            const roomName = DB.rooms[roomId]?.name || roomId;
            const today = todayStr();
            const endDate = addMonths(today, 12);
            const events = [];

            if (!eq.tasks) return events;
            for (const task of eq.tasks) {
                let current = task.startDate;
                let k = 0;
                // An interval below 1 (only from a hand-edited file) would never move on: one visit, no repeats (review G10)
                const stepOk = Number.isFinite(Number(task.intervalValue)) && Number(task.intervalValue) >= 1;
                if (!/^\d{4}-\d{2}-\d{2}$/.test(String(current || ''))) continue;

                while (current <= endDate) {
                    events.push({
                        id: newEventId(),
                        date: current,
                        title: `${task.emoji || '🔧'} ${task.name} — ${eq.name} — ${roomName}`,
                        sourceTool: 'EquipmentWizard',
                        roomId: roomId,
                        equipmentId: eq.id,
                        taskId: task.id,
                        taskType: 'equipment_maintenance'
                    });

                    // Months: occurrence k is always start + k × interval (clamped to month end), never
                    // chained from the previous date — a clamped Feb 28 must not pull later months to the 28th.
                    k++;
                    if (!stepOk) break;
                    if (task.intervalUnit === 'months') {
                        current = addMonths(task.startDate, k * task.intervalValue);
                    } else {
                        current = addDays(current, task.intervalValue);
                    }
                }
            }

            return events;
        }

        // ---- Compute Calendar Events for a Room ----
        function computeCalendarEvents(roomId) {
            const equipment = getRoomEquipment(roomId);
            const events = [];

            for (const eq of equipment) {
                if (!eq.tasks) continue;
                events.push(...computeEquipmentEvents(eq, roomId));
            }

            return events;
        }

        // ---- Reconcile: Remove existing EquipmentWizard events for a room ----
        function reconcileRoomSchedule(roomId) {
            DB.data.calendarEvents = DB.data.calendarEvents.filter(ev => {
                if (ev.sourceTool === 'EquipmentWizard' && ev.roomId === roomId) {
                    return false;
                }
                return true;
            });
        }

        // ---- Room Selector Change Handler — auto-sync on room switch ----
        activeRoomSelect.addEventListener('change', () => {
            renderEquipmentList();
            autoSyncCalendar();
        });

        // ---- Update Status Bar ----
        function updateStatusBar() {
            const statusBar = $('statusBar');
            const statusText = $('statusText');
            statusBar.classList.add('loaded');

            const roomId = getActiveRoomId();
            let eqCount = 0;
            let taskCount = 0;
            if (roomId) {
                const equipment = getRoomEquipment(roomId);
                eqCount = equipment.length;
                equipment.forEach(eq => { taskCount += (eq.tasks?.length || 0); });
            }

            statusText.textContent = `DB loaded · ${Object.keys(DB.rooms).length} rooms · ${eqCount} equipment · ${taskCount} tasks`;
        }

        // ---- Toast ----
        let toastTimer = null;
        function showToast(message) {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ---- Close Tool ----
        $('closeToolBtn').addEventListener('click', () => window.close());

        // ---- Initial render check ----
        updateStatusBar();
    </script>
</body>
</html>
