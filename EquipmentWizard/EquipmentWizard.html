<!-- EquipmentWizard.html — Cyclical equipment maintenance scheduler for SitkaGit suite -->
<!-- Tool: EquipmentWizard | Purpose: Auto-populate calendar with recurring maintenance events per room -->
<!-- Database Keys: "_EquipmentWizard" (top-level), "calendarEvents" -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipment Wizard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #53d8a8;
            --accent-hover: #3fb98b;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8b8;
            --border: #2a2a4a;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --warning: #f39c12;
            --input-bg: #1a1a3e;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 24px; }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .header-right { display: flex; gap: 8px; align-items: flex-end; }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }

        /* ---- Status Bar ---- */
        .status-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-bar.loaded { border-color: var(--accent); }

        .status-badge {
            background: var(--bg-card);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--accent);
        }

        /* ---- Card ---- */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
        }

        /* ---- Form ---- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .form-row {
            display: flex;
            gap: 16px;
        }

        .form-row .form-group { flex: 1; }

        /* ---- Buttons ---- */
        .btn {
            padding: 10px 24px;
            border-radius: var(--radius);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { border-color: var(--text-secondary); }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-danger:hover { background: var(--danger-hover); }

        .btn-small {
            padding: 6px 14px;
            font-size: 0.8rem;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 8px;
        }

        /* ---- Equipment List ---- */
        .equipment-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .equipment-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            transition: border-color 0.2s;
        }

        .equipment-item:hover { border-color: var(--accent); }

        .equipment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .equipment-header:hover { background: rgba(83, 216, 168, 0.05); }

        .equipment-emoji {
            font-size: 1.3rem;
            flex-shrink: 0;
            width: 32px;
            text-align: center;
        }

        .equipment-info {
            flex: 1;
            min-width: 0;
        }

        .equipment-name {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .equipment-type-badge {
            font-size: 0.7rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .equipment-details {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .equipment-task-count {
            font-size: 0.75rem;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .equipment-delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .equipment-item:hover .equipment-delete-btn { opacity: 1; }
        .equipment-delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        /* ---- Sub-tasks (expandable section within equipment) ---- */
        .equipment-body {
            display: none;
            border-top: 1px solid var(--border);
            padding: 16px;
        }

        .equipment-body.open { display: block; }

        .subtask-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 16px;
        }

        .subtask-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .subtask-emoji {
            font-size: 1.1rem;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
        }

        .subtask-info {
            flex: 1;
            min-width: 0;
        }

        .subtask-name {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .subtask-interval {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .subtask-start {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .subtask-edit-btn {
            background: none;
            border: none;
            color: var(--warning);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .subtask-delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 1rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .subtask-item:hover .subtask-edit-btn { opacity: 1; }
        .subtask-item:hover .subtask-delete-btn { opacity: 1; }
        .subtask-edit-btn:hover { background: rgba(243, 156, 18, 0.2); }
        .subtask-delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        /* ---- Add Sub-task Form (inside equipment body) ---- */
        .add-subtask-form {
            background: var(--input-bg);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 14px;
        }

        .add-subtask-form .form-group:last-child { margin-bottom: 0; }

        /* ---- Calendar Events Preview List ---- */
        .event-preview-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 360px;
            overflow-y: auto;
        }

        .event-preview-item {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
        }

        .event-preview-date {
            font-size: 0.8rem;
            color: var(--accent);
            background: var(--input-bg);
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 600;
        }

        .event-preview-text {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .event-preview-equipment {
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: var(--input-bg);
            padding: 2px 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        /* ---- Footer ---- */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        /* ---- Toast notification ---- */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 24px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Empty State ---- */
        .empty-state {
            text-align: center;
            padding: 24px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* ---- Section Divider ---- */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .section-divider span {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ---- Scrollbar Styling ---- */
        .event-preview-list::-webkit-scrollbar { width: 6px; }
        .event-preview-list::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 3px; }
        .event-preview-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        .event-preview-list::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

        /* ---- Emoji Picker Row ---- */
        .emoji-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .emoji-btn {
            width: 36px;
            height: 36px;
            border-radius: var(--radius);
            border: 2px solid transparent;
            background: var(--input-bg);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .emoji-btn:hover {
            background: var(--bg-card);
            border-color: var(--border);
        }

        .emoji-btn.selected {
            border-color: var(--accent);
            background: rgba(83, 216, 168, 0.15);
        }

        /* ---- Additional Maintenance Tracker ---- */
        .tracker-section {
            margin-top: 16px;
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .tracker-title {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        .tracker-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
            max-height: 180px;
            overflow-y: auto;
        }

        .tracker-item {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
        }

        .tracker-date {
            font-size: 0.78rem;
            color: var(--warning);
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 4px;
            white-space: nowrap;
            flex-shrink: 0;
            font-weight: 600;
        }

        .tracker-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tracker-delete-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            opacity: 0;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .tracker-item:hover .tracker-delete-btn { opacity: 1; }
        .tracker-delete-btn:hover { background: rgba(231, 76, 60, 0.2); }

        .add-tracker-form {
            background: var(--input-bg);
            border: 1px dashed var(--border);
            border-radius: var(--radius);
            padding: 12px;
        }

        .add-tracker-form .form-group:last-child { margin-bottom: 0; }

        .tracker-list::-webkit-scrollbar { width: 4px; }
        .tracker-list::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 2px; }
        .tracker-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    </style>
</head>
<body>
    <!-- Header (room-focused tool — Active Room selector) -->
    <header class="header">
        <div class="header-left">
            <span class="logo">🔧 Equipment Wizard</span>
        </div>
        <div class="header-right">
            <div class="form-group">
                <label for="activeRoom">Active Room</label>
                <select id="activeRoom">
                    <option value="">— Select a room —</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">No database loaded. Open from SitkaTools.</span>
        </div>

        <!-- Add Equipment Form -->
        <div class="card">
            <h2 class="card-title">Add Equipment</h2>
            <form id="equipmentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="equipmentType">Equipment Type</label>
                        <select id="equipmentType">
                            <option value="">— Select type —</option>
                            <optgroup label="Dehumidifier">
                                <option value="Dehumidifier">Dehumidifier</option>
                            </optgroup>
                            <optgroup label="Air Conditioner">
                                <option value="Air Conditioner">Air Conditioner</option>
                            </optgroup>
                            <optgroup label="Plumbing">
                                <option value="Plumbing">Plumbing</option>
                            </optgroup>
                            <optgroup label="Irrigation">
                                <option value="Irrigation Layout">Irrigation Layout</option>
                                <option value="Dripper System">Dripper System</option>
                            </optgroup>
                            <optgroup label="Infrastructure">
                                <option value="Table">Table</option>
                                <option value="HVAC Unit">HVAC Unit</option>
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="equipmentName">Equipment Name / Label</label>
                        <input type="text" id="equipmentName" placeholder="e.g., Dehumidifier #1, North Wall AC" required autocomplete="off">
                    </div>
                </div>
                <div id="dehumidifierFields" style="display:none;">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="equipmentSerial">Serial Number</label>
                            <input type="text" id="equipmentSerial" placeholder="e.g., SN-2024-00123" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="equipmentFilterSize">Filter Size</label>
                            <input type="text" id="equipmentFilterSize" placeholder="e.g., 12x12x1 in" autocomplete="off">
                        </div>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Add Equipment</button>
                </div>
            </form>
        </div>

        <!-- Equipment Inventory List -->
        <div class="card" id="equipmentListCard" style="display:none;">
            <h2 class="card-title">Equipment Inventory</h2>
            <div class="equipment-list" id="equipmentList"></div>
        </div>

        <!-- Calendar Events Preview (always visible) -->
        <div class="card" id="previewCard">
            <h2 class="card-title">Upcoming Maintenance Events <span id="previewCount" style="font-weight:400; font-size:0.85rem; color:var(--text-secondary);"></span></h2>
            <div class="event-preview-list" id="previewList"></div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <button class="btn btn-secondary" id="closeToolBtn">Close Tool</button>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // =====================================================
        // EquipmentWizard — Cyclical Equipment Maintenance Scheduler
        // Database Keys: "_EquipmentWizard" (top-level), "calendarEvents"
        // =====================================================

        const DB = {
            data: null,

            get rooms() { return this.data?.rooms || {}; },

            ensureStructure() {
                if (!this.data) this.data = { lots: {}, rooms: {}, calendarEvents: [] };
                if (!this.data.lots) this.data.lots = {};
                if (!this.data.rooms) this.data.rooms = {};
                if (!this.data.calendarEvents) this.data.calendarEvents = [];
                if (!this.data._EquipmentWizard) {
                    this.data._EquipmentWizard = { rooms: {} };
                }
                return this.data;
            }
        };

        const $ = id => document.getElementById(id);

        // ---- Utility: unique ID generator ----
        function uid() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        }

        // ---- Utility: today as YYYY-MM-DD ----
        function todayStr() {
            return new Date().toISOString().split('T')[0];
        }

        // ---- Utility: add months to a date string ----
        function addMonths(dateStr, months) {
            const d = new Date(dateStr + 'T00:00:00');
            d.setMonth(d.getMonth() + months);
            return d.toISOString().split('T')[0];
        }

        // ---- Utility: add days to a date string ----
        function addDays(dateStr, days) {
            const d = new Date(dateStr + 'T00:00:00');
            d.setDate(d.getDate() + days);
            return d.toISOString().split('T')[0];
        }

        // ---- postMessage Convention ----
        DB.ensureStructure();

        function notifySitkaTools() {
            if (window.opener && !window.opener.closed) {
                const message = {
                    type: 'sitkaGit_db_update',
                    payload: DB.data
                };
                console.log('[EquipmentWizard] Sending postMessage with calendarEvents count:', DB.data.calendarEvents?.length || 0);
                window.opener.postMessage(message, '*');
            } else {
                console.warn('[EquipmentWizard] Could not notify SitkaTools - opener closed or unavailable');
            }
        }

        window.addEventListener('message', (e) => {
            if (e.data?.type === 'sitkaGit_db' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'sitkaGit_ready' }, '*');
                }
                populateRoomSelector();
                renderEquipmentList();
                updateStatusBar();
                // On every load: purge all EquipmentWizard events and regenerate from ALL rooms
                syncAllRooms();
                showToast('Database loaded — calendar synced across all rooms');
            }
        });

        // ---- Expanded State Tracking ----
        const expandedSet = new Set();

        // ---- DOM References ----
        const activeRoomSelect = $('activeRoom');
        const equipmentForm = $('equipmentForm');
        const equipmentTypeSelect = $('equipmentType');
        const equipmentNameInput = $('equipmentName');
        const dehumidifierFieldsDiv = $('dehumidifierFields');
        const equipmentListCard = $('equipmentListCard');
        const equipmentListEl = $('equipmentList');
        const previewCard = $('previewCard');
        const previewListEl = $('previewList');
        const previewCountEl = $('previewCount');

        // ---- Toggle Dehumidifier Fields ----
        equipmentTypeSelect.addEventListener('change', () => {
            const type = equipmentTypeSelect.value;
            dehumidifierFieldsDiv.style.display = type === 'Dehumidifier' ? 'block' : 'none';
        });

        // ---- Populate Room Selector ----
        function populateRoomSelector() {
            const sel = $('activeRoom');
            if (!sel) return;
            sel.innerHTML = '<option value="">— Select a room —</option>';
            for (const [id, room] of Object.entries(DB.rooms)) {
                const opt = document.createElement('option');
                opt.value = id;
                opt.textContent = `${id} — ${room.name || 'Unnamed Room'}`;
                sel.appendChild(opt);
            }
        }

        // ---- Active Room for this tool ----
        function getActiveRoomId() {
            return activeRoomSelect.value;
        }

        // ---- Get equipment list for a room ----
        function getRoomEquipment(roomId) {
            if (!DB.data._EquipmentWizard?.rooms?.[roomId]) {
                DB.data._EquipmentWizard.rooms[roomId] = { equipment: [] };
            }
            return DB.data._EquipmentWizard.rooms[roomId].equipment || [];
        }

        // ---- Sync ALL rooms: purge every EquipmentWizard event, regenerate from all rooms ----
        function syncAllRooms() {
            // Purge ALL existing EquipmentWizard events across every room
            DB.data.calendarEvents = DB.data.calendarEvents.filter(ev => ev.sourceTool !== 'EquipmentWizard');

            let totalEvents = 0;
            for (const roomId of Object.keys(DB.rooms)) {
                const events = computeCalendarEvents(roomId);
                DB.data.calendarEvents.push(...events);
                totalEvents += events.length;
            }

            // Update preview for active room
            const activeRoom = getActiveRoomId();
            if (activeRoom) {
                renderPreview(computeCalendarEvents(activeRoom));
            }

            notifySitkaTools();
            console.log(`[EquipmentWizard] Synced all rooms — ${totalEvents} total events`);
        }

        // ---- Auto-sync: purge old room events, regenerate, update preview, notify ----
        function autoSyncCalendar(roomId) {
            if (!roomId) roomId = getActiveRoomId();
            if (!roomId) return;

            // Purge all existing EquipmentWizard events for this room
            reconcileRoomSchedule(roomId);

            // Compute and append fresh events
            const events = computeCalendarEvents(roomId);
            DB.data.calendarEvents.push(...events);

            // Update preview
            renderPreview(events);

            // Notify SitkaTools
            notifySitkaTools();
        }

        // ---- Render Preview List ----
        function renderPreview(events) {
            if (!events) events = computeCalendarEvents(getActiveRoomId());
            events.sort((a, b) => a.date.localeCompare(b.date));

            previewCountEl.textContent = `(${events.length} events)`;
            previewListEl.innerHTML = '';

            if (events.length === 0) {
                previewListEl.innerHTML = '<div class="empty-state">No scheduled maintenance tasks yet. Add tasks to equipment above.</div>';
                return;
            }

            events.forEach(ev => {
                const item = document.createElement('div');
                item.className = 'event-preview-item';
                const parts = ev.title.split(' — ');
                const equipBadge = parts[1] || '';

                item.innerHTML = `
                    <span class="event-preview-date">${ev.date}</span>
                    <span class="event-preview-text">${ev.title}</span>
                    <span class="event-preview-equipment">${equipBadge}</span>
                `;
                previewListEl.appendChild(item);
            });
        }

        // ---- Render Equipment List ----
        function renderEquipmentList() {
            const roomId = getActiveRoomId();
            if (!roomId) {
                equipmentListCard.style.display = 'none';
                previewListEl.innerHTML = '<div class="empty-state">Select a room to see scheduled maintenance.</div>';
                previewCountEl.textContent = '';
                return;
            }

            const equipment = getRoomEquipment(roomId);

            if (equipment.length === 0) {
                equipmentListCard.style.display = 'block';
                equipmentListEl.innerHTML = '<div class="empty-state">No equipment added yet. Use the form above to add your first item.</div>';
                renderPreview([]);
                return;
            }

            equipmentListCard.style.display = 'block';

            // Capture which items are currently expanded
            const beforeExpand = new Set();
            equipmentListEl.querySelectorAll('.equipment-body.open').forEach(body => {
                const m = body.id.match(/eqBody_(\d+)/);
                if (m) beforeExpand.add(parseInt(m[1]));
            });

            equipmentListEl.innerHTML = '';
            equipment.forEach((eq, idx) => {
                const item = document.createElement('div');
                item.className = 'equipment-item';

                const emoji = eq.emoji || '🔧';
                const taskCount = eq.tasks?.length || 0;

                // Build dehumidifier details badge
                let dehumDetails = '';
                if (eq.type === 'Dehumidifier') {
                    const parts = [];
                    if (eq.serialNumber) parts.push(`SN: ${eq.serialNumber}`);
                    if (eq.filterSize) parts.push(`Filter: ${eq.filterSize}`);
                    if (parts.length > 0) {
                        dehumDetails = `<div class="equipment-details">${parts.join(' · ')}</div>`;
                    }
                }

                item.innerHTML = `
                    <div class="equipment-header" data-idx="${idx}">
                        <span class="equipment-emoji">${emoji}</span>
                        <div class="equipment-info">
                            <div class="equipment-name">${eq.name}</div>
                            ${eq.type ? `<span class="equipment-type-badge">${eq.type}</span>` : ''}
                            ${dehumDetails}
                        </div>
                        <span class="equipment-task-count">${taskCount} task${taskCount !== 1 ? 's' : ''}</span>
                        <button class="equipment-delete-btn" data-idx="${idx}" title="Remove equipment">✕</button>
                    </div>
                    <div class="equipment-body" id="eqBody_${idx}">
                        <div class="subtask-list" id="subtaskList_${idx}"></div>

                        <!-- Scheduled Maintenance Header -->
                        <div class="tracker-title">Scheduled Maintenance</div>
                        <div class="add-subtask-form">
                            <form class="add-subtask-inner" data-idx="${idx}">
                                <div class="form-group">
                                    <label>Task Name</label>
                                    <input type="text" class="subtask-name-input" placeholder="e.g., Replace filter, Tighten connections" required autocomplete="off">
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Interval</label>
                                        <div style="display:flex; gap:8px;">
                                            <input type="number" class="subtask-interval-value" min="1" value="30" style="flex:1; -webkit-appearance: textfield; -moz-appearance: textfield; appearance: textfield;" required>
                                            <select class="subtask-interval-unit" style="flex:1;">
                                                <option value="days">Days</option>
                                                <option value="months">Months</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Start Date</label>
                                        <input type="date" class="subtask-start-date" value="${todayStr()}" required>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Emoji</label>
                                    <div class="emoji-row">
                                        <button type="button" class="emoji-btn selected" data-emoji="🔧">🔧</button>
                                        <button type="button" class="emoji-btn" data-emoji="🧹">🧹</button>
                                        <button type="button" class="emoji-btn" data-emoji="🌀">🌀</button>
                                        <button type="button" class="emoji-btn" data-emoji="💧">💧</button>
                                        <button type="button" class="emoji-btn" data-emoji="❄️">❄️</button>
                                        <button type="button" class="emoji-btn" data-emoji="🌡️">🌡️</button>
                                        <button type="button" class="emoji-btn" data-emoji="⚙️">⚙️</button>
                                        <button type="button" class="emoji-btn" data-emoji="🔍">🔍</button>
                                        <button type="button" class="emoji-btn" data-emoji="🛠️">🛠️</button>
                                    </div>
                                </div>
                                <div class="form-actions">
                                    <button type="submit" class="btn btn-primary btn-small">Add Task</button>
                                </div>
                            </form>
                        </div>

                        <!-- Repair Log -->
                        <div class="tracker-section" style="margin-top: 16px;">
                            <div class="tracker-title">Repair Log</div>
                            <div class="tracker-list" id="trackerList_${idx}"></div>
                            <div class="add-tracker-form">
                                <form class="add-tracker-inner" data-idx="${idx}">
                                    <div class="form-row">
                                        <div class="form-group" style="flex:2;">
                                            <label>Description</label>
                                            <input type="text" class="tracker-name-input" placeholder="e.g., Compressor replaced" required autocomplete="off">
                                        </div>
                                        <div class="form-group" style="flex:1;">
                                            <label>Date</label>
                                            <input type="date" class="tracker-date-input" value="${todayStr()}" required>
                                        </div>
                                    </div>
                                    <div class="form-actions">
                                        <button type="submit" class="btn btn-primary btn-small">Log Entry</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                `;

                equipmentListEl.appendChild(item);

                // Restore expanded state for this item
                const body = $(`eqBody_${idx}`);
                if (expandedSet.has(idx) || beforeExpand.has(idx)) {
                    body.classList.add('open');
                }

                // Render subtasks
                const subtaskList = $(`subtaskList_${idx}`);
                if (eq.tasks && eq.tasks.length > 0) {
                    eq.tasks.forEach((task, tIdx) => {
                        const taskEl = document.createElement('div');
                        taskEl.className = 'subtask-item';
                        taskEl.innerHTML = `
                            <span class="subtask-emoji">${task.emoji || '🔧'}</span>
                            <div class="subtask-info">
                                <div class="subtask-name">${task.name}</div>
                                <div class="subtask-interval">Every ${task.intervalValue} ${task.intervalUnit}</div>
                            </div>
                            <span class="subtask-start">Start: ${task.startDate}</span>
                            <button class="subtask-edit-btn" data-eq-idx="${idx}" data-task-idx="${tIdx}" title="Edit task">✎</button>
                            <button class="subtask-delete-btn" data-eq-idx="${idx}" data-task-idx="${tIdx}" title="Remove task">✕</button>
                        `;
                        subtaskList.appendChild(taskEl);
                    });
                }

                // Render additional maintenance tracker entries
                const trackerList = $(`trackerList_${idx}`);
                if (eq.additionalMaintenance && eq.additionalMaintenance.length > 0) {
                    const sorted = [...eq.additionalMaintenance].sort((a, b) => b.date.localeCompare(a.date));
                    sorted.forEach((entry, sIdx) => {
                        const entryEl = document.createElement('div');
                        entryEl.className = 'tracker-item';
                        entryEl.innerHTML = `
                            <span class="tracker-date">${entry.date}</span>
                            <span class="tracker-name">${entry.name}</span>
                            <button class="tracker-delete-btn" data-eq-idx="${idx}" data-tracker-id="${entry.id}" title="Remove entry">✕</button>
                        `;
                        trackerList.appendChild(entryEl);
                    });
                }
            });

            // Bind expand/collapse headers
            equipmentListEl.querySelectorAll('.equipment-header').forEach(header => {
                header.addEventListener('click', (e) => {
                    if (e.target.closest('.equipment-delete-btn') || e.target.closest('.subtask-edit-btn')) return;
                    const idx = parseInt(header.dataset.idx);
                    const body = $(`eqBody_${idx}`);
                    body.classList.toggle('open');
                    if (body.classList.contains('open')) {
                        expandedSet.add(idx);
                    } else {
                        expandedSet.delete(idx);
                    }
                });
            });

            // Bind equipment delete buttons
            equipmentListEl.querySelectorAll('.equipment-delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.idx);
                    deleteEquipment(idx);
                });
            });

            // Bind subtask edit buttons
            equipmentListEl.querySelectorAll('.subtask-edit-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const eqIdx = parseInt(btn.dataset.eqIdx);
                    const taskIdx = parseInt(btn.dataset.taskIdx);
                    loadTaskIntoForm(eqIdx, taskIdx);
                });
            });

            // Bind subtask delete buttons
            equipmentListEl.querySelectorAll('.subtask-delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const eqIdx = parseInt(btn.dataset.eqIdx);
                    const taskIdx = parseInt(btn.dataset.taskIdx);
                    deleteSubtask(eqIdx, taskIdx);
                });
            });

            // Bind add subtask forms
            equipmentListEl.querySelectorAll('.add-subtask-inner').forEach(form => {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const idx = parseInt(form.dataset.idx);
                    addSubtask(idx, form);
                });
            });

            // Bind emoji buttons in subtask forms
            equipmentListEl.querySelectorAll('.emoji-row').forEach(row => {
                row.querySelectorAll('.emoji-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        row.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
                        btn.classList.add('selected');
                    });
                });
            });

            // Bind tracker delete buttons
            equipmentListEl.querySelectorAll('.tracker-delete-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const eqIdx = parseInt(btn.dataset.eqIdx);
                    const trackerId = btn.dataset.trackerId;
                    deleteTrackerEntry(eqIdx, trackerId);
                });
            });

            // Bind add tracker forms
            equipmentListEl.querySelectorAll('.add-tracker-inner').forEach(form => {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const idx = parseInt(form.dataset.idx);
                    addTrackerEntry(idx, form);
                });
            });
        }

        // ---- Add Equipment ----
        equipmentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const roomId = getActiveRoomId();
            if (!roomId) {
                showToast('Please select a room first.');
                return;
            }

            const type = equipmentTypeSelect.value;
            const name = equipmentNameInput.value.trim();
            if (!name) {
                showToast('Please enter an equipment name.');
                return;
            }

            const eqEmoji = getEmojiForType(type);

            // Capture dehumidifier-specific fields
            const serialNumber = type === 'Dehumidifier' ? $('equipmentSerial').value.trim() : undefined;
            const filterSize = type === 'Dehumidifier' ? $('equipmentFilterSize').value.trim() : undefined;

            const equipment = getRoomEquipment(roomId);
            equipment.push({
                id: uid(),
                type: type,
                name: name,
                emoji: eqEmoji,
                installedDate: todayStr(),
                serialNumber: serialNumber || undefined,
                filterSize: filterSize || undefined,
                tasks: [],
                additionalMaintenance: []
            });

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;

            equipmentNameInput.value = '';
            equipmentTypeSelect.value = '';
            $('equipmentSerial').value = '';
            $('equipmentFilterSize').value = '';
            renderEquipmentList();
            autoSyncCalendar(roomId);
            showToast(`Added "${name}" to room`);
        });

        // ---- Load Task Into Form (for editing) ----
        function loadTaskIntoForm(eqIdx, taskIdx) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq || !eq.tasks || !eq.tasks[taskIdx]) return;

            const task = eq.tasks[taskIdx];

            // Find the add-subtask form for this equipment item
            const body = $(`eqBody_${eqIdx}`);
            if (!body) return;

            // Ensure the body is expanded so the user can see the form
            body.classList.add('open');
            expandedSet.add(eqIdx);

            // Populate form fields
            const form = body.querySelector('.add-subtask-inner');
            if (!form) return;

            form.querySelector('.subtask-name-input').value = task.name;
            form.querySelector('.subtask-interval-value').value = task.intervalValue;
            form.querySelector('.subtask-interval-unit').value = task.intervalUnit;
            form.querySelector('.subtask-start-date').value = task.startDate;

            // Select the matching emoji button
            const emojiRow = form.querySelector('.emoji-row');
            if (emojiRow) {
                emojiRow.querySelectorAll('.emoji-btn').forEach(b => b.classList.remove('selected'));
                const match = emojiRow.querySelector(`.emoji-btn[data-emoji="${task.emoji}"]`);
                if (match) {
                    match.classList.add('selected');
                } else {
                    emojiRow.querySelector('.emoji-btn')?.classList.add('selected');
                }
            }

            // Scroll the form into view
            form.scrollIntoView({ behavior: 'smooth', block: 'center' });

            showToast(`Editing "${task.name}" — submit to update`);
        }

        // ---- Get emoji for equipment type ----
        function getEmojiForType(type) {
            const map = {
                'Dehumidifier': '💧',
                'Air Conditioner': '❄️',
                'Plumbing': '🔩',
                'Irrigation Layout': '🚿',
                'Dripper System': '💦',
                'Table': '🪵',
                'HVAC Unit': '🌀'
            };
            return map[type] || '🔧';
        }

        // ---- Delete Equipment ----
        function deleteEquipment(idx) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const equipment = getRoomEquipment(roomId);
            const removed = equipment.splice(idx, 1)[0];

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            renderEquipmentList();
            autoSyncCalendar(roomId);
            showToast(`Removed "${removed?.name}"`);
        }

        // ---- Add Sub-task ----
        function addSubtask(eqIdx, form) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const nameInput = form.querySelector('.subtask-name-input');
            const intervalValueInput = form.querySelector('.subtask-interval-value');
            const intervalUnitSelect = form.querySelector('.subtask-interval-unit');
            const startDateInput = form.querySelector('.subtask-start-date');
            const emojiRow = form.querySelector('.emoji-row');
            const selectedEmojiBtn = emojiRow?.querySelector('.emoji-btn.selected');

            const name = nameInput.value.trim();
            if (!name) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq) return;

            if (!eq.tasks) eq.tasks = [];

            // Check for a task with the same name — replace it instead of duplicating
            const existingIdx = eq.tasks.findIndex(t => t.name === name);
            const isNew = existingIdx === -1;

            const newTask = {
                id: uid(),
                name: name,
                intervalValue: parseInt(intervalValueInput.value),
                intervalUnit: intervalUnitSelect.value,
                startDate: startDateInput.value || todayStr(),
                emoji: selectedEmojiBtn?.dataset.emoji || '🔧'
            };

            if (isNew) {
                eq.tasks.push(newTask);
            } else {
                eq.tasks[existingIdx] = newTask;
            }

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            renderEquipmentList();
            autoSyncCalendar(roomId);
            showToast(isNew ? `Added task "${name}"` : `Updated task "${name}"`);
        }

        // ---- Delete Sub-task ----
        function deleteSubtask(eqIdx, taskIdx) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq || !eq.tasks) return;

            const removed = eq.tasks.splice(taskIdx, 1)[0];

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            renderEquipmentList();
            autoSyncCalendar(roomId);
            showToast(`Removed task "${removed?.name}"`);
        }

        // ---- Add Tracker Entry ----
        function addTrackerEntry(eqIdx, form) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const nameInput = form.querySelector('.tracker-name-input');
            const dateInput = form.querySelector('.tracker-date-input');

            const name = nameInput.value.trim();
            if (!name) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq) return;

            if (!eq.additionalMaintenance) eq.additionalMaintenance = [];
            eq.additionalMaintenance.push({
                id: uid(),
                name: name,
                date: dateInput.value || todayStr()
            });

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            notifySitkaTools();
            renderEquipmentList();
            showToast(`Logged "${name}"`);
        }

        // ---- Delete Tracker Entry ----
        function deleteTrackerEntry(eqIdx, trackerId) {
            const roomId = getActiveRoomId();
            if (!roomId) return;

            const equipment = getRoomEquipment(roomId);
            const eq = equipment[eqIdx];
            if (!eq || !eq.additionalMaintenance) return;

            const before = eq.additionalMaintenance.length;
            eq.additionalMaintenance = eq.additionalMaintenance.filter(e => e.id !== trackerId);

            if (eq.additionalMaintenance.length === before) {
                showToast('Entry not found.');
                return;
            }

            DB.data._EquipmentWizard.rooms[roomId].equipment = equipment;
            notifySitkaTools();
            renderEquipmentList();
            showToast('Removed entry');
        }

        // ---- Compute Calendar Events for a Single Equipment Item ----
        function computeEquipmentEvents(eq, roomId) {
            const roomName = DB.rooms[roomId]?.name || roomId;
            const today = todayStr();
            const endDate = addMonths(today, 12);
            const events = [];

            if (!eq.tasks) return events;
            for (const task of eq.tasks) {
                let current = task.startDate;

                while (current <= endDate) {
                    events.push({
                        id: uid(),
                        date: current,
                        title: `${task.emoji || '🔧'} ${task.name} — ${eq.name} — ${roomName}`,
                        sourceTool: 'EquipmentWizard',
                        roomId: roomId,
                        equipmentId: eq.id,
                        taskType: 'equipment_maintenance'
                    });

                    if (task.intervalUnit === 'months') {
                        current = addMonths(current, task.intervalValue);
                    } else {
                        current = addDays(current, task.intervalValue);
                    }
                }
            }

            return events;
        }

        // ---- Compute Calendar Events for a Room ----
        function computeCalendarEvents(roomId) {
            const equipment = getRoomEquipment(roomId);
            const events = [];

            for (const eq of equipment) {
                if (!eq.tasks) continue;
                events.push(...computeEquipmentEvents(eq, roomId));
            }

            return events;
        }

        // ---- Reconcile: Remove existing EquipmentWizard events for a room ----
        function reconcileRoomSchedule(roomId) {
            DB.data.calendarEvents = DB.data.calendarEvents.filter(ev => {
                if (ev.sourceTool === 'EquipmentWizard' && ev.roomId === roomId) {
                    return false;
                }
                return true;
            });
        }

        // ---- Purge calendar events for a specific equipment item ----
        function purgeEquipmentEvents(equipmentId) {
            DB.data.calendarEvents = DB.data.calendarEvents.filter(ev => {
                if (ev.sourceTool === 'EquipmentWizard' && ev.equipmentId === equipmentId) {
                    return false;
                }
                return true;
            });
        }

        // ---- Room Selector Change Handler — auto-sync on room switch ----
        activeRoomSelect.addEventListener('change', () => {
            renderEquipmentList();
            autoSyncCalendar();
        });

        // ---- Update Status Bar ----
        function updateStatusBar() {
            const statusBar = $('statusBar');
            const statusText = $('statusText');
            statusBar.classList.add('loaded');

            const roomId = getActiveRoomId();
            let eqCount = 0;
            let taskCount = 0;
            if (roomId) {
                const equipment = getRoomEquipment(roomId);
                eqCount = equipment.length;
                equipment.forEach(eq => { taskCount += (eq.tasks?.length || 0); });
            }

            statusText.textContent = `DB loaded · ${Object.keys(DB.rooms).length} rooms · ${eqCount} equipment · ${taskCount} tasks`;
        }

        // ---- Toast ----
        let toastTimer = null;
        function showToast(message) {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
        }

        // ---- Close Tool ----
        $('closeToolBtn').addEventListener('click', () => window.close());

        // ---- Initial render check ----
        updateStatusBar();
    </script>
</body>
</html>
