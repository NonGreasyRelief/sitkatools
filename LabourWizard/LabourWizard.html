<!-- LabourWizard.html — Labour tracking & cost reporting for SitkaGit suite -->
<!-- Tool: LabourWizard | Purpose: Track per-lot task labour (employees, hours, wages) and generate per-plant cost reports -->
<!-- Database Keys: "_LabourWizard" (top-level roster), "_tool_LabourWizard" (per-lot labour maps), "calendarEvents" (time-off only) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labour Wizard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #53d8a8;
            --accent-hover: #3fb98b;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8b8;
            --border: #2a2a4a;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --warning: #f39c12;
            --input-bg: #1a1a3e;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 24px; }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .header-right { display: flex; gap: 8px; align-items: flex-end; }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
        }

        /* ---- Status Bar ---- */
        .status-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-bar.loaded { border-color: var(--accent); }

        /* ---- Card ---- */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--accent);
        }

        /* ---- Form (selector) ---- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-group select {
            padding: 10px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ---- Buttons ---- */
        .btn {
            padding: 10px 24px;
            border-radius: var(--radius);
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover { border-color: var(--text-secondary); }

        /* ---- Empty / Stub State ---- */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* ---- Footer ---- */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        /* ---- Toast notification ---- */
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 24px;
            border-radius: var(--radius);
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 300;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <!-- Header (lot-focused tool — Active Lot selector) -->
    <header class="header">
        <div class="header-left">
            <span class="logo">👷 Labour Wizard</span>
        </div>
        <div class="header-right">
            <div class="form-group">
                <label for="activeLot">Active Lot</label>
                <select id="activeLot">
                    <option value="">— Select a lot —</option>
                </select>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">No database loaded. Open from SitkaTools.</span>
        </div>

        <!-- Stub placeholder — tool content (Employees / Tasks tabs + Labour Report) to be implemented -->
        <div class="card">
            <h2 class="card-title">Labour Wizard</h2>
            <div class="empty-state">
                This tool is under construction.<br>
                Employees, Tasks, and Labour Report sections will appear here.
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <button class="btn btn-secondary" id="closeToolBtn">Close Tool</button>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        const $ = id => document.getElementById(id);

        // ---- Close Tool (only interactive element in this stub) ----
        $('closeToolBtn').addEventListener('click', () => window.close());
    </script>
</body>
</html>
