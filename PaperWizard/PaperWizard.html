                                const day = item0.day || 1;
                                members = cfgFields.filter(f => f.dayGroup === item0.dayGroup && (f.day || 1) === day).map(f => f.id);
                            } else {
                                members = [...new Set(cfgGroupMembers(id))];
                            }
                            drag = { mode: 'axis', id, kind, axis: handle.dataset.axis, offX: px - item0.x, offY: py - item0.y, members };
                        } else if (handle) {
                            drag = { mode: 'resize', id, kind, corner: handle.dataset.corner };
                        } else if (e.shiftKey && kind === 'field') {
                            // Shift-click a box → toggle it in the multi-selection.
                            selectCfgItem('field', id, { additive: true });
                        } else {
                            const item = findCfgItem(kind, id);
                            if (!item) return;
                            cfgSelection = { kind, id };
                            cfgMultiSel = new Set();
                            refreshCfgOverlays(); // selection visuals + properties panel
                            // Drag modes:
                            //   plain drag  → whole daily-entry group moves as one block.
                            //   Alt/⌥-drag  → ONLY the grabbed box (one field, one day).
                            //   Ctrl/⌘-drag → all boxes on that day within the group (one row).
                            const members = new Set();
                            if (e.altKey) {
                                members.add(id);
                            } else if ((e.ctrlKey || e.metaKey) && item.dayGroup) {
                                // Move every box sharing this day + group (the whole row for that day).
                                const day = item.day || 1;
                                for (const f of cfgFields) {
                                    if (f.dayGroup === item.dayGroup && (f.day || 1) === day) members.add(f.id);
                                }
                            } else {
                                for (const sid of [id, ...cfgMultiSel]) for (const m of cfgGroupMembers(sid)) members.add(m);
                            }
                            drag = { mode: 'move', id, kind, offX: px - item.x, offY: py - item.y, members: [...members] };
                        }
                    } else if (e.shiftKey) {
                        // Shift-drag on empty space → marquee selection.
                        drag = { mode: 'marquee', x0: px, y0: py };
                        const el = document.createElement('div');
                        el.className = 'marquee';
                        el.style.left = (px * 100) + '%';
                        el.style.top = (py * 100) + '%';
                        el.style.width = '0%';
                        el.style.height = '0%';
                        pageEl.appendChild(el);
                        drag.el = el;
                    } else {
                        drag = { mode: 'create', x0: px, y0: py };
                        const el = document.createElement('div');
                        el.className = 'field-box';
                        el.style.left = (px * 100) + '%';
                        el.style.top = (py * 100) + '%';
                        el.style.width = '0%';
                        el.style.height = '0%';
                        pageEl.appendChild(el);
                        drag.el = el;
                    }
                    e.preventDefault();
                    try { pageEl.setPointerCapture(e.pointerId); } catch (_) {}
                });

                pageEl.addEventListener('pointermove', (e) => {
                    if (!drag) return;
                    const rect = pageEl.getBoundingClientRect();
                    if (!rect.width || !rect.height) return;
                    const px = clamp01((e.clientX - rect.left) / rect.width);
                    const py = clamp01((e.clientY - rect.top) / rect.height);

                    if (drag.mode === 'create') {
                        const x = Math.min(drag.x0, px), y = Math.min(drag.y0, py);
                        const w = Math.abs(px - drag.x0), h = Math.abs(py - drag.y0);
                        drag.el.style.left = (x * 100) + '%';
                        drag.el.style.top = (y * 100) + '%';
                        drag.el.style.width = (w * 100) + '%';
                        drag.el.style.height = (h * 100) + '%';
                        drag.geo = { x, y, w, h };
                    } else if (drag.mode === 'marquee') {
                        const x = Math.min(drag.x0, px), y = Math.min(drag.y0, py);
                        const w = Math.abs(px - drag.x0), h = Math.abs(py - drag.y0);
                        drag.el.style.left = (x * 100) + '%';
                        drag.el.style.top = (y * 100) + '%';
                        drag.el.style.width = (w * 100) + '%';
                        drag.el.style.height = (h * 100) + '%';
                        // Live selection: boxes on this page whose center falls inside the rect.
                        const hits = cfgFields
                            .filter(f => (f.page ?? 1) === pageNum && f.x + f.w / 2 >= x && f.x + f.w / 2 <= x + w && f.y + f.h / 2 >= y && f.y + f.h / 2 <= y + h)
                            .map(f => f.id);
                        cfgMultiSel = new Set(hits.slice(1));
                        cfgSelection = hits.length ? { kind: 'field', id: hits[0] } : null;
                        pageEl.querySelectorAll('.field-box').forEach(el => {
                            const isSel = cfgSelection?.id === el.dataset.id;
                            el.classList.toggle('selected', isSel);
                            el.classList.toggle('multi-sel', !isSel && cfgMultiSel.has(el.dataset.id));
                        });
                    } else if (drag.mode === 'move') {
                        // Move the primary box AND every member of its daily-entry group(s).
                        const item = findCfgItem(drag.kind, drag.id);
                        if (!item) return;
                        const nx = clamp01(px - drag.offX), ny = clamp01(py - drag.offY);
                        const dx = nx - item.x, dy = ny - item.y;
                        if (!dx && !dy) return;
                        if (drag.kind === 'signature') {
                            // The signature box lives in cfgSignature, not cfgFields.
                            item.x = r4(clamp01(item.x + dx));
                            item.y = r4(clamp01(item.y + dy));
                            const el = pageEl.querySelector(`.field-box[data-id="${drag.id}"]`);
                            if (el) { el.style.left = (item.x * 100) + '%'; el.style.top = (item.y * 100) + '%'; }
                        } else {
                            for (const mid of drag.members) {
                                const m = cfgFields.find(f => f.id === mid);
                                if (!m) continue;
                                m.x = r4(clamp01(m.x + dx));
                                m.y = r4(clamp01(m.y + dy));
                                const el = pageEl.querySelector(`.field-box[data-id="${mid}"]`);
                                if (el) { el.style.left = (m.x * 100) + '%'; el.style.top = (m.y * 100) + '%'; }
                            }
                        }
                    } else if (drag.mode === 'axis') {
                        // Axis-locked move: only the dragged axis changes — X for ↔, Y for ↕.
                        const item = findCfgItem(drag.kind, drag.id);
                        if (!item) return;
                        const nx = drag.axis === 'h' ? clamp01(px - (drag.offX ?? 0)) : item.x;
                        const ny = drag.axis === 'v' ? clamp01(py - (drag.offY ?? 0)) : item.y;
                        const dx = nx - item.x, dy = ny - item.y;
                        if (!dx && !dy) return;
                        if (drag.kind === 'signature') {
                            // The signature box lives in cfgSignature, not cfgFields.
                            item.x = r4(nx);
                            item.y = r4(ny);
                            const el = pageEl.querySelector(`.field-box[data-id="${drag.id}"]`);
                            if (el) { el.style.left = (item.x * 100) + '%'; el.style.top = (item.y * 100) + '%'; }
                        } else {
                            for (const mid of drag.members) {
                                const m = cfgFields.find(f => f.id === mid);
                                if (!m) continue;
                                m.x = r4(clamp01(m.x + dx));
                                m.y = r4(clamp01(m.y + dy));
                                const el = pageEl.querySelector(`.field-box[data-id="${mid}"]`);
                                if (el) { el.style.left = (m.x * 100) + '%'; el.style.top = (m.y * 100) + '%'; }
                            }
                        }
                    } else if (drag.mode === 'resize') {
                        const item = findCfgItem(drag.kind, drag.id);
                        if (!item) return;
                        let { x, y, w, h } = item;
                        if (drag.corner.includes('e')) w = clamp01(px - x);
                        if (drag.corner.includes('s')) h = clamp01(py - y);
                        if (drag.corner.includes('w')) { const right = x + w; x = Math.min(clamp01(px), right - 0.02); w = right - x; }
                        if (drag.corner.includes('n')) { const bottom = y + h; y = Math.min(clamp01(py), bottom - 0.02); h = bottom - y; }
                        // item is the live cfgSignature object for signature boxes and the
                        // live field object otherwise — mutating it updates the model either way.
                        item.x = r4(x); item.y = r4(y); item.w = r4(Math.max(w, 0.02)); item.h = r4(Math.max(h, 0.02));
                        const el = pageEl.querySelector(`.field-box[data-id="${drag.id}"]`);
                        if (el) {
                            el.style.left = (item.x * 100) + '%';
                            el.style.top = (item.y * 100) + '%';
                            el.style.width = (item.w * 100) + '%';
                            el.style.height = (item.h * 100) + '%';
                        }
                    }
                });

                const finishDrag = () => {
                    if (!drag) return;
                    if (drag.mode === 'create') {
                        const g = drag.geo;
                        if (g && g.w >= 0.02 && g.h >= 0.015) {
                            const f = {
                                id: generateFieldId(), label: `Field ${cfgFields.length + 1}`,
                                x: r4(g.x), y: r4(g.y), w: r4(g.w), h: r4(g.h),
                                page: pageNum, fontSize: 10, align: 'left',
                                source: null, questionId: null,
                                day: 1, dayGroup: null,
                                checkbox: false, checkValue: ''
                            };
                            cfgFields.push(f);
                            cfgSelection = { kind: 'field', id: f.id };
                        } else {
                            clearCfgSelection(); // plain click on empty space deselects
                        }
                    } else if (drag.mode === 'marquee') {
                        drag.el?.remove();
                    }
                    drag = null;
                    refreshCfgOverlays();
                };
                pageEl.addEventListener('pointerup', finishDrag);
                pageEl.addEventListener('pointercancel', () => { if (drag) { drag = null; refreshCfgOverlays(); } });
            });
        }

        // ---- Field properties panel (Step 3) ----
        const BINDING_OPTIONS = [
            ['lot.name', 'lot.name — lot #'],
            ['lot.lotNumber', 'lot.lotNumber — lot number only (strips the strain prefix)'],
            ['lot.strain', 'lot.strain — strain name'],
            ['lot.stage', 'lot.stage — phase'],
            ['lot.plantCount', 'lot.plantCount — plant count'],
            ['lot.parentLotId', 'lot.parentLotId — parent lot #'],
            ['lot.createdDate', 'lot.createdDate — creation date'],
            ['lot.destRoom', 'lot.destRoom — grow room'],
            ['lot.vegRoom', 'lot.vegRoom — veg room'],
            ['lot.cloningRoom', 'lot.cloningRoom — clone room'],
            ['lot.dryRoom', 'lot.dryRoom — dry room'],
            ['lot.trimRoom', 'lot.trimRoom — trim room'],
            ['lot.currentRoom', 'lot.currentRoom — room of this log (stored instance room, not the live lot)'],
            ['lot.roomDesignation', 'lot.roomDesignation — designation of the room of this log (stored instance room)'],
            ['lot.roomBuilding', 'lot.roomBuilding — building ID of the room of this log (stored instance room)'],
            ['instance.phase', 'instance.phase — phase snapshot'],
            ['sheet.periodStart', 'sheet.periodStart — window start'],
            ['sheet.periodEnd', 'sheet.periodEnd — window end'],
            ['day.date', 'day.date — date of the current day (MM/DD, row fields only)'],
            ['day.plantsRemoved', 'day.plantsRemoved — plants removed that day (yesterday − today, row fields only)'],
            ['signature.date', 'signature.date — date signed (yyyy/mm/dd, stamped when the signature is saved)'],
            ['year.current', 'year.current — last digit of the year (at save time)']
        ];

        // Candidate values for a checkbox field's "checked when value equals" — derived from
        // the field's auto-fill source so the user picks instead of typing (no typos). Phase
        // sources offer the fixed phase vocabulary; room sources offer every room name known
        // to the DB. Anything else stays free text.
        function checkValueOptionsFor(source) {
            if (source === 'instance.phase' || source === 'lot.stage') return PHASE_OPTIONS;
            if (['lot.destRoom', 'lot.vegRoom', 'lot.cloningRoom', 'lot.dryRoom', 'lot.trimRoom', 'lot.currentRoom'].includes(source))
                return knownRoomNames().sort((a, b) => a.localeCompare(b));
            if (source === 'lot.roomDesignation') return ROOM_DESIGNATIONS;
            if (source === 'lot.roomBuilding') return Object.keys(DB.buildings || {}).sort((a, b) => a.localeCompare(b));
            return null;
        }

        function fieldPropertiesPanelHtml() {
            if (!loadedDoc) return '<div class="fp-body" id="fpBody"><p class="cfg-hint">Load the form pages first, then click-drag over any page to create a text box.</p></div>';

            // Multi-selection: group controls instead of single-box properties.
            const selIds = selectedFieldIds();
            if (selIds.length > 1) {
                const groups = new Set(cfgFields.filter(f => selIds.includes(f.id) && f.dayGroup).map(f => f.dayGroup));
                return `
                    <div class="fp-body" id="fpBody">
                        <div class="field-properties">
                            <div class="fp-head"><span class="fp-id">${selIds.length} boxes selected</span></div>
                            ${groups.size ? `<p class="cfg-hint" style="margin-bottom:10px;">Selection includes daily-entry group${groups.size > 1 ? 's' : ''}: <b>${[...groups].join(', ')}</b>. Drag a member to move the whole group — hold <b>Ctrl/⌘</b> to move just that day's row, or <b>Alt/⌥</b> to move just that one box.</p>` : '<p class="cfg-hint" style="margin-bottom:10px;">Place the day-1 boxes over the form\'s first day row, select them all (Shift-click or Shift-drag), then group them — days 2–N are created as real boxes you can slide into position.</p>'}
                            <div style="display:flex; flex-direction:column; gap:8px;">
                                <button type="button" class="btn btn-primary" id="fpGroupBtn" style="min-height:42px;">🔗 Group as daily entry</button>
                                ${groups.size ? '<button type="button" class="btn btn-secondary" id="fpUngroupBtn" style="min-height:42px;">✂️ Ungroup (remove day 2–N boxes)</button>' : ''}
                                <button type="button" class="btn btn-secondary" id="fpDuplicateBtn" title="Copy every selected box — exact same size & position" style="min-height:42px;">⧉ Duplicate selection</button>
                            </div>
                        </div>
                    </div>`;
            }

            if (!cfgSelection) return '<div class="fp-body" id="fpBody"><p class="cfg-hint">Click-drag over any page to create a box. Drag a box to move it — plain drag moves the whole daily-entry group, <b>Ctrl/⌘</b>-drag moves just that day\'s row (all boxes on the same day), and <b>Alt/⌥</b>-drag moves just that one box; the ↕ / ↔ arrow handles slide along one axis only (same modifiers apply); corner & edge handles resize. ⧉ Duplicate (or Ctrl/⌘+D) copies a box at the exact same size & position. Shift-click or Shift-drag selects several boxes at once. Delete key removes the selection.</p></div>';

            const isSig = cfgSelection.kind === 'signature';
            const item = findCfgItem(cfgSelection.kind, cfgSelection.id);
            if (!item) return '<div class="fp-body" id="fpBody"><p class="cfg-hint">Selected box no longer exists.</p></div>';

            const pageOpts = Array.from({ length: cfgPageCount }, (_, i) =>
                `<option value="${i + 1}"${(item.page ?? 1) === i + 1 ? ' selected' : ''}>Page ${i + 1}</option>`).join('');
            const geo = `
                <div class="fp-grid">
                    <div class="form-group"><label for="fpX">X</label><input type="number" id="fpX" min="0" max="1" step="0.005" value="${item.x}"></div>
                    <div class="form-group"><label for="fpY">Y</label><input type="number" id="fpY" min="0" max="1" step="0.005" value="${item.y}"></div>
                    <div class="form-group"><label for="fpW">W</label><input type="number" id="fpW" min="0.01" max="1" step="0.005" value="${item.w}"></div>
                    <div class="form-group"><label for="fpH">H</label><input type="number" id="fpH" min="0.01" max="1" step="0.005" value="${item.h}"></div>
                </div>`;
            const pageSel = `
                <div class="form-group"><label for="fpPage">Page</label><select id="fpPage">${pageOpts}</select></div>`;

            let body;
            if (isSig) {
                body = `
                    <div class="form-group" style="margin-bottom:10px;"><label for="fpLabel">Label</label><input type="text" id="fpLabel" value="${escapeHtml(item.label || '')}" placeholder="e.g., Initials"></div>
                    ${geo}${pageSel}`;
            } else {
                const srcOpts = `<option value=""${!item.source ? ' selected' : ''}>— wizard question —</option>` +
                    BINDING_OPTIONS.map(([v, l]) => `<option value="${v}"${item.source === v ? ' selected' : ''}>${l}</option>`).join('');
                // Dropdown whenever the source has a known value set (phases / room names).
                const checkOpts = checkValueOptionsFor(item.source);
                body = `
                    <div class="form-group" style="margin-bottom:10px;"><label for="fpLabel">Label</label><input type="text" id="fpLabel" value="${escapeHtml(item.label || '')}" placeholder="e.g., Strain Name"></div>
                    ${geo}${pageSel}
                    <div class="fp-grid">
                        <div class="form-group"><label for="fpFontSize">Font (pt)</label><input type="number" id="fpFontSize" min="4" max="72" step="0.5" value="${item.fontSize ?? 10}"></div>
                        <div class="form-group"><label for="fpAlign">Align</label><select id="fpAlign">
                            <option value="left"${item.align === 'left' ? ' selected' : ''}>left</option>
                            <option value="center"${item.align === 'center' ? ' selected' : ''}>center</option>
                            <option value="right"${item.align === 'right' ? ' selected' : ''}>right</option>
                        </select></div>
                    </div>
                    <div class="form-group"><label for="fpSource">Auto-fill source</label><select id="fpSource">${srcOpts}</select></div>
                    <div class="form-group" id="fpQuestionWrap" style="display:${item.source ? 'none' : ''};">
                        <label for="fpQuestionLink">Filled by question</label>
                        <select id="fpQuestionLink">
                            <option value="">— none (unbound) —</option>
                            ${(cfgWizard?.questions || []).map(q => `<option value="${q.id}"${item.questionId === q.id ? ' selected' : ''}>${escapeHtml(q.label || q.id)}</option>`).join('')}
                        </select>
                    </div>
                    ${item.dayGroup ? `
                    <div class="form-group">
                        <label style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">Daily-entry group</label>
                        <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
                            <span class="fp-id">${escapeHtml(item.dayGroup)} · day ${item.day || 1}</span>
                            <button type="button" class="btn btn-secondary" id="fpUngroupBtn" style="min-height:36px; padding:4px 12px; font-size:0.8rem;">✂️ Ungroup</button>
                        </div>
                    </div>` : ''}
                    <div class="form-group">
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; letter-spacing:0; font-size:0.85rem; color:var(--text-primary);">
                            <input type="checkbox" id="fpCheckbox"${item.checkbox ? ' checked' : ''} style="width:18px; height:18px; min-height:0;"> ☑ Checkbox field (prints an X when its value matches)
                        </label>
                    </div>
                    <div class="form-group" id="fpCheckValueWrap" style="display:${item.checkbox ? '' : 'none'};"><label for="fpCheckValue">Checked when value equals</label>${checkOpts
                        ? (() => { const cv = item.checkValue ?? ''; const opts = checkOpts.includes(cv) ? checkOpts : [cv, ...checkOpts];
                            return `<select id="fpCheckValue">${opts.map(v => `<option value="${escapeHtml(v)}"${v === cv ? ' selected' : ''}>${escapeHtml(v)}</option>`).join('')}</select>`; })()
                        : `<input type="text" id="fpCheckValue" value="${escapeHtml(item.checkValue ?? '')}" placeholder="e.g., Bloom">`}</div>
                    ${cfgCadence === 'daily-weekly' ? `
                    <div class="form-group">
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; letter-spacing:0; font-size:0.85rem; color:var(--text-primary);">
                            <input type="checkbox" id="fpConstantField"${item.constant ? ' checked' : ''} style="width:18px; height:18px; min-height:0;"> 📌 Constant field (set once per lot via Initialize paperwork)
                        </label>
                        ${item.constant && !item.questionId ? '<p class="cfg-hint" style="margin:6px 0 0;">Bind a question first — constant fields are filled by the Initialize quiz, never by auto-fill.</p>' : ''}
                    </div>` : ''}`;
            }

            return `
                <div class="fp-body" id="fpBody">
                    <div class="field-properties">
                        <div class="fp-head">
                            <span class="fp-id">${isSig ? '✍️' : ''} ${escapeHtml(item.id)}</span>
                            <span style="display:flex; gap:6px;">
                                <button type="button" class="btn btn-secondary" id="fpDuplicateBtn" title="Copy this box — exact same size & position" style="min-height:36px; padding:4px 12px; font-size:0.8rem;">⧉ Duplicate</button>
                                <button type="button" class="btn btn-danger" id="fpDeleteBtn" style="min-height:36px; padding:4px 12px; font-size:0.8rem;">🗑 Delete</button>
                            </span>
                        </div>
                        ${body}
                    </div>
                </div>`;
        }

        function wireFieldProperties() {
            // Multi-selection panel: group / ungroup / duplicate actions.
            if (selectedFieldIds().length > 1) {
                $('fpGroupBtn')?.addEventListener('click', groupSelectionAsDailyEntry);
                $('fpUngroupBtn')?.addEventListener('click', ungroupSelection);
                $('fpDuplicateBtn')?.addEventListener('click', duplicateSelection);
                return;
            }
            if (!cfgSelection) return;
            const item = findCfgItem(cfgSelection.kind, cfgSelection.id);
            if (!item) return;
            const isSig = cfgSelection.kind === 'signature';
            // Light refresh — updates box + panel without reloading the page images.
            // Call sites pass ids with a leading '#' — strip it, since $ is getElementById.
            const num = (id, apply) => { const el = $(id.replace(/^#/, '')); if (!el) return; el.addEventListener('change', () => { apply(parseFloat(el.value)); refreshCfgOverlays(); }); };

            $('fpLabel').addEventListener('change', () => { item.label = $('fpLabel').value.trim(); refreshCfgOverlays(); });
            num('#fpX', v => { if (!isNaN(v)) item.x = r4(clamp01(v)); });
            num('#fpY', v => { if (!isNaN(v)) item.y = r4(clamp01(v)); });
            num('#fpW', v => { if (!isNaN(v)) item.w = r4(Math.max(0.01, Math.min(1, v))); });
            num('#fpH', v => { if (!isNaN(v)) item.h = r4(Math.max(0.01, Math.min(1, v))); });
            $('fpPage').addEventListener('change', () => { item.page = parseInt($('fpPage').value, 10) || 1; refreshCfgOverlays(); });

            if (!isSig) {
                num('#fpFontSize', v => { if (!isNaN(v)) item.fontSize = Math.max(4, Math.min(72, v)); });
                $('fpAlign').addEventListener('change', () => { item.align = $('fpAlign').value; refreshCfgOverlays(); });
                $('fpSource').addEventListener('change', () => {
                    // A field is either auto-filled or question-filled — never both. Bindings
                    // are column-level: the source applies to every day of THIS box's column
                    // (same group + same x); sibling columns in the same group keep their own
                    // bindings.
                    const src = $('fpSource').value || null;
                    const col = item.dayGroup
                        ? cfgFields.filter(x => x.dayGroup === item.dayGroup && Math.abs(x.x - item.x) < 0.005)
                        : [item];
                    // A constant field is quiz-filled, not binding-filled — same exclusivity as questionId.
                    for (const t of col) { if (src) { t.questionId = null; t.constant = false; } t.source = src; }
                    refreshCfgOverlays();
                    refreshWizardBuilder();
                });
                const qWrap = $('fpQuestionWrap');
                if (qWrap) {
                    qWrap.style.display = item.source ? 'none' : '';
                    $('fpQuestionLink').addEventListener('change', () => {
                        const qid = $('fpQuestionLink').value || null;
                        // The field side is the sole binding point. Propagate to every day of
                        // THIS box's column (same group + same x) — editing any day's box
                        // updates the whole column, so the binding repeats across all days.
                        // Sibling columns in the same group keep their own bindings.
                        const col = item.dayGroup
                            ? cfgFields.filter(x => x.dayGroup === item.dayGroup && Math.abs(x.x - item.x) < 0.005)
                            : [item];
                        for (const t of col) t.questionId = qid;
                        refreshCfgOverlays();
                        refreshWizardBuilder();
                    });
                }
                // Ungroup (single box in a daily-entry group): remove the group's day 2..N boxes.
                $('fpUngroupBtn')?.addEventListener('click', () => {
                    cfgMultiSel = new Set();
                    ungroupSelection();
                });
                const cbWrap = $('fpCheckValueWrap');
                if (cbWrap) {
                    cbWrap.style.display = item.checkbox ? '' : 'none';
                    $('fpCheckbox').addEventListener('change', () => { item.checkbox = $('fpCheckbox').checked; refreshCfgOverlays(); });
                    $('fpCheckValue').addEventListener('change', () => { item.checkValue = $('fpCheckValue').value.trim(); refreshCfgOverlays(); });
                }
                // Constant field (daily-weekly only): the value is set once per lot via the
                // cabinet's Initialize quiz and stored at lot+sheet level — it prints on every
                // page of the chain. A constant field is question-filled, never auto-filled.
                const cField = $('fpConstantField');
                if (cField) {
                    cField.addEventListener('change', () => {
                        item.constant = cField.checked;
                        if (item.constant && item.source) item.source = null; // quiz-filled, not binding-filled
                        refreshCfgOverlays();
                        refreshWizardBuilder();
                    });
                }
            }
            $('fpDuplicateBtn')?.addEventListener('click', duplicateSelection);
            $('fpDeleteBtn').addEventListener('click', deleteSelectedCfgItem);
        }

        // ---- Filing Cabinet (Step 5) — pure computed view, stores nothing ----

        // Map a configured sheet to one of the fixed cabinet sections.
        // Document values that mark a sheet as a room-clean form — one per room role, plus the
        // legacy single value from before the trees were split per room.
        const ROOM_CLEAN_DOCS = ['room-clean', 'room-clean-clone', 'room-clean-veg', 'room-clean-grow', 'room-clean-dry', 'room-clean-trim'];

        function sheetSection(sheetId) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return null;
            // Explicit assignment (Configure Sheets → Document dropdown) wins over heuristics.
            if (sheet.document && ROOM_CLEAN_DOCS.includes(sheet.document)) return 'room-clean';
            if (sheet.document && CAB_SECTIONS.some(s => s.key === sheet.document)) return sheet.document;
            if (sheet.cadence === 'daily-weekly') return 'grow-log';
            if (sheet.cadence === 'one-shot') return 'propagation';
            // event sheets: classify by sheet id / name keywords
            const s = (sheetId + ' ' + (sheet.name || '')).toLowerCase();
            if (/clean/.test(s)) return 'room-clean';
            if (/ipm|pest|spray|treat/.test(s)) return 'ipm';
            if (/harvest|trim|dry|cure/.test(s)) return 'harvest';
            return 'other';
        }

        const CAB_SECTIONS = [
            { key: 'grow-log', icon: '📗', label: 'Grow Logs' },
            { key: 'propagation', icon: '📄', label: 'Propagation' },
            { key: 'room-clean', icon: '🧼', label: 'Room Cleans (pre-move-in)' },
            { key: 'room-clean-post', icon: '🧽', label: 'Room Cleans (post-usage)' },
            { key: 'ipm', icon: '🐛', label: 'IPM Log' },
            { key: 'harvest', icon: '🌾', label: 'Harvest' },
            { key: 'drying-log', icon: '🏺', label: 'Drying Logs' },
            { key: 'trim-log', icon: '✂️', label: 'Trim Logs' },
            { key: 'other', icon: '📄', label: 'Other' }
        ];

        // Explicit document assignments offered in the Configure Sheets toolbar (shown when a
        // saved sheet is selected). Values are cabinet section keys — an assigned sheet files
        // under that section instead of the cadence/keyword heuristics.
        const SHEET_DOCUMENTS = [
            ['grow-log', '📗 Grow-Log'],
            ['propagation', '📄 Propagation work sheet'],
            ['harvest', '🌾 Harvest Log'],
            ['ipm', '🐛 IPM Log'],
            ['drying-log', '🏺 Drying Log'],
            ['trim-log', '✂️ Trim Log'],
            ['room-clean-clone', '🧼 Clone Room Clean'],
            ['room-clean-veg', '🧼 Veg Room Clean'],
            ['room-clean-grow', '🧼 Grow Room Clean'],
            ['room-clean-dry', '🧼 Dry Room Clean'],
            ['room-clean-trim', '🧼 Trim Room Clean']
        ];

        function wizardForSheet(sheetId) {
            return Object.values(DB.paperWizard?.wizards || {}).find(w => w.sheetId === sheetId) || null;
        }

        // Question ids that must be answered for a day slot to count as filled.
        function rowScopedQuestionIds(sheetId) {
            const wiz = wizardForSheet(sheetId);
            if (!wiz) return [];
            return (wiz.questions || []).filter(q => q.rowScoped).map(q => q.id);
        }

        // Instance-level questions (one-shot / event completion).
        function instanceQuestionIds(sheetId) {
            const wiz = wizardForSheet(sheetId);
            if (!wiz) return [];
            return (wiz.questions || []).filter(q => !q.rowScoped).map(q => q.id);
        }

        // Constant (header) questions: the ids of every question bound to at least one field
        // flagged `constant` on a daily-weekly sheet. These are set ONCE per lot via the
        // cabinet's "Initialize paperwork" quiz, stored at lot+sheet level (not per instance),
        // and excluded from the daily runner — they print on every page of the chain.
        function constantQuestionIds(sheetId) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet || sheet.cadence !== 'daily-weekly') return [];
            const ids = new Set();
            for (const f of sheet.fields || []) {
                if (f.constant && f.questionId) ids.add(f.questionId);
            }
            return [...ids];
        }

        // Lot-level constant values for a daily-weekly sheet: entries[lotId][sheetId].constants.
        // Sibling to `instances` — created lazily on first save, survives rollovers (a fresh
        // instance in the chain reads the same values). Pure getter (no mutation) so it is
        // safe to call from render paths; saveInitConstants ensures the path exists.
        function lotConstants(lotId, sheetId) {
            return DB.paperWizard?.entries?.[lotId]?.[sheetId]?.constants || null;
        }

        function hasAnswer(map, qid) {
            const v = map?.[qid];
            if (v === null || v === undefined) return false;
            // A drawn-initials answer is a {name, strokes} object — answered when it has strokes.
            if (typeof v === 'object') return Array.isArray(v.strokes) && v.strokes.length > 0;
            return String(v).trim() !== '';
        }

        // Is a given day fully answered for the sheet's row-scoped questions? A row-scoped
        // initials question is one of them — hasAnswer treats its {strokes} object as answered
        // only once drawn, so per-day accountability falls out with no special-casing.
        // Blank-but-confirmed fields count: saving a day's entry records EVERY row-scoped
        // question in the day object (blank answers stored as ''), so the mere presence of a
        // question's key means the user confirmed that day — an intentionally left-blank box
        // (e.g. an empty comments field) still counts as filled out for that day. Initials are
        // NEVER waived: their key is present even when the pad is empty (stored null), so they
        // only ever count via drawn strokes, regardless of confirm.
        function dayAnswered(instance, dateStr, sheetId) {
            const day = instance.days?.[dateStr];
            if (!day) return false;
            const qids = rowScopedQuestionIds(sheetId);
            if (qids.length === 0) {
                if (!Object.keys(day).some(k => hasAnswer(day, k))) return false;
            } else if (!qids.every(qid => hasAnswer(day, qid) || (qid in day && !isInitialsQuestion(sheetId, qid)))) return false;
            return true;
        }

        // True when the sheet's wizard defines this question as type 'initials'.
        function isInitialsQuestion(sheetId, qid) {
            const wiz = wizardForSheet(sheetId);
            return (wiz?.questions || []).find(q => q.id === qid)?.type === 'initials';
        }

        // Active window for a daily-weekly instance: [periodStart, min(periodEnd, phaseChangeDate)].
        function activeWindow(inst, key) {
            const start = parseDate(key);
            const endFull = new Date(start.getTime());
            endFull.setDate(endFull.getDate() + 6);
            let end = endFull;
            if (inst.phaseChangeDate) {
                const pc = parseDate(inst.phaseChangeDate);
                if (pc < end) end = pc;
                if (end < start) end = new Date(start.getTime()); // safety: never invert
            }
            return { start, end };
        }

        function daysBetween(a, b) {
            return Math.round((b - a) / 86400000) + 1;
        }

        // Completion rule (spec): daily-weekly = every active-window day answered for all
        // row-scoped questions (+ signature if defined; strikeInitials when phaseChangeDate set).
        // one-shot/event = all instance-level questions answered (+ signature if defined).
        function instanceComplete(sheetId, key, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return false;
            const needsSig = !!sheet.signature;
            if (sheet.cadence === 'daily-weekly') {
                const { start, end } = activeWindow(inst, key);
                const total = daysBetween(start, end);
                let filled = 0;
                for (const d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) {
                    if (dayAnswered(inst, dateToStr(d), sheetId)) filled++;
                }
                const strikeOk = !inst.phaseChangeDate || !!inst.strikeInitials;
                return filled === total && (!needsSig || inst.signature) && strikeOk;
            }
            const qids = instanceQuestionIds(sheetId);
            const answered = qids.filter(qid => hasAnswer(inst.header, qid)).length;
            return qids.length > 0 && answered === qids.length && (!needsSig || inst.signature);
        }

        // Re-evaluate completion after a save: completedAt is set/cleared — never a flag.
        function evaluateCompletion(sheetId, key, inst) {
            inst.completedAt = instanceComplete(sheetId, key, inst) ? new Date().toISOString() : null;
        }

        // ---- Phase change / write-back (Step 9) ----

        // Strike-out computation (spec: derived, never stored). Takes the instance's
        // phaseChangeDate + the sheet's day-row geometry (its explicit daily-entry groups)
        // and returns, PER PAGE, the struck rows, one diagonal across them, and label
        // positions — all in normalized page coords. A multi-page daily form (e.g. a
        // two-page grow-log) has its own repeating day section on each page, so every page
        // with struck rows gets its own strike-out. Feeds the print popup (SVG overlay).
        function computeStrikeOut(sheet, inst, key) {
            if (!inst?.phaseChangeDate) return null;
            const rows = dayRowsFromGroups(sheet);
            if (!rows) return null; // no day-row geometry configured
            // Group the sheet's day rows by page — each page's repeating section is struck
            // independently (its own diagonal + initials + date in that page's coords).
            const byPage = new Map();
            for (const r of rows) {
                const pg = r.fields[0]?.page ?? 1;
                if (!byPage.has(pg)) byPage.set(pg, []);
                byPage.get(pg).push(r);
            }
            const out = {};
            for (const [pg, pageRows] of byPage) {
                const s = strikeOutForRows(pageRows, key, inst.phaseChangeDate);
                if (s) out[pg] = s;
            }
            return Object.keys(out).length ? out : null;
        }

        // Strike-out for one page's day rows: the struck rows (dates after the change date),
        // one diagonal across them, and the initials/date label positions — normalized coords.
        function strikeOutForRows(rows, key, phaseChangeDate) {
            const d1 = (rows.find(r => r.day === 1)?.fields) || [];
            if (!d1.length) return null;
            // Horizontal extent of the day section (from the day-1 row).
            const x0 = Math.min(...d1.map(f => f.x));
            const x1 = Math.max(...d1.map(f => f.x + f.w));
            // Struck rows: every day row whose date is after the phase-change date.
            const struckRows = [];
            for (const r of rows) {
                const d = r.day || 1;
                if (d <= 1) continue;
                if (addDaysStr(key, d - 1) > phaseChangeDate) {
                    struckRows.push({
                        day: d,
                        yTop: Math.min(...r.fields.map(f => f.y)),
                        yBot: Math.max(...r.fields.map(f => f.y + f.h))
                    });
                }
            }
            if (!struckRows.length) return null;
            const first = struckRows[0], last = struckRows[struckRows.length - 1];
            // One diagonal: top-right of the first struck row → bottom-left of the last.
            const line = { x1, y1: first.yTop, x2: x0, y2: last.yBot };
            const midX = (line.x1 + line.x2) / 2, midY = (line.y1 + line.y2) / 2;
            const gap = Math.max(0.015, (last.yBot - first.yTop) * 0.08);
            // Drawn strike-initials box: a wide/short rect centered just above the midpoint.
            const iw = STRIKE_INITIALS_RECT.w, ih = STRIKE_INITIALS_RECT.h;
            return {
                struckRows,
                line,
                initialsRect: { x: midX - iw / 2, y: (midY - gap) - ih / 2, w: iw, h: ih }, // above the line
                date: { x: midX, y: midY + gap }      // centered just below it
            };
        }

        // Drawn strike-out initials capture: a modal pad (like the signature/initials pads) where
        // the master grower draws their initials for the phase-/room-change strike-out. Resolves
        // to { name, strokes } on confirm, or null if cancelled / left empty.
        function captureStrikeInitials(label, actionLabel, aspectRatio) {
            return new Promise((resolve) => {
                const ov = document.createElement('div');
                ov.className = 'strike-overlay';
                ov.innerHTML = `
                    <div class="strike-card">
                        <div class="strike-title">✍️ Strike-out initials — ${escapeHtml(label)}</div>
                        <div class="strike-sub">This closes the current log — rows after the change date are struck through. Draw your initials for the strike-out:</div>
                        <div class="sig-pad-wrap"><canvas id="strikePad" class="sig-pad"></canvas></div>
                        <input type="text" id="strikeName" class="sig-name" placeholder="Signer name / initials">
                        <div class="strike-foot">
                            <button type="button" class="btn btn-secondary" id="strikeClearBtn">🧹 Clear</button>
                            <span class="spacer"></span>
                            <button type="button" class="btn btn-secondary" id="strikeCancelBtn">Cancel</button>
                            <button type="button" class="btn btn-primary" id="strikeOkBtn">${escapeHtml(actionLabel || 'Record phase change')}</button>
                        </div>
                    </div>`;
                document.body.appendChild(ov);
                const dataAtOpen = DB.data; // a live update from SitkaTools replaces DB.data
                const strokes = [];
                // aspectRatio matches the strike-out box's on-paper pixel ratio (no skew).
                const pad = initDrawPad('strikePad', aspectRatio || 3, strokes);
                const nameEl = $('strikeName');
                const clearAll = () => { strokes.length = 0; if (pad) pad.clear(); };
                $('strikeClearBtn').addEventListener('click', clearAll);
                $('strikeCancelBtn').addEventListener('click', () => { ov.remove(); resolve(null); });
                $('strikeOkBtn').addEventListener('click', () => {
                    if (!strokes.length) { showToast('Draw your initials first'); return; }
                    const name = (nameEl.value || '').trim();
                    ov.remove();
                    // The DB was replaced while the pad was open: the save waiting on these initials
                    // still holds the old copy, so it is cancelled like Cancel (nothing saved).
                    if (DB.data !== dataAtOpen) {
                        alert('SitkaTools updated the database while this was open, so nothing was recorded. Please try again.');
                        resolve(null);
                        return;
                    }
                    resolve({ name, strokes });
                });
            });
        }

        // =====================================================
        // Grow logs started mid-crop, and backfilled changes
        // - A lot whose earlier paperwork is still on paper can start its first daily log on a
        //   chosen day, with a chosen phase / plant count / room. Days before that are marked
        //   "on paper" (entries[lot][sheet].paperBefore) and aren't flagged as missing.
        // - A past day's plant count / phase / room changed while later days are on file:
        //   plant count — later days in unsigned logs shift by the same difference;
        //   phase / room — the log is struck out on that day and the unsigned pages after it are
        //   rebuilt from that day with the new value (re-paged). Logs the master grower has signed
        //   are never changed: propagation stops at the first one.
        // =====================================================
        function hasValue(v) {
            return v !== null && v !== undefined && String(v).trim() !== '';
        }

        function sameTracked(field, a, b) {
            return field === 'phase'
                ? normalizeStage(a) === normalizeStage(b)
                : String(a ?? '').trim().toLowerCase() === String(b ?? '').trim().toLowerCase();
        }

        // A lot's daily-weekly instances for one sheet, oldest first.
        function dailyChain(lotId, sheetId) {
            const instances = DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances || {};
            return Object.keys(instances).sort().map(key => ({ key, inst: instances[key] }));
        }

        // Is `day` followed by later entries (or a later page) in this lot's chain?
        function isBackfillDay(lotId, sheetId, key, day) {
            return dailyChain(lotId, sheetId).some(c => c.key > key || Object.keys(c.inst.days || {}).some(ds => ds > day));
        }

        // Plant count on the newest recorded day of the chain (a later page wins a same-date tie).
        function latestChainPlantCount(lotId, sheetId, pcQ) {
            let best = null, bestDay = '';
            for (const { inst } of dailyChain(lotId, sheetId)) {
                for (const [ds, row] of Object.entries(inst.days || {})) {
                    if (hasValue(row?.[pcQ.id]) && ds >= bestDay) { best = Number(String(row[pcQ.id]).trim()); bestDay = ds; }
                }
            }
            return best;
        }

        // Later recorded counts a backfilled plant-count change applies to (unsigned logs only).
        // A later page's rows count from the edited date itself: after a phase/room change the
        // move day is on both pages (double entry), so editing the old page's move-day row must
        // reach the new page's row for the same date. `pages` = every unsigned later page (its
        // header plant-count snapshot shifts too, even before it has any rows).
        function plantShiftPlan(lotId, sheetId, key, day, pcQ) {
            const affected = [], signedDays = [], pages = [];
            let blocked = false;
            for (const { key: k, inst } of dailyChain(lotId, sheetId)) {
                if (k < key) continue;
                if (inst.signature) blocked = true;
                if (!blocked && k > key) pages.push(k);
                for (const ds of Object.keys(inst.days || {}).filter(d => (k === key ? d > day : d >= day)).sort()) {
                    const v = inst.days[ds]?.[pcQ.id];
                    if (!hasValue(v)) continue;
                    if (blocked) signedDays.push(ds);
                    else affected.push({ inst, key: k, ds, value: Number(String(v).trim()) });
                }
            }
            return { affected, signedDays, pages };
        }

        // Pages a backfilled phase/room change re-pages: the log it was recorded in, then later
        // unsigned pages that only continue it (tracked value = old or new — a change recorded
        // late merges in; the other tracked value unchanged). Stops at a signed page or a page
        // that records a different change.
        function repagePlan(lotId, sheetId, key, day, changes) {
            const chain = dailyChain(lotId, sheetId);
            const idx = chain.findIndex(c => c.key === key);
            const first = chain[idx];
            const pages = [first];
            const otherFields = ['phase', 'room'].filter(f => !changes.some(c => c.field === f));
            let stop = null;
            for (const c of chain.slice(idx + 1)) {
                const fits = changes.every(ch => !c.inst[ch.field]
                        || sameTracked(ch.field, c.inst[ch.field], ch.oldValue) || sameTracked(ch.field, c.inst[ch.field], ch.newValue))
                    && otherFields.every(f => !c.inst[f] || !first.inst[f] || sameTracked(f, c.inst[f], first.inst[f]));
                if (c.inst.signature || !fits) { stop = c; break; }
                pages.push(c);
            }
            // Days moving onto the rebuilt pages; a later page wins a double-entry date.
            const moved = new Map();
            for (const c of pages) {
                for (const ds of Object.keys(c.inst.days || {}).sort()) if (ds > day) moved.set(ds, c.inst.days[ds]);
            }
            // The page that led into the stop was struck on the stop's first day for a real
            // change ("linked"): the rebuilt pages end the same way and keep that day's row.
            const linked = !!stop && pages[pages.length - 1].inst.phaseChangeDate === stop.key;
            if (stop) for (const ds of [...moved.keys()]) if (linked ? ds > stop.key : ds >= stop.key) moved.delete(ds);
            return { pages, stop, linked, moved };
        }

        // Apply a re-page plan. `savedRow` is the backfilled day's entry (new value); `drawn` the
        // strike-out initials (null when the change is on the log's first day — that page simply
        // switches to the new value, nothing to strike).
        function applyRepage(lotId, sheetId, key, day, changes, plan, savedRow, drawn) {
            const sheetData = DB.paperWizard.entries[lotId][sheetId];
            const wiz = wizardForSheet(sheetId);
            const originals = plan.pages.map(c => ({ key: c.key, inst: c.inst }));
            const reprint = originals.filter(o => o.inst.printedAt).map(o => o.key);
            const first = originals[0].inst;
            const reuse = day === key;
            for (const o of originals.slice(1)) delete sheetData.instances[o.key];
            if (!reuse) {
                // The log the change was recorded in ends on that day; its row keeps the OLD value
                // (double entry), like a phase/room change recorded on the day.
                for (const ds of Object.keys(first.days || {})) if (ds > day) delete first.days[ds];
                first.phaseChangeDate = day;
                first.strikeInitials = { name: drawn.name, strokes: drawn.strokes };
                if (!first.days[day]) first.days[day] = {};
                for (const ch of changes) {
                    if (ch.q.rowScoped) first.days[day][ch.q.id] = ch.oldValue;
                    else first.header[ch.q.id] = ch.oldValue;
                }
            }
            const coverOf = (ds) => {
                let best = originals[0];
                for (const o of originals) if (o.key <= ds) best = o;
                return best.inst;
            };
            const rows = new Map([[day, { ...savedRow }]]);
            for (const [ds, row] of plan.moved) rows.set(ds, { ...row });
            const dates = [...rows.keys()].sort();
            const newKeys = [];
            let page = null;
            for (const ds of dates) {
                if (!page || ds > addDaysStr(page.key, 6)) {
                    const src = coverOf(ds);
                    page = { key: ds, inst: { phase: src.phase ?? null, room: src.room ?? null, header: {}, days: {},
                        phaseChangeDate: null, strikeInitials: null, snapshots: {}, signature: null, completedAt: null, printedAt: null } };
                    for (const ch of changes) page.inst[ch.field] = ch.newValue;
                    for (const [qid, v] of Object.entries(src.header || {})) {
                        const q = wiz.questions.find(x => x.id === qid);
                        if (q && q.type !== 'phase' && q.type !== 'room') page.inst.header[qid] = v;
                    }
                    for (const ch of changes) if (!ch.q.rowScoped) page.inst.header[ch.q.id] = ch.newValue;
                    sheetData.instances[ds] = page.inst;
                    newKeys.push(ds);
                }
                const row = rows.get(ds);
                for (const ch of changes) {
                    if (ch.q.rowScoped && hasValue(row[ch.q.id]) && sameTracked(ch.field, row[ch.q.id], ch.oldValue)) row[ch.q.id] = ch.newValue;
                }
                page.inst.days[ds] = row;
            }
            // The last rebuilt page must not run into the page we stopped at: end it like the
            // original did (linked change), or strike it the day before a signed page.
            if (plan.stop && page && addDaysStr(page.key, 6) >= plan.stop.key) {
                const lastOrig = originals[originals.length - 1].inst;
                if (plan.linked) {
                    page.inst.phaseChangeDate = plan.stop.key;
                    page.inst.strikeInitials = lastOrig.strikeInitials || (drawn ? { name: drawn.name, strokes: drawn.strokes } : null);
                } else {
                    page.inst.phaseChangeDate = addDaysStr(plan.stop.key, -1);
                    page.inst.strikeInitials = drawn ? { name: drawn.name, strokes: drawn.strokes } : (lastOrig.strikeInitials || null);
                }
            }
            for (const k of new Set([key, ...newKeys])) {
                if (!sheetData.instances[k]) continue;
                captureSnapshots(sheetId, lotId, k, sheetData.instances[k]);
                evaluateCompletion(sheetId, k, sheetData.instances[k]);
            }
            return { newKeys, reprint };
        }

        // Saving a backfilled day: work out what the change means for later days, confirm with
        // the user (and capture strike initials) BEFORE touching anything else, then apply.
        // Returns { message } — or null when cancelled (the caller rolls the save back).
        async function applyBackfill(ctx, wiz, inst, backup) {
            const { lotId, sheetId, key, day } = ctx;
            const phaseQ = wiz.questions.find(q => q.type === 'phase');
            const roomQ = wiz.questions.find(q => q.type === 'room');
            const pcQ = wiz.questions.find(q => q.type === 'plant-count' && q.rowScoped);
            const notes = [];

            // Plant count: shift later recorded counts by the same difference
            let shift = null, delta = 0;
            if (pcQ && hasValue(ctx.draft[pcQ.id])) {
                const newCount = Number(String(ctx.draft[pcQ.id]).trim());
                const before = backup.day?.[pcQ.id];
                const oldCount = hasValue(before) ? Number(String(before).trim()) : lastRecordedPlantCount(lotId, sheetId, key, addDaysStr(day, -1));
                if (Number.isFinite(newCount) && Number.isFinite(oldCount) && oldCount !== null && newCount !== oldCount) {
                    delta = newCount - oldCount;
                    const plan = plantShiftPlan(lotId, sheetId, key, day, pcQ);
                    if (plan.affected.length || plan.pages.length) {
                        const n = plan.affected.length;
                        const laterTxt = n
                            ? `${n} later day${n === 1 ? '' : 's'} (${fmtShort(plan.affected[0].ds)} – ${fmtShort(plan.affected[n - 1].ds)}) still count from the old number`
                            : `The log${plan.pages.length === 1 ? '' : 's'} after it still start${plan.pages.length === 1 ? 's' : ''} from the old number`;
                        let msg = `⚠️ You changed the plant count on ${fmtShort(day)} from ${oldCount} to ${newCount}.\n\n` +
                            `${laterTxt}.\n\nOK — apply the ${delta > 0 ? '+' : ''}${delta} change to them.\nCancel — save this day only.`;
                        if (plan.signedDays.length) msg += `\n\n${plan.signedDays.length} day(s) in logs the master grower has signed stay as they are.`;
                        if (confirm(msg)) shift = plan;
                    } else if (plan.signedDays.length) {
                        notes.push(`${plan.signedDays.length} signed day(s) after it keep the old count`);
                    }
                }
            }

            // Phase / room: re-page the unsigned logs after the day
            const changes = [];
            for (const [field, q] of [['phase', phaseQ], ['room', roomQ]]) {
                if (!q) continue;
                const nv = String(ctx.draft[q.id] ?? '').trim();
                if (!nv) continue;
                const before = q.rowScoped ? backup.day?.[q.id] : backup.header?.[q.id];
                const old = hasValue(before) ? String(before).trim() : (inst[field] || null);
                if (old && !sameTracked(field, old, nv)) {
                    changes.push({ field, q,
                        oldValue: field === 'phase' ? normalizeStage(old) : old,
                        newValue: field === 'phase' ? normalizeStage(nv) : nv });
                }
            }
            let repage = null, drawn = null;
            if (changes.length) {
                const what = changes.map(c => `${c.field} (${c.oldValue} → ${c.newValue})`).join(' and ');
                if (inst.signature) {
                    alert(`This log is signed by the master grower, so the ${what} change can't be re-paged. Nothing was saved.`);
                    return null;
                }
                if (inst.phaseChangeDate && day >= inst.phaseChangeDate) {
                    alert(`This log already ends on ${fmtShort(inst.phaseChangeDate)} — record the ${what} change on the log that follows it. Nothing was saved.`);
                    return null;
                }
                const plan = repagePlan(lotId, sheetId, key, day, changes);
                const movedDays = [...plan.moved.keys()].sort();
                let msg = `⚠️ You changed the ${what} on ${fmtShort(day)}, but the days after it were logged under the old value.\n\n`;
                msg += day === key
                    ? `This log starts on ${fmtShort(day)}, so it switches to the new value`
                    : `The log starting ${fmtShort(key)} will be struck out on ${fmtShort(day)}, and a new page starts that day`;
                msg += movedDays.length
                    ? ` — ${movedDays.length} later day${movedDays.length === 1 ? '' : 's'} (${fmtShort(movedDays[0])} – ${fmtShort(movedDays[movedDays.length - 1])}) are re-paged under the new value.`
                    : '.';
                if (plan.stop) {
                    msg += plan.stop.inst.signature
                        ? `\n\nThe log starting ${fmtShort(plan.stop.key)} is signed by the master grower and stays as it is.`
                        : `\n\nThe log starting ${fmtShort(plan.stop.key)} records a later change and stays as it is.`;
                }
                msg += `\n\nOK — re-page.\nCancel — don't save this change.`;
                if (!confirm(msg)) return null;
                if (day !== key) {
                    const strikeSheet = DB.paperWizard.sheets[sheetId];
                    drawn = await captureStrikeInitials(changes.map(c => c.newValue).join(' · '), 'Re-page logs', boxPrintAspect(strikeSheet, STRIKE_INITIALS_RECT));
                    if (!drawn) { showToast('Re-page cancelled — no changes made'); return null; }
                }
                repage = plan;
            }

            // Apply — no more prompts from here on
            if (shift) {
                const touched = new Set(shift.pages);
                for (const a of shift.affected) {
                    a.inst.days[a.ds][pcQ.id] = String(Math.max(0, a.value + delta));
                    touched.add(a.key);
                }
                for (const k of touched) {
                    const t = DB.paperWizard.entries[lotId][sheetId].instances[k];
                    const snap = t.snapshots?.['lot.plantCount'];
                    if (hasValue(snap) && Number.isFinite(Number(snap))) t.snapshots['lot.plantCount'] = String(Math.max(0, Number(snap) + delta));
                    evaluateCompletion(sheetId, k, t);
                }
                notes.push(`${shift.affected.length} later count${shift.affected.length === 1 ? '' : 's'}${shift.pages.length ? ` and ${shift.pages.length} later page${shift.pages.length === 1 ? '' : 's'}` : ''} adjusted by ${delta > 0 ? '+' : ''}${delta}`);
                const reprint = [...touched].filter(k => DB.paperWizard.entries[lotId][sheetId].instances[k].printedAt);
                if (reprint.length) notes.push(`reprint ${reprint.map(fmtShort).join(', ')}`);
            }
            if (repage) {
                const savedRow = { ...(inst.days[day] || {}) };
                const r = applyRepage(lotId, sheetId, key, day, changes, repage, savedRow, drawn);
                notes.push(`re-paged from ${fmtShort(day)} (${r.newKeys.length} page${r.newKeys.length === 1 ? '' : 's'})`);
                if (r.reprint.length) notes.push(`reprint ${r.reprint.map(fmtShort).join(', ')}`);
                // The lot's live phase/room follows the change only when nothing later overrides it
                if (!repage.stop && DB.lots[lotId]) {
                    for (const ch of changes) {
                        if (ch.field === 'phase') DB.lots[lotId].stage = stageFromForm(ch.newValue);
                        else DB.lots[lotId].currentRoom = ch.newValue;
                    }
                }
            }
            // The lot's live plant count always follows the newest recorded day
            if (pcQ && DB.lots[lotId]) {
                const latest = latestChainPlantCount(lotId, sheetId, pcQ);
                if (latest !== null) DB.lots[lotId].plantCount = latest;
            }
            return { message: `Backfilled entry saved${notes.length ? ' · ' + notes.join(' · ') : ''}` };
        }

        // "Start grow log on a chosen day" — for a lot with no daily log of this sheet yet (its
        // earlier paperwork is on paper). Sets the lot's live phase / room / plant count to the
        // chosen starting values, marks the days before as on paper, creates the first page.
        function openStartLogModal(lotId, sheetId) {
            if (readOnlyHere(lotId)) return;
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            const lot = DB.lots[lotId];
            if (!sheet || !lot) return;
            const today = todayStr();
            const curPhase = currentLotPhase(lotId);
            const curRoom = currentLotRoom(lotId);
            const rooms = pickableRoomNames(curRoom).sort((a, b) => a.localeCompare(b));
            // A stage outside the form's phase list (drying / curing) is offered too, preselected —
            // otherwise the first option would be picked and overwrite the lot's stage.
            const phases = curPhase && !PHASE_OPTIONS.includes(curPhase) ? [...PHASE_OPTIONS, curPhase] : PHASE_OPTIONS;
            const ov = document.createElement('div');
            ov.className = 'wiz-overlay';
            ov.id = 'startLogOverlay';
            ov.innerHTML = `
                <div class="wiz-card">
                    <div class="wiz-head"><span class="wiz-title">📅 Start ${escapeHtml(sheet.name || sheetId)} on a chosen day</span></div>
                    <div class="wiz-body">
                        <div class="startlog-grid">
                            <label>First day of the log<input type="date" class="sig-name" id="startLogDate" max="${today}" value="${today}"></label>
                            <label>Phase<select class="sig-name" id="startLogPhase">
                                ${phases.map(p => `<option value="${escapeHtml(p)}"${p === curPhase ? ' selected' : ''}>${escapeHtml(p.charAt(0).toUpperCase() + p.slice(1))}</option>`).join('')}
                            </select></label>
                            <label>Plant count<input type="number" min="0" step="1" class="sig-name" id="startLogCount" value="${hasValue(lot.plantCount) ? escapeHtml(String(lot.plantCount)) : ''}"></label>
                            <label>Room<select class="sig-name" id="startLogRoom">
                                <option value="">— none —</option>
                                ${rooms.map(r => `<option${r === curRoom ? ' selected' : ''}>${escapeHtml(r)}</option>`).join('')}
                            </select></label>
                        </div>
                        <div class="startlog-note">Days before this date stay on paper and won't be flagged as missing. The lot's current phase, room and plant count are set to these starting values.</div>
                    </div>
                    <div class="wiz-foot">
                        <span class="spacer"></span>
                        <button type="button" class="btn btn-secondary" id="startLogCancel">Cancel</button>
                        <button type="button" class="btn btn-primary" id="startLogOk">Start log</button>
                    </div>
                </div>`;
            document.body.appendChild(ov);
            $('startLogCancel').addEventListener('click', () => ov.remove());
            $('startLogOk').addEventListener('click', () => {
                if (readOnlyHere(lotId)) { ov.remove(); return; }
                // Look the lot up again — a live update from SitkaTools may have replaced the DB
                // while this dialog was open.
                const lot = DB.lots[lotId];
                if (!lot) { ov.remove(); showToast('This lot is no longer in the database'); return; }
                const date = $('startLogDate').value;
                const phase = $('startLogPhase').value;
                const countRaw = $('startLogCount').value.trim();
                const room = $('startLogRoom').value || null;
                if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date > today) { showToast('Pick a start date on or before today'); return; }
                if (countRaw !== '' && !(Number.isInteger(Number(countRaw)) && Number(countRaw) >= 0)) { showToast('Plant count must be a whole number'); return; }
                if (dailyChain(lotId, sheetId).length) { showToast('This lot already has a log — use Fill instead'); ov.remove(); return; }
                // Live lot values (PaperWizard's write-back permission: stage / currentRoom / plantCount).
                // The stage is only written when the pick differs from the lot's current one.
                if (phase !== curPhase) lot.stage = stageFromForm(phase);
                lot.currentRoom = room;
                if (countRaw !== '') lot.plantCount = Number(countRaw);
                const pw = DB.paperWizard;
                if (!pw.entries[lotId]) pw.entries[lotId] = {};
                if (!pw.entries[lotId][sheetId]) pw.entries[lotId][sheetId] = { instances: {} };
                const sheetData = pw.entries[lotId][sheetId];
                if (!sheetData.instances) sheetData.instances = {};
                sheetData.paperBefore = date;
                const inst = { phase: normalizeStage(phase), room, header: {}, days: {}, phaseChangeDate: null, strikeInitials: null,
                               snapshots: {}, signature: null, completedAt: null, printedAt: null };
                // Seed the first day's plant count so the wizard opens with it filled in
                const pcQ = wizardForSheet(sheetId)?.questions.find(q => q.type === 'plant-count' && q.rowScoped);
                if (pcQ && countRaw !== '') inst.days[date] = { [pcQ.id]: String(Number(countRaw)) };
                sheetData.instances[date] = inst;
                captureSnapshots(sheetId, lotId, date, inst);
                evaluateCompletion(sheetId, date, inst);
                ov.remove();
                notifySitkaTools();
                renderAll();
                showToast(`Log started ${fmtShort(date)} — earlier days are on paper`);
                openRunner(lotId, sheetId, date, date);
            });
        }

        // Rollover core for phase AND room changes (spec "Phase Change" + room-change rule) —
        // data-only: closes the open daily-weekly instance (phaseChangeDate = move day +
        // confirmer's drawn strikeInitials) and creates a fresh instance carrying the new value
        // (periodStart = move day, header carries it), optionally writing back to the main DB.
        // `moveDay` is the date the change is recorded on — today for live changes, the entry's
        // own day when a row-scoped question records a change on a backfilled day (the strike-out
        // and the fresh page both land on that day). cfg = { questionId, instField, label,
        // actionLabel, cancelMsg, writeBackFn }. `prevValue` is stamped on the old log's move-day
        // row — the double entry: one full entry under the old value, then a fresh 7-day page
        // starting on the same day under the new value (left for the user to fill in). Returns
        // { inst, newKey, value, reused } or null if cancelled — callers handle notify/close/render.
        async function dailyRollover(writeBack, moveDay, cfg, prevValue) {
            const ctx = runnerCtx;
            if (!ctx) return null;
            const wiz = wizardForSheet(ctx.sheetId);
            const q = wiz.questions.find(x => x.id === cfg.questionId);
            const value = String(q ? (ctx.draft[q.id] ?? '') : '').trim();
            if (!value) return null;
            const today = moveDay || todayStr();
            const oldInst = ctx.inst;
            const pw = DB.paperWizard;
            if (!pw.entries[ctx.lotId]) pw.entries[ctx.lotId] = {};
            if (!pw.entries[ctx.lotId][ctx.sheetId]) pw.entries[ctx.lotId][ctx.sheetId] = { instances: {} };
            const sheetData = pw.entries[ctx.lotId][ctx.sheetId];
            if (!sheetData.instances) sheetData.instances = {};
            // Collision at the move date with an old instance that holds nothing worth keeping
            // (change recorded on the window's very first day): two instances can't share a key,
            // and there is no earlier row to strike through — repurpose it in place as the fresh
            // page instead. cfg.freshOnly marks the save-first flow where the instance holds NO
            // pre-existing content (only this save's move-day entry, persisted before the
            // rollover ran); pre-save flows require a truly empty instance.
            const dayKeys = Object.keys(oldInst.days || {});
            const headerEmpty = !Object.entries(oldInst.header || {}).some(([, v]) => String(v ?? '').trim() !== '');
            if (sheetData.instances[today] === oldInst && !oldInst.signature
                && (cfg.freshOnly
                    ? dayKeys.length <= 1 && dayKeys.every(k => k === today)
                    : dayKeys.length === 0 && headerEmpty)) {
                oldInst[cfg.instField] = value;
                // The OTHER snapshot follows the live lot record — a same-save double change
                // already wrote the other new value back before this rollover ran (and the DB
                // was already correct for reverse-direction changes).
                if (cfg.instField === 'phase') oldInst.room = DB.lots[ctx.lotId]?.currentRoom || oldInst.room || null;
                else oldInst.phase = normalizeStage(DB.lots[ctx.lotId]?.stage) || oldInst.phase || null;
                oldInst.phaseChangeDate = null;
                oldInst.strikeInitials = null;
                for (const x of wiz.questions) {
                    if (!x.rowScoped && String(ctx.draft[x.id] ?? '').trim() !== '') oldInst.header[x.id] = ctx.draft[x.id];
                }
                // Row-scoped double entry: the new value also lands on this log's move-day row
                // (the instance was repurposed as the fresh log, so it carries the NEW value).
                if (q?.rowScoped) {
                    if (!oldInst.days[today]) oldInst.days[today] = {};
                    oldInst.days[today][q.id] = value;
                }
                if (writeBack) cfg.writeBackFn(value);
                captureSnapshots(ctx.sheetId, ctx.lotId, ctx.key, oldInst);
                evaluateCompletion(ctx.sheetId, ctx.key, oldInst);
                return { inst: oldInst, newKey: ctx.key, value, reused: true };
            }
            const strikeSheet = DB.paperWizard.sheets[ctx.sheetId];
            const drawn = await captureStrikeInitials(cfg.label(), cfg.actionLabel, boxPrintAspect(strikeSheet, STRIKE_INITIALS_RECT));
            if (!drawn) { showToast(`${cfg.cancelMsg} — no changes made`); return null; }
            // 1) Close the old instance: window ends at the move date, initials captured (drawn).
            oldInst.phaseChangeDate = today;
            oldInst.strikeInitials = { name: drawn.name, strokes: drawn.strokes };
            // 2) Fresh instance carrying the new value. periodStart = move date; if a non-empty
            //    log already owns that key, shift forward so nothing is clobbered — the new log
            //    then starts the day after the old one closed.
            let newKey = today;
            while (sheetData.instances[newKey]) newKey = addDaysStr(newKey, 1);
            const newInst = { [cfg.instField]: value, header: {}, days: {}, phaseChangeDate: null, strikeInitials: null,
                              snapshots: {}, signature: null, completedAt: null, printedAt: null };
            // Stamp the OTHER snapshot too — a phase change doesn't move the lot (and vice
            // versa), so the fresh log carries both its phase and its room. It comes from the
            // live lot record, which already reflects any same-save double change (written back
            // before this rollover ran; already correct for reverse-direction changes), falling
            // back to the old instance's snapshot when the lot record has no value.
            if (cfg.instField === 'phase') newInst.room = DB.lots[ctx.lotId]?.currentRoom || oldInst.room || null;
            else newInst.phase = normalizeStage(DB.lots[ctx.lotId]?.stage) || oldInst.phase || null;
            // Header carries any instance-level answers from this save — EXCEPT the tracked
            // question(s): the fresh log's move-day entry is filled by the user walking the
            // wizard a second time (the double entry), so its phase/room answers are NOT
            // pre-filled here.
            for (const x of wiz.questions) {
                if (!x.rowScoped && x.type !== 'phase' && x.type !== 'room'
                    && String(ctx.draft[x.id] ?? '').trim() !== '') newInst.header[x.id] = ctx.draft[x.id];
            }
            // Row-scoped double entry: the old log's move-day row is stamped with the PREVIOUS
            // value (the user filled that day out fully under the old phase/room before the
            // strike-out). The fresh log starts a brand-new 7-day window on the same day — its
            // move-day row is left for the user to fill in under the new value.
            if (q?.rowScoped && prevValue) {
                if (!oldInst.days[today]) oldInst.days[today] = {};
                oldInst.days[today][q.id] = prevValue;
            }
            sheetData.instances[newKey] = newInst;
            // 3) Write-back: the wizard-recorded change updates the main DB (PaperWizard's
            //    special permission). Reverse-direction rollovers skip this.
            if (writeBack) cfg.writeBackFn(value);
            captureSnapshots(ctx.sheetId, ctx.lotId, ctx.key, oldInst);
            evaluateCompletion(ctx.sheetId, ctx.key, oldInst);
            captureSnapshots(ctx.sheetId, ctx.lotId, newKey, newInst);
            evaluateCompletion(ctx.sheetId, newKey, newInst);
            return { inst: newInst, newKey, value, reused: false };
        }

        // Phase-change rollover (spec "Phase Change") — closes the open log and starts a fresh
        // one in the new phase, writing lot.stage back when the change came from the wizard.
        // `prevValue` is stamped on the old log's move-day row (the double entry); `freshOnly`
        // marks that the instance holds no pre-existing content (save-first flow).
        async function phaseRollover(writeBack, moveDay, prevValue, freshOnly) {
            const wiz = wizardForSheet(runnerCtx?.sheetId);
            // Write-back is a property of the question TYPE (implicit — no writesTo field).
            const phaseQ = wiz?.questions.find(q => q.type === 'phase');
            if (!phaseQ) return null;
            return dailyRollover(writeBack, moveDay, {
                questionId: phaseQ.id, instField: 'phase', freshOnly,
                label: () => String(runnerCtx.draft[phaseQ.id] ?? '').trim(),
                actionLabel: 'Record phase change',
                cancelMsg: 'Phase change cancelled',
                writeBackFn: v => { if (DB.lots[runnerCtx.lotId]) DB.lots[runnerCtx.lotId].stage = stageFromForm(v); } // 'Bloom' → 'flower'
            }, prevValue);
        }

        // Room-change rollover — the same strike-out + fresh log as a phase change, but the new
        // instance carries the new room (instance.room snapshot) and lot.currentRoom is written
        // back when the change came from the wizard.
        async function roomRollover(writeBack, moveDay, prevValue, freshOnly) {
