<!-- PaperWizard.html — Controlled paperwork fill & print tool for SitkaGit suite -->
<!-- Tool: PaperWizard | Purpose: Fill controlled paperwork from WebP page images via wizards, overlay text, print -->
<!-- Database Keys: "_PaperWizard" (top-level) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Wizard</title>
    <style>
        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #53d8a8;
            --accent-hover: #3fb98b;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8b8;
            --border: #2a2a4a;
            --danger: #e74c3c;
            --danger-hover: #c0392b;
            --warning: #f39c12;
            --input-bg: #1a1a3e;
            --radius: 8px;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ---- Header ---- */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left { display: flex; align-items: center; gap: 24px; }

        .logo {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        /* ---- Tabs (segmented) ---- */
        .tabs {
            display: flex;
            gap: 4px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 3px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            min-height: 42px;
            transition: all 0.15s ease;
        }

        .tab-btn:hover { color: var(--text-primary); }
        .tab-btn.active { background: var(--accent); color: #08301f; }

        /* ---- Header right side ---- */
        .header-right {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* ---- Form controls ---- */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        select, input[type="date"], input[type="text"], input[type="number"] {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-primary);
            padding: 8px 12px;
            font-size: 0.9rem;
            font-family: inherit;
            min-height: 48px; /* tablet touch target */
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        select:disabled { opacity: 0.5; cursor: not-allowed; }

        /* ---- Buttons ---- */
        .btn {
            border: none;
            border-radius: var(--radius);
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            min-height: 48px; /* tablet touch target */
            transition: background 0.15s ease;
        }

        .btn-primary { background: var(--accent); color: #08301f; }
        .btn-primary:hover { background: var(--accent-hover); }

        .btn-secondary { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }

        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: var(--danger-hover); }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* Header buttons (Load / Export) — ≥48px touch target */
        .db-btn { padding: 8px 12px; min-height: 48px; font-size: 0.85rem; }

        /* ---- Save popup (blob link — right-click → Save Link As…) ---- */
        .export-wrapper { position: relative; display: flex; align-items: flex-end; }

        .save-popup {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--accent);
            border-radius: var(--radius);
            padding: 12px 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 300px;
        }

        .save-popup.hidden { display: none; }

        .save-link {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
            line-height: 1.4;
        }

        .save-link:hover { text-decoration: underline; color: var(--accent-hover); }

        .save-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .save-close:hover { color: var(--danger); background: rgba(231, 76, 60, 0.15); }

        /* ---- Main Content ---- */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        /* ---- Status bar ---- */
        .status-bar {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 10px 16px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .status-bar.loaded { border-color: var(--accent); }

        /* ---- Empty state ---- */
        .empty-state {
            margin-bottom: 12px;
            text-align: center;
            padding: 64px 24px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .empty-state .empty-icon { font-size: 3rem; }
        .empty-state .empty-title { font-size: 1.15rem; font-weight: 600; color: var(--text-primary); }
        .empty-state .empty-sub { font-size: 0.9rem; max-width: 420px; line-height: 1.5; }

        /* ---- Toast ---- */
        .toast {
            position: fixed;
            bottom: 76px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            z-index: 300;
            max-width: 90vw;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- Footer (sticky) ---- */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        /* ---- Configure Sheets tab (Step 2) ---- */
        .cfg-toolbar {
            display: flex;
            align-items: flex-end;
            gap: 16px;
            flex-wrap: wrap;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .seg {
            display: flex;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .seg button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 8px 14px;
            min-height: 42px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .seg button.active { background: var(--accent); color: #08301f; }

        .file-chip {
            margin-left: auto;
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--text-primary);
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }

        /* Single column: the page stage on top, all property panels below it. */
        .cfg-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            align-items: start;
        }

        .page-stage {
            display: flex;                /* flex + margin:auto on the child = centered when it fits, scrollable (both axes) when zoomed past the edges */
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            height: calc(100vh - 320px);
            min-height: 420px;
            overflow: auto;
        }

        .page-stage > .empty-state { margin: auto; }

        .page-stack {
            margin: auto;                 /* centers when small, scrolls when zoomed */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 16px;
            width: max-content;
        }

        .page-stack > div {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .zoom-ctl {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #0b1220;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 3px 6px;
        }
        .zoom-ctl button {
            min-width: 28px;
            height: 28px;
            padding: 0 6px;
            line-height: 1;
            font-size: 0.95rem;
            border-radius: 6px;
            background: #131c2e;
            color: var(--text-primary);
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .zoom-ctl button:hover { background: #1b2740; }
        .zoom-ctl #zoomPct {
            min-width: 46px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .page-label {
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
            letter-spacing: 0.4px;
        }

        .form-page {
            position: relative;
            background: #fff;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
            touch-action: none;
            width: calc(var(--fitw, 800px) * var(--zoom, 1));
        }

        .form-page img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
        }

        /* ---- Field boxes (Step 3) — normalized geometry, positioned in % ---- */
        .field-box {
            position: absolute;
            background: rgba(83, 216, 168, 0.14);
            border: 1.5px solid var(--accent);
            cursor: move;
            z-index: 2;
        }

        .field-box.selected {
            border-width: 2px;
            background: rgba(83, 216, 168, 0.24);
        }

        /* Multi-selected (part of a selection set) — distinct from the primary box */
        .field-box.multi-sel {
            border-width: 2px;
            background: rgba(83, 216, 168, 0.24);
            outline: 1px dashed var(--accent);
            outline-offset: 2px;
        }

        .field-box.sig {
            border-style: dashed;
            border-color: var(--warning);
            background: rgba(243, 156, 18, 0.12);
        }

        .field-box.sig.selected, .field-box.sig.multi-sel { background: rgba(243, 156, 18, 0.22); }

        /* Daily-initials box — a per-day drawn-initials field (part of a daily-entry group). */
        .field-box.initials { border-color: #b98cff; background: rgba(185, 140, 255, 0.14); }
        .field-box.initials.selected, .field-box.initials.multi-sel { background: rgba(185, 140, 255, 0.26); }
        .field-box.initials .handle { border-color: #b98cff; }
        .field-box .box-initials {
            position: absolute; top: 1px; left: 2px; font-size: 11px; line-height: 1;
            color: #b98cff; pointer-events: none;
        }

        /* Day badge — marks a box that belongs to a daily-entry group (day 2..N).
           Non-interactive so it never intercepts box create/move/resize drags. */
        .field-box .box-day {
            position: absolute;
            top: -9px;
            right: -2px;
            transform: translateY(-100%);
            background: var(--bg-card);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* Marquee selection rectangle (Shift-drag on empty page space) */
        .marquee {
            position: absolute;
            z-index: 5;
            background: rgba(83, 216, 168, 0.10);
            border: 1px dashed var(--accent);
            pointer-events: none;
        }

        .field-box .box-label {
            position: absolute;
            top: -9px;
            left: -2px;
            transform: translateY(-100%);
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 10px;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            pointer-events: none;
            max-width: calc(100% + 4px);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .field-box.selected .box-label { border-color: var(--accent); }
        .field-box.sig.selected .box-label { border-color: var(--warning); }

        /* Checkbox-field indicator (Configure preview) */
        .field-box .box-check {
            position: absolute;
            top: 1px; right: 2px;
            font-size: 11px; line-height: 1;
            color: var(--accent);
            pointer-events: none;
        }

        /* Constant-field indicator — a header box whose value is set once per lot via the
           cabinet's "Initialize paperwork" quiz (daily-weekly sheets only). */
        .field-box.constant { border-color: #f3c14b; background: rgba(243, 193, 75, 0.14); }
        .field-box.constant.selected, .field-box.constant.multi-sel { background: rgba(243, 193, 75, 0.26); }
        .field-box.constant .handle { border-color: #f3c14b; }
        .field-box .box-constant {
            position: absolute; top: 1px; right: 2px;
            font-size: 11px; line-height: 1;
            color: #f3c14b; pointer-events: none;
        }

        .field-box .handle {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            border: 2px solid var(--accent);
            border-radius: 3px;
            z-index: 3;
        }

        .field-box.sig .handle { border-color: var(--warning); }
        .field-box .handle.nw { top: -7px; left: -7px; cursor: nwse-resize; }
        .field-box .handle.ne { top: -7px; right: -7px; cursor: nesw-resize; }
        .field-box .handle.sw { bottom: -7px; left: -7px; cursor: nesw-resize; }
        .field-box .handle.se { bottom: -7px; right: -7px; cursor: nwse-resize; }

        /* Edge-scale handles — resize along a single axis (shown when selected).
           n/s change height only, e/w change width only. */
        .field-box .handle.n { top: -7px; left: 50%; transform: translateX(-50%); width: 16px; height: 8px; border-radius: 4px; cursor: ns-resize; }
        .field-box .handle.s { bottom: -7px; left: 50%; transform: translateX(-50%); width: 16px; height: 8px; border-radius: 4px; cursor: ns-resize; }
        .field-box .handle.e { right: -7px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px; border-radius: 4px; cursor: ew-resize; }
        .field-box .handle.w { left: -7px; top: 50%; transform: translateY(-50%); width: 8px; height: 16px; border-radius: 4px; cursor: ew-resize; }

        /* Axis-move arrow handles — float just above / beside every box (nudged clear of
           the n/e edge-scale pills). ↕ slides the box vertically (X locked), ↔ slides it
           horizontally (Y locked), so boxes can be lined up neatly one axis at a time. */
        .field-box .handle.move-v {
            top: -27px; left: 50%; transform: translateX(-50%);
            width: 16px; height: 13px; cursor: ns-resize;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; line-height: 1; color: var(--accent);
        }
        .field-box .handle.move-h {
            right: -27px; top: 50%; transform: translateY(-50%);
            width: 13px; height: 16px; cursor: ew-resize;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; line-height: 1; color: var(--accent);
        }
        .field-box.sig .handle.move-v, .field-box.sig .handle.move-h { border-color: var(--warning); color: var(--warning); }
        .field-box.initials .handle.move-v, .field-box.initials .handle.move-h { border-color: #b98cff; color: #b98cff; }

        /* ---- Field properties panel (Step 3) ---- */
        .fp-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 12px;
        }

        .fp-id {
            font-family: 'Consolas', 'Menlo', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent);
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 3px 8px;
        }

        .fp-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
        }

        .fp-grid .form-group, .field-properties .form-group { margin-bottom: 0; }
        .field-properties > .form-group { margin-bottom: 10px; }

        /* Panels below the page image: Sheet + Field properties sit side by side on wide
           windows (stacked on narrow ones); the Wizard builder spans the full width below
           them so its question inputs never bleed out of a squeezed column. minmax(0, 1fr)
           lets tracks shrink below their content's min-width — that's what stops the blowout. */
        .cfg-side {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
            align-items: start;
        }
        /* Wizard builder spans both columns (full width) on its own row below the two panels. */
        .cfg-side .wizard-card { grid-column: 1 / -1; }
        @media (max-width: 720px) {
            .cfg-side { grid-template-columns: minmax(0, 1fr); }
        }

        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; }

        .cfg-hint { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5; }

        /* Wizard builder (Step 4) */
        textarea {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.85rem;
            padding: 7px 9px;
            box-sizing: border-box;
        }
        textarea:focus { outline: none; border-color: var(--accent); }

        .q-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
        .q-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 6px;
            padding: 10px 12px;
        }
        .q-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .q-num {
            font-size: 0.75rem; font-weight: 700; color: var(--text-secondary);
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 4px; padding: 2px 7px;
        }
        .q-id {
            font-family: 'Consolas', 'Menlo', monospace; font-size: 0.75rem;
            color: var(--accent); font-weight: 700;
        }
        .q-spacer { flex: 1; }
        .q-btn {
            background: none; border: 1px solid var(--border); border-radius: 4px;
            color: var(--text-secondary); cursor: pointer; font-size: 0.75rem;
            padding: 2px 8px; line-height: 1.4;
        }
        .q-btn:hover:not(:disabled) { background: var(--bg-secondary); color: var(--text-primary); }
        .q-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .q-btn.q-del:hover { background: var(--danger); border-color: var(--danger); color: #fff; }
        .q-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .q-controls > .form-group { margin-bottom: 0; }
        .q-controls .q-full { grid-column: 1 / -1; }
        .q-product { display: flex; gap: 8px; flex-wrap: wrap; }
        .q-product > * { flex: 1; min-width: 160px; }
        .q-bind-indicator {
            font-size: 0.8rem; color: var(--text-secondary);
            background: var(--bg-secondary); border: 1px dashed var(--border);
            border-radius: 4px; padding: 6px 8px; min-height: 34px;
        }
        .q-checks { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px; }
        .q-check {
            display: flex; align-items: center; gap: 6px; cursor: pointer;
            font-size: 0.8rem; color: var(--text-primary);
        }
        .q-check input { width: 16px; height: 16px; min-height: 0; margin: 0; }

        .save-row { display: flex; gap: 10px; grid-column: 1 / -1; }
        .save-row .btn { flex: 1; min-height: 42px; }

        /* ---- Filing Cabinet tree (Step 5) ---- */
        .cab-head {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 14px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .cab-head .cab-sub { color: var(--text-secondary); font-weight: 400; font-size: 0.8rem; }
        .cab-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .cab-initbtn { min-height: 36px; padding: 4px 12px; font-size: 0.85rem; border-radius: 6px;
            background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); cursor: pointer; }
        .cab-initbtn:hover { border-color: var(--accent); }
        .cab-initbtn.pending::after { content: ' ⚠️'; font-size: 0.8rem; }
        .cab-loaddoc {
            background: none; border: 1px solid var(--accent); border-radius: 6px;
            color: var(--accent); cursor: pointer; font-size: 0.8rem; font-weight: 600; padding: 5px 12px;
        }
        .cab-loaddoc:hover { background: var(--accent); color: #08301f; }
        .cab-printdoc { font-size: 0.75rem; color: var(--text-secondary); border: 1px solid var(--border); border-radius: 10px; padding: 2px 9px; }
        .cab-printdoc.none { color: var(--warning); border-color: var(--warning); }
        .cab-hint { color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 14px; line-height: 1.5; }
        .cab-warn {
            background: #fff8e6; border: 1px solid var(--warning); border-radius: var(--radius);
            color: #4a2c00; font-size: 0.85rem; line-height: 1.5; padding: 10px 14px; margin-bottom: 12px;
        }
        .cab-leaf.coverage { border-style: dashed; }
        .cab-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 10px;
            overflow: hidden;
        }
        .cab-section > summary {
            list-style: none;
            cursor: pointer;
            padding: 10px 14px;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            user-select: none;
        }
        .cab-section > summary::-webkit-details-marker { display: none; }
        .cab-section > summary::before { content: '▸'; color: var(--text-secondary); font-size: 0.8rem; }
        .cab-section[open] > summary::before { content: '▾'; }
        .cab-count { margin-left: auto; font-weight: 400; font-size: 0.78rem; color: var(--text-secondary); }
        .cab-count .cab-miss { color: var(--warning); }
        .cab-body { padding: 4px 10px 10px; display: flex; flex-direction: column; gap: 6px; }
        .cab-leaf {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 0.85rem;
        }
        .cab-leaf .cab-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cab-leaf .cab-from { color: var(--text-secondary); font-size: 0.75rem; }
        .cab-leaf.ref { border-style: dashed; }
        .cab-status {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
            white-space: nowrap;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .cab-status.ok { color: #08301f; background: var(--accent); border-color: var(--accent); }
        .cab-status.due, .cab-status.warn { color: #4a2c00; background: var(--warning); border-color: var(--warning); }
        .cab-status.miss { color: #fff; background: var(--danger); border-color: var(--danger); }
        .cab-fill {
            background: none; border: 1px solid var(--accent); border-radius: 4px;
            color: var(--accent); cursor: pointer; font-size: 0.72rem; font-weight: 600;
            padding: 2px 9px; white-space: nowrap;
        }
        .cab-fill:hover { background: var(--accent); color: #08301f; }

        /* Print button on leaves (Step 10) — enabled only when the instance is complete
           AND a matching page set is loaded this session. */
        .cab-print {
            background: none; border: 1px solid var(--border); border-radius: 4px;
            color: var(--text-dim); cursor: pointer; font-size: 0.72rem; font-weight: 600;
            padding: 2px 9px; white-space: nowrap; margin-left: 6px;
        }
        .cab-print:hover:not(:disabled) { background: var(--accent); color: #08301f; border-color: var(--accent); }
        .cab-print:disabled { opacity: .45; cursor: not-allowed; }

        /* Sign button on leaves — enabled when an instance exists and the sheet has a
           signature box. Amber to match the signature box styling in the editor. */
        .cab-sign {
            background: none; border: 1px solid var(--warning); border-radius: 4px;
            color: var(--warning); cursor: pointer; font-size: 0.72rem; font-weight: 600;
            padding: 2px 9px; white-space: nowrap; margin-left: 6px;
        }
        .cab-sign:hover:not(:disabled) { background: var(--warning); color: #4a2c00; border-color: var(--warning); }
        .cab-sign:disabled { opacity: .45; cursor: not-allowed; }

        /* ---- Wizard runner modal (Step 6) ---- */
        .wiz-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .wiz-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            width: 100%; max-width: 520px;
            max-height: 90vh; overflow-y: auto;
        }
        .wiz-head {
            display: flex; align-items: center; gap: 8px;
            padding: 14px 16px; border-bottom: 1px solid var(--border);
        }
        .wiz-title { font-weight: 700; font-size: 0.95rem; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .wiz-prog { color: var(--text-secondary); font-size: 0.78rem; white-space: nowrap; }
        .wiz-close {
            background: none; border: none; color: var(--text-secondary);
            font-size: 1.1rem; cursor: pointer; padding: 2px 6px; line-height: 1;
        }
        .wiz-close:hover { color: var(--danger); }
        .wiz-body { padding: 18px 16px; }
        .wiz-daychips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .day-chip {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text-secondary); font-size: 0.75rem; padding: 3px 10px; cursor: pointer;
        }
        .day-chip:hover { color: var(--text-primary); }
        .day-chip.sel { background: var(--accent); border-color: var(--accent); color: #08301f; font-weight: 700; }
        .day-chip.filled::after { content: ' ✓'; }
        .wiz-hint { color: var(--text-secondary); font-size: 0.75rem; margin-top: 6px; }
        .wiz-q-label { font-size: 1.05rem; font-weight: 600; margin-bottom: 12px; }
        .wiz-mandatory { color: var(--warning); font-size: 0.78rem; font-weight: 600; margin-left: 8px; white-space: nowrap; }
        .wiz-q-ctl input, .wiz-q-ctl select {
            width: 100%; background: var(--input-bg); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-primary); font-size: 1rem; padding: 10px 12px;
        }
        .wiz-q-ctl input:focus, .wiz-q-ctl select:focus { outline: none; border-color: var(--accent); }
        .wiz-same {
            margin-top: 10px; background: none; border: 1px dashed var(--border); border-radius: 6px;
            color: var(--text-secondary); font-size: 0.8rem; padding: 6px 12px; cursor: pointer;
        }
        .wiz-same:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
        .wiz-same:disabled { opacity: 0.4; cursor: not-allowed; }
        .wiz-foot {
            display: flex; align-items: center; gap: 10px;
            padding: 14px 16px; border-top: 1px solid var(--border);
        }
        .wiz-foot .btn { min-height: 38px; }
        .wiz-foot .spacer { flex: 1; }

        /* ---- Signature pad (Step 8) ---- */
        .sig-pad-wrap { margin-bottom: 12px; }
        .sig-pad {
            width: 100%; display: block; touch-action: none; cursor: crosshair;
            background: var(--input-bg); border: 1px dashed var(--border); border-radius: 6px;
        }
        /* Initials pad — ~30% narrower than the full-width signature pad so a near-square
           box doesn't push the card past the viewport on a 1080p screen. */
        .sig-pad.init-pad { width: 70%; margin: 0 auto; }
        .sig-name {
            width: 100%; box-sizing: border-box; background: var(--input-bg); border: 1px solid var(--border);
            border-radius: 6px; color: var(--text-primary); font-size: 0.95rem; padding: 8px 12px;
        }
        .sig-name:focus { outline: none; border-color: var(--accent); }

        /* "Start grow log on a chosen day" dialog */
        .startlog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .startlog-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--text-secondary); }
        .startlog-note { font-size: 0.85rem; color: var(--text-secondary); margin-top: 12px; line-height: 1.4; }
        .sig-actions { display: flex; gap: 8px; margin-top: 10px; }
        .sig-clear {
            background: none; border: 1px dashed var(--border); border-radius: 6px;
            color: var(--text-secondary); font-size: 0.8rem; padding: 6px 12px; cursor: pointer;
        }
        .sig-clear:hover { color: var(--danger); border-color: var(--danger); }

        /* ---- Strike-out initials capture (drawn, like the signature pad) ---- */
        /* Above the wizard runner (z-200) — it opens while the runner is still on screen. */
        .strike-overlay {
            position: fixed; inset: 0; z-index: 250; background: rgba(4, 8, 16, 0.72);
            display: flex; align-items: center; justify-content: center; padding: 16px;
        }
        .strike-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
            box-shadow: var(--shadow); width: 100%; max-width: 420px; padding: 18px 16px;
        }
        .strike-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 6px; }
        .strike-sub { color: var(--text-secondary); font-size: 0.82rem; line-height: 1.5; margin-bottom: 12px; }
        .strike-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
        .strike-foot .spacer { flex: 1; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <span class="logo">📄 Paper Wizard</span>
            <nav class="tabs" id="tabBar">
                <button type="button" class="tab-btn active" id="tabCabinetBtn">Filing Cabinet</button>
                <button type="button" class="tab-btn" id="tabConfigureBtn">Configure Sheets</button>
            </nav>
        </div>
        <div class="header-right">
            <div class="form-group">
                <label for="lotSelect">Active Lot</label>
                <select id="lotSelect"></select>
            </div>
            <div class="export-wrapper">
                <div class="save-popup hidden" id="savePopup">
                    <a class="save-link" id="saveLink" href="#">📄 Click to generate file</a>
                    <button type="button" class="save-close" id="saveCloseBtn" title="Close">✕</button>
                </div>
            </div>
        </div>
    </header>


    <!-- Hidden file input for just-in-time controlled page-image load (never stored) -->
    <input type="file" id="pageImportInput" accept=".webp,image/webp" multiple style="display:none;">

    <!-- Hidden file input for the print path: loads a page set matching a sheet's id -->
    <input type="file" id="printImportInput" accept=".webp,image/webp" multiple style="display:none;">

    <!-- Hidden file input for per-sheet configuration import (.json bundle) -->
    <input type="file" id="sheetImportInput" accept=".json,application/json" style="display:none;">

    <!-- Main Content -->
    <main class="main">
        <!-- Status Bar -->
        <div class="status-bar" id="statusBar">
            <span id="statusText">No database loaded.</span>
        </div>

        <!-- Filing Cabinet tab (first page) -->
        <section class="tab-panel active" id="cabinetPanel"></section>

        <!-- Configure Sheets tab -->
        <section class="tab-panel" id="configurePanel"></section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <button class="btn btn-secondary" id="closeToolBtn">Close Tool</button>
    </footer>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // =====================================================
        // PaperWizard — Controlled paperwork fill & print tool
        // Database Keys: "_PaperWizard" (read/write), lot records
        //   (may write exactly two fields on lots: plantCount, stage)
        // Step 1: shell, DB structure, sync plumbing
        // Step 2: just-in-time page-image load + preview canvas (Configure tab)
        // =====================================================

        const DB = {
            data: null,
            fileName: '',

            get lots() { return this.data?.lots || {}; },
            get rooms() { return this.data?.rooms || {}; },
            get buildings() { return this.data?.buildings || {}; },
            get calendarEvents() { return this.data?.calendarEvents || []; },
            get paperWizard() { return this.data?._PaperWizard; },

            ensureStructure() {
                if (!this.data) this.data = { lots: {}, rooms: {}, buildings: {}, calendarEvents: [] };
                if (!this.data.lots) this.data.lots = {};
                if (!this.data.rooms) this.data.rooms = {};
                if (!this.data.buildings) this.data.buildings = {};
                if (!this.data.calendarEvents) this.data.calendarEvents = [];
                if (!this.data._PaperWizard) this.data._PaperWizard = { sheets: {}, wizards: {}, entries: {} };
                if (!this.data._PaperWizard.sheets) this.data._PaperWizard.sheets = {};
                if (!this.data._PaperWizard.wizards) this.data._PaperWizard.wizards = {};
                if (!this.data._PaperWizard.entries) this.data._PaperWizard.entries = {};
                return this.data;
            },

            // Sync all in-memory changes before export.
            // PaperWizard writes directly to DB.data on every mutation,
            // so no extra flush is needed — but the method exists as convention.
            sync() {
                this.ensureStructure();
                return this.data;
            }
        };

        const $ = id => document.getElementById(id);

        // True once a DB has arrived (postMessage delivery or file import).
        // Needed because ensureStructure() makes DB.data truthy from load time.
        let dbLoaded = false;

        // ---- Date helpers (local time, YYYY-MM-DD) ----
        function dateToStr(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${dd}`;
        }

        function todayStr() { return dateToStr(new Date()); }

        // Parse YYYY-MM-DD into a local Date (avoids UTC off-by-one from new Date(str)).
        function parseDate(str) {
            const [y, m, d] = str.split('-').map(Number);
            return new Date(y, m - 1, d);
        }

        // ---- Stage vocabulary bridge ----
        // The main DB (SitkaTools) stores lowercase stages ('cloning','veg','flower',…);
        // the paper forms use their own phase words ('Cloning','Vegetation','Bloom',…).
        // normalizeStage() maps any known spelling to the form's vocabulary (for prefill,
        // comparison and printing); stageFromForm() maps back for write-backs so a saved
        // entry never corrupts lot.stage. Unknown values pass through unchanged.
        const STAGE_TO_FORM = { cloning: 'Cloning', mother: 'Mother', veg: 'Vegetation', vegetation: 'Vegetation', flower: 'Bloom', bloom: 'Bloom', harvest: 'Harvesting', harvesting: 'Harvesting' };
        // Fixed phase vocabulary for phase questions (the form's own words, from STAGE_TO_FORM).
        const PHASE_OPTIONS = ['Cloning', 'Mother', 'Vegetation', 'Bloom', 'Harvesting'];
        // Room designation vocabulary — set per room in SitkaTools' Room Manager
        // (room.designation). The lot.roomDesignation binding resolves the INSTANCE's stored
        // room (inst.room, falling back to the live lot.currentRoom) to its room record and
        // returns this value, so paperwork can carry checkboxes that match a room's designation.
        const ROOM_DESIGNATIONS = ['Grow 1', 'Grow 2', 'Grow 3', 'Grow 4', 'Clone', 'Mother', 'Vegetation'];
        function normalizeStage(v) {
            if (v === null || v === undefined) return null;
            const s = String(v).trim();
            return STAGE_TO_FORM[s.toLowerCase()] ?? s;
        }
        function stageFromForm(v) {
            if (v === null || v === undefined) return null;
            const s = String(v).trim();
            for (const [db, form] of Object.entries(STAGE_TO_FORM)) if (form === s) return db;
            return s; // unknown phase word — keep as-is rather than drop it
        }

        // ---- HTML escaping (quote-safe, so results can go into attribute values) ----
        function escapeHtml(s) {
            return String(s ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ---- Toast ----
        let toastTimer = null;
        function showToast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
        }

        // ---- Tab state ----
        let activeTab = 'cabinet'; // 'cabinet' | 'configure'

        function switchTab(tab) {
            activeTab = tab;
            $('tabCabinetBtn').classList.toggle('active', tab === 'cabinet');
            $('tabConfigureBtn').classList.toggle('active', tab === 'configure');
            $('cabinetPanel').classList.toggle('active', tab === 'cabinet');
            $('configurePanel').classList.toggle('active', tab === 'configure');
            // Configuration is lot-independent — disable the lot selector on this tab.
            const lotSel = $('lotSelect');
            lotSel.disabled = (tab === 'configure');
            lotSel.title = (tab === 'configure') ? 'Configuration is lot-independent' : '';
            renderAll();
        }

        // Building device (DeviceView): Configure Sheets is office work — sheet layouts and wizards are saved
        // in Main.json, which a building device can't save — so only the Filing Cabinet is offered.
        function applyDeviceView() {
            $('tabConfigureBtn').style.display = DeviceView.building ? 'none' : '';
            if (DeviceView.building && activeTab === 'configure') switchTab('cabinet');
        }

        // ---- Active lot state ----
        let activeLotId = null;

        // Resolve the room a lot currently lives in — live currentRoom (by name) wins, else
        // any room that lists it in assignedLots. Null when unknown → grouped as Unassigned.
        function lotRoomId(lotId) {
            const rooms = DB.rooms || {};
            const lot = DB.lots[lotId];
            if (lot?.currentRoom) {
                const target = String(lot.currentRoom).trim().toLowerCase();
                for (const [roomId, r] of Object.entries(rooms)) {
                    if (r?.name && String(r.name).trim().toLowerCase() === target) return roomId;
                }
            }
            for (const [roomId, r] of Object.entries(rooms)) {
                if ((r.assignedLots || []).includes(lotId)) return roomId;
            }
            return null;
        }

        function populateLotSelector() {
            const sel = $('lotSelect');
            const prev = activeLotId;
            // Lots from the main DB plus orphaned lots that only exist in PaperWizard entries.
            const ids = new Set(Object.keys(DB.lots));
            Object.keys(DB.paperWizard?.entries || {}).forEach(id => ids.add(id));
            // A building device lists only its own building's lots (DeviceView — closed lots aren't among them)
            if (DeviceView.building) [...ids].forEach(id => { if (!DeviceView.lotVisible(id)) ids.delete(id); });

            if (!ids.size) {
                sel.innerHTML = '';
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '— No lots —';
                sel.appendChild(opt);
                activeLotId = null;
                return;
            }

            // Group by room (same layout as CropLabourWizard's selector): unselectable
            // "↓ Room" dividers in alphabetical order of room name, lots within a room
            // oldest-first, and lots with no resolvable room under a trailing divider.
            const rooms = DB.rooms || {};
            const groups = new Map();   // roomId -> [lotId]
            const unassigned = [];
            for (const id of ids) {
                const roomId = lotRoomId(id);
                if (roomId && rooms[roomId]) {
                    if (!groups.has(roomId)) groups.set(roomId, []);
                    groups.get(roomId).push(id);
                } else {
                    unassigned.push(id);
                }
            }

            // Oldest lot first (by createdDate; lot ID breaks ties) — same as CropLabourWizard.
            const byAge = (a, b) =>
                String(DB.lots[a]?.createdDate || '').localeCompare(String(DB.lots[b]?.createdDate || '')) ||
                a.localeCompare(b);

            const addDivider = label => {
                const opt = document.createElement('option');
                opt.textContent = `↓ ${label}`;
                opt.disabled = true;
                sel.appendChild(opt);
            };

            const addLotOption = lotId => {
                const lot = DB.lots[lotId];
                const opt = document.createElement('option');
                opt.value = lotId;
                if (lot) {
                    opt.textContent = lot.strain ? `${lotId} — ${lot.strain}` : lotId;
                } else {
                    opt.textContent = `${lotId} — (closed)`; // orphaned: entries exist, lot record gone
                }
                sel.appendChild(opt);
            };

            sel.innerHTML = '';
            [...groups.keys()]
                .sort((a, b) => (rooms[a].name || '').localeCompare(rooms[b].name || ''))
                .forEach(roomId => {
                    addDivider(rooms[roomId].name || roomId);
                    groups.get(roomId).sort(byAge).forEach(addLotOption);
                });

            if (unassigned.length) {
                addDivider('Unassigned');
                unassigned.sort(byAge).forEach(addLotOption);
            }

            // Keep current selection if still valid, else default to the most recent lot
            // (original behavior — the grouped order above is display-only).
            const newest = [...ids].sort((a, b) =>
                String(DB.lots[b]?.createdDate || '').localeCompare(String(DB.lots[a]?.createdDate || '')))[0];
            activeLotId = (prev && ids.has(prev)) ? prev : newest;
            sel.value = activeLotId;
        }

        function updateStatusBar() {
            const bar = $('statusBar');
            const txt = $('statusText');
            if (!dbLoaded) {
                bar.classList.remove('loaded');
                txt.textContent = 'No database loaded — tap 📂 Load… or open from SitkaTools.';
                return;
            }
            bar.classList.add('loaded');
            const sheetCount = Object.keys(DB.paperWizard.sheets).length;
            const lot = activeLotId ? DB.lots[activeLotId] : null;
            let html = `📋 ${sheetCount} sheet${sheetCount === 1 ? '' : 's'} configured`;
            if (activeLotId) {
                html += ` · 🌱 ${escapeHtml(activeLotId)}` + (lot?.strain ? ` ${escapeHtml(lot.strain)}` : '');
            }
            const due = activeLotId ? dueTodayCount(activeLotId) : 0;
            if (due > 0) {
                html += ` · <span style="color:var(--warning)">⏳ ${due} entr${due === 1 ? 'y' : 'ies'} due today</span>`;
            }
            txt.innerHTML = html;
        }

        // ---- Empty state helper ----
        function emptyStateHtml(icon, title, sub) {
            return `<div class="empty-state">
                <div class="empty-icon">${icon}</div>
                <div class="empty-title">${title}</div>
                <div class="empty-sub">${sub}</div>
            </div>`;
        }

        // ---- Configure Sheets — just-in-time page-image load (Step 2/3b) ----
        // Golden rule: the controlled page images are NEVER stored — not in the DB,
        // not in browser storage. Only in-memory blob URLs for this session; the DB
        // stores the expected file names (sheet id + -pN pages) and geometry only.
        let loadedDoc = null;      // { name, baseName, pageCount, pages: [{ url, wPx, hPx }] } | null
        let configSheetId = null;  // sheet id (= expected page-image base name) being configured
        let orientation = 'portrait';
        let cfgName = '';
        let cfgCadence = 'one-shot';
        let cfgPageCount = 1;   // number of loaded page images
        let cfgZoom = 1;        // page zoom (1 = fit-to-width)
        let cfgFields = [];     // working copy of the sheet's fields[]
        let cfgSignature = null;// working copy of the sheet's signature box
        // Multi-select: primary selection + extra selected ids. A daily-entry group is a
        // set of field ids (day 1 = the manually placed boxes, day n = its clones).
        let cfgSelection = null;   // { kind: 'field'|'signature', id } | null — the primary box
        let cfgMultiSel = new Set(); // extra selected field ids (group moves / multi-delete)
        // Wizard builder (Step 4) — working copy, saved to _PaperWizard.wizards on Save.
        let cfgWizard = null;       // { id, sheetId, name, questions[] }
        let cfgQuestionSel = null;  // id of the question currently being edited
        let cfgDocument = null;     // explicit document assignment (cabinet section key) for this sheet

        // Print document (Step 10) — separate from loadedDoc (the Configure-tab doc).
        // The print path needs a page set whose base name matches the SHEET being printed,
        // which may differ from whatever is open in Configure. Same golden rule: blob URLs
        // only, revoked on close / new load.
        let printDoc = null;        // { sheetId, pages: [{ url, wPx, hPx }] } | null

        function letterPageSize(isLandscape) {
            return isLandscape
                ? { widthIn: 11, heightIn: 8.5 }
                : { widthIn: 8.5, heightIn: 11 };
        }

        // On-paper pixel aspect ratio of a normalized box rect = (w·pageW)/(h·pageH).
        // Draw pads MUST use this exact aspect ratio so that strokes — stored as 0–1
        // normalized coords and printed with preserveAspectRatio="none" — scale uniformly
        // into the box instead of being skewed by the page's width/height ratio.
        function boxPrintAspect(sheet, rect) {
            if (!rect || !rect.w || !rect.h) return 4;
            const { widthIn, heightIn } = letterPageSize(sheet?.orientation === 'landscape');
            return (rect.w / rect.h) * (widthIn / heightIn);
        }

        // Fixed size of the strike-out initials box (normalized page coords) — shared by the
        // capture pad's aspect ratio and computeStrikeOut so they never drift apart.
        const STRIKE_INITIALS_RECT = { w: 0.2, h: 0.07 };

        function revokeLoadedDoc() {
            loadedDoc?.pages.forEach(p => URL.revokeObjectURL(p.url));
            loadedDoc = null;
        }

        function revokePrintDoc() {
            printDoc?.pages.forEach(p => URL.revokeObjectURL(p.url));
            printDoc = null;
        }

        // ---- Page zoom (Step 3b) ----
        // Pages are sized in CSS: width = --fitw * --zoom. Changing zoom is a pure
        // CSS-variable update, so it never reloads the page images and the %-positioned
        // boxes track automatically. The box editor reads live getBoundingClientRect(),
        // so normalized coords stay correct at any zoom.
        function setZoom(z) {
            cfgZoom = Math.max(0.5, Math.min(4, z));
            applyZoom();
        }
        function applyZoom() {
            const stage = $('pageStage');
            if (!stage) return;
            stage.style.setProperty('--zoom', cfgZoom);
            const pct = $('zoomPct');
            if (pct) pct.textContent = Math.round(cfgZoom * 100) + '%';
        }
        function updateFitWidth() {
            const stage = $('pageStage');
            if (!stage || !loadedDoc) return;
            const avail = stage.clientWidth - 32;      // minus .page-stack padding
            const w = Math.max(320, Math.min(avail, 1200));
            stage.style.setProperty('--fitw', w + 'px');
        }

        // Page images carry their own aspect ratio (inline aspect-ratio on each
        // .form-page), so no JS sizing is needed — window resizes are pure CSS and
        // the %-positioned boxes track automatically.

        // ---- Page-image helpers (Step 3b) ----
        const PAGE_IMG_RE = /^(.+)-p(\d+)(?:\.[a-z0-9]+)?$/i;

        // Parse the selected files into a validated, ordered page set.
        // Convention: <base>-p1.webp, <base>-p2.webp, … — all same base name, numbered
        // 1..N with no gaps. Returns { baseName, pages } or throws an Error with a
        // user-facing message (the file-name check is the wrong-revision guard).
        function parsePageFiles(fileList) {
            const files = Array.from(fileList || []);
            if (!files.length) throw new Error('No page images selected.');
            const badType = files.find(f => !/\.webp$/i.test(f.name));
            if (badType) throw new Error(`"${badType.name}" is not a WebP image — export each form page as WebP.`);

            const parsed = files.map(f => {
                const m = f.name.match(PAGE_IMG_RE);
                if (!m) throw new Error(`"${f.name}" doesn't follow the naming convention <base>-pN.webp (e.g. grow-log-p1.webp).`);
                return { file: f, baseName: m[1], n: parseInt(m[2], 10) };
            });

            const bases = new Set(parsed.map(p => p.baseName));
            if (bases.size > 1) throw new Error(`Mixed page sets detected (${[...bases].join(', ')}). All pages must share the same base name.`);
            const baseName = parsed[0].baseName;

            const byNum = new Map();
            for (const p of parsed) {
                if (byNum.has(p.n)) throw new Error(`Duplicate page number: ${p.file.name}.`);
                byNum.set(p.n, p);
            }
            const nums = [...byNum.keys()].sort((a, b) => a - b);
            for (let i = 1; i <= nums.length; i++) {
                if (!byNum.has(i)) throw new Error(`Missing page ${i} — expected consecutive pages starting at p1.`);
            }

            return { baseName, pages: nums.map(n => byNum.get(n).file) };
        }

        // Decode each file into a blob URL + natural pixel size (for aspect ratio).
        async function loadPageImages(files) {
            const pages = [];
            for (const f of files) {
                const url = URL.createObjectURL(f);
                try {
                    const img = await new Promise((res, rej) => {
                        const el = new Image();
                        el.onload = () => res(el);
                        el.onerror = () => rej(new Error(`Could not decode "${f.name}".`));
                        el.src = url;
                    });
                    pages.push({ url, wPx: img.naturalWidth, hPx: img.naturalHeight });
                } catch (err) {
                    URL.revokeObjectURL(url);
                    throw err;
                }
            }
            return pages;
        }

        async function handlePageImport(e) {
            const files = Array.from(e.target.files || []); // copy — input.files is a live FileList, cleared by the reset below
            e.target.value = ''; // allow re-picking the same file
            if (!files.length) return;

            let parsed;
            try {
                parsed = parsePageFiles(files);
            } catch (err) {
                alert(err.message);
                return;
            }

            const existing = DB.paperWizard.sheets[parsed.baseName];
            if (existing) {
                const boxCount = (existing.fields?.length || 0) + (existing.signature ? 1 : 0);
                if (boxCount > 0 && !confirm(`"${parsed.baseName}" is already configured with ${boxCount} box(es).\nOpen it for editing?`)) {
                    return; // cancelled — keep the current document
                }
            }

            // Swap in the new document — revoke the previous blob URLs (lifecycle rule).
            revokeLoadedDoc();
            let pages;
            try {
                pages = await loadPageImages(parsed.pages);
                loadedDoc = { name: parsed.baseName, baseName: parsed.baseName, pageCount: pages.length, pages };
            } catch (err) {
                alert(err.message);
                return;
            }
            configSheetId = parsed.baseName;

            // Prefill sheet-level settings from an existing sheet, else defaults.
            const s = DB.paperWizard.sheets[parsed.baseName];
            orientation = pages[0].wPx > pages[0].hPx ? 'landscape' : 'portrait'; // derived from the page image
            cfgName = s?.name || parsed.baseName;
            cfgCadence = s?.cadence || 'one-shot';
            cfgDocument = s?.document || null;
            cfgPageCount = Math.max(1, Math.min(20, pages.length));
            // Working copies of the layout (saved to DB in Step 4).
            cfgFields = (s?.fields || []).map(f => ({ ...f, page: f.page ?? 1 }));
            cfgSignature = s?.signature ? { ...s.signature } : null;
            cfgSelection = null;
            cfgMultiSel = new Set();
            // Wizard working copy: reopen the saved wizard for this sheet, else start fresh.
            // The wizard's id is its map key (wizard objects don't store their own id).
            const existingWizEntry = Object.entries(DB.paperWizard.wizards).find(([, w]) => w.sheetId === parsed.baseName) || null;
            cfgWizard = existingWizEntry
                ? { id: existingWizEntry[0], sheetId: parsed.baseName, name: existingWizEntry[1].name || '', questions: (existingWizEntry[1].questions || []).map(q => ({ ...q })) }
                : { id: generateFieldId(), sheetId: parsed.baseName, name: cfgName + ' Wizard', questions: [] };
            cfgQuestionSel = null;

            renderConfigure();
            showToast(existing ? `Opened "${parsed.baseName}" for editing` : `Loaded "${parsed.baseName}" — new sheet configuration`);
        }

        // Load the page set used by the PRINT popup. The file base name names the sheet
        // (the wrong-revision guard): it must match a configured sheet id. Independent of
        // loadedDoc (Configure tab). Blob lifecycle: replaces any previously loaded print doc.
        async function loadPrintDocument(files) {
            let parsed;
            try {
                parsed = parsePageFiles(files);
            } catch (err) {
                alert(err.message);
                return false;
            }
            const sheet = DB.paperWizard?.sheets?.[parsed.baseName];
            if (!sheet) {
                alert(`No sheet configured with id "${parsed.baseName}".\n\nConfigure the sheet first (Configure Sheets tab), then load its page set here.`);
                return false;
            }
            revokePrintDoc(); // lifecycle: a new print doc replaces the old one
            let pages;
            try {
                pages = await loadPageImages(parsed.pages);
            } catch (err) {
                alert(err.message);
                return false;
            }
            printDoc = { sheetId: parsed.baseName, pages };
            renderAll();
            showToast(`Print document "${parsed.baseName}" loaded (${pages.length} page${pages.length > 1 ? 's' : ''})`);
            return true;
        }

        // ---- Box placement editor + field properties (Step 3) ----
        const CODE_ALPHABET = 'abcdefghjkmnpqrstuvwxyz23456789';

        // Random 4-char id, unique across the working sheet's fields, signature,
        // and wizard questions (immutable once created).
        function generateFieldId() {
            const used = new Set(cfgFields.map(f => f.id));
            if (cfgSignature?.id) used.add(cfgSignature.id);
            cfgWizard?.questions.forEach(q => used.add(q.id));
            let code;
            do {
                code = '';
                for (let i = 0; i < 4; i++) code += CODE_ALPHABET[Math.floor(Math.random() * CODE_ALPHABET.length)];
            } while (used.has(code));
            return code;
        }

        const clamp01 = v => Math.max(0, Math.min(1, v));
        const r4 = v => Math.round(v * 10000) / 10000; // normalized coords stored at 4 dp

        function findCfgItem(kind, id) {
            return kind === 'signature'
                ? (cfgSignature && cfgSignature.id === id ? cfgSignature : null)
                : cfgFields.find(f => f.id === id) || null;
        }

        // The wizard question (if any) whose answer fills the given field. The binding lives
        // on the FIELD side (field.questionId) — questions carry no target of their own.
        function findQuestionForField(fieldId) {
            const qid = cfgFields.find(f => f.id === fieldId)?.questionId;
            return (qid && cfgWizard?.questions.find(q => q.id === qid)) || null;
        }

        // A field is an initials box when it's bound to a wizard question of type 'initials'.
        // The badge is derived from the binding (single source of truth) — no per-field flag.
        function fieldIsInitialsBox(fieldId) {
            const qid = cfgFields.find(f => f.id === fieldId)?.questionId;
            return !!qid && (cfgWizard?.questions || []).find(q => q.id === qid)?.type === 'initials';
        }

        // Overlay HTML for one box (shared by the full render and the light refresh).
        function boxOverlayHtml(kind, item) {
            const sel = cfgSelection && cfgSelection.id === item.id;
            const multi = !sel && kind === 'field' && cfgMultiSel.has(item.id);
            const isInitBox = kind === 'field' && fieldIsInitialsBox(item.id);
            const isConst = kind === 'field' && !!item.constant;
            return `<div class="field-box${kind === 'signature' ? ' sig' : ''}${isInitBox ? ' initials' : ''}${isConst ? ' constant' : ''}${sel ? ' selected' : multi ? ' multi-sel' : ''}" data-id="${item.id}" data-kind="${kind}" style="left:${(item.x * 100)}%;top:${(item.y * 100)}%;width:${(item.w * 100)}%;height:${(item.h * 100)}%;">` +
                (item.checkbox ? '<span class="box-check" title="Checkbox field">☑</span>' : '') +
                (isInitBox ? '<span class="box-initials" title="Initials box — bound to an initials question">✍️</span>' : '') +
                (isConst ? '<span class="box-constant" title="Constant field — set once per lot via Initialize paperwork">📌</span>' : '') +
                `<span class="box-label">${escapeHtml(item.label || item.id)}</span>` +
                (kind === 'field' && item.day > 1 ? `<span class="box-day" title="Daily-entry group — day ${item.day}">D${item.day}</span>` : '') +
                // Axis-move handles float on every box (selected or not): ↕ above, ↔ beside.
                `<span class="handle move-v" data-axis="v" title="Drag to slide vertically (X locked)">↕</span>` +
                `<span class="handle move-h" data-axis="h" title="Drag to slide horizontally (Y locked)">↔</span>` +
                // Corner handles (diagonal scale) + edge handles (single-axis scale), shown when selected.
                (sel ? [...['nw', 'ne', 'sw', 'se'], ...['n', 's', 'e', 'w']].map(c => `<span class="handle ${c}" data-corner="${c}"></span>`).join('') : '') +
                `</div>`;
        }

        function pageBoxesHtml(pageNum) {
            let html = '';
            for (const f of cfgFields) if ((f.page ?? 1) === pageNum) {
                // Every day's boxes are real, individually placed fields — no ghost clones.
                // A D2..DN badge marks the members of a daily-entry group.
                html += boxOverlayHtml('field', f);
            }
            if (cfgSignature && (cfgSignature.page ?? 1) === pageNum) html += boxOverlayHtml('signature', cfgSignature);
            return html;
        }

        // ---- Daily-entry groups (daily-weekly sheets) ----
        // A group is a set of field ids: day 1 = the boxes placed manually over the form's
        // first day row, day n = its clones. Grouping copies the selected day-1 boxes into
        // real fields for days 2..N (offset by the measured pitch); moving any member moves
        // the whole group together; ungrouping deletes the day 2..N members.

        function cfgDayGroups() {
            const map = new Map();
            for (const f of cfgFields) {
                if (!f.dayGroup) continue;
                if (!map.has(f.dayGroup)) map.set(f.dayGroup, []);
                map.get(f.dayGroup).push(f.id);
            }
            return map;
        }

        // All field ids that move together with `id` (its whole daily-entry group).
        function cfgGroupMembers(id) {
            const f = cfgFields.find(x => x.id === id);
            if (!f?.dayGroup) return [id];
            return cfgFields.filter(x => x.dayGroup === f.dayGroup).map(x => x.id);
        }

        // Pitch between consecutive day rows of a group: median Δy of the day-1→day-2 pair.
        function cfgGroupPitch(groupIds) {
            const members = cfgFields.filter(f => groupIds.includes(f.id));
            const d1 = members.filter(f => (f.day || 1) === 1);
            const d2 = members.filter(f => f.day === 2);
            if (!d1.length || !d2.length) return null;
            const deltas = [];
            for (const a of d1) {
                const b = d2.find(x => Math.abs(x.x - a.x) < 0.005);
                if (b) deltas.push(b.y - a.y);
            }
            if (!deltas.length) return null;
            deltas.sort((a, b) => a - b);
            return deltas[Math.floor(deltas.length / 2)];
        }

        // Group the selected day-1 boxes into a daily-entry group: copies them into real
        // fields for days 2..N, offset by the measured pitch. Returns the new group id or null.
        function groupSelectionAsDailyEntry() {
            if (cfgCadence !== 'daily-weekly') { showToast('Daily-entry groups are for daily-weekly sheets'); return; }
            const selIds = cfgSelection?.kind === 'field' ? [cfgSelection.id, ...cfgMultiSel] : [...cfgMultiSel];
            const selFields = cfgFields.filter(f => selIds.includes(f.id));
            if (!selFields.length) { showToast('Select the day-1 boxes first (Shift-click or Shift-drag)'); return; }
            // Refuse to group boxes that already belong to a different group.
            const foreign = selFields.find(f => f.dayGroup && !selFields.every(x => x.dayGroup === f.dayGroup));
            if (foreign) { showToast('Selection mixes boxes from different groups — ungroup first'); return; }

            // Pitch: measured from an existing day-1→day-2 pair, else the tallest selected box.
            let pitch = cfgGroupPitch(selFields.map(f => f.id));
            if (!pitch || pitch <= 0) pitch = Math.max(...selFields.map(f => f.h));
            const count = prompt('How many days in this entry (7 for a weekly grow-log)?', '7');
            const n = Math.max(2, Math.min(14, parseInt(count, 10) || 7));

            // If the selection already contains day-2..N members of one group, re-space them
            // to the measured pitch instead of duplicating.
            const existingGroup = selFields[0].dayGroup;
            if (existingGroup) {
                for (const f of cfgFields) {
                    if (f.dayGroup !== existingGroup) continue;
                    const d1 = cfgFields.find(x => x.dayGroup === existingGroup && (x.day || 1) === 1 && Math.abs(x.x - f.x) < 0.005);
                    if (d1 && f.day > 1) f.y = r4(clamp01(d1.y + (f.day - 1) * pitch));
                }
                refreshCfgOverlays();
                showToast(`Re-spaced ${existingGroup} to pitch ${pitch.toFixed(3)}`);
                return;
            }

            const gid = generateFieldId();
            for (const f of selFields) {
                f.dayGroup = gid;
                f.day = 1;
                for (let d = 2; d <= n; d++) {
                    cfgFields.push({ ...f, id: generateFieldId(), day: d, y: r4(clamp01(f.y + (d - 1) * pitch)) });
                }
            }
            refreshCfgOverlays();
            showToast(`Grouped ${selFields.length} box(es) into daily entry "${gid}" — ${n} days. Drag a member to move the whole group; hold Alt/⌥ to move just that day row.`);
        }

        // Ungroup: delete every day 2..N member of each group in the selection; day-1 boxes stay.
        function ungroupSelection() {
            const selIds = cfgSelection?.kind === 'field' ? [cfgSelection.id, ...cfgMultiSel] : [...cfgMultiSel];
            const groups = new Set(cfgFields.filter(f => selIds.includes(f.id) && f.dayGroup).map(f => f.dayGroup));
            if (!groups.size) { showToast('No daily-entry group in the selection'); return; }
            let removed = 0;
            cfgFields = cfgFields.filter(f => {
                if (f.dayGroup && groups.has(f.dayGroup) && (f.day || 1) > 1) {
                    removed++;
                    return false;
                }
                return true;
            });
            // Bindings live on the fields themselves — day-1 survivors keep their questionId.
            // Dissolve the group: clear dayGroup/day on the surviving day-1 boxes so they stop
            // moving together. (Previously they kept their group id and stayed "stuck".)
            for (const f of cfgFields) {
                if (f.dayGroup && groups.has(f.dayGroup)) { f.dayGroup = null; f.day = 1; }
            }
            cfgMultiSel = new Set();
            refreshCfgOverlays();
            refreshWizardBuilder();
            showToast(`Ungrouped — removed ${removed} day 2..N box(es); day-1 boxes kept`);
        }

        // Light refresh: re-render ONLY the box overlays + properties panel.
        // Never rebuilds the panel — that would reload the page images.
        function refreshCfgOverlays() {
            const stage = $('pageStage');
            if (stage) {
                stage.querySelectorAll('.form-page').forEach(pageEl => {
                    const pageNum = parseInt(pageEl.dataset.page, 10) || 1;
                    pageEl.querySelectorAll('.field-box').forEach(el => el.remove());
                    const html = pageBoxesHtml(pageNum);
                    if (html) pageEl.insertAdjacentHTML('beforeend', html);
                });
            }
            const fpBody = $('fpBody');
            if (fpBody) {
                fpBody.outerHTML = fieldPropertiesPanelHtml();
                wireFieldProperties();
            }
        }

        // Selection model: one primary box (cfgSelection) + a set of extra selected field ids
        // (cfgMultiSel). Shift-click toggles membership; Shift-drag draws a marquee.
        function selectCfgItem(kind, id, { additive = false } = {}) {
            if (kind === 'signature') {
                cfgSelection = { kind, id };
                cfgMultiSel = new Set();
            } else if (additive) {
                if (cfgSelection?.id === id) {
                    // Ctrl-click the primary box again → drop it from the selection.
                    cfgMultiSel.delete(id);
                    cfgSelection = null;
                } else {
                    cfgMultiSel.add(id);
                    if (!cfgSelection || cfgSelection.kind !== 'field') cfgSelection = { kind: 'field', id };
                }
            } else {
                cfgSelection = { kind, id };
                cfgMultiSel = new Set();
            }
            refreshCfgOverlays();
        }

        function clearCfgSelection() {
            cfgSelection = null;
            cfgMultiSel = new Set();
            refreshCfgOverlays();
        }

        // All field ids in the current selection (primary + extras).
        function selectedFieldIds() {
            const out = [];
            if (cfgSelection?.kind === 'field') out.push(cfgSelection.id);
            for (const id of cfgMultiSel) if (!out.includes(id)) out.push(id);
            return out;
        }

        // Delete exactly the selected boxes (primary + multi-selected) plus the signature
        // if it is the primary selection. Moving is block-level (a group moves together);
        // deleting is exact — to dissolve a group's clones use Ungroup instead.
        function deleteSelectedCfgItem() {
            const selIds = new Set(selectedFieldIds());
            if (!selIds.size && cfgSelection?.kind !== 'signature') return;
            // Bindings live on the fields themselves — deleting a box takes its binding with it.
            cfgFields = cfgFields.filter(f => !selIds.has(f.id));
            if (cfgSelection?.kind === 'signature') cfgSignature = null;
            clearCfgSelection();
            refreshWizardBuilder();
        }

        // Duplicate the selected box(es): each copy is an exact clone — same size, same
        // location, same bindings — with a fresh id and a " (copy)" label. The copies are
        // left unbound to questions (the original keeps its question) and ungrouped, so a
        // duplicated daily-entry member becomes a standalone box the user can re-group or
        // bind as needed. The new boxes become the selection.
        function duplicateSelection() {
            const selIds = selectedFieldIds();
            if (!selIds.length && cfgSelection?.kind !== 'signature') return;
            const copies = [];
            for (const id of selIds) {
                const f = cfgFields.find(x => x.id === id);
                if (!f) continue;
                copies.push({
                    ...f,
                    id: generateFieldId(),
                    label: `${f.label || f.id} (copy)`,
                    dayGroup: null, // a copy is standalone — re-group it if wanted
                    day: 1,
                    questionId: null // the original keeps its wizard question
                });
            }
            cfgFields.push(...copies);
            if (cfgSelection?.kind === 'signature' && cfgSignature) {
                const c = { ...cfgSignature, id: generateFieldId(), label: `${cfgSignature.label || 'Signature'} (copy)` };
                cfgSignature = c;
                cfgSelection = { kind: 'signature', id: c.id };
            } else if (copies.length) {
                cfgSelection = { kind: 'field', id: copies[copies.length - 1].id };
                cfgMultiSel = new Set(copies.slice(0, -1).map(c => c.id));
            }
            refreshCfgOverlays();
            refreshWizardBuilder();
            showToast(`Duplicated ${copies.length || 1} box(es) — same size & position`);
        }

        function addSignatureBox() {
            if (cfgSignature) { selectCfgItem('signature', cfgSignature.id); return; }
            cfgSignature = { id: generateFieldId(), label: 'Signature', x: 0.58, y: 0.86, w: 0.32, h: 0.07, page: 1 };
            cfgSelection = { kind: 'signature', id: cfgSignature.id };
            refreshCfgOverlays();
        }

        // Pointer-based editor on the page stack: click-drag empty space to create a box;
        // Shift-drag empty space to marquee-select boxes; Shift-click a box to multi-select;
        // drag a box body to move it — plain = whole daily-entry group, Ctrl/⌘ = that day's
        // row (all boxes on the same day in the group), Alt/⌥ = just that one box; drag a
        // corner/edge handle to resize. All geometry is normalized 0–1 within its page.
        function attachBoxEditor(stage) {
            stage.querySelectorAll('.form-page').forEach(pageEl => {
                const pageNum = parseInt(pageEl.dataset.page, 10) || 1;
                let drag = null; // { mode:'create'|'marquee'|'move'|'axis'|'resize', ... }

                pageEl.addEventListener('pointerdown', (e) => {
                    if (e.button !== 0) return;
                    const rect = pageEl.getBoundingClientRect();
                    if (!rect.width || !rect.height) return;
                    const px = clamp01((e.clientX - rect.left) / rect.width);
                    const py = clamp01((e.clientY - rect.top) / rect.height);

                    const handle = e.target.closest('.handle');
                    const boxEl = e.target.closest('.field-box');
                    if (boxEl && boxEl.dataset.id) {
                        const id = boxEl.dataset.id;
                        const kind = boxEl.dataset.kind || 'field';
                        if (handle?.dataset.axis) {
                            // Axis-move handle (↕ above / ↔ beside the box): slide along one
                            // axis only, so boxes can be lined up neatly. A daily-entry group
                            // still moves as one block — unless a modifier is held:
                            //   Alt/⌥    → just this box (one field).
                            //   Ctrl/⌘   → all boxes on that day within the group (one row).
                            cfgSelection = { kind, id };
                            cfgMultiSel = new Set();
                            refreshCfgOverlays();
                            const item0 = findCfgItem(kind, id);
                            let members;
                            if (e.altKey) {
                                members = [id];
                            } else if ((e.ctrlKey || e.metaKey) && item0.dayGroup) {
