                            el.style.left = (item.x * 100) + '%';
                            el.style.top = (item.y * 100) + '%';
                            el.style.width = (item.w * 100) + '%';
                            el.style.height = (item.h * 100) + '%';
                        }
                    }
                });

                const finishDrag = () => {
                    if (!drag) return;
                    if (drag.mode === 'create') {
                        const g = drag.geo;
                        if (g && g.w >= 0.02 && g.h >= 0.015) {
                            const f = {
                                id: generateFieldId(), label: `Field ${cfgFields.length + 1}`,
                                x: r4(g.x), y: r4(g.y), w: r4(g.w), h: r4(g.h),
                                page: pageNum, fontSize: 10, align: 'left',
                                source: null, questionId: null,
                                day: 1, dayGroup: null,
                                checkbox: false, checkValue: ''
                            };
                            cfgFields.push(f);
                            cfgSelection = { kind: 'field', id: f.id };
                        } else {
                            clearCfgSelection(); // plain click on empty space deselects
                        }
                    } else if (drag.mode === 'marquee') {
                        drag.el?.remove();
                    }
                    drag = null;
                    refreshCfgOverlays();
                };
                pageEl.addEventListener('pointerup', finishDrag);
                pageEl.addEventListener('pointercancel', () => { if (drag) { drag = null; refreshCfgOverlays(); } });
            });
        }

        // ---- Field properties panel (Step 3) ----
        const BINDING_OPTIONS = [
            ['lot.name', 'lot.name — lot #'],
            ['lot.strain', 'lot.strain — strain name'],
            ['lot.stage', 'lot.stage — phase'],
            ['lot.plantCount', 'lot.plantCount — plant count'],
            ['lot.parentLotId', 'lot.parentLotId — parent lot #'],
            ['lot.createdDate', 'lot.createdDate — creation date'],
            ['lot.destRoom', 'lot.destRoom — grow room'],
            ['lot.vegRoom', 'lot.vegRoom — veg room'],
            ['lot.cloningRoom', 'lot.cloningRoom — clone room'],
            ['instance.phase', 'instance.phase — phase snapshot'],
            ['sheet.periodStart', 'sheet.periodStart — window start'],
            ['sheet.periodEnd', 'sheet.periodEnd — window end'],
            ['day.date', 'day.date — date of the current day (MM/DD, row fields only)']
        ];

                </div>`;
            const pageSel = `
                <div class="form-group"><label for="fpPage">Page</label><select id="fpPage">${pageOpts}</select></div>`;

            let body;
            if (isSig) {
                body = `
                    <div class="form-group" style="margin-bottom:10px;"><label for="fpLabel">Label</label><input type="text" id="fpLabel" value="${escapeHtml(item.label || '')}" placeholder="e.g., Initials"></div>
                    ${geo}${pageSel}`;
            } else {
                const srcOpts = `<option value=""${!item.source ? ' selected' : ''}>— wizard question —</option>` +
                    BINDING_OPTIONS.map(([v, l]) => `<option value="${v}"${item.source === v ? ' selected' : ''}>${l}</option>`).join('');
                body = `
                    <div class="form-group" style="margin-bottom:10px;"><label for="fpLabel">Label</label><input type="text" id="fpLabel" value="${escapeHtml(item.label || '')}" placeholder="e.g., Strain Name"></div>
                    ${geo}${pageSel}
                    <div class="fp-grid">
                        <div class="form-group"><label for="fpFontSize">Font (pt)</label><input type="number" id="fpFontSize" min="4" max="72" step="0.5" value="${item.fontSize ?? 10}"></div>
                        <div class="form-group"><label for="fpAlign">Align</label><select id="fpAlign">
                            <option value="left"${item.align === 'left' ? ' selected' : ''}>left</option>
                            <option value="center"${item.align === 'center' ? ' selected' : ''}>center</option>
                            <option value="right"${item.align === 'right' ? ' selected' : ''}>right</option>
                        </select></div>
                    </div>
                    <div class="form-group"><label for="fpSource">Auto-fill source</label><select id="fpSource">${srcOpts}</select></div>
                    <div class="form-group" id="fpQuestionWrap" style="display:${item.source ? 'none' : ''};">
                        <label for="fpQuestionLink">Filled by question</label>
                        <select id="fpQuestionLink">
                            <option value="">— none (unbound) —</option>
                            ${(cfgWizard?.questions || []).map(q => `<option value="${q.id}"${item.questionId === q.id ? ' selected' : ''}>${escapeHtml(q.label || q.id)}</option>`).join('')}
                        </select>
                    </div>
                    ${item.dayGroup ? `
                    <div class="form-group">
                        <label style="font-size:0.75rem; color:var(--text-secondary); text-transform:uppercase; letter-spacing:0.5px;">Daily-entry group</label>
                        <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
                            <span class="fp-id">${escapeHtml(item.dayGroup)} · day ${item.day || 1}</span>
                            <button type="button" class="btn btn-secondary" id="fpUngroupBtn" style="min-height:36px; padding:4px 12px; font-size:0.8rem;">✂️ Ungroup</button>
                        </div>
                    </div>` : ''}
                    <div class="form-group">
                        <label style="display:flex; align-items:center; gap:8px; cursor:pointer; text-transform:none; letter-spacing:0; font-size:0.85rem; color:var(--text-primary);">
                            <input type="checkbox" id="fpCheckbox"${item.checkbox ? ' checked' : ''} style="width:18px; height:18px; min-height:0;"> ☑ Checkbox field (prints an X when its value matches)
                        </label>
                    </div>
                    <div class="form-group" id="fpCheckValueWrap" style="display:${item.checkbox ? '' : 'none'};"><label for="fpCheckValue">Checked when value equals</label><input type="text" id="fpCheckValue" value="${escapeHtml(item.checkValue ?? '')}" placeholder="e.g., Bloom"></div>`;
            }

            return `
                <div class="fp-body" id="fpBody">
                    <div class="field-properties">
                        <div class="fp-head">
                            <span class="fp-id">${isSig ? '✍️' : ''} ${escapeHtml(item.id)}</span>
                            <span style="display:flex; gap:6px;">
                                <button type="button" class="btn btn-secondary" id="fpDuplicateBtn" title="Copy this box — exact same size & position" style="min-height:36px; padding:4px 12px; font-size:0.8rem;">⧉ Duplicate</button>
                                <button type="button" class="btn btn-danger" id="fpDeleteBtn" style="min-height:36px; padding:4px 12px; font-size:0.8rem;">🗑 Delete</button>
                            </span>

                        ${body}

        }

        function wireFieldProperties() {
            // Multi-selection panel: group / ungroup / duplicate actions.
            if (selectedFieldIds().length > 1) {
                $('fpGroupBtn')?.addEventListener('click', groupSelectionAsDailyEntry);
                $('fpUngroupBtn')?.addEventListener('click', ungroupSelection);
                $('fpDuplicateBtn')?.addEventListener('click', duplicateSelection);
                return;
            }
            if (!cfgSelection) return;
            const item = findCfgItem(cfgSelection.kind, cfgSelection.id);
            if (!item) return;
            const isSig = cfgSelection.kind === 'signature';
            // Light refresh — updates box + panel without reloading the page images.
            const num = (id, apply) => { const el = $(id); if (!el) return; el.addEventListener('change', () => { apply(parseFloat(el.value)); refreshCfgOverlays(); }); };

            $('fpLabel').addEventListener('change', () => { item.label = $('fpLabel').value.trim(); refreshCfgOverlays(); });
            num('#fpX', v => { if (!isNaN(v)) item.x = r4(clamp01(v)); });
            num('#fpY', v => { if (!isNaN(v)) item.y = r4(clamp01(v)); });
            num('#fpW', v => { if (!isNaN(v)) item.w = r4(Math.max(0.01, Math.min(1, v))); });
            num('#fpH', v => { if (!isNaN(v)) item.h = r4(Math.max(0.01, Math.min(1, v))); });
            $('fpPage').addEventListener('change', () => { item.page = parseInt($('fpPage').value, 10) || 1; refreshCfgOverlays(); });

            if (!isSig) {
                num('#fpFontSize', v => { if (!isNaN(v)) item.fontSize = Math.max(4, Math.min(72, v)); });
                $('fpAlign').addEventListener('change', () => { item.align = $('fpAlign').value; refreshCfgOverlays(); });
                $('fpSource').addEventListener('change', () => {
                    // A field is either auto-filled or question-filled — never both. Bindings
                    // are group-level: the source applies to every day of the column.
                    const src = $('fpSource').value || null;
                    mutateFieldGroup(item.id, t => { if (src) t.questionId = null; t.source = src; });
                    refreshCfgOverlays();
                    refreshWizardBuilder();
                });
                const qWrap = $('fpQuestionWrap');
                if (qWrap) {
                    qWrap.style.display = item.source ? 'none' : '';
                    $('fpQuestionLink').addEventListener('change', () => {
                        const qid = $('fpQuestionLink').value || null;
                        // The field side is the sole binding point. Propagate to every day of
                        // THIS box's column (same group + same x) — editing any day's box
                        // updates the whole column, so the binding repeats across all days.
                        // Sibling columns in the same group keep their own bindings.
                        const col = item.dayGroup
                            ? cfgFields.filter(x => x.dayGroup === item.dayGroup && Math.abs(x.x - item.x) < 0.005)
                            : [item];
                        for (const t of col) t.questionId = qid;
                        refreshCfgOverlays();
                        refreshWizardBuilder();
                    });
                }
                // Ungroup (single box in a daily-entry group): remove the group's day 2..N boxes.
                $('fpUngroupBtn')?.addEventListener('click', () => {
                    cfgMultiSel = new Set();
                    ungroupSelection();
                });
                const cbWrap = $('fpCheckValueWrap');
                if (cbWrap) {
                    cbWrap.style.display = item.checkbox ? '' : 'none';
                    $('fpCheckbox').addEventListener('change', () => { item.checkbox = $('fpCheckbox').checked; refreshCfgOverlays(); });
                    $('fpCheckValue').addEventListener('change', () => { item.checkValue = $('fpCheckValue').value.trim(); refreshCfgOverlays(); });
                }
            }
            $('fpDuplicateBtn')?.addEventListener('click', duplicateSelection);
            $('fpDeleteBtn').addEventListener('click', deleteSelectedCfgItem);
        }

        // ---- Filing Cabinet (Step 5) — pure computed view, stores nothing ----

        // Map a configured sheet to one of the fixed cabinet sections.
        function sheetSection(sheetId) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return null;
            if (sheet.cadence === 'daily-weekly') return 'grow-log';
            if (sheet.cadence === 'one-shot') return 'propagation';
            // event sheets: classify by sheet id / name keywords
            const s = (sheetId + ' ' + (sheet.name || '')).toLowerCase();
            if (/clean/.test(s)) return 'room-clean';
            if (/ipm|pest|spray|treat/.test(s)) return 'ipm';
            if (/harvest|trim|dry|cure/.test(s)) return 'harvest';
            return 'other';
        }

        const CAB_SECTIONS = [
            { key: 'propagation', icon: '📄', label: 'Propagation' },
            { key: 'room-clean', icon: '🧼', label: 'Room Cleans (pre-move-in)' },
            { key: 'grow-log', icon: '📗', label: 'Grow Logs' },
            { key: 'ipm', icon: '🐛', label: 'IPM Log' },
            { key: 'harvest', icon: '🌾', label: 'Harvest' },
            { key: 'other', icon: '📄', label: 'Other' }
        ];

        function wizardForSheet(sheetId) {
            return Object.values(DB.paperWizard?.wizards || {}).find(w => w.sheetId === sheetId) || null;
        }

        // Question ids that must be answered for a day slot to count as filled.
        function rowScopedQuestionIds(sheetId) {
            const wiz = wizardForSheet(sheetId);
            if (!wiz) return [];
            return (wiz.questions || []).filter(q => q.rowScoped).map(q => q.id);
        }

        // Instance-level questions (one-shot / event completion).
        function instanceQuestionIds(sheetId) {
            const wiz = wizardForSheet(sheetId);
            if (!wiz) return [];
            return (wiz.questions || []).filter(q => !q.rowScoped).map(q => q.id);
        }

        function hasAnswer(map, qid) {
            const v = map?.[qid];
            if (v === null || v === undefined) return false;
            // A drawn-initials answer is a {name, strokes} object — answered when it has strokes.
            if (typeof v === 'object') return Array.isArray(v.strokes) && v.strokes.length > 0;
            return String(v).trim() !== '';
        }

        // Is a given day fully answered for the sheet's row-scoped questions? A row-scoped
        // initials question is one of them — hasAnswer treats its {strokes} object as answered
        // only once drawn, so per-day accountability falls out with no special-casing.
        function dayAnswered(instance, dateStr, sheetId) {
            const day = instance.days?.[dateStr];
            if (!day) return false;
            const qids = rowScopedQuestionIds(sheetId);
            if (qids.length === 0) {
                if (!Object.keys(day).some(k => hasAnswer(day, k))) return false;
            } else if (!qids.every(qid => hasAnswer(day, qid))) return false;
            return true;
        }

        // Active window for a daily-weekly instance: [periodStart, min(periodEnd, phaseChangeDate)].
        function activeWindow(inst, key) {
            const start = parseDate(key);
            const endFull = new Date(start.getTime());
            endFull.setDate(endFull.getDate() + 6);
            let end = endFull;
            if (inst.phaseChangeDate) {
                const pc = parseDate(inst.phaseChangeDate);
                if (pc < end) end = pc;
                if (end < start) end = new Date(start.getTime()); // safety: never invert
            }
            return { start, end };
        }

        function daysBetween(a, b) {
            return Math.round((b - a) / 86400000) + 1;
        }

        // Completion rule (spec): daily-weekly = every active-window day answered for all
        // row-scoped questions (+ signature if defined; strikeInitials when phaseChangeDate set).
        // one-shot/event = all instance-level questions answered (+ signature if defined).
        function instanceComplete(sheetId, key, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return false;
            const needsSig = !!sheet.signature;
            if (sheet.cadence === 'daily-weekly') {
                const { start, end } = activeWindow(inst, key);
                const total = daysBetween(start, end);
                let filled = 0;
                for (const d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) {
                    if (dayAnswered(inst, dateToStr(d), sheetId)) filled++;
                }
                const strikeOk = !inst.phaseChangeDate || !!inst.strikeInitials;
                return filled === total && (!needsSig || inst.signature) && strikeOk;
            }
            const qids = instanceQuestionIds(sheetId);
            const answered = qids.filter(qid => hasAnswer(inst.header, qid)).length;
            return qids.length > 0 && answered === qids.length && (!needsSig || inst.signature);
        }

        // Re-evaluate completion after a save: completedAt is set/cleared — never a flag.
        function evaluateCompletion(sheetId, key, inst) {
            inst.completedAt = instanceComplete(sheetId, key, inst) ? new Date().toISOString() : null;
        }

        // ---- Phase change / write-back (Step 9) ----

        // Strike-out computation (spec: derived, never stored). Takes the instance's
        // phaseChangeDate + the sheet's day-row geometry (its explicit daily-entry groups)
        // and returns the struck rows, one diagonal across them, and label positions — all
        // in normalized page coords. Feeds the print popup (SVG overlay) and any preview.
        function computeStrikeOut(sheet, inst, key) {
            if (!inst?.phaseChangeDate) return null;
            const rows = dayRowsFromGroups(sheet);
            if (!rows) return null; // no day-row geometry configured
            const d1 = (rows.find(r => r.day === 1)?.fields) || [];
            if (!d1.length) return null;
            // Horizontal extent of the day section (from the day-1 row).
            const x0 = Math.min(...d1.map(f => f.x));
            const x1 = Math.max(...d1.map(f => f.x + f.w));
            // Struck rows: every day row whose date is after the phase-change date.
            const struckRows = [];
            for (const r of rows) {
                const d = r.day || 1;
                if (d <= 1) continue;
                if (addDaysStr(key, d - 1) > inst.phaseChangeDate) {
                    struckRows.push({
                        day: d,
                        yTop: Math.min(...r.fields.map(f => f.y)),
                        yBot: Math.max(...r.fields.map(f => f.y + f.h))
                    });
                }
            }
            if (!struckRows.length) return null;
            const first = struckRows[0], last = struckRows[struckRows.length - 1];
            // One diagonal: top-right of the first struck row → bottom-left of the last.
            const line = { x1, y1: first.yTop, x2: x0, y2: last.yBot };
            const midX = (line.x1 + line.x2) / 2, midY = (line.y1 + line.y2) / 2;
            const gap = Math.max(0.015, (last.yBot - first.yTop) * 0.08);
            // Drawn strike-initials box: a wide/short rect centered just above the midpoint.
            const iw = 0.2, ih = 0.07;
            return {
                struckRows,
                line,
                initialsRect: { x: midX - iw / 2, y: (midY - gap) - ih / 2, w: iw, h: ih }, // above the line
                date: { x: midX, y: midY + gap }      // centered just below it
            };
        }

        // Drawn strike-out initials capture: a modal pad (like the signature/initials pads) where
        // the master grower draws their initials for the phase-change strike-out. Resolves to
        // { name, strokes } on confirm, or null if cancelled / left empty.
        function captureStrikeInitials(newPhase) {
            return new Promise((resolve) => {
                const ov = document.createElement('div');
                ov.className = 'strike-overlay';
                ov.innerHTML = `
                    <div class="strike-card">
                        <div class="strike-title">✍️ Strike-out initials — ${escapeHtml(newPhase)}</div>
                        <div class="strike-sub">This closes the current grow-log (rows after today are struck through) and starts a fresh one. Draw your initials for the strike-out:</div>
                        <div class="sig-pad-wrap"><canvas id="strikePad" class="sig-pad"></canvas></div>
                        <input type="text" id="strikeName" class="sig-name" placeholder="Signer name / initials">
                        <div class="strike-foot">
                            <button type="button" class="btn btn-secondary" id="strikeClearBtn">🧹 Clear</button>
                            <span class="spacer"></span>
                            <button type="button" class="btn btn-secondary" id="strikeCancelBtn">Cancel</button>
                            <button type="button" class="btn btn-primary" id="strikeOkBtn">Record phase change</button>
                        </div>
                    </div>`;
                document.body.appendChild(ov);
                const strokes = [];
                const pad = initDrawPad('strikePad', 3, strokes);
                const nameEl = $('strikeName');
                const clearAll = () => { strokes.length = 0; if (pad) pad.clear(); };
                $('strikeClearBtn').addEventListener('click', clearAll);
                $('strikeCancelBtn').addEventListener('click', () => { ov.remove(); resolve(null); });
                $('strikeOkBtn').addEventListener('click', () => {
                    if (!strokes.length) { showToast('Draw your initials first'); return; }
                    const name = (nameEl.value || '').trim();
                    ov.remove();
                    resolve({ name, strokes });
                });
            });
        }

        // Phase-change rollover (spec "Phase Change") — data-only: closes the open daily-weekly
        // instance (phaseChangeDate = today + confirmer's drawn strikeInitials) and creates a
        // fresh instance for the new phase (periodStart = move date, header carries the new
        // phase), optionally writing the new stage back to the main DB. Returns { inst, newKey,
        // newPhase, reused } or null if cancelled — callers handle notify/close/render + double-entry offer.
        async function phaseRollover(writeBack) {
            const ctx = runnerCtx;
            if (!ctx) return null;
            const wiz = wizardForSheet(ctx.sheetId);
            const phaseQ = wiz.questions.find(q => q.writesTo === 'lot.stage');
            const newPhase = String(phaseQ ? (ctx.draft[phaseQ.id] ?? '') : '').trim();
            if (!newPhase) return null;
            const today = todayStr();
            const oldInst = ctx.inst;
            const pw = DB.paperWizard;
            if (!pw.entries[ctx.lotId]) pw.entries[ctx.lotId] = {};
            if (!pw.entries[ctx.lotId][ctx.sheetId]) pw.entries[ctx.lotId][ctx.sheetId] = { instances: {} };
            const sheetData = pw.entries[ctx.lotId][ctx.sheetId];
            if (!sheetData.instances) sheetData.instances = {};
            // Collision at the move date with an empty old instance (phase change recorded on the
            // window's very first entry): two instances can't share a key, and an empty log has
            // nothing to strike through — repurpose it in place instead.
            if (sheetData.instances[today] === oldInst && !oldInst.signature
                && Object.keys(oldInst.days || {}).length === 0
                && !Object.entries(oldInst.header || {}).some(([, v]) => String(v ?? '').trim() !== '')) {
                oldInst.phase = newPhase;
                oldInst.phaseChangeDate = null;
                oldInst.strikeInitials = null;
                for (const q of wiz.questions) {
                    if (!q.rowScoped && String(ctx.draft[q.id] ?? '').trim() !== '') oldInst.header[q.id] = ctx.draft[q.id];
                }
                if (writeBack && DB.lots[ctx.lotId]) DB.lots[ctx.lotId].stage = stageFromForm(newPhase);
                captureSnapshots(ctx.sheetId, ctx.lotId, ctx.key, oldInst);
                evaluateCompletion(ctx.sheetId, ctx.key, oldInst);
                return { inst: oldInst, newKey: ctx.key, newPhase, reused: true };
            }
            const drawn = await captureStrikeInitials(newPhase);
            if (!drawn) { showToast('Phase change cancelled — no changes made'); return null; }
            // 1) Close the old instance: window ends at the move date, initials captured (drawn).
            oldInst.phaseChangeDate = today;
            oldInst.strikeInitials = { name: drawn.name, strokes: drawn.strokes };
            // 2) Fresh instance for the new phase. periodStart = move date; if a non-empty log
            //    already owns that key, shift forward so nothing is clobbered — the new log then
            //    starts the day after the old one closed.
            let newKey = today;
            while (sheetData.instances[newKey]) newKey = addDaysStr(newKey, 1);
            const newInst = { phase: newPhase, header: {}, days: {}, phaseChangeDate: null, strikeInitials: null,
                              snapshots: {}, signature: null, completedAt: null, printedAt: null };
            // Header carries the new phase + any other instance-level answers from this save.
            for (const q of wiz.questions) {
                if (!q.rowScoped && String(ctx.draft[q.id] ?? '').trim() !== '') newInst.header[q.id] = ctx.draft[q.id];
            }
            sheetData.instances[newKey] = newInst;
            // 3) Write-back: the wizard-recorded change updates the main DB (the only field
            //    PaperWizard may write besides plantCount). Reverse-direction rollovers skip this.
            if (writeBack && DB.lots[ctx.lotId]) {
                DB.lots[ctx.lotId].stage = stageFromForm(newPhase); // 'Bloom' → 'flower'
            }
            captureSnapshots(ctx.sheetId, ctx.lotId, ctx.key, oldInst);
            evaluateCompletion(ctx.sheetId, ctx.key, oldInst);
            captureSnapshots(ctx.sheetId, ctx.lotId, newKey, newInst);
            evaluateCompletion(ctx.sheetId, newKey, newInst);
            return { inst: newInst, newKey, newPhase, reused: false };
        }

        // Reverse-direction detection (spec): the lot's live stage changed in SitkaTools and no
        // longer matches this instance's stored phase → prompt to confirm the move. Rolls over
        // WITHOUT writing back — the main DB is already correct. Called from openRunner after
        // runnerCtx is set up for this instance; returns true when the open was handled.
        async function checkStageMismatch(lotId, sheetId, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet || sheet.cadence !== 'daily-weekly') return false;
            if (inst.phaseChangeDate || inst.completedAt) return false; // already closed / done — not the open log
            const lot = DB.lots[lotId];
            // Compare in the form's vocabulary — 'flower' and 'Bloom' are the same phase.
            if (!lot || !inst.phase || !lot.stage || normalizeStage(inst.phase) === normalizeStage(lot.stage)) return false;
            const ok = confirm(`Lot is now in ${normalizeStage(lot.stage)} — close this grow-log?\n\n` +
                `The open log was started in ${inst.phase}. Confirming records the phase change (rows after today are struck through) and starts a fresh log for ${lot.stage}.`);
            if (!ok) return false; // proceed to open the runner normally
            const wiz = wizardForSheet(sheetId);
            const phaseQ = wiz?.questions.find(q => q.writesTo === 'lot.stage');
            if (!phaseQ) { showToast('No Phase question on this sheet — record the move in SitkaTools instead'); return false; }
            // Point the Phase question's draft at the new stage (form vocabulary) so the rollover records it.
            runnerCtx.draft[phaseQ.id] = normalizeStage(lot.stage);
            const roll = await phaseRollover(false);
            if (!roll) return false; // cancelled at the initials prompt — open normally
            notifySitkaTools();
            closeRunner();
            renderAll();
            showToast(`Phase change to ${lot.stage} recorded — new grow-log started ${fmtShort(roll.newKey)}`);
            if (!roll.reused && confirm('Start filling the new grow-log now?')) openRunner(lotId, sheetId, roll.newKey);
            return true;
        }

        // Status chip for an owned instance. Returns { text, cls }.
        function instanceStatus(sheetId, key, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return { text: '—', cls: '' };
            if (instanceComplete(sheetId, key, inst)) return { text: '✓ complete', cls: 'ok' };

            if (sheet.cadence === 'daily-weekly') {
                const { start, end } = activeWindow(inst, key);
                const total = daysBetween(start, end);
                let filled = 0;
                for (const d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) {
                    if (dayAnswered(inst, dateToStr(d), sheetId)) filled++;
                }
                // Due: today inside the active window and today's slot not filled.
                const today = parseDate(todayStr());
                if (today >= start && today <= end && !dayAnswered(inst, todayStr(), sheetId))
                    return { text: '⏳ due', cls: 'due' };
                if (filled === 0) return { text: '— not started', cls: '' };
                let txt = `${filled}/${total} days`;
                if (inst.phaseChangeDate) txt += ` · phase change ${fmtShort(inst.phaseChangeDate)}`;
                return { text: txt, cls: '' };
            }

            // one-shot / event progress.
            const qids = instanceQuestionIds(sheetId);
            const answered = qids.filter(qid => hasAnswer(inst.header, qid)).length;
            if (answered === 0) return { text: '— not started', cls: '' };
            let txt = `${answered}/${qids.length} fields`;
            if (inst.phaseChangeDate) txt += ` · phase change ${fmtShort(inst.phaseChangeDate)}`;
            return { text: txt, cls: '' };
        }

        // Count of daily-weekly instances whose entry is due today for a lot.
        function dueTodayCount(lotId) {
            const entries = DB.paperWizard?.entries?.[lotId] || {};
            let n = 0;
            for (const [sheetId, sheetData] of Object.entries(entries)) {
                const sheet = DB.paperWizard?.sheets?.[sheetId];
                if (!sheet || sheet.cadence !== 'daily-weekly') continue;
                for (const [key, inst] of Object.entries(sheetData.instances || {})) {
                    if (instanceStatus(sheetId, key, inst).cls === 'due') n++;
                }
            }
            return n;
        }

        // All room names known to the DB (rooms table + lot room fields). Names may duplicate.
        function knownRoomNames() {
            const names = new Set();
            Object.values(DB.rooms || {}).forEach(r => { if (r?.name) names.add(String(r.name)); });
            Object.values(DB.lots || {}).forEach(l => {
                ['cloningRoom', 'vegRoom', 'destRoom'].forEach(k => { if (l?.[k]) names.add(String(l[k])); });
            });
            return [...names];
        }

        // Move-in dates for a lot's three rooms (spec: Filing Cabinet sourcing rule).
        function moveInDates(lotId) {
            const today = todayStr();
            const entries = DB.paperWizard?.entries?.[lotId] || {};
            // Earliest periodStart of a grow-log instance with the given phase.
            const firstPhase = phase => {
                let best = null;
                for (const [sheetId, sd] of Object.entries(entries)) {
                    const sheet = DB.paperWizard?.sheets?.[sheetId];
                    if (!sheet || sheet.cadence !== 'daily-weekly') continue;
                    for (const [key, inst] of Object.entries(sd.instances || {})) {
                        if (String(inst.phase || '').toLowerCase() === phase.toLowerCase()) {
                            if (!best || key < best) best = key;
                        }
                    }
                }
                return best;
            };
            const lot = DB.lots[lotId];
            return {
                clone: (lot?.createdDate && String(lot.createdDate).slice(0, 10)) || today,
                veg: firstPhase('Veg') || today,
                grow: firstPhase('Bloom') || today
            };
        }

        // Scan ALL lots' room-clean event instances. Returns [{ lotId, sheetId, key, date, roomName }].
        function allRoomCleans() {
            const out = [];
            const roomNames = knownRoomNames();
            for (const [lotId, sheets] of Object.entries(DB.paperWizard?.entries || {})) {
                for (const [sheetId, sd] of Object.entries(sheets || {})) {
                    if (sheetSection(sheetId) !== 'room-clean') continue;
                    for (const [key, inst] of Object.entries(sd.instances || {})) {
                        // The room name lives somewhere in the header values.
                        const roomName = Object.values(inst.header || {})
                            .map(v => String(v ?? '').trim())
                            .find(v => v && roomNames.some(n => n.toLowerCase() === v.toLowerCase())) || null;
                        out.push({ lotId, sheetId, key, date: key, roomName });
                    }
                }
            }
            return out;
        }

        // Most recent clean of a room dated on/before `byDate`. Null if none.
        // Reference nodes are other lots' documents — exclude the lot's own cleans
        // (those appear as owned leaves instead).
        function cleanBefore(roomName, byDate, excludeLotId) {
            const matches = allRoomCleans().filter(c =>
                c.lotId !== excludeLotId &&
                c.roomName && c.roomName.toLowerCase() === roomName.toLowerCase() && c.date <= byDate);
            if (!matches.length) return null;
            matches.sort((a, b) => b.date.localeCompare(a.date));
            return matches[0];
        }

        // ---- Tab renderers ----

        const CAB_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        function fmtShort(dateStr) {
            const d = parseDate(dateStr);
            return `${CAB_MONTHS[d.getMonth()]} ${d.getDate()}`;
        }

        function addDaysStr(dateStr, n) {
            const d = parseDate(dateStr);
            d.setDate(d.getDate() + n);
            return dateToStr(d);
        }

        // 🖨️ Print button for a leaf (Step 10). Always rendered and always clickable once an
        // entry exists and the matching page set is loaded this session — incomplete instances
        // print too (unanswered fields show N/A / empty boxes). The tooltip still lists what's
        // missing so the user knows the copy isn't final; only "no entry yet" or "document not
        // loaded" actually disable the button.
        function printButtonHtml({ lotId, sheetId, key }) {
            const inst = DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances?.[key] || null;
            const blockers = printBlockers(sheetId, key, inst);
            // Hard locks only: nothing to print yet, or no page set for this sheet this session.
            const disabled = !inst || (blockers.length > 0 && /not loaded/.test(blockers[0]));
            const title = blockers.length ? `Print — ${blockers.join(' · ')}` : 'Open print popup';
            return `<button type="button" class="cab-print" data-print="1" data-plot="${escapeHtml(lotId)}" data-sheet="${escapeHtml(sheetId)}" data-key="${escapeHtml(key)}"${disabled ? ' disabled' : ''} title="${escapeHtml(title)}">🖨️ Print</button>`;
        }

        // One cabinet leaf row. `label` must be pre-escaped HTML.
        function cabLeaf(label, status, opts = {}) {
            const refCls = opts.ref ? ' ref' : '';
            const from = opts.from ? `<span class="cab-from">from ${escapeHtml(opts.from)}</span>` : '';
            // Reference nodes open the same print popup as owned instances (no Fill action).
            const printBtn = opts.print ? printButtonHtml(opts.print) : '';
            return `<div class="cab-leaf${refCls}">
                <span class="cab-label">${label}</span>
                ${from}
                ${printBtn}
                <span class="cab-status ${status.cls}">${status.text}</span>
            </div>`;
        }

        // Owned leaf with an inline Fill button (reference nodes stay read-only).
        function cabLeafFill(label, status, sheetId, key, lotId) {
            return `<div class="cab-leaf" data-fill="1" data-sheet="${escapeHtml(sheetId)}" data-key="${escapeHtml(key)}">
                <span class="cab-label">${label}</span>
                <button type="button" class="cab-fill">Fill</button>
                ${printButtonHtml({ lotId: lotId || activeLotId, sheetId, key })}
                <span class="cab-status ${status.cls}">${status.text}</span>
            </div>`;
        }

        // ---- Wizard runner (Step 6) — centered card, one question at a time ----
        let runnerCtx = null; // { lotId, sheetId, key, day, idx, draft } while the modal is open

        // Resolve a binding string against the current DB (prefill only — the stored answer prints).
        function resolveBinding(binding, ctx) {
            if (!binding) return null;
            const [kind, field] = String(binding).split('.');
            if (kind === 'lot') {
                const lot = DB.lots[ctx.lotId];
                const v = lot ? lot[field] : null;
                if (field === 'stage') return normalizeStage(v); // form vocabulary for prefill/print
                return (v === null || v === undefined) ? null : String(v);
            }
            if (kind === 'instance' && field === 'phase') return ctx.inst?.phase || null;
            if (kind === 'day' && field === 'date') return ctx.dayDate ? fmtMMDD(ctx.dayDate) : null;
            if (kind === 'sheet') {
                const start = ctx.key;
                // periodEnd only makes sense for a real date key (daily-weekly windows).
                const end = /^\d{4}-\d{2}-\d{2}$/.test(start) ? addDaysStr(start, 6) : null;
                if (field === 'periodStart') return start;
                if (field === 'periodEnd') return end;
            }
            return null;
        }

        // Every binding a sheet uses: field sources + question prefillFrom values.
        function sheetBindings(sheetId) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return [];
            const set = new Set();
            for (const f of sheet.fields || []) if (f.source) set.add(f.source);
            const wiz = wizardForSheet(sheetId);
            for (const q of wiz?.questions || []) if (q.prefillFrom) set.add(q.prefillFrom);
            return [...set];
        }

        // Capture save-time binding snapshots on the instance (spec: captured at creation and
        // refreshed on every entry save — the stored snapshot, not the live DB, is what prints).
        function captureSnapshots(sheetId, lotId, key, inst) {
            if (!inst.snapshots) inst.snapshots = {};
            for (const b of sheetBindings(sheetId)) {
                if (b === 'day.date') continue; // derived per row at print time — never snapshotted
                inst.snapshots[b] = resolveBinding(b, { lotId, key, inst });
            }
        }

        // Previous daily-weekly instance key for this lot+sheet (for same-as-last at a chain start).
        // The current instance may be an unsaved draft, so take the largest stored key before it.
        function prevInstanceKey(lotId, sheetId, key) {
            const keys = Object.keys(DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances || {}).sort();
            let best = null;
            for (const k of keys) if (k < key) best = k;
            return best;
        }

        async function openRunner(lotId, sheetId, key) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            const wiz = wizardForSheet(sheetId);
            if (!sheet || !wiz) { showToast('No wizard configured for this sheet'); return; }

            let instKey = key;
            let inst = DB.paperWizard.entries[lotId]?.[sheetId]?.instances?.[instKey] || null;
            const today = todayStr();
            if (!inst) {
                // No instance yet — create a draft (persisted on Save).
                if (sheet.cadence === 'daily-weekly') instKey = today;
                else if (sheet.cadence === 'event') instKey = key || today;
                else instKey = 'single';
                inst = { phase: sheet.cadence === 'daily-weekly' ? normalizeStage(DB.lots[lotId]?.stage) : null,
                         header: {}, days: {}, phaseChangeDate: null, strikeInitials: null,
                         snapshots: {}, signature: null, completedAt: null, printedAt: null };
            }

            let day = null;
            if (sheet.cadence === 'daily-weekly') {
                const winEnd = addDaysStr(instKey, 6);
                if (today >= instKey && today <= winEnd) day = today; // today inside this window
                else { // otherwise the first unfilled day in the window
                    for (let i = 0; i < 7; i++) {
                        const ds = addDaysStr(instKey, i);
                        if (!dayAnswered(inst, ds, sheetId)) { day = ds; break; }
                    }
                    if (!day) day = instKey;
                }
            }
            runnerCtx = { lotId, sheetId, key: instKey, day, idx: 0, draft: {}, inst,
                sigDraft: inst.signature
                    ? { name: inst.signature.name || '', strokes: (inst.signature.strokes || []).map(s => s.slice()) }
                    : { name: '', strokes: [] } };
            // Reverse-direction phase detection (Step 9): stage changed in SitkaTools since this
            // instance was created → confirm the move and roll over (no write-back — DB is current).
            if (await checkStageMismatch(lotId, sheetId, inst)) return;
            resetRunnerDraft();
            renderRunner();
        }

        // (Re)load the draft answers for the current scope from saved data / prefill bindings.
        function resetRunnerDraft() {
            const { sheetId, inst, day } = runnerCtx;
            const wiz = wizardForSheet(sheetId);
            const draft = {};
            for (const q of wiz.questions) {
                if (q.type === 'initials') {
                    // Drawn initials: the answer is a {name, strokes} object stored in the same
                    // slot as any other answer (per-day for row-scoped, instance-level otherwise).
                    const saved = q.rowScoped ? (inst.days?.[day]?.[q.id] ?? null) : (inst.header?.[q.id] ?? null);
                    draft[q.id] = (saved && Array.isArray(saved.strokes))
                        ? { name: saved.name || '', strokes: saved.strokes.map(s => s.slice()) }
                        : { name: '', strokes: [] };
                    continue;
                }
                let v = q.rowScoped ? (inst.days?.[day]?.[q.id] ?? null) : (inst.header?.[q.id] ?? null);
                if ((v === null || v === undefined || String(v).trim() === '') && q.prefillFrom) {
                    // day.date prefills from the current day (row-scoped only).
                    v = resolveBinding(q.prefillFrom, { lotId: runnerCtx.lotId, key: runnerCtx.key, inst, dayDate: q.rowScoped ? day : null });
                }
                draft[q.id] = (v === null || v === undefined) ? '' : String(v);
            }
            runnerCtx.draft = draft;
        }

        // Sources for "⏪ Same as last time": row-scoped questions copy the previous day's
        // answers (falling back to the previous instance's last day at a chain start);
        // instance-level questions copy the previous instance's header.
        function runnerSameSources() {
            const { sheetId, inst, key, day } = runnerCtx;
            let daySrc = null, instSrc = null;
            if (day) {
                const prevDay = addDaysStr(day, -1);
                if (inst.days?.[prevDay]) daySrc = inst.days[prevDay];
                const pk = prevInstanceKey(runnerCtx.lotId, sheetId, key);
                if (pk) {
                    const pinst = DB.paperWizard.entries[runnerCtx.lotId][sheetId].instances[pk];
                    const pkeys = Object.keys(pinst.days || {}).sort();
                    if (pkeys.length && !daySrc) daySrc = pinst.days[pkeys[pkeys.length - 1]];
                    instSrc = pinst.header || null;
                }
            } else {
                const pk = prevInstanceKey(runnerCtx.lotId, sheetId, key);
                if (pk) instSrc = DB.paperWizard.entries[runnerCtx.lotId][sheetId].instances[pk].header || null;
            }
            return { daySrc, instSrc };
        }

        // "⏪ Same as last time" — pre-fills unanswered sameAsLast questions. Never auto-saves.
        function runnerSameAsLast() {
            const wiz = wizardForSheet(runnerCtx.sheetId);
            const { daySrc, instSrc } = runnerSameSources();
            let n = 0;
            for (const q of wiz.questions) {
                if (!q.sameAsLast) continue;
                if (q.type === 'initials') continue; // never copy drawn strokes
                const src = q.rowScoped ? daySrc : instSrc;
                const v = src ? src[q.id] : null;
                if (v !== null && v !== undefined && String(v).trim() !== '' && String(runnerCtx.draft[q.id] ?? '').trim() === '') {
                    runnerCtx.draft[q.id] = String(v);
                    n++;
                }
            }
            renderRunner();
            showToast(n ? `Copied ${n} answer${n === 1 ? '' : 's'} from last time` : 'Nothing new to copy');
        }

        function runnerGo(delta) {
            const sheet = DB.paperWizard.sheets[runnerCtx.sheetId];
            const wiz = wizardForSheet(runnerCtx.sheetId);
            // Steps = the wizard's questions (an initials question is one of them) + the
            // signature step (if the sheet defines one). Must match renderRunner.
            const totalSteps = wiz.questions.length + (sheet.signature ? 1 : 0);
            runnerCtx.idx = Math.max(0, Math.min(totalSteps - 1, runnerCtx.idx + delta));
            renderRunner();
        }

        function closeRunner() {
            runnerCtx = null;
            const ov = $('wizOverlay');
            if (ov) ov.remove();
            document.removeEventListener('keydown', runnerEscHandler);
        }

        function runnerEscHandler(e) { if (e.key === 'Escape') closeRunner(); }

        // Generic stylus draw-pad: pointer-captured strokes stored as normalized [x,y] arrays
        // within the box. No image is generated — pure vector data, re-drawn on open. Shared by
        // the manager signature pad, the per-day initials pad, and the strike-out capture dialog.
        function initDrawPad(canvasId, aspectRatio, strokes) {
            const canvas = $(canvasId);
            if (!canvas) return;
            const W = 480;
            const H = Math.max(60, Math.round(W / (aspectRatio || 4)));
            canvas.width = W;
            canvas.height = H;
            const g = canvas.getContext('2d');
            g.clearRect(0, 0, W, H);
            g.lineWidth = 2.5;
            g.lineCap = 'round';
            g.lineJoin = 'round';
            g.strokeStyle = '#1a1a1a';

            const drawStroke = (pts) => {
                if (!pts.length) return;
                g.beginPath();
                g.moveTo(pts[0][0] * W, pts[0][1] * H);
                for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] * W, pts[i][1] * H);
                g.stroke();
            };
            for (const s of strokes) drawStroke(s); // repaint existing (re-sign / re-initial view)

            let drawing = false;
            const toNorm = (e) => {
                const r = canvas.getBoundingClientRect();
                return [
                    Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
                    Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
                ];
            };
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                drawing = true;
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
                strokes.push([toNorm(e)]);
            });
            canvas.addEventListener('pointermove', (e) => {
                if (!drawing) return;
                const stroke = strokes[strokes.length - 1];
                const p = toNorm(e);
                const prev = stroke[stroke.length - 1] || p;
                stroke.push(p);
                g.beginPath();
                g.moveTo(prev[0] * W, prev[1] * H);
                g.lineTo(p[0] * W, p[1] * H);
                g.stroke();
            });
            const endStroke = () => { drawing = false; };
            canvas.addEventListener('pointerup', endStroke);
            canvas.addEventListener('pointercancel', endStroke);
            // Clear the pad's pixels + drawing state (the caller empties `strokes` itself).
            return { clear: () => { g.clearRect(0, 0, W, H); drawing = false; } };
        }

        // Manager signature pad (Step 8) — the final review signature at the end of the wizard.
        function initSigPad(ctx) {
            const sheet = DB.paperWizard.sheets[ctx.sheetId];
            const sig = sheet.signature;
            const ar = (sig.w && sig.h) ? (sig.w / sig.h) : 4; // box aspect ratio
            initDrawPad('sigPad', ar, ctx.sigDraft.strokes);
        }

        // Initials-question pad — the draw surface for a wizard question of type 'initials'.
        // Sized to the bound field's aspect ratio (wide/short boxes); strokes live in the
        // question's draft answer ({name, strokes}).
        function initQuestionInitialsPad(ctx, q) {
            const sheet = DB.paperWizard.sheets[ctx.sheetId];
            // The binding lives on the field side — any field carrying this question's id
            // (group members share geometry, so the first match sizes the pad correctly).
            const f = (sheet.fields || []).find(x => x.questionId === q.id);
            const ar = (f && f.w && f.h) ? (f.w / f.h) : 3; // initials boxes are wide/short
            initDrawPad('qInitPad', ar, ctx.draft[q.id].strokes);
        }

        function renderRunner() {
            const ctx = runnerCtx;
            const sheet = DB.paperWizard.sheets[ctx.sheetId];
            const wiz = wizardForSheet(ctx.sheetId);
            const qs = wiz.questions;
            const hasSig = !!sheet.signature;
            const totalSteps = qs.length + (hasSig ? 1 : 0);
            const sigIdx = qs.length;                        // the signature step (if any)
            const isSigStep = hasSig && ctx.idx === sigIdx;
            const q = isSigStep ? null : qs[ctx.idx];
            const isLast = ctx.idx === totalSteps - 1;

            // Day selector (daily-weekly only): the instance's 7-day window. Shown on question
            // and initials steps — both are per-day; the signature step is instance-level.
            let dayChipsHtml = '';
            if (sheet.cadence === 'daily-weekly' && !isSigStep) {
                const chips = [];
                for (let i = 0; i < 7; i++) {
                    const ds = addDaysStr(ctx.key, i);
                    const filled = dayAnswered(ctx.inst, ds, ctx.sheetId);
                    const selCls = ds === ctx.day ? ' sel' : '';
                    chips.push(`<button type="button" class="day-chip${selCls}${filled ? ' filled' : ''}" data-day="${ds}">${fmtShort(ds)}</button>`);
                }
                dayChipsHtml = `<div class="wiz-daychips">${chips.join('')}</div>
                    <div class="wiz-hint">Answers are saved per day — pick a day, answer, then Save.</div>`;
            }

            // Question step body vs signature step body. An initials question renders a draw pad.
            let bodyInner;
            if (isSigStep) {
                bodyInner = `
                <div class="wiz-q-label">✍️ ${escapeHtml(sheet.signature.label || 'Signature')}</div>
                <div class="sig-pad-wrap"><canvas id="sigPad" class="sig-pad"></canvas></div>
                <input type="text" id="sigName" class="sig-name" placeholder="Signer name / initials" value="${escapeHtml(ctx.sigDraft?.name ?? '')}">
                <div class="wiz-hint" style="margin-bottom:10px;">Master grower review — sign off on the whole log.</div>
                <div class="sig-actions"><button type="button" class="sig-clear" id="sigClearBtn">🧹 Clear signature</button></div>`;
            } else if (q.type === 'initials') {
                const d = ctx.draft[q.id] || { name: '', strokes: [] };
                bodyInner = `
                <div class="wiz-q-label">✍️ ${escapeHtml(q.label)}</div>
                <div class="sig-pad-wrap"><canvas id="qInitPad" class="sig-pad"></canvas></div>
                <input type="text" id="qInitName" class="sig-name" placeholder="Who filled this (name / initials)" value="${escapeHtml(d.name ?? '')}">
                <div class="wiz-hint" style="margin-bottom:10px;">Draw your initials — they print in the box at its placed position.</div>
                <div class="sig-actions"><button type="button" class="sig-clear" id="qInitClearBtn">🧹 Clear initials</button></div>`;
            } else {
                const val = escapeHtml(ctx.draft[q.id] ?? '');
                let ctl;
                if (q.type === 'select') {
                    const opts = ['<option value="">— select —</option>']
                        .concat((q.options || []).map(o => `<option value="${escapeHtml(o)}"${o === ctx.draft[q.id] ? ' selected' : ''}>${escapeHtml(o)}</option>`));
                    ctl = `<select id="wizCtl">${opts.join('')}</select>`;
                } else if (q.type === 'number') {
                    ctl = `<input type="number" step="any" id="wizCtl" value="${val}">`;
                } else {
                    ctl = `<input type="text" id="wizCtl" value="${val}">`;
                }
                const anySame = qs.some(x => x.sameAsLast);
                const sameSrcs = anySame ? runnerSameSources() : { daySrc: null, instSrc: null };
                const sameEnabled = (qs.some(x => x.sameAsLast && x.rowScoped) && sameSrcs.daySrc)
                    || (qs.some(x => x.sameAsLast && !x.rowScoped) && sameSrcs.instSrc);
                bodyInner = `
                <div class="wiz-q-label">${escapeHtml(q.label)}</div>
                <div class="wiz-q-ctl">${ctl}</div>
                ${anySame ? `<button type="button" class="wiz-same" id="wizSameBtn"${sameEnabled ? '' : ' disabled'}>⏪ Same as last time</button>` : ''}`;
            }

            const progText = isSigStep ? '✍️ Signature' : `Question ${ctx.idx + 1} of ${qs.length}`;
            const card = `
            <div class="wiz-head">
                <span class="wiz-title">${escapeHtml(wiz.name || sheet.name)}</span>
                <span class="wiz-prog">${progText}</span>
                <button type="button" class="wiz-close" id="wizCloseBtn" title="Close">✕</button>
            </div>
            <div class="wiz-body">
                ${dayChipsHtml}
                ${bodyInner}
            </div>
            <div class="wiz-foot">
                <button type="button" class="btn btn-secondary" id="wizBackBtn"${ctx.idx === 0 ? ' disabled' : ''}>← Back</button>
                <span class="spacer"></span>
                ${isLast
                    ? `<button type="button" class="btn btn-primary" id="wizSaveBtn">💾 Save entry</button>`
                    : `<button type="button" class="btn btn-primary" id="wizNextBtn">Next →</button>`}
            </div>`;

            let ov = $('wizOverlay');
            if (!ov) {
                ov = document.createElement('div');
                ov.id = 'wizOverlay';
                ov.className = 'wiz-overlay';
                ov.addEventListener('mousedown', e => { if (e.target === ov) closeRunner(); });
                document.body.appendChild(ov);
                document.addEventListener('keydown', runnerEscHandler);
            }
            ov.innerHTML = `<div class="wiz-card">${card}</div>`;

            $('wizCloseBtn').addEventListener('click', closeRunner);
            $('wizBackBtn').addEventListener('click', () => runnerGo(-1));
            if (isLast) $('wizSaveBtn').addEventListener('click', saveRunnerEntry);
            else $('wizNextBtn').addEventListener('click', () => runnerGo(1));
            const sameBtn = $('wizSameBtn');
            if (sameBtn) sameBtn.addEventListener('click', runnerSameAsLast);

            // Day chips: switch the active day and restart at question 1.
            ov.querySelectorAll('.day-chip').forEach(b => b.addEventListener('click', () => {
                ctx.day = b.dataset.day;
                ctx.idx = 0;
                resetRunnerDraft();
                renderRunner();
            }));

            if (isSigStep) {
                initSigPad(ctx);
                const nameEl = $('sigName');
                nameEl.addEventListener('input', () => { ctx.sigDraft.name = nameEl.value; });
                $('sigClearBtn').addEventListener('click', () => {
                    ctx.sigDraft.strokes = [];
                    renderRunner();
                });
            } else if (q.type === 'initials') {
                initQuestionInitialsPad(ctx, q);
                const nameEl = $('qInitName');
                nameEl.addEventListener('input', () => { ctx.draft[q.id].name = nameEl.value; });
                $('qInitClearBtn').addEventListener('click', () => {
                    ctx.draft[q.id].strokes = [];
                    renderRunner();
                });
            } else {
                const ctlEl = $('wizCtl');
                ctlEl.addEventListener('input', () => { ctx.draft[q.id] = ctlEl.value; });
                ctlEl.addEventListener('change', () => { ctx.draft[q.id] = ctlEl.value; });
                ctlEl.focus();
            }
        }

        // Persist the draft answers into the instance, refresh binding snapshots, and
        // re-evaluate completion (spec: snapshots captured at creation AND on every save;
        // completedAt set/cleared after every save — never a flag).
        async function saveRunnerEntry() {
            const ctx = runnerCtx;
            const sheet = DB.paperWizard.sheets[ctx.sheetId];
            const wiz = wizardForSheet(ctx.sheetId);
            const pw = DB.paperWizard;
            if (!pw.entries[ctx.lotId]) pw.entries[ctx.lotId] = {};
            if (!pw.entries[ctx.lotId][ctx.sheetId]) pw.entries[ctx.lotId][ctx.sheetId] = { instances: {} };
            const sheetData = pw.entries[ctx.lotId][ctx.sheetId];
            if (!sheetData.instances) sheetData.instances = {};
            let inst = sheetData.instances[ctx.key];
            if (!inst) {
                inst = { phase: sheet.cadence === 'daily-weekly' ? (DB.lots[ctx.lotId]?.stage || null) : null,
                         header: {}, days: {}, phaseChangeDate: null, strikeInitials: null,
                         snapshots: {}, signature: null, completedAt: null, printedAt: null };
                sheetData.instances[ctx.key] = inst;
            }
            // Phase change (Step 9) — checked BEFORE writing answers: a new phase closes this
            // instance and starts a fresh one; the old log keeps its original phase snapshot.
            const phaseQ = wiz.questions.find(q => q.writesTo === 'lot.stage' && !q.rowScoped);
            let rolled = null;
            if (phaseQ) {
                const nv = String(ctx.draft[phaseQ.id] ?? '').trim();
                if (nv && sheet.cadence === 'daily-weekly' && !inst.phaseChangeDate && inst.phase !== nv) {
                    rolled = await phaseRollover(true); // drawn strike-initials capture; null = cancelled
                    if (!rolled) return;                // nothing saved — runner stays open
                }
            }
            for (const q of wiz.questions) {
                let v = ctx.draft[q.id];
                if (q === phaseQ && rolled) continue; // old log keeps its original phase
                if (q.type === 'initials') {
                    // Drawn initials: store the {name, strokes} object (or null when the pad is
                    // empty, so a re-opened day can be re-signed).
                    v = (v && Array.isArray(v.strokes) && v.strokes.length)
                        ? { name: String(v.name || '').trim(), strokes: v.strokes }
                        : null;
                }
                if (q.rowScoped) {
                    if (!inst.days) inst.days = {};
                    if (!inst.days[ctx.day]) inst.days[ctx.day] = {};
                    inst.days[ctx.day][q.id] = v;
                } else {
                    if (!inst.header) inst.header = {};
                    inst.header[q.id] = v;
                }
            }
            // Signature (Step 8): the pad is the source of truth for this save — re-signing
            // replaces stored strokes; an empty pad clears the signature.
            if (sheet.signature) {
                inst.signature = ctx.sigDraft.strokes.length
                    ? { name: ctx.sigDraft.name.trim(), strokes: ctx.sigDraft.strokes }
                    : null;
            }
            // Plant count write-back (Step 9): row-scoped question whose value differs from the
            // live lot record. Same value = no write; per-day entries keep the full history.
            for (const q of wiz.questions) {
                if (q.writesTo === 'lot.plantCount' && q.rowScoped) {
                    const v = String(ctx.draft[q.id] ?? '').trim();
                    if (v !== '' && DB.lots[ctx.lotId] && Number(DB.lots[ctx.lotId].plantCount) !== Number(v)) {
                        DB.lots[ctx.lotId].plantCount = Number(v);
                    }
                }
            }
            captureSnapshots(ctx.sheetId, ctx.lotId, ctx.key, inst);
            evaluateCompletion(ctx.sheetId, ctx.key, inst);
            notifySitkaTools();
            closeRunner();
            renderAll();
            if (rolled) {
                showToast(`Entry saved · phase change to ${rolled.newPhase} recorded`);
                // Double entry on the move day: offer to run today's entry on the new instance.
                if (!rolled.reused && confirm('Start filling the new grow-log now?')) openRunner(ctx.lotId, ctx.sheetId, rolled.newKey);
            } else {
                showToast('Entry saved');
            }
        }

        // ---- Print popup (Step 10) ----

        // Day rows for a daily-weekly sheet — derived from the sheet's explicit daily-entry
        // groups (no grid, no pitch inference). Each group contributes one row per day it has
        // boxes for; a field prints on day n at its own placed position in that group's day-n
        // member. Legacy sheets (pre-grouping: `row` flag + rowGrid) fall back to the old
        // clone-down behavior so already-configured forms keep printing.
        function dayRowsFromGroups(sheet) {
            const groups = new Map();
            for (const f of sheet.fields || []) {
                if (!f.dayGroup) continue;
                if (!groups.has(f.dayGroup)) groups.set(f.dayGroup, []);
                groups.get(f.dayGroup).push(f);
            }
            const rows = [];
            for (const [gid, members] of groups) {
                const byDay = new Map();
                for (const m of members) {
                    const d = m.day || 1;
                    if (!byDay.has(d)) byDay.set(d, []);
                    byDay.get(d).push(m);
                }
                const days = [...byDay.keys()].sort((a, b) => a - b);
                for (const d of days) rows.push({ day: d, fields: byDay.get(d) });
            }
            if (rows.length) return rows;

            // Legacy fallback: `row`-flagged fields cloned down by the stored rowGrid pitch.
            const legacy = (sheet.fields || []).filter(f => f.row && f.page === 1);
            if (!legacy.length) return null;
            const pitch = sheet.rowGrid?.pitch > 0 ? sheet.rowGrid.pitch : Math.max(...legacy.map(f => f.h));
            const count = sheet.rowGrid?.count || 7;
            return Array.from({ length: count }, (_, i) => ({ day: i + 1, fields: legacy.map(f => ({ ...f, y: f.y + i * pitch })) }));
        }

        // What is missing before an instance can be printed — drives the disabled tooltip.
        function printBlockers(sheetId, key, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return ['Sheet not configured'];
            if (!printDoc || printDoc.sheetId !== sheetId) return [`Document "${sheetId}" not loaded this session`];
            if (!inst) return ['No entry yet — fill it first'];
            const out = [];
            if (instanceComplete(sheetId, key, inst)) return out;
            if (sheet.cadence === 'daily-weekly') {
                const { start, end } = activeWindow(inst, key);
                const total = daysBetween(start, end);
                let filled = 0;
                for (const d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) if (dayAnswered(inst, dateToStr(d), sheetId)) filled++;
                if (filled < total) out.push(`${total - filled} day(s) left`);
                if (sheet.signature && !inst.signature) out.push('signature missing');
                if (inst.phaseChangeDate && !inst.strikeInitials) out.push('strike initials missing');
            } else {
                const qids = instanceQuestionIds(sheetId);
                const answered = qids.filter(qid => hasAnswer(inst.header, qid)).length;
                if (answered < qids.length) out.push(`${qids.length - answered} field(s) left`);
                if (sheet.signature && !inst.signature) out.push('signature missing');
            }
            return out;
        }

        // MM/DD for the form's Date column.
        function fmtMMDD(dateStr) { const p = String(dateStr).split('-'); return p.length === 3 ? `${p[1]}/${p[2]}` : dateStr; }

        // Resolve what a field prints. Snapshot-first (spec), live binding as fallback for
        // legacy instances without snapshots. Empty/missing → 'N/A' (checkboxes → empty box).
        function printFieldValue(sheet, inst, lotId, key, f, dayDate) {
            let v;
            if (f.source) {
                // day.date is derived per row — never snapshotted.
                if (f.source === 'day.date') v = resolveBinding(f.source, { lotId, key, inst, dayDate });
                else v = (inst.snapshots && inst.snapshots[f.source] != null) ? inst.snapshots[f.source] : resolveBinding(f.source, { lotId, key, inst });
            } else if (f.row || f.dayGroup) {
                // Row field (legacy) or daily-entry group member: that day's answer.
                v = inst.days?.[dayDate]?.[f.questionId];
            } else {
                v = inst.header?.[f.questionId];
            }
            const s = (v === null || v === undefined) ? '' : String(v).trim();
            if (f.checkbox) return { checked: !!s && s === (f.checkValue || ''), text: '' };
            return { checked: false, text: s || 'N/A' };
        }

        // Signature as an inline SVG polyline set over the box (strokes are normalized 0–1).
        // `box` = sheet.signature geometry; `sig` = inst.signature strokes (normalized 0–1).
        // Drawn strokes (signature / per-day initials / strike-out) as an inline SVG polyline
        // set over a normalized rect. `rect` = {x,y,w,h} in 0–1 page coords; `sig` = {strokes}.
        function strokesSvgHtml(rect, sig) {
            const polys = ((sig && sig.strokes) || [])
                .filter(st => st.length >= 2)
                .map(st => `<polyline points="${st.map(p => `${(p[0] * 100).toFixed(2)},${(p[1] * 100).toFixed(2)}`).join(' ')}"/>`)
                .join('');
            return `<svg class="ov-sig" style="left:${rect.x * 100}%;top:${rect.y * 100}%;width:${rect.w * 100}%;height:${rect.h * 100}%;" viewBox="0 0 100 100" preserveAspectRatio="none">${polys}</svg>`;
        }

        // Signature as an inline SVG polyline set over the box (strokes are normalized 0–1).
        function sigSvgHtml(box, sig) { return strokesSvgHtml(box, sig); }

        // Build + open the self-contained print popup. Light theme (paper preview), one section
        // per page at physical size, %-positioned overlays, signature + strike-out as SVG.
        function openPrintPopup(lotId, sheetId, key) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet || !printDoc || printDoc.sheetId !== sheetId) { showToast('Load the matching document first'); return; }
            const inst = DB.paperWizard.entries?.[lotId]?.[sheetId]?.instances?.[key];
            if (!inst) { showToast('No entry to print yet'); return; }

            const isLandscape = printDoc.pages[0].wPx > printDoc.pages[0].hPx;
            const { widthIn: W, heightIn: H } = letterPageSize(isLandscape);
            const wiz = wizardForSheet(sheetId);
            const dayRows = sheet.cadence === 'daily-weekly' ? dayRowsFromGroups(sheet) : null;
            const strike = (sheet.cadence === 'daily-weekly' && inst.phaseChangeDate) ? computeStrikeOut(sheet, inst, key) : null;

            // One overlay span for a field at normalized y.
            const overlaySpan = (f, y, val) => {
                const left = f.x * 100, top = y * 100, w = f.w * 100, h = f.h * 100;
                if (f.checkbox) {
                    // Square box sized to the field's height in inches (the placed box over the form's checkbox).
                    const boxIn = Math.max(0.08, f.h * H);
                    return `<span class="ov-cb${val.checked ? ' on' : ''}" style="left:${left}%;top:${top}%;width:${boxIn}in;height:${boxIn}in;${val.checked ? `font-size:${(boxIn * 0.72).toFixed(3)}in;` : ''}">${val.checked ? '✕' : ''}</span>`;
                }
                const fs = (f.fontSize ?? 10) / 72;
                return `<span class="ov" style="left:${left}%;top:${top}%;width:${w}%;height:${h}%;font-size:${fs}in;text-align:${f.align || 'left'};">${escapeHtml(val.text)}</span>`;
            };

            // Overlay spans for one page.
            const overlayFor = (pageNum) => {
                let html = '';
                for (const f of sheet.fields || []) {
                    if ((f.page ?? 1) !== pageNum) continue;
                    // Initials box: the field is bound to a question of type 'initials'. The drawn
                    // strokes live in that question's answer — per-day when the question is row-
                    // scoped (each group member prints its own day's strokes), instance-level
                    // otherwise. A box with no strokes prints empty.
                    const initQ = wiz.questions.find(x => x.id === f.questionId);
                    if (initQ && initQ.type === 'initials') {
                        const isRow = !!initQ.rowScoped;
                        const dayDate = isRow ? addDaysStr(key, (f.day || 1) - 1) : null;
                        const rec = isRow ? inst.days?.[dayDate]?.[f.questionId] : inst.header?.[f.questionId];
                        if (rec && Array.isArray(rec.strokes) && rec.strokes.length) html += strokesSvgHtml(f, rec);
                        continue;
                    }
                    if (f.dayGroup) {
                        // Daily-entry group member: prints on its OWN day, at its OWN placed
                        // position — no cloning, no pitch math. What you slid is what prints.
                        const dayDate = addDaysStr(key, (f.day || 1) - 1);
                        html += overlaySpan(f, f.y, printFieldValue(sheet, inst, lotId, key, f, dayDate));
                    } else if (f.row && dayRows) {
                        // Legacy row field (pre-grouping sheet): clone down by the stored pitch.
                        for (const r of dayRows) {
                            const lf = r.fields.find(x => x.id === f.id);
                            if (!lf) continue;
                            html += overlaySpan(lf, lf.y, printFieldValue(sheet, inst, lotId, key, f, addDaysStr(key, r.day - 1)));
                        }
                    } else {
                        html += overlaySpan(f, f.y, printFieldValue(sheet, inst, lotId, key, f, null));
                    }
                }
                if (sheet.signature && (sheet.signature.page ?? 1) === pageNum) html += sigSvgHtml(sheet.signature, inst.signature);
                if (strike && strike.line && pageNum === 1) {
                    const L = strike.line;
                    const fsIn = 10 / 72;
                    html += `<svg class="ov-strike" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="${L.x1 * 100}" y1="${L.y1 * 100}" x2="${L.x2 * 100}" y2="${L.y2 * 100}"/></svg>`;
                    // Strike-out initials: drawn strokes (new) or a legacy typed string.
                    const si = inst.strikeInitials;
                    if (si && typeof si === 'object' && (si.strokes || []).length) {
                        html += strokesSvgHtml(strike.initialsRect, si);
                    } else if (typeof si === 'string' && si.trim()) {
                        const r = strike.initialsRect;
                        html += `<span class="ov-strike-txt" style="left:${(r.x + r.w / 2) * 100}%;top:${(r.y + r.h / 2) * 100}%;font-size:${fsIn}in;">${escapeHtml(si)}</span>`;
                    }
                    html += `<span class="ov-strike-date" style="left:${strike.date.x * 100}%;top:${strike.date.y * 100}%;font-size:${fsIn}in;">${fmtMMDD(inst.phaseChangeDate)}</span>`;
                }
                return html;
            };

            const pages = printDoc.pages.map((pg, i) => {
                const n = i + 1;
                return `<section class="pp-page" style="width:${W}in;height:${H}in;">
                    <img src="${pg.url}" alt="" draggable="false">
                    ${overlayFor(n)}
                </section>`;
            }).join('');

            const title = `${sheet.name || sheetId} — ${lotId} · ${fmtMMDD(key)}`;
            const html = `<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; }
  .pp-toolbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #f3f4f6; border-bottom: 1px solid #d1d5db; }
  .pp-toolbar .pp-title { font-size: 13px; font-weight: 700; color: #111827; }
  .pp-print-btn { margin-left: auto; font-size: 14px; font-weight: 700; padding: 6px 16px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  .pp-print-btn:hover { background: #1d4ed8; }
  .pp-page { position: relative; margin: 0 auto 14px; overflow: hidden; page-break-after: always; }
  .pp-page img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ov { position: absolute; margin: 0; line-height: 1.15; color: #000; overflow: hidden; word-break: break-word; }
  .ov-cb { position: absolute; display: flex; align-items: center; justify-content: center; border: 1px solid #000; font-weight: 700; line-height: 1; color: #000; }
  .ov-cb.on { font-size: 0.9em; }
  .ov-sig { position: absolute; overflow: visible; }
  .ov-sig polyline { fill: none; stroke: #000; stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .ov-strike { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .ov-strike line { stroke: #b00020; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .ov-strike-txt, .ov-strike-date { position: absolute; transform: translate(-50%, -50%); color: #b00020; font-weight: 700; white-space: nowrap; }
  @page { size: ${W}in ${H}in; margin: 0; }
  @media print { .pp-toolbar { display: none; } .pp-page { margin: 0; } }
</style></head>
<body>
  <div class="pp-toolbar"><span class="pp-title">🖨️ ${escapeHtml(title)}</span><button type="button" class="pp-print-btn" onclick="window.print()">🖨️ Print</button></div>
  ${pages}
</body></html>`;

            const win = window.open('', '_blank', 'width=1000,height=1200');
            if (!win) { showToast('Popup blocked — allow popups to print'); return; }
            win.document.open();
            win.document.write(html);
            win.document.close();
            // Informational: record that this instance was rendered for print (re-print always allowed).
            inst.printedAt = new Date().toISOString();
            notifySitkaTools();
        }

        function renderCabinet() {
            const panel = $('cabinetPanel');
            if (!dbLoaded) {
                panel.innerHTML = emptyStateHtml('🗄️', 'No database loaded',
                    isStandalone
                        ? 'Tap 📂 Load in the header to import a DB-YY-MM-DD.json file.'
                        : 'Open PaperWizard from SitkaTools to receive the database.');
                return;
            }
            if (!activeLotId) {
                panel.innerHTML = emptyStateHtml('🗄️', 'No lots in database',
                    'Create a lot in SitkaTools first — each lot gets its own filing cabinet.');
                return;
            }

            const lot = DB.lots[activeLotId] || null; // orphaned (closed) lots still get a cabinet
            const pw = DB.paperWizard;
            const entries = pw.entries?.[activeLotId] || {};
            const sections = {};
            CAB_SECTIONS.forEach(s => { sections[s.key] = []; });

            // Propagation — one expected instance per configured one-shot sheet.
            for (const [sheetId, sheet] of Object.entries(pw.sheets || {})) {
                if (sheet.cadence !== 'one-shot') continue;
                const inst = entries[sheetId]?.instances?.['single'] || null;
                sections.propagation.push(inst
                    ? { html: cabLeafFill(escapeHtml(sheet.name || sheetId), instanceStatus(sheetId, 'single', inst), sheetId, 'single'), missing: false }
                    : { html: cabLeafFill(escapeHtml(sheet.name || sheetId), { text: '⚠️ missing', cls: 'miss' }, sheetId, 'single'), missing: true });
            }

            // Room Cleans (pre-move-in) — reference nodes from other lots + cleans this lot logged.
            const moveIn = moveInDates(activeLotId);
            const roomByDate = new Map(); // roomName -> earliest move-in date across roles
            if (lot) {
                [['clone', lot.cloningRoom], ['veg', lot.vegRoom], ['grow', lot.destRoom]].forEach(([role, name]) => {
                    if (!name) return;
                    const d = moveIn[role];
