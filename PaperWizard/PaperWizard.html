                    if (units) { if (!units.some(([v]) => v === q.metricUnit)) q.metricUnit = units[0][0]; } else delete q.metricUnit;
                    refreshWizardBuilder();   // shows or hides the unit picker
                });
                const unitEl = card.querySelector('.q-metric-unit');
                if (unitEl) unitEl.addEventListener('change', () => { q.metricUnit = unitEl.value; });
                // Fertilizer product link (feed.nutrient only)
                const pModeEl = card.querySelector('.q-product-mode');
                if (pModeEl) pModeEl.addEventListener('change', () => {
                    if (pModeEl.value === 'fixed') q.metricProduct = { name: q.metricProduct?.name || '' };
                    else if (pModeEl.value === 'from') q.metricProduct = { from: cfgWizard.questions.find(x => x.id !== q.id && x.type === 'select')?.id || '' };
                    else delete q.metricProduct;
                    refreshWizardBuilder();
                });
                const pNameEl = card.querySelector('.q-product-name');
                if (pNameEl) pNameEl.addEventListener('change', () => { q.metricProduct = { name: pNameEl.value.trim() }; });
                const pFromEl = card.querySelector('.q-product-from');
                if (pFromEl) pFromEl.addEventListener('change', () => { q.metricProduct = { from: pFromEl.value }; });
                // Write-back is implicit for plant-count / phase / room types — no control here.
                card.querySelector('.q-row').addEventListener('change', () => { q.rowScoped = card.querySelector('.q-row').checked; refreshCfgOverlays(); });
                card.querySelector('.q-same').addEventListener('change', () => { q.sameAsLast = card.querySelector('.q-same').checked; refreshCfgOverlays(); });
                card.querySelector('.q-mand').addEventListener('change', () => { q.mandatory = card.querySelector('.q-mand').checked; refreshCfgOverlays(); });
                const up = card.querySelector('.q-up');
                if (up && !up.disabled) up.addEventListener('click', () => {
                    const i = cfgWizard.questions.indexOf(q);
                    [cfgWizard.questions[i - 1], cfgWizard.questions[i]] = [cfgWizard.questions[i], cfgWizard.questions[i - 1]];
                    refreshWizardBuilder();
                });
                const down = card.querySelector('.q-down');
                if (down && !down.disabled) down.addEventListener('click', () => {
                    const i = cfgWizard.questions.indexOf(q);
                    [cfgWizard.questions[i + 1], cfgWizard.questions[i]] = [cfgWizard.questions[i], cfgWizard.questions[i + 1]];
                    refreshWizardBuilder();
                });
                card.querySelector('.q-del').addEventListener('click', () => {
                    // Clear the binding from EVERY field carrying this question's id — a whole
                    // daily-entry column, not just the first match.
                    cfgFields.forEach(f => { if (f.questionId === q.id) f.questionId = null; });
                    cfgWizard.questions = cfgWizard.questions.filter(x => x.id !== q.id);
                    if (cfgQuestionSel === q.id) cfgQuestionSel = null;
                    refreshCfgOverlays();
                    refreshWizardBuilder();
                });
            });
        }

        // Open a saved sheet's configuration from the toolbar dropdown. Page images are
        // never stored (Golden Rule), so if the loaded document doesn't match this sheet's
        // id it is revoked and the stage asks for a fresh just-in-time load.
        function openSavedSheet(sheetId) {
            const s = DB.paperWizard.sheets[sheetId];
            if (!s) return;
            if (loadedDoc && loadedDoc.baseName !== sheetId) revokeLoadedDoc();
            configSheetId = sheetId;
            orientation = s.orientation || 'portrait';
            cfgName = s.name || sheetId;
            cfgCadence = s.cadence || 'one-shot';
            cfgDocument = s.document || null;
            cfgPageCount = Math.max(1, Math.min(20, s.pageCount || 1));
            // Working copies of the layout (saved to DB on 💾 Save).
            cfgFields = (s.fields || []).map(f => ({ ...f, page: f.page ?? 1 }));
            cfgSignature = s.signature ? { ...s.signature } : null;
            cfgSelection = null;
            cfgMultiSel = new Set();
            // Wizard working copy: reopen the saved wizard for this sheet, else start fresh.
            const existingWizEntry = Object.entries(DB.paperWizard.wizards).find(([, w]) => w.sheetId === sheetId) || null;
            cfgWizard = existingWizEntry
                ? { id: existingWizEntry[0], sheetId, name: existingWizEntry[1].name || '',
                    // Normalize legacy questions (no mandatory flag yet) and drop the retired
                    // writesTo field — write-back is implicit for plant-count / phase / room.
                    questions: (existingWizEntry[1].questions || []).map(q => { const { writesTo, ...rest } = q; return { ...rest, mandatory: !!q.mandatory }; }) }
                : { id: generateFieldId(), sheetId, name: cfgName + ' Wizard', questions: [] };
            cfgQuestionSel = null;
            renderConfigure();
            showToast(`Opened "${sheetId}" for editing`);
        }

        // ---- Save / delete sheet (Step 4) ----
        function saveSheet() {
            if (!configSheetId || !loadedDoc) { showToast('Load the form pages first'); return; }
            if (!cfgName.trim()) { alert('Give the sheet a name before saving.'); $('sheetNameInput')?.focus(); return; }
            if (!cfgWizard || !cfgWizard.questions.length) { alert('Add at least one wizard question before saving.'); return; }
            for (const q of cfgWizard.questions) {
                if (!q.label.trim()) { alert(`Question ${q.id} needs a label.`); return; }
                if (q.type === 'select' && !(q.options || []).length) { alert(`"${q.label}" is a select question but has no options.`); return; }
            }
            const pw = DB.paperWizard;
            const { widthIn, heightIn } = letterPageSize(orientation === 'landscape');
            pw.sheets[configSheetId] = {
                name: cfgName.trim(),
                orientation,
                pageWidthIn: widthIn,
                pageHeightIn: heightIn,
                pageCount: cfgPageCount,
                cadence: cfgCadence,
                document: cfgDocument,
                // No rowGrid — daily-weekly rows are the explicit day-group boxes in fields[].
                fields: cfgFields.map(f => ({ ...f })),
                signature: cfgSignature ? { ...cfgSignature } : null
            };
            pw.wizards[cfgWizard.id] = {
                sheetId: configSheetId,
                name: cfgWizard.name.trim() || cfgName.trim(),
                // writesTo is retired — write-back is implicit for plant-count / phase / room
                // types, so it is never persisted (legacy copies are dropped on load too).
                questions: cfgWizard.questions.map(q => { const { writesTo, ...rest } = q; return { ...rest, options: [...(q.options || [])], mandatory: !!q.mandatory }; })
            };
            notifySitkaTools();
            renderConfigure(); // the saved-sheet dropdown now lists this sheet
            showToast(`Saved sheet "${configSheetId}" (${cfgWizard.questions.length} question${cfgWizard.questions.length > 1 ? 's' : ''})`);
        }

        function deleteSheet() {
            if (!configSheetId) return;
            const s = DB.paperWizard.sheets[configSheetId];
            const wizCount = Object.values(DB.paperWizard.wizards).filter(w => w.sheetId === configSheetId).length;
            const what = s ? `sheet "${s.name}"` : `"${configSheetId}"`;
            if (!confirm(`Delete ${wizCount ? what + ' and its wizard(s)' : what}? This cannot be undone.`)) return;
            delete DB.paperWizard.sheets[configSheetId];
            Object.keys(DB.paperWizard.wizards).forEach(id => {
                if (DB.paperWizard.wizards[id].sheetId === configSheetId) delete DB.paperWizard.wizards[id];
            });
            // Reset the working copies to a fresh configuration for this base name.
            cfgName = configSheetId;
            cfgCadence = 'one-shot';
            cfgDocument = null;
            cfgFields = [];
            cfgSignature = null;
            cfgSelection = null;
            cfgMultiSel = new Set();
            cfgWizard = { id: generateFieldId(), sheetId: configSheetId, name: cfgName + ' Wizard', questions: [] };
            cfgQuestionSel = null;
            notifySitkaTools();
            renderAll(); // status bar + cabinet also reflect the deletion
            showToast(`Deleted ${what}`);
        }

        // ---- Per-sheet configuration import/export (.json bundle) ----
        // A sheet export is a self-contained bundle: the sheet layout plus every wizard
        // bound to it. Page images are never included (Golden Rule) — the importing machine
        // loads its own copy of the controlled form pages just in time.
        function exportSheetConfig(sheetId) {
            const s = DB.paperWizard?.sheets?.[sheetId];
            if (!s) { showToast('Select a saved sheet to export'); return; }
            const wizards = {};
            Object.entries(DB.paperWizard.wizards).forEach(([id, w]) => {
                if (w.sheetId === sheetId) wizards[id] = JSON.parse(JSON.stringify(w));
            });
            const payload = {
                format: 'paperwizard-sheet',
                version: 1,
                exportedAt: new Date().toISOString(),
                sheetId,
                sheet: JSON.parse(JSON.stringify(s)),
                wizards
            };
            downloadJsonFile(`${sheetId}.json`, JSON.stringify(payload, null, 2), `Exported sheet "${s.name || sheetId}"`);
        }

        // Shared download helper — generates a blob link the user right-clicks → Save Link As…
        // (works in Edge even when popups are blocked; consistent with the DB export).
        function downloadJsonFile(filename, json, toastMsg) {
            const blob = new Blob([json], { type: 'application/json' });
            showSavePopup(filename, blob, toastMsg);
        }

        // ---- Save popup: persistent blob link (right-click → Save Link As…) ----
        let currentBlobUrl = null;
        let currentBlobRef = null;

        function showSavePopup(filename, blob, toastMsg) {
            if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            currentBlobRef = blob;
            currentBlobUrl = URL.createObjectURL(blob);

            const isTouchDevice = window.matchMedia('(pointer: coarse)').matches;
            const saveLink = $('saveLink');
            if (isTouchDevice) {
                // On mobile, make the link a button that triggers navigator.share on tap
                saveLink.href = '#';
                saveLink.textContent = `📄 ${filename} — Tap to save`;
                saveLink.onclick = (e) => {
                    e.preventDefault();
                    if (currentBlobRef) shareFile(currentBlobRef, filename);
                };
            } else {
                saveLink.href = currentBlobUrl;
                saveLink.download = filename;
                saveLink.textContent = `📄 ${filename} — Right-click → Save Link As…`;
                saveLink.onclick = null;
            }

            $('savePopup').classList.remove('hidden');
            showToast(toastMsg);
        }

        function closeSavePopup() {
            $('savePopup').classList.add('hidden');
            if (currentBlobUrl) {
                URL.revokeObjectURL(currentBlobUrl);
                currentBlobUrl = null;
            }
        }

        // Share or download a file directly (touch fallback — fixes iOS Safari blob URL issue).
        function shareFile(blob, filename) {
            const file = new File([blob], filename, { type: 'application/json' });
            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({ files: [file], title: filename }).catch(() => {});
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        }

        function handleSheetImport(e) {
            const file = e.target.files?.[0];
            e.target.value = ''; // allow re-picking the same file
            if (!file) return;
            if (!dbLoaded) { alert('Load a database first, then import the sheet.'); return; }
            const reader = new FileReader();
            reader.onload = () => {
                let data;
                try {
                    data = JSON.parse(reader.result);
                } catch (err) {
                    alert('Failed to parse sheet file: ' + err.message);
                    return;
                }
                // Validate the bundle shape. The sheet id comes from the file, falling back
                // to the file name (grow-log.json → grow-log).
                const sheetId = (typeof data.sheetId === 'string' && data.sheetId.trim())
                    ? data.sheetId.trim()
                    : file.name.replace(/\.json$/i, '');
                const sheet = data.sheet;
                if (!sheet || typeof sheet !== 'object' || !Array.isArray(sheet.fields)) {
                    alert(`"${file.name}" is not a valid PaperWizard sheet export (missing sheet layout).`);
                    return;
                }
                const wizards = (data.wizards && typeof data.wizards === 'object') ? data.wizards : {};
                for (const [id, w] of Object.entries(wizards)) {
                    if (!w || w.sheetId !== sheetId) {
                        alert(`Wizard "${id}" in "${file.name}" does not reference sheet "${sheetId}" — refusing to import.`);
                        return;
                    }
                }
                const pw = DB.ensureStructure()._PaperWizard;
                if (pw.sheets[sheetId] && !confirm(`Sheet "${sheetId}" already exists. Replace it with the imported configuration?`)) return;
                // Normalize the layout the same way the editor does.
                sheet.name = (typeof sheet.name === 'string' && sheet.name.trim()) ? sheet.name.trim() : sheetId;
                sheet.pageCount = Math.max(1, Math.min(20, Number(sheet.pageCount) || 1));
                // Replace any existing wizards for this sheet, then install the bundle.
                Object.keys(pw.wizards).forEach(id => { if (pw.wizards[id].sheetId === sheetId) delete pw.wizards[id]; });
                pw.sheets[sheetId] = JSON.parse(JSON.stringify(sheet));
                Object.entries(wizards).forEach(([id, w]) => { pw.wizards[id] = JSON.parse(JSON.stringify(w)); });
                notifySitkaTools();
                renderAll();
                openSavedSheet(sheetId); // opens it in the editor (page images still need a just-in-time load)
                showToast(`Imported sheet "${sheetId}"${Object.keys(wizards).length ? ' + wizard' : ''}`);
            };
            reader.onerror = () => alert('Failed to read file.');
            reader.readAsText(file);
        }

        // Keep fit-to-width current as the window resizes.
        window.addEventListener('resize', updateFitWidth);

        // Delete/Backspace removes the selected box; Ctrl/⌘+D duplicates it (unless typing in a control).
        document.addEventListener('keydown', (e) => {
            const t = e.target;
            if (t && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA')) return;
            if ((e.key === 'Delete' || e.key === 'Backspace') && cfgSelection) {
                e.preventDefault();
                deleteSelectedCfgItem();
            } else if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D') && cfgSelection) {
                e.preventDefault();
                duplicateSelection();
            }
        });

        function renderAll() {
            populateLotSelector();
            updateStatusBar();
            renderCabinet();
            renderConfigure(); // idempotent — skips rebuild when nothing changed
        }

        // ---- postMessage Convention — receive DB from SitkaTools, send updates back ----
        DB.ensureStructure();

        // ---- Building device view (root CLAUDE.md → "Building Device View") ----
        // SitkaTools sends `view: { building }` with the DB: the building's id on a building device, null on the
        // office (or with a single-file DB). A building device sees only its own building — the rooms in it and the
        // lots whose current room or flower room is in it — and only what it can save; office-only tools (schedules,
        // plans) don't run there at all. Display only: the DB keeps everything. Every tool has this same snippet
        // except OFFICE_ONLY. `var` (not const) so the message handlers can use it however early they run.
        var DeviceView = {
            OFFICE_ONLY: false,   // true: this whole tool is office work a building device couldn't save
            building: null,
            // Take the view sent with a DB message. True when this tool is office-only and this is a building device.
            take(msg) {
                if (msg && Object.prototype.hasOwnProperty.call(msg, 'view')) this.building = msg.view?.building || null;
                if (!this.OFFICE_ONLY || !this.building) return false;
                this.showOfficeOnly(msg?.payload?.buildings?.[this.building]?.name || this.building);
                return true;
            },
            buildingOfRoomName(name) {
                const target = String(name || '').trim().toLowerCase();
                if (!target) return null;
                for (const room of Object.values(DB.data?.rooms || {})) {
                    if (room && String(room.name || '').trim().toLowerCase() === target) return room.buildingId || null;
                }
                return null;
            },
            lotVisible(lotId) {
                if (!this.building) return true;
                const lot = DB.data?.lots?.[lotId];
                return !!lot && (this.buildingOfRoomName(lot.currentRoom) === this.building || this.buildingOfRoomName(lot.destRoom) === this.building);
            },
            roomVisible(roomId) {
                return !this.building || DB.data?.rooms?.[roomId]?.buildingId === this.building;
            },
            showOfficeOnly(buildingName) {
                if (document.getElementById('officeOnlyCover')) return;
                const wrap = document.createElement('div');
                wrap.id = 'officeOnlyCover';
                wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10001; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; padding: 24px;';
                wrap.innerHTML = `
                    <div style="max-width: 440px; text-align: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 32px;">
                        <div style="font-size: 2.5rem; margin-bottom: 12px;">🏢</div>
                        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);">Office only</div>
                        <div style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;">
                            This tool is run from the office. This device is set up for <strong data-building></strong>.</div>
                        <button type="button" style="background: var(--accent); color: var(--bg-primary); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.95rem;">Close Tool</button>
                    </div>`;
                wrap.querySelector('[data-building]').textContent = buildingName;
                wrap.querySelector('button').addEventListener('click', () => window.close());
                document.body.appendChild(wrap);
            }
        };

        // ---- Shared working copy (ROADMAP Phase 1 — tablets) ----
        // Every tool is served from the same site, so they share browser storage. SitkaTools keeps the open DB in
        // IndexedDB ('sitkatools' → 'work'). When this tool is opened as a plain tab (tablets, where the popup /
        // postMessage hand-off doesn't work) it loads the DB from there, writes its changes back, and every open
        // tab refreshes through a BroadcastChannel. Saving always happens in SitkaTools ("Go back to SitkaTools to
        // save" in the banner), and tools only run through SitkaTools — opened by themselves they say so.
        // `var` (not const) so notifySitkaTools() can check it safely however early it runs.
        var WorkCopy = {
            TOOL: 'PaperWizard',
            LIVE: true,          // this tool handles live 'sitkaGit_db_update' messages without a full reload
            MAX_AGE: 12 * 60 * 60 * 1000,
            inUse: false,            // the DB in this tab came from the shared copy
            gotDb: false,            // SitkaTools delivered the DB by postMessage
            channel: ('BroadcastChannel' in window) ? new BroadcastChannel('sitkatools-db') : null,
            _open() {
                return new Promise((resolve, reject) => {
                    const req = indexedDB.open('sitkatools', 3);
                    req.onupgradeneeded = () => {
                        for (const name of ['folders', 'settings', 'work']) {
                            if (!req.result.objectStoreNames.contains(name)) req.result.createObjectStore(name, { keyPath: 'key' });
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            async read() {
                try {
                    const idb = await this._open();
                    const row = await new Promise((resolve, reject) => {
                        const r = idb.transaction('work', 'readonly').objectStore('work').get('current');
                        r.onsuccess = () => resolve(r.result);
                        r.onerror = () => reject(r.error);
                    });
                    idb.close();
                    const copy = row && row.value;
                    return copy && copy.db && (Date.now() - copy.at) < this.MAX_AGE ? copy : null;
                } catch (_) {
                    return null;
                }
            },
            async write(db) {
                try {
                    const idb = await this._open();
                    await new Promise((resolve, reject) => {
                        const tx = idb.transaction('work', 'readwrite');
                        const store = tx.objectStore('work');
                        const r = store.get('current');
                        r.onsuccess = () => {
                            const prev = (r.result && r.result.value) || {};
                            store.put({ key: 'current', value: { ...prev, db, at: Date.now(), unsaved: true, from: this.TOOL } });
                        };
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                    });
                    idb.close();
                    if (this.channel) this.channel.postMessage({ type: 'db-updated', from: this.TOOL });
                } catch (_) { /* storage unavailable — changes stay in this tab */ }
            },
            // Delete the copy unless it holds changes nobody has saved yet
            async forgetIfSaved() {
                try {
                    const idb = await this._open();
                    await new Promise((resolve, reject) => {
                        const tx = idb.transaction('work', 'readwrite');
                        const store = tx.objectStore('work');
                        const r = store.get('current');
                        r.onsuccess = () => { if (r.result && r.result.value && r.result.value.unsaved === false) store.delete('current'); };
                        tx.oncomplete = resolve;
                        tx.onerror = () => reject(tx.error);
                    });
                    idb.close();
                } catch (_) { /* ignore */ }
            },
            // Hand the latest changes to SitkaTools, ask it to have the user save, and switch to its tab
            async goBackToSave() {
                await this.write(DB.data);
                if (this.channel) this.channel.postMessage({ type: 'save-request', from: this.TOOL });
                try { if (window.opener && !window.opener.closed) window.opener.focus(); } catch (_) { /* not allowed */ }
                setTimeout(() => {
                    if (document.visibilityState !== 'visible') return; // switched tabs
                    const msg = 'Switch to the SitkaTools tab — it is waiting for you to save.';
                    if (typeof showToast === 'function') showToast(msg);
                    else alert(msg);
                }, 600);
            },
            showOpenFromSitka() {
                const wrap = document.createElement('div');
                wrap.id = 'openFromSitka';
                wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10000; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; padding: 24px;';
                wrap.innerHTML = `
                    <div style="max-width: 440px; text-align: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 32px;">
                        <div style="font-size: 2.5rem; margin-bottom: 12px;">🌿</div>
                        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);">Open this tool from SitkaTools</div>
                        <div style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;">
                            Tools get their database from SitkaTools. Open SitkaTools, load your database, then open this tool from there.</div>
                        <a href="../SitkaTools/SitkaTools.html" style="display: inline-block; background: var(--accent); color: var(--bg-primary); padding: 12px 24px; border-radius: 8px; font-weight: 700; text-decoration: none;">Open SitkaTools</a>
                    </div>`;
                document.body.appendChild(wrap);
            },
            // Hand the DB (and the device view sent with it) to this tool's own "DB arrived from SitkaTools" message handler
            apply(db, initial, view) {
                if (!initial && JSON.stringify(db) === JSON.stringify(DB.data) && (view?.building || null) === DeviceView.building) return;
                const type = (initial || !this.LIVE) ? 'sitkaGit_db' : 'sitkaGit_db_update';
                window.dispatchEvent(new MessageEvent('message', { data: { type, payload: db, view } }));
            },
            async start() {
                const copy = await this.read();
                if (!copy) {
                    // Opened by itself with no SitkaTools open on this device: tools only run through SitkaTools
                    if (!window.opener) this.showOpenFromSitka();
                    return;
                }
                this.inUse = true;
                this.apply(copy.db, true, copy.view);
                const banner = document.createElement('div');
                banner.id = 'workCopyBanner';
                banner.textContent = '📋 Using the database open in SitkaTools. ';
                banner.style.cssText = 'background: var(--bg-card); color: var(--text-primary); border-bottom: 1px solid var(--accent); padding: 8px 16px; font-size: 0.85rem; text-align: center;';
                const back = document.createElement('button');
                back.type = 'button';
                back.id = 'workCopyGoBack';
                back.textContent = 'Go back to SitkaTools to save';
                back.style.cssText = 'background: var(--accent); color: var(--bg-primary); border: none; border-radius: 6px; padding: 6px 12px; margin-left: 6px; font-weight: 700; cursor: pointer; font-size: inherit;';
                back.addEventListener('click', () => this.goBackToSave());
                banner.appendChild(back);
                document.body.insertBefore(banner, document.body.firstChild);
            }
        };
        window.addEventListener('message', (e) => {
            if (e.isTrusted && e.data?.type === 'sitkaGit_db' && window.opener && e.source === window.opener) WorkCopy.gotDb = true;
        });
        if (!window.opener) WorkCopy.start();
        else setTimeout(() => { if (!WorkCopy.gotDb) WorkCopy.start(); }, 1500);
        if (WorkCopy.channel) {
            WorkCopy.channel.addEventListener('message', async (e) => {
                // SitkaTools closed with everything saved: finish forgetting the copy (it may not get to)
                if (e.data?.type === 'sitka-closing') {
                    if (!e.data.unsaved) WorkCopy.forgetIfSaved();
                    return;
                }
                if (!WorkCopy.inUse || e.data?.type !== 'db-updated' || e.data.from === WorkCopy.TOOL) return;
                const copy = await WorkCopy.read();
                if (copy) WorkCopy.apply(copy.db, false, copy.view);
            });
        }

        // postMessage target origin: our own origin when served over http(s) (ROADMAP 0.4).
        // file:// pages have opaque origins, so they can only be reached with '*'.
        const SITKA_MSG_ORIGIN = (location.protocol === 'file:' || location.origin === 'null') ? '*' : location.origin;

        // ---- Lost link to SitkaTools ----
        // A popup's changes reach SitkaTools only by postMessage. If SitkaTools is reloaded or closed while this
        // window stays open, they would go nowhere while this window still looked fine. SitkaTools answers a
        // message from a window it didn't open with 'sitkaGit_not_linked'; this window checks on every change and
        // whenever it gets the focus, and then covers the page: reopen the tool from SitkaTools. Tablet tabs save
        // through the shared working copy, so it never applies to them.
        var LinkLost = {
            dismissed: false,
            timer: null,
            applies() { return WorkCopy.gotDb && !WorkCopy.inUse; },
            openerGone() { try { return !window.opener || window.opener.closed; } catch (_) { return true; } },
            // Before a change is sent: false (and the cover) when SitkaTools is gone
            canSend() {
                if (!this.applies() || !this.openerGone()) return true;
                this.show(true);
                return false;
            },
            // Is SitkaTools still there, and does it still know this window?
            check() {
                if (!this.applies() || this.dismissed) return;
                if (this.openerGone()) { this.show(false); return; }
                try { window.opener.postMessage({ type: 'sitkaGit_ping' }, SITKA_MSG_ORIGIN); } catch (_) { /* gone */ }
            },
            // lostChange: a change was just made that SitkaTools didn't get
            show(lostChange) {
                if (!lostChange && this.dismissed) return;
                this.dismissed = false;
                let wrap = document.getElementById('linkLost');
                if (!wrap) {
                    wrap = document.createElement('div');
                    wrap.id = 'linkLost';
                    wrap.style.cssText = 'position: fixed; inset: 0; z-index: 10002; background: rgba(10, 10, 25, 0.92); display: flex; align-items: center; justify-content: center; padding: 24px;';
                    wrap.innerHTML = `
                        <div style="max-width: 460px; text-align: center; background: var(--bg-secondary); border: 2px solid var(--warning); border-radius: 12px; padding: 28px;">
                            <div style="font-size: 2.5rem; margin-bottom: 10px;">⚠️</div>
                            <div data-title style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px; color: var(--text-primary);"></div>
                            <div data-text style="font-size: 0.95rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5;"></div>
                            <button type="button" data-close style="background: var(--accent); color: var(--bg-primary); border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer;">Close this window</button>
                            <div style="margin-top: 14px;"><button type="button" data-keep style="background: none; border: none; color: var(--text-secondary); text-decoration: underline; cursor: pointer; font-size: 0.85rem;">Keep it open to look (changes here won't be saved)</button></div>
                        </div>`;
                    wrap.querySelector('[data-close]').addEventListener('click', () => window.close());
                    wrap.querySelector('[data-keep]').addEventListener('click', () => { this.dismissed = true; wrap.style.display = 'none'; });
                    document.body.appendChild(wrap);
                }
                wrap.querySelector('[data-title]').textContent = lostChange ? 'SitkaTools didn’t get your last change' : 'This window lost its link to SitkaTools';
                wrap.querySelector('[data-text]').textContent = 'SitkaTools was reloaded or closed after it opened this window, so changes made here can’t be saved. ' +
                    'Close this window and open the tool again from SitkaTools' + (lostChange ? ', then make your last change again.' : '.');
                wrap.style.display = 'flex';
            }
        };
        window.addEventListener('message', (e) => {
            if (!e.isTrusted || !window.opener || e.source !== window.opener) return;
            // From the first DB on: notice SitkaTools closing even while nothing is being changed
            if (e.data?.type === 'sitkaGit_db' && !LinkLost.timer) {
                LinkLost.timer = setInterval(() => { if (LinkLost.applies() && !LinkLost.dismissed && LinkLost.openerGone()) LinkLost.show(false); }, 3000);
            }
            if (e.data?.type === 'sitkaGit_not_linked' && LinkLost.applies()) LinkLost.show(e.data.about === 'sitkaGit_db_update');
        });
        window.addEventListener('focus', () => LinkLost.check());
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') LinkLost.check(); });

        function notifySitkaTools() {
            if (typeof LinkLost !== 'undefined' && !LinkLost.canSend()) return;   // SitkaTools is gone (cover shown)
            if (WorkCopy && WorkCopy.inUse) WorkCopy.write(DB.data);
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'sitkaGit_db_update',
                    payload: DB.data
                }, SITKA_MSG_ORIGIN);
            }
        }

        window.addEventListener('message', (e) => {
            // Only trust the SitkaTools window that opened this tool (ROADMAP 0.4)
            // Real messages must come from the SitkaTools window that opened us; untrusted events are this
            // page's own shared-copy loader (WorkCopy.apply)
            if (e.isTrusted && (!window.opener || e.source !== window.opener)) return;
            // Initial DB delivery from SitkaTools
            if (e.data?.type === 'sitkaGit_db' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();
                DeviceView.take(e.data);
                dbLoaded = true;

                // Acknowledge receipt so SitkaTools stops retrying
                if (window.opener && !window.opener.closed) {
                    window.opener.postMessage({ type: 'sitkaGit_ready' }, SITKA_MSG_ORIGIN);
                }

                applyDeviceView();
                renderAll();
                showToast('Database loaded from SitkaTools');
            }

            // Live DB updates pushed by SitkaTools whenever its DB changes — refresh non-disruptively.
            // Never notifySitkaTools() from here (that would ping-pong) and no toast.
            if (e.data?.type === 'sitkaGit_db_update' && e.data.payload) {
                DB.data = e.data.payload;
                DB.ensureStructure();
                DeviceView.take(e.data);
                dbLoaded = true;
                // An open runner keeps its draft and stays on screen (it isn't re-rendered, so a
                // half-typed answer keeps its caret); only its page is looked up again in the new DB.
                // A draft page that was never saved isn't there — it stays a draft. Saves re-read
                // the DB anyway, and the dialogs (signature, start log, strike initials) check for
                // the swap themselves. Answers still showing their prefill follow the new DB.
                if (runnerCtx && runnerCtx.mode !== 'init') {
                    const fresh = DB.paperWizard.entries[runnerCtx.lotId]?.[runnerCtx.sheetId]?.instances?.[runnerCtx.key];
                    if (fresh) runnerCtx.inst = fresh;
                    refreshRunnerPrefills();
                }
                applyDeviceView();
                renderAll(); // the cabinet behind any open dialog — dialogs are separate overlays
            }
        });

        // ---- Init ----
        function init() {
            $('pageImportInput').addEventListener('change', handlePageImport);
            $('sheetImportInput').addEventListener('change', handleSheetImport);
            // Print-document picker (Filing Cabinet): base name names the sheet.
            $('printImportInput').addEventListener('change', e => {
                const files = Array.from(e.target.files || []); // copy — input.files is a live FileList, cleared by the reset below
                e.target.value = ''; // allow re-picking the same file
                if (!files.length) return;
                loadPrintDocument(files);
            });
            $('saveCloseBtn').addEventListener('click', (e) => { e.stopPropagation(); closeSavePopup(); });
            // Close the save popup when clicking elsewhere on the page.
            document.addEventListener('click', () => closeSavePopup());

            $('tabCabinetBtn').addEventListener('click', () => switchTab('cabinet'));
            $('tabConfigureBtn').addEventListener('click', () => switchTab('configure'));

            $('lotSelect').addEventListener('change', () => {
                activeLotId = $('lotSelect').value || null;
                renderAll();
            });

            // ---- Close Tool ----
            $('closeToolBtn').addEventListener('click', () => window.close());

            // Page-image blob lifecycle: revoke both the Configure doc and the print doc on close.
            window.addEventListener('beforeunload', () => {
                revokeLoadedDoc();
                revokePrintDoc();
                if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            });

            renderAll();
        }

        init();
    </script>
</body>
</html>
