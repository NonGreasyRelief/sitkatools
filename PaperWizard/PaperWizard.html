            const wiz = wizardForSheet(runnerCtx?.sheetId);
            // Write-back is a property of the question TYPE (implicit — no writesTo field).
            const roomQ = wiz?.questions.find(q => q.type === 'room');
            if (!roomQ) return null;
            return dailyRollover(writeBack, moveDay, {
                questionId: roomQ.id, instField: 'room', freshOnly,
                label: () => String(runnerCtx.draft[roomQ.id] ?? '').trim(),
                actionLabel: 'Record room change',
                cancelMsg: 'Room change cancelled',
                writeBackFn: v => { if (DB.lots[runnerCtx.lotId]) DB.lots[runnerCtx.lotId].currentRoom = v; }
            }, prevValue);
        }

        // Plant-count-zero rollover — the lot's plants are all gone, so its open daily-weekly
        // log ends on that day: strike-out + drawn initials, NO fresh instance (there is no new
        // phase or room to continue in). The plant count itself was already written back to 0 by
        // the normal write-back pass before this runs. Returns { reused: false } on success,
        // null when cancelled at the initials prompt.
        async function plantZeroRollover(moveDay) {
            const ctx = runnerCtx;
            if (!ctx) return null;
            const oldInst = ctx.inst;
            const pw = DB.paperWizard;
            if (!pw.entries[ctx.lotId]) pw.entries[ctx.lotId] = {};
            if (!pw.entries[ctx.lotId][ctx.sheetId]) pw.entries[ctx.lotId][ctx.sheetId] = { instances: {} };
            const sheetData = pw.entries[ctx.lotId][ctx.sheetId];
            if (!sheetData.instances) sheetData.instances = {};
            const strikeSheet = DB.paperWizard.sheets[ctx.sheetId];
            const drawn = await captureStrikeInitials('all plants removed', 'Record plant loss', boxPrintAspect(strikeSheet, STRIKE_INITIALS_RECT));
            if (!drawn) { showToast('Plant-loss strike-out cancelled — no changes made'); return null; }
            oldInst.phaseChangeDate = moveDay || todayStr();
            oldInst.strikeInitials = { name: drawn.name, strokes: drawn.strokes };
            captureSnapshots(ctx.sheetId, ctx.lotId, ctx.key, oldInst);
            evaluateCompletion(ctx.sheetId, ctx.key, oldInst);
            return { inst: oldInst, newKey: null, value: '0', reused: false };
        }

        // The lot's CURRENT phase in the form's vocabulary (live DB value, normalized). This is
        // what a Phase question's answer is compared against — a different pick means the lot
        // changed phase: write the new phase back and flag the strike-out. Null when unknown.
        function currentLotPhase(lotId) {
            const s = DB.lots[lotId]?.stage;
            return (s === null || s === undefined || String(s).trim() === '') ? null : normalizeStage(s);
        }

        // The lot's CURRENT room name (live DB value, trimmed). What a Room question's answer is
        // compared against — a different pick means the lot moved rooms: write back + strike-out.
        function currentLotRoom(lotId) {
            const r = DB.lots[lotId]?.currentRoom;
            return (r === null || r === undefined || String(r).trim() === '') ? null : String(r).trim();
        }

        // The plant count explicitly answered ON `day` (no walk-back): null when that day has

        // The plant count explicitly answered ON `day` (no walk-back): null when that day has
        // no non-empty answer yet. Used for the "today" side of day.plantsRemoved — a fallback
        // to an earlier day's count would understate removals, so an unanswered day prints N/A.
        function explicitPlantCountOn(lotId, sheetId, key, day) {
            const wiz = wizardForSheet(sheetId);
            // Write-back is a property of the question TYPE (implicit — no writesTo field).
            const pcQ = wiz?.questions.find(q => q.type === 'plant-count' && q.rowScoped);
            if (!pcQ) return null;
            const v = DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances?.[key]?.days?.[day]?.[pcQ.id];
            if (v === null || v === undefined || String(v).trim() === '') return null;
            return Number(String(v).trim());
        }

        // Last recorded plant count on or before `day` for a row-scoped plant-count question:
        // walks back through this instance's days, then earlier instances' last days (chain
        // start), until a non-empty answer is found. Null when no plant-count question exists
        // or nothing has been recorded yet — the caller prints N/A in that case.
        function lastRecordedPlantCount(lotId, sheetId, key, day) {
            const wiz = wizardForSheet(sheetId);
            // Write-back is a property of the question TYPE (implicit — no writesTo field).
            const pcQ = wiz?.questions.find(q => q.type === 'plant-count' && q.rowScoped);
            if (!pcQ) return null;
            const instances = DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances || {};
            let curKey = key, curDay = day;
            while (curKey) {
                const inst = instances[curKey];
                for (let ds = curDay; ds >= curKey; ds = addDaysStr(ds, -1)) {
                    const v = inst?.days?.[ds]?.[pcQ.id];
                    if (v !== null && v !== undefined && String(v).trim() !== '') return Number(String(v).trim());
                }
                const pk = prevInstanceKey(lotId, sheetId, curKey);
                if (!pk) break;
                const pkeys = Object.keys(instances[pk].days || {}).sort();
                curDay = pkeys.length ? pkeys[pkeys.length - 1] : pk; // last recorded day (or the window start)
                curKey = pk;
            }
            return null;
        }

        // Is the lot's live stage (changed in SitkaTools) different from this open log's phase?
        // Asked when the runner opens (checkStageMismatch) and when a live update arrives while it
        // is open (refreshRunnerPrefills). `key` is the runner's page.
        function stageMismatch(lotId, sheetId, key, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet || sheet.cadence !== 'daily-weekly') return false;
            if (inst.phaseChangeDate || inst.completedAt) return false; // already closed / done — not the open log
            // An older page opened to backfill a day isn't the open log either
            if (dailyChain(lotId, sheetId).some(c => c.key > key)) return false;
            const lot = DB.lots[lotId];
            // Compare in the form's vocabulary — 'flower' and 'Bloom' are the same phase.
            return !!(lot && inst.phase && lot.stage && normalizeStage(inst.phase) !== normalizeStage(lot.stage));
        }

        // Reverse-direction detection (spec): the lot's live stage changed in SitkaTools and no
        // longer matches this instance's stored phase → prompt to confirm the move. Rolls over
        // WITHOUT writing back — the main DB is already correct. Called from openRunner after
        // runnerCtx is set up for this instance; returns true when the open was handled.
        async function checkStageMismatch(lotId, sheetId, inst) {
            if (!stageMismatch(lotId, sheetId, runnerCtx?.key, inst)) return false;
            const lot = DB.lots[lotId];
            // If the runner opens normally after all (declined / cancelled), the Phase question
            // prefills the lot's live phase, not this page's (see resetRunnerDraft).
            if (runnerCtx) runnerCtx.phaseFromLot = true;
            const ok = confirm(`Lot is now in ${normalizeStage(lot.stage)} — close this grow-log?\n\n` +
                `The open log was started in ${inst.phase}. Confirming records the phase change (rows after today are struck through) and starts a fresh log for ${lot.stage}.`);
            if (!ok) return false; // proceed to open the runner normally
            const wiz = wizardForSheet(sheetId);
            const phaseQ = wiz?.questions.find(q => q.type === 'phase');
            if (!phaseQ) { showToast('No Phase question on this sheet — record the move in SitkaTools instead'); return false; }
            // Point the Phase question's draft at the new stage (form vocabulary) so the rollover records it.
            runnerCtx.draft[phaseQ.id] = normalizeStage(lot.stage);
            const roll = await phaseRollover(false, todayStr(), inst.phase ? normalizeStage(inst.phase) : null);
            if (!roll) return false; // cancelled at the initials prompt — open normally
            notifySitkaTools();
            closeRunner();
            renderAll();
            showToast(`Phase change to ${lot.stage} recorded — new grow-log started ${fmtShort(roll.newKey)}`);
            if (!roll.reused && confirm('Start filling the new grow-log now?')) openRunner(lotId, sheetId, roll.newKey);
            return true;
        }

        // Reverse-direction room detection: the lot's live currentRoom (changed in SitkaTools)
        // no longer matches this instance's stored room → prompt to confirm the move. Rolls over
        // WITHOUT writing back — the main DB is already correct. Only fires when the sheet has a
        // 🏠 Room question and the instance recorded a room.
        async function checkRoomMismatch(lotId, sheetId, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet || sheet.cadence !== 'daily-weekly') return false;
            if (inst.phaseChangeDate || inst.completedAt) return false; // already closed / done — not the open log
            // An older page opened to backfill a day isn't the open log either
            if (runnerCtx && dailyChain(lotId, sheetId).some(c => c.key > runnerCtx.key)) return false;
            const roomQ = wizardForSheet(sheetId)?.questions.find(q => q.type === 'room');
            if (!roomQ) return false;
            const lot = DB.lots[lotId];
            // No mismatch when either side has no room recorded, or the two agree.
            if (!lot?.currentRoom || !inst.room) return false;
            if (String(lot.currentRoom).trim().toLowerCase() === String(inst.room).trim().toLowerCase()) return false;
            const ok = confirm(`Lot is now in ${lot.currentRoom} — close this log?\n\n` +
                `The open log was started in ${inst.room}. Confirming records the room change (rows after today are struck through) and starts a fresh log for ${lot.currentRoom}.`);
            if (!ok) return false; // proceed to open the runner normally
            // Point the Room question's draft at the new room so the rollover records it.
            runnerCtx.draft[roomQ.id] = String(lot.currentRoom).trim();
            const roll = await roomRollover(false, todayStr(), inst.room ? String(inst.room).trim() : null);
            if (!roll) return false; // cancelled at the initials prompt — open normally
            notifySitkaTools();
            closeRunner();
            renderAll();
            showToast(`Room change to ${lot.currentRoom} recorded — new log started ${fmtShort(roll.newKey)}`);
            if (!roll.reused && confirm('Start filling the new log now?')) openRunner(lotId, sheetId, roll.newKey);
            return true;
        }

        // Status chip for an owned instance. Returns { text, cls }.
        function instanceStatus(sheetId, key, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return { text: '—', cls: '' };
            if (instanceComplete(sheetId, key, inst)) return { text: '✓ complete', cls: 'ok' };

            if (sheet.cadence === 'daily-weekly') {
                const { start, end } = activeWindow(inst, key);
                const total = daysBetween(start, end);
                let filled = 0;
                for (const d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) {
                    if (dayAnswered(inst, dateToStr(d), sheetId)) filled++;
                }
                // Due: today inside the active window and today's slot not filled.
                const today = parseDate(todayStr());
                if (today >= start && today <= end && !dayAnswered(inst, todayStr(), sheetId))
                    return { text: '⏳ due', cls: 'due' };
                if (filled === 0) return { text: '— not started', cls: '' };
                let txt = `${filled}/${total} days`;
                if (inst.phaseChangeDate) txt += ` · phase change ${fmtShort(inst.phaseChangeDate)}`;
                return { text: txt, cls: '' };
            }

            // one-shot / event progress.
            const qids = instanceQuestionIds(sheetId);
            const answered = qids.filter(qid => hasAnswer(inst.header, qid)).length;
            if (answered === 0) return { text: '— not started', cls: '' };
            let txt = `${answered}/${qids.length} fields`;
            if (inst.phaseChangeDate) txt += ` · phase change ${fmtShort(inst.phaseChangeDate)}`;
            return { text: txt, cls: '' };
        }

        // Count of daily-weekly instances whose entry is due today for a lot.
        function dueTodayCount(lotId) {
            const entries = DB.paperWizard?.entries?.[lotId] || {};
            let n = 0;
            for (const [sheetId, sheetData] of Object.entries(entries)) {
                const sheet = DB.paperWizard?.sheets?.[sheetId];
                if (!sheet || sheet.cadence !== 'daily-weekly') continue;
                for (const [key, inst] of Object.entries(sheetData.instances || {})) {
                    if (instanceStatus(sheetId, key, inst).cls === 'due') n++;
                }
            }
            return n;
        }

        // Designation of a room by name (case-insensitive) — null when the room is unknown
        // or has no designation set. Feeds the lot.roomDesignation binding.
        function roomDesignationFor(roomName) {
            if (!roomName) return null;
            const target = String(roomName).trim().toLowerCase();
            for (const r of Object.values(DB.rooms || {})) {
                if (r?.name && String(r.name).trim().toLowerCase() === target) return r.designation || null;
            }
            return null;
        }

        // Building ID of a room by name (case-insensitive) — null when the room is unknown
        // or has no building assigned. Feeds the lot.roomBuilding binding.
        function roomBuildingFor(roomName) {
            if (!roomName) return null;
            const target = String(roomName).trim().toLowerCase();
            for (const r of Object.values(DB.rooms || {})) {
                if (r?.name && String(r.name).trim().toLowerCase() === target) return r.buildingId || null;
            }
            return null;
        }

        // All room names known to the DB (rooms table + lot room fields). Names may duplicate.
        function knownRoomNames() {
            const names = new Set();
            Object.values(DB.rooms || {}).forEach(r => { if (r?.name) names.add(String(r.name)); });
            Object.values(DB.lots || {}).forEach(l => {
                ['cloningRoom', 'vegRoom', 'destRoom', 'dryRoom', 'trimRoom', 'currentRoom'].forEach(k => { if (l?.[k]) names.add(String(l[k])); });
            });
            return [...names];
        }

        // Room names offered when recording where a lot is. A building device offers only its own building's
        // rooms (lots move between buildings with SitkaTools' Send / Accept), plus the values already in play.
        function pickableRoomNames(...keep) {
            if (!DeviceView.building) return knownRoomNames();
            const names = new Set();
            Object.values(DB.rooms || {}).forEach(r => { if (r?.name && r.buildingId === DeviceView.building) names.add(String(r.name)); });
            keep.forEach(n => { if (n) names.add(String(n)); });
            return [...names];
        }

        // Building device: lots it lists but can't fill — view and print only. Returns { banner, toast }, or null
        // when this device may fill the lot's paperwork.
        // - Sent and not yet accepted: its paperwork is frozen; its unsigned pages go to the receiving building's
        //   file when that building accepts it (SitkaTools → DbSplit lot hand-off).
        // - In another building right now (listed because its flower room is here): its pages are saved there.
        function lotElsewhere(lotId) {
            if (!DeviceView.building) return null;
            const name = id => DB.buildings?.[id]?.name || id;
            const sent = Object.values(DB.data?._LotTransfers || {}).find(t => t && t.lotId === lotId && !t.acceptedAt);
            if (sent && sent.to === DeviceView.building) return {
                banner: `🚚 ${lotId} is on its way here from ${name(sent.from)} — accept it in SitkaTools (Data & Files → Lots) to fill its paperwork. You can view and print it here.`,
                toast: `${lotId} isn't accepted yet — accept it in SitkaTools first`
            };
            if (sent) return {
                banner: `🚚 Read only on this device — ${lotId} was sent to ${name(sent.to)}; its unsigned paperwork goes with it when ${name(sent.to)} accepts it. You can view and print it here.`,
                toast: `Read only here — ${lotId} was sent to ${name(sent.to)}`
            };
            const room = DB.lots[lotId]?.currentRoom;
            const b = DeviceView.buildingOfRoomName(room);
            if (!b || b === DeviceView.building) return null;
            return {
                banner: `🔒 Read only on this device — ${lotId} is in ${room} (${name(b)}), so its paperwork is filled and saved there. You can view and print it here.`,
                toast: `Read only here — ${lotId} is in ${room} (${name(b)}), where its paperwork is filled`
            };
        }

        // Guard for every fill / sign / start action: true (after a toast) when the lot is read-only here
        function readOnlyHere(lotId) {
            const where = lotElsewhere(lotId);
            if (where) showToast(where.toast);
            return !!where;
        }

        // First date on which any of this lot's daily logs recorded the lot being in `roomName`
        // (via a 🏠 Room question answer). Null when no log has recorded it yet. This is the
        // authoritative move-in date — paperwork, not the schedule, is the source of truth.
        function firstRoomEntryDate(lotId, roomName) {
            if (!roomName) return null;
            const entries = DB.paperWizard?.entries?.[lotId] || {};
            let best = null;
            for (const [sheetId, sd] of Object.entries(entries)) {
                const sheet = DB.paperWizard?.sheets?.[sheetId];
                if (!sheet || sheet.cadence !== 'daily-weekly') continue;
                const roomQ = wizardForSheet(sheetId)?.questions.find(q => q.type === 'room');
                if (!roomQ) continue;
                for (const inst of Object.values(sd.instances || {})) {
                    for (const [ds, day] of Object.entries(inst.days || {})) {
                        const v = day?.[roomQ.id];
                        if (v !== null && v !== undefined && String(v).trim().toLowerCase() === roomName.toLowerCase()) {
                            if (!best || ds < best) best = ds;
                        }
                    }
                }
            }
            return best;
        }

        // Move-in dates for a lot's five rooms (spec: Filing Cabinet sourcing rule).
        // Log-derived date wins (first day a daily log recorded the lot in that room);
        // phase inference is the fallback for clone/veg/grow; dry/trim fall back to today.
        function moveInDates(lotId) {
            const today = todayStr();
            const entries = DB.paperWizard?.entries?.[lotId] || {};
            // Earliest periodStart of a grow-log instance with the given phase.
            const firstPhase = phase => {
                let best = null;
                for (const [sheetId, sd] of Object.entries(entries)) {
                    const sheet = DB.paperWizard?.sheets?.[sheetId];
                    if (!sheet || sheet.cadence !== 'daily-weekly') continue;
                    for (const [key, inst] of Object.entries(sd.instances || {})) {
                        if (String(inst.phase || '').toLowerCase() === phase.toLowerCase()) {
                            if (!best || key < best) best = key;
                        }
                    }
                }
                return best;
            };
            const lot = DB.lots[lotId];
            const phaseFallback = {
                clone: (lot?.createdDate && String(lot.createdDate).slice(0, 10)) || today,
                veg: firstPhase('Veg') || today,
                grow: firstPhase('Bloom') || today
            };
            const out = {};
            for (const [role, name] of Object.entries({
                clone: lot?.cloningRoom, veg: lot?.vegRoom, grow: lot?.destRoom,
                dry: lot?.dryRoom, trim: lot?.trimRoom
            })) {
                if (!name) { out[role] = null; continue; }
                out[role] = firstRoomEntryDate(lotId, name) || phaseFallback[role] || today;
            }
            return out;
        }

        // Is a configured sheet a room-clean form (any room role)?
        function isRoomCleanSheet(sheetId) {
            const doc = DB.paperWizard?.sheets?.[sheetId]?.document;
            if (doc) return ROOM_CLEAN_DOCS.includes(doc);
            return sheetSection(sheetId) === 'room-clean'; // no explicit assignment — heuristics
        }

        // Which room role a cleaning sheet belongs to (clone/veg/grow/dry/trim). The explicit
        // Document assignment wins; legacy 'room-clean' sheets fall back to name keywords.
        function cleanRoomRole(sheetId) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet || !isRoomCleanSheet(sheetId)) return null;
            const doc = sheet.document;
            if (doc && doc !== 'room-clean') return doc.replace('room-clean-', '');
            const s = (sheetId + ' ' + (sheet.name || '')).toLowerCase();
            if (/clone/.test(s)) return 'clone';
            if (/veg|vegetat/.test(s)) return 'veg';
            if (/dry/.test(s)) return 'dry';
            if (/trim/.test(s)) return 'trim';
            if (/grow|flower|bloom/.test(s)) return 'grow';
            return null;
        }

        // Scan ALL lots' room-clean event instances. Returns [{ lotId, sheetId, key, date, roomName }].
        function allRoomCleans() {
            const out = [];
            const roomNames = knownRoomNames();
            for (const [lotId, sheets] of Object.entries(DB.paperWizard?.entries || {})) {
                for (const [sheetId, sd] of Object.entries(sheets || {})) {
                    if (!isRoomCleanSheet(sheetId)) continue;
                    for (const [key, inst] of Object.entries(sd.instances || {})) {
                        // The room name lives somewhere in the header values.
                        const roomName = Object.values(inst.header || {})
                            .map(v => String(v ?? '').trim())
                            .find(v => v && roomNames.some(n => n.toLowerCase() === v.toLowerCase())) || null;
                        out.push({ lotId, sheetId, key, date: key, roomName });
                    }
                }
            }
            return out;
        }

        // Most recent clean of a room dated on/before `byDate`. Null if none.
        // Reference nodes are other lots' documents — exclude the lot's own cleans
        // (those appear as owned leaves instead).
        function cleanBefore(roomName, byDate, excludeLotId) {
            const matches = allRoomCleans().filter(c =>
                c.lotId !== excludeLotId &&
                c.roomName && c.roomName.toLowerCase() === roomName.toLowerCase() && c.date <= byDate);
            if (!matches.length) return null;
            matches.sort((a, b) => b.date.localeCompare(a.date));
            return matches[0];
        }

        // ---- Tab renderers ----

        const CAB_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        function fmtShort(dateStr) {
            const d = parseDate(dateStr);
            return `${CAB_MONTHS[d.getMonth()]} ${d.getDate()}`;
        }

        function addDaysStr(dateStr, n) {
            const d = parseDate(dateStr);
            d.setDate(d.getDate() + n);
            return dateToStr(d);
        }

        // 🖨️ Print button for a leaf (Step 10). Always rendered and always clickable once an
        // entry exists and the matching page set is loaded this session — incomplete instances
        // print too (unanswered fields show N/A / empty boxes). The tooltip still lists what's
        // missing so the user knows the copy isn't final; only "no entry yet" or "document not
        // loaded" actually disable the button.
        function printButtonHtml({ lotId, sheetId, key }) {
            const inst = DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances?.[key] || null;
            const blockers = printBlockers(sheetId, key, inst, lotId);
            // Hard locks only: nothing to print yet, or no page set for this sheet this session.
            const disabled = !inst || (blockers.length > 0 && /not loaded/.test(blockers[0]));
            const title = blockers.length ? `Print — ${blockers.join(' · ')}` : 'Open print popup';
            return `<button type="button" class="cab-print" data-print="1" data-plot="${escapeHtml(lotId)}" data-sheet="${escapeHtml(sheetId)}" data-key="${escapeHtml(key)}"${disabled ? ' disabled' : ''} title="${escapeHtml(title)}">🖨️ Print</button>`;
        }

        // What's still open on an instance, independent of the print document (the sign
        // button works whether or not a page set is loaded this session). Mirrors the
        // per-cadence checks in printBlockers minus the doc gate and the signature check
        // itself (this IS the signature button).
        function signatureMissing(sheetId, key, inst) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet || !inst) return [];
            if (instanceComplete(sheetId, key, inst)) return [];
            const out = [];
            if (sheet.cadence === 'daily-weekly') {
                const { start, end } = activeWindow(inst, key);
                const total = daysBetween(start, end);
                let filled = 0;
                for (const d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) if (dayAnswered(inst, dateToStr(d), sheetId)) filled++;
                if (filled < total) out.push(`${total - filled} day(s) left`);
                if (inst.phaseChangeDate && !inst.strikeInitials) out.push('strike initials missing');
            } else {
                const qids = instanceQuestionIds(sheetId);
                const answered = qids.filter(qid => hasAnswer(inst.header, qid)).length;
                if (answered < qids.length) out.push(`${qids.length - answered} field(s) left`);
            }
            return out;
        }

        // ✍️ Sign button for a leaf — opens the signature-only modal. Enabled when an
        // instance exists and the sheet defines a signature box. Completion status is
        // surfaced in the tooltip but never blocks signing ("if he so decides").
        function signatureButtonHtml({ lotId, sheetId, key }) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet?.signature) return '';
            const inst = DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances?.[key] || null;
            if (!inst) {
                return `<button type="button" class="cab-sign" data-sign="1" data-plot="${escapeHtml(lotId)}" data-sheet="${escapeHtml(sheetId)}" data-key="${escapeHtml(key)}" disabled title="No entry yet — fill it first">✍️ Sign</button>`;
            }
            const signed = !!inst.signature;
            let title;
            if (signed) {
                title = `Signed by ${inst.signature.name || '—'} — click to re-sign`;
            } else {
                const missing = signatureMissing(sheetId, key, inst);
                title = missing.length ? `Sign off (${missing.join(' · ')})` : 'Log is complete — sign off';
            }
            return `<button type="button" class="cab-sign" data-sign="1" data-plot="${escapeHtml(lotId)}" data-sheet="${escapeHtml(sheetId)}" data-key="${escapeHtml(key)}" title="${escapeHtml(title)}">✍️ Sign</button>`;
        }

        // One cabinet leaf row. `label` must be pre-escaped HTML.
        function cabLeaf(label, status, opts = {}) {
            const refCls = opts.ref ? ' ref' : '';
            const from = opts.from ? `<span class="cab-from">from ${escapeHtml(opts.from)}</span>` : '';
            // Reference nodes open the same print popup as owned instances (no Fill action).
            const printBtn = opts.print ? printButtonHtml(opts.print) : '';
            return `<div class="cab-leaf${refCls}">
                <span class="cab-label">${label}</span>
                ${from}
                ${printBtn}
                <span class="cab-status ${status.cls}">${status.text}</span>
            </div>`;
        }

        // Owned leaf with an inline Fill button (reference nodes stay read-only).
        function cabLeafFill(label, status, sheetId, key, lotId) {
            return `<div class="cab-leaf" data-fill="1" data-sheet="${escapeHtml(sheetId)}" data-key="${escapeHtml(key)}">
                <span class="cab-label">${label}</span>
                <button type="button" class="cab-fill">Fill</button>
                ${signatureButtonHtml({ lotId: lotId || activeLotId, sheetId, key })}
                ${printButtonHtml({ lotId: lotId || activeLotId, sheetId, key })}
                <span class="cab-status ${status.cls}">${status.text}</span>
            </div>`;
        }

        // ---- Wizard runner (Step 6) — centered card, one question at a time ----
        let runnerCtx = null; // { lotId, sheetId, key, day, idx, draft } while the modal is open

        // Resolve a binding string against the current DB (prefill only — the stored answer prints).
        function resolveBinding(binding, ctx) {
            if (!binding) return null;
            const [kind, field] = String(binding).split('.');
            if (kind === 'lot') {
                const lot = DB.lots[ctx.lotId];
                const v = lot ? lot[field] : null;
                if (field === 'stage') return normalizeStage(v); // form vocabulary for prefill/print
                // NOTE: room bindings (roomDesignation / roomBuilding / currentRoom) resolve from
                // the LIVE lot here because this path also serves PREFILL (the Room question's
                // prefillFrom), where "where are the plants now" is the right answer. PRINTING a
                // struck-out page must instead show the room THIS log was kept in — that is done
                // directly in printFieldValue from inst.room, never through this live resolution.
                if (field === 'roomDesignation') return roomDesignationFor(lot?.currentRoom);
                if (field === 'roomBuilding') return roomBuildingFor(lot?.currentRoom);
                // Lot number only: names are "{lotId} {strainPrefix}", so the first token is
                // the number. Falls back to the lot ID when the name has no space.
                if (field === 'lotNumber') {
                    const n = lot?.name ? String(lot.name).trim().split(/\s+/)[0] : '';
                    return n || ctx.lotId || null;
                }
                return (v === null || v === undefined) ? null : String(v);
            }
            if (kind === 'instance' && field === 'phase') return ctx.inst?.phase || null;
            // Date the instance was signed (yyyy/mm/dd) — stamped when the master grower saves
            // his signature via the cabinet's ✍️ Sign button (re-signing updates it). Resolved
            // live from inst.signature, never snapshotted; null until the log is signed.
            if (kind === 'signature' && field === 'date') return ctx.inst?.signature?.date ? fmtYYYYMMDD(ctx.inst.signature.date) : null;
            // Last digit of the current year (2021 → 1, 2023 → 3). Resolved at save time and
            // snapshotted like any other binding — a form saved in 2026 keeps printing "6".
            if (kind === 'year' && field === 'current') return String(new Date().getFullYear() % 10);
            if (kind === 'day' && field === 'date') return ctx.dayDate ? fmtMMDD(ctx.dayDate) : null;
            // Plants removed on the current day row: yesterday's count − today's count, clamped
            // at 0. Derived per row at print time from the saved plant-count answers (never
            // snapshotted — like day.date). Today must have an EXPLICIT answer for that day —
            // falling back to an earlier day's count would understate removals; null → N/A.
            if (kind === 'day' && field === 'plantsRemoved') {
                if (!ctx.dayDate) return null;
                const today = explicitPlantCountOn(ctx.lotId, ctx.sheetId, ctx.key, ctx.dayDate);
                if (today == null) return null;
                const yest = lastRecordedPlantCount(ctx.lotId, ctx.sheetId, ctx.key, addDaysStr(ctx.dayDate, -1));
                if (yest == null) return null;
                return String(Math.max(0, yest - today));
            }
            if (kind === 'sheet') {
                const start = ctx.key;
                // periodEnd only makes sense for a real date key (daily-weekly windows).
                const end = /^\d{4}-\d{2}-\d{2}$/.test(start) ? addDaysStr(start, 6) : null;
                if (field === 'periodStart') return start;
                if (field === 'periodEnd') return end;
            }
            return null;
        }

        // Every binding a sheet uses: field sources + question prefillFrom values.
        function sheetBindings(sheetId) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return [];
            const set = new Set();
            for (const f of sheet.fields || []) if (f.source) set.add(f.source);
            const wiz = wizardForSheet(sheetId);
            for (const q of wiz?.questions || []) if (q.prefillFrom) set.add(q.prefillFrom);
            return [...set];
        }

        // Capture save-time binding snapshots on the instance (spec: captured at creation and
        // refreshed on every entry save — the stored snapshot, not the live DB, is what prints).
        function captureSnapshots(sheetId, lotId, key, inst) {
            if (!inst.snapshots) inst.snapshots = {};
            for (const b of sheetBindings(sheetId)) {
                // day.date / day.plantsRemoved are derived per row at print time — never snapshotted.
                // Room bindings follow the instance's own stored room and are resolved at PRINT
                // time too — snapshotting them would freeze the room as of the last save, which is
                // wrong for a log that later moved rooms (the struck-out page must keep printing
                // the room it was actually kept in).
                if (b === 'day.date' || b === 'day.plantsRemoved' || b === 'signature.date'
                    || b === 'lot.roomDesignation' || b === 'lot.roomBuilding' || b === 'lot.currentRoom') continue;
                inst.snapshots[b] = resolveBinding(b, { lotId, sheetId, key, inst });
            }
        }

        // Previous daily-weekly instance key for this lot+sheet (for same-as-last at a chain start).
        // The current instance may be an unsaved draft, so take the largest stored key before it.
        function prevInstanceKey(lotId, sheetId, key) {
            const keys = Object.keys(DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances || {}).sort();
            let best = null;
            for (const k of keys) if (k < key) best = k;
            return best;
        }

        async function openRunner(lotId, sheetId, key, preferDay) {
            if (readOnlyHere(lotId)) return;
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            const wiz = wizardForSheet(sheetId);
            if (!sheet || !wiz) { showToast('No wizard configured for this sheet'); return; }
            // A daily-weekly sheet whose questions are ALL constant fields has nothing to ask
            // per day — its values live in the Initialize quiz (lot-level), not in instances.
            if (sheet.cadence === 'daily-weekly') {
                const cids = new Set(constantQuestionIds(sheetId));
                if (!(wiz.questions || []).some(q => !cids.has(q.id))) {
                    showToast('Every question on this sheet is a constant field — use 📋 Initialize paperwork');
                    return;
                }
            }

            let instKey = key;
            let inst = DB.paperWizard.entries[lotId]?.[sheetId]?.instances?.[instKey] || null;
            const today = todayStr();
            if (!inst) {
                // No instance yet — create a draft (persisted on Save). Daily-weekly drafts
                // default to today unless an explicit date was requested (backfill from the
                // cabinet's missing-day leaves starts a window on that past day).
                if (sheet.cadence === 'daily-weekly') instKey = /^\d{4}-\d{2}-\d{2}$/.test(key || '') ? key : today;
                else if (sheet.cadence === 'event') instKey = key || today;
                else instKey = 'single';
                inst = { phase: sheet.cadence === 'daily-weekly' ? normalizeStage(DB.lots[lotId]?.stage) : null,
                         room: sheet.cadence === 'daily-weekly' ? (DB.lots[lotId]?.currentRoom || null) : null,
                         header: {}, days: {}, phaseChangeDate: null, strikeInitials: null,
                         snapshots: {}, signature: null, completedAt: null, printedAt: null };
            }

            let day = null;
            if (sheet.cadence === 'daily-weekly') {
                const winEnd = addDaysStr(instKey, 6);
                if (preferDay && preferDay >= instKey && preferDay <= winEnd) day = preferDay; // e.g. a log just started on a chosen day
                else if (today >= instKey && today <= winEnd) day = today; // today inside this window
                else { // otherwise the first unfilled day in the window
                    for (let i = 0; i < 7; i++) {
                        const ds = addDaysStr(instKey, i);
                        if (!dayAnswered(inst, ds, sheetId)) { day = ds; break; }
                    }
                    if (!day) day = instKey;
                }
            }
            runnerCtx = { lotId, sheetId, key: instKey, day, idx: 0, draft: {}, inst };
            // Reverse-direction phase detection (Step 9): stage changed in SitkaTools since this
            // instance was created → confirm the move and roll over (no write-back — DB is current).
            if (await checkStageMismatch(lotId, sheetId, inst)) return;
            // Same for room changes (currentRoom edited in SitkaTools).
            if (await checkRoomMismatch(lotId, sheetId, inst)) return;
            resetRunnerDraft();
            renderRunner();
        }

        // (Re)load the draft answers for the current scope from saved data / prefill bindings.
        function resetRunnerDraft() {
            const { sheetId, inst, day } = runnerCtx;
            const wiz = wizardForSheet(sheetId);
            // Constant questions are set once per lot via the Initialize quiz — never drafted
            // here (they don't live in an instance at all).
            const cids = new Set(constantQuestionIds(sheetId));
            // A backfill day (later days on file) is compared with what its page said, not with
            // the live lot (applyBackfill) — so its plant count / phase / room prefill from the page.
            const backfill = !!day && isBackfillDay(runnerCtx.lotId, sheetId, runnerCtx.key, day);
            const draft = {};
            const prefilled = {};
            for (const q of (wiz.questions || []).filter(q => !cids.has(q.id))) {
                if (q.type === 'initials') {
                    // Drawn initials: the answer is a {name, strokes} object stored in the same
                    // slot as any other answer (per-day for row-scoped, instance-level otherwise).
                    const saved = q.rowScoped ? (inst.days?.[day]?.[q.id] ?? null) : (inst.header?.[q.id] ?? null);
                    draft[q.id] = (saved && Array.isArray(saved.strokes))
                        ? { name: saved.name || '', strokes: saved.strokes.map(s => s.slice()) }
                        : { name: '', strokes: [], mandatory: false };
                    continue;
                }
                let v = q.rowScoped ? (inst.days?.[day]?.[q.id] ?? null) : (inst.header?.[q.id] ?? null);
                if ((v === null || v === undefined || String(v).trim() === '') && q.prefillFrom) {
                    v = runnerPrefill(q, backfill);
                    prefilled[q.id] = v;
                }
                draft[q.id] = (v === null || v === undefined) ? '' : String(v);
            }
            runnerCtx.draft = draft;
            runnerCtx.prefilled = prefilled; // what each prefilled answer opened with (refreshRunnerPrefills)
        }

        // The prefill for a question left blank in the runner's current scope (prefillFrom set).
        function runnerPrefill(q, backfill) {
            const { lotId, sheetId, key, inst, day } = runnerCtx;
            // day.date prefills from the current day (row-scoped only).
            let v = resolveBinding(q.prefillFrom, { lotId, sheetId, key, inst, dayDate: q.rowScoped ? day : null });
            if (backfill) {
                // Live values would read as a change on save: a false "shift later days?"
                // prompt (plant count) or a false strike-out + re-page (phase / room).
                if (q.type === 'plant-count' && q.rowScoped) {
                    const prev = lastRecordedPlantCount(lotId, sheetId, key, addDaysStr(day, -1));
                    if (prev !== null) v = prev;
                } else if (q.type === 'phase' && inst.phase) v = normalizeStage(inst.phase);
                else if (q.type === 'room' && inst.room) v = inst.room;
            } else if (q.type === 'phase' && runnerCtx.phaseFromLot) {
                // "Lot is now in X — close this log?" was declined: the day records the lot's
                // live phase, so a plain save isn't read as a change back (checkStageMismatch).
                v = currentLotPhase(lotId) ?? v;
            }
            return (v === null || v === undefined) ? '' : String(v);
        }

        // A live update from SitkaTools while the runner is open: prefilled answers follow the new
        // DB — a stale plant count / phase / room prefill would otherwise be saved over the newer
        // value (or read as a change). Recomputed with the same rules as the open (a backfill day
        // still prefills from the page), and only where the answer is still the old prefill: an
        // answer the user typed or picked is never touched.
        function refreshRunnerPrefills() {
            const ctx = runnerCtx;
            if (!ctx || ctx.mode === 'init' || !ctx.prefilled) return; // not drafted yet — the open will prefill
            const wiz = wizardForSheet(ctx.sheetId);
            if (!wiz) return;
            const cids = new Set(constantQuestionIds(ctx.sheetId));
            const steps = (wiz.questions || []).filter(q => !cids.has(q.id)); // must match renderRunner
            const shown = steps[ctx.idx];
            const backfill = !!ctx.day && isBackfillDay(ctx.lotId, ctx.sheetId, ctx.key, ctx.day);
            // The stage changed in SitkaTools: opening now would ask "Lot is now in … — close this
            // grow-log?". A live update doesn't ask — it goes on as if that was declined, so the
            // phase prefill follows the lot's live phase (a plain save isn't read as a change back).
            if (stageMismatch(ctx.lotId, ctx.sheetId, ctx.key, ctx.inst)) ctx.phaseFromLot = true;
            let shownChanged = false;
            for (const q of steps) {
                if (!Object.prototype.hasOwnProperty.call(ctx.prefilled, q.id)) continue;
                const old = ctx.prefilled[q.id];
                // Changed by the user (or no longer a prefilled question): theirs from now on.
                if (q.type === 'initials' || !q.prefillFrom || String(ctx.draft[q.id] ?? '') !== old) {
                    delete ctx.prefilled[q.id];
                    continue;
                }
                const nv = runnerPrefill(q, backfill);
                if (nv === old) continue;
                ctx.draft[q.id] = nv;
                ctx.prefilled[q.id] = nv;
                if (q !== shown) continue;
                // On screen: the control still showing the old prefill shows the new one.
                const ctl = $('wizCtl');
                if (ctl && ctl.value === old) {
                    ctl.value = nv;
                    if (ctl.tagName === 'SELECT' && ctl.value !== nv) { // e.g. a room added since the step was drawn
                        const opt = document.createElement('option');
                        opt.value = nv;
                        opt.textContent = nv;
                        ctl.appendChild(opt);
                        ctl.value = nv;
                    }
                }
                shownChanged = true;
            }
            if (shownChanged) updateRunnerFooter(); // a mandatory step's Next / Save follows the new answer
        }

        // Sources for "⏪ Same as last time": row-scoped questions copy the previous day's
        // answers (falling back to the previous instance's last day at a chain start);
        // instance-level questions copy the previous instance's header.
        function runnerSameSources() {
            const { sheetId, inst, key, day } = runnerCtx;
            let daySrc = null, instSrc = null;
            if (day) {
                const prevDay = addDaysStr(day, -1);
                if (inst.days?.[prevDay]) daySrc = inst.days[prevDay];
                const pk = prevInstanceKey(runnerCtx.lotId, sheetId, key);
                if (pk) {
                    const pinst = DB.paperWizard.entries[runnerCtx.lotId][sheetId].instances[pk];
                    const pkeys = Object.keys(pinst.days || {}).sort();
                    if (pkeys.length && !daySrc) daySrc = pinst.days[pkeys[pkeys.length - 1]];
                    instSrc = pinst.header || null;
                }
            } else {
                const pk = prevInstanceKey(runnerCtx.lotId, sheetId, key);
                if (pk) instSrc = DB.paperWizard.entries[runnerCtx.lotId][sheetId].instances[pk].header || null;
            }
            return { daySrc, instSrc };
        }

        // "⏪ Same as last time" — pre-fills unanswered sameAsLast questions. Never auto-saves.
        function runnerSameAsLast() {
            const wiz = wizardForSheet(runnerCtx.sheetId);
            const { daySrc, instSrc } = runnerSameSources();
            const cids = new Set(constantQuestionIds(runnerCtx.sheetId));
            let n = 0;
            for (const q of (wiz.questions || []).filter(q => !cids.has(q.id))) {
                if (!q.sameAsLast) continue;
                if (q.type === 'initials') continue; // never copy drawn strokes
                // Phase / room questions are deliberate change actions, not routine data —
                // auto-copying them (e.g. the old log's stamped move-day value onto the fresh
                // log's first day) could silently re-trigger a rollover.
                if (q.type === 'phase' || q.type === 'room') continue;
                const src = q.rowScoped ? daySrc : instSrc;
                const v = src ? src[q.id] : null;
                if (v !== null && v !== undefined && String(v).trim() !== '' && String(runnerCtx.draft[q.id] ?? '').trim() === '') {
                    runnerCtx.draft[q.id] = String(v);
                    n++;
                }
            }
            renderRunner();
            showToast(n ? `Copied ${n} answer${n === 1 ? '' : 's'} from last time` : 'Nothing new to copy');
        }

        function runnerGo(delta) {
            const wiz = wizardForSheet(runnerCtx.sheetId);
            // Steps = the wizard's questions minus the constant ones (set via Initialize). The
            // master grower's signature is NOT a wizard step — it is captured only via the
            // cabinet leaf's ✍️ Sign button. Must match renderRunner.
            const cids = new Set(constantQuestionIds(runnerCtx.sheetId));
            const steps = (wiz.questions || []).filter(q => !cids.has(q.id));
            // Mandatory gate: you can't advance past a mandatory question that has no answer
            // yet (the Next button is hidden in the UI; this guards Enter-to-advance too).
            if (delta > 0) {
                const cur = steps[runnerCtx.idx];
                if (cur?.mandatory) {
                    const v = runnerCtx.draft[cur.id];
                    const answered = cur.type === 'initials'
                        ? !!(v && Array.isArray(v.strokes) && v.strokes.length)
                        : String(v ?? '').trim() !== '';
                    if (!answered) { showToast(`"${cur.label}" is mandatory — answer it before continuing`); return; }
                }
            }
            runnerCtx.idx = Math.max(0, Math.min(steps.length - 1, runnerCtx.idx + delta));
            renderRunner();
        }

        function closeRunner() {
            runnerCtx = null;
            const ov = $('wizOverlay');
            if (ov) ov.remove();
            document.removeEventListener('keydown', runnerEscHandler);
        }

        function runnerEscHandler(e) { if (e.key === 'Escape') closeRunner(); }

        // ---- Initialize paperwork (constant fields) ----
        // A step-through quiz over this lot's constant questions — same card UI as the daily
        // runner, but no day chips and no instance: answers are stored ONCE per lot+sheet
        // (entries[lotId][sheetId].constants) and print on every page of the chain. Re-running
        // pre-fills the current values so they can be edited.
        function initQuizSteps(lotId) {
            const steps = [];
            for (const [sheetId, sheet] of Object.entries(DB.paperWizard?.sheets || {})) {
                if (sheet.cadence !== 'daily-weekly') continue;
                const wiz = wizardForSheet(sheetId);
                if (!wiz) continue;
                const cids = new Set(constantQuestionIds(sheetId));
                for (const q of wiz.questions || []) {
                    if (cids.has(q.id)) steps.push({ sheetId, sheetName: sheet.name || sheetId, q });
                }
            }
            return steps;
        }

        function openInitQuiz(lotId) {
            if (readOnlyHere(lotId)) return;
            const steps = initQuizSteps(lotId);
            if (!steps.length) { showToast('No constant fields configured — flag a header box 📌 in Configure Sheets'); return; }
            const draft = {};
            for (const s of steps) {
                const saved = lotConstants(lotId, s.sheetId)?.[s.q.id];
                if (s.q.type === 'initials') {
                    draft[s.q.id] = (saved && Array.isArray(saved.strokes))
                        ? { name: saved.name || '', strokes: saved.strokes.map(x => x.slice()) }
                        : { name: '', strokes: [], mandatory: false };
                } else {
                    let v = (saved === null || saved === undefined) ? '' : String(saved);
                    if (v.trim() === '' && s.q.prefillFrom) {
                        v = String(resolveBinding(s.q.prefillFrom, { lotId, sheetId: s.sheetId, key: null, inst: null }) ?? '');
                    }
                    draft[s.q.id] = v;
                }
            }
            runnerCtx = { mode: 'init', lotId, idx: 0, draft, steps };
            renderRunner();
        }

        function saveInitConstants() {
            const ctx = runnerCtx;
            if (readOnlyHere(ctx.lotId)) return; // a live update may have made the lot read-only here
            // Mandatory questions must be answered before the quiz can save — same rule as
            // the daily runner's Save button.
            for (const s of ctx.steps) {
                if (!s.q.mandatory) continue;
                const v = ctx.draft[s.q.id];
                const empty = s.q.type === 'initials'
                    ? !(v && Array.isArray(v.strokes) && v.strokes.length)
                    : String(v ?? '').trim() === '';
                if (empty) { showToast(`"${s.q.label}" is mandatory — answer it before saving`); return; }
            }
            for (const s of ctx.steps) {
                let v = ctx.draft[s.q.id];
                if (s.q.type === 'initials') {
                    // Same storage shape as the daily runner: {name, strokes} or null when empty.
                    v = (v && Array.isArray(v.strokes) && v.strokes.length)
                        ? { name: String(v.name || '').trim(), strokes: v.strokes }
                        : null;
                } else {
                    v = String(v ?? '').trim();
                }
                // Ensure the lot+sheet entry path exists (a sheet may have no instances yet).
                if (!DB.paperWizard.entries[ctx.lotId]) DB.paperWizard.entries[ctx.lotId] = {};
                if (!DB.paperWizard.entries[ctx.lotId][s.sheetId]) DB.paperWizard.entries[ctx.lotId][s.sheetId] = { instances: {} };
                const sd = DB.paperWizard.entries[ctx.lotId][s.sheetId];
                if (!sd.constants) sd.constants = {};
                sd.constants[s.q.id] = v;
            }
            notifySitkaTools();
            closeRunner();
            renderAll();
            showToast('Constant values saved — they print on every page of this form');
        }

        // Generic stylus draw-pad: pointer-captured strokes stored as normalized [x,y] arrays
        // within the box. No image is generated — pure vector data, re-drawn on open. Shared by
        // the manager signature pad, the per-day initials pad, and the strike-out capture dialog.
        // `onStroke` fires when a stroke is committed (pointerup) — the wizard runner uses it
        // to re-evaluate mandatory gating as soon as something has been drawn.
        function initDrawPad(canvasId, aspectRatio, strokes, onStroke) {
            const canvas = $(canvasId);
            if (!canvas) return;
            const W = 480;
            const H = Math.max(60, Math.round(W / (aspectRatio || 4)));
            canvas.width = W;
            canvas.height = H;
            const g = canvas.getContext('2d');
            g.clearRect(0, 0, W, H);
            g.lineWidth = 2.5;
            g.lineCap = 'round';
            g.lineJoin = 'round';
            g.strokeStyle = '#1a1a1a';

            const drawStroke = (pts) => {
                if (!pts.length) return;
                g.beginPath();
                g.moveTo(pts[0][0] * W, pts[0][1] * H);
                for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0] * W, pts[i][1] * H);
                g.stroke();
            };
            for (const s of strokes) drawStroke(s); // repaint existing (re-sign / re-initial view)

            let drawing = false;
            const toNorm = (e) => {
                const r = canvas.getBoundingClientRect();
                return [
                    Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
                    Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
                ];
            };
            canvas.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                drawing = true;
                try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
                strokes.push([toNorm(e)]);
            });
            canvas.addEventListener('pointermove', (e) => {
                if (!drawing) return;
                const stroke = strokes[strokes.length - 1];
                const p = toNorm(e);
                const prev = stroke[stroke.length - 1] || p;
                stroke.push(p);
                g.beginPath();
                g.moveTo(prev[0] * W, prev[1] * H);
                g.lineTo(p[0] * W, p[1] * H);
                g.stroke();
            });
            const endStroke = () => { if (drawing) onStroke?.(); drawing = false; };
            canvas.addEventListener('pointerup', endStroke);
            canvas.addEventListener('pointercancel', endStroke);
            // Clear the pad's pixels + drawing state (the caller empties `strokes` itself).
            return { clear: () => { g.clearRect(0, 0, W, H); drawing = false; } };
        }

        // ---- Signature-only modal (tree-view ✍️ Sign button) ----
        // A lightweight sign-off dialog: draw pad + name, pre-filled if already signed.
        // No day chips, no question navigation, no phase/room rollover checks — signing
        // can never accidentally trigger a log rollover. Empty pad on save clears the
        // signature (same rule as the wizard's signature step).
        let sigModalCtx = null; // { lotId, sheetId, key, inst, strokes } while open

        function closeSignatureModal() {
            sigModalCtx = null;
            const ov = $('sigModalOverlay');
            if (ov) ov.remove();
            document.removeEventListener('keydown', sigModalEscHandler);
        }

        function sigModalEscHandler(e) { if (e.key === 'Escape') closeSignatureModal(); }

        function openSignatureModal(lotId, sheetId, key) {
            if (readOnlyHere(lotId)) return;
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet?.signature) { showToast('No signature box configured for this sheet'); return; }
            const inst = DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances?.[key] || null;
            if (!inst) { showToast('No entry yet — fill it first'); return; }

            sigModalCtx = {
                lotId, sheetId, key, inst,
                strokes: inst.signature ? (inst.signature.strokes || []).map(s => s.slice()) : []
            };

            const sig = sheet.signature;
            // Match the box's on-paper pixel aspect ratio so the signature prints undistorted.
            const ar = boxPrintAspect(sheet, sig);
            const nameVal = escapeHtml(inst.signature?.name ?? '');
            const label = escapeHtml(sig.label || 'Signature');
            const sheetName = escapeHtml(sheet.name || sheetId);

            let ov = $('sigModalOverlay');
            if (!ov) {
                ov = document.createElement('div');
                ov.id = 'sigModalOverlay';
                ov.className = 'wiz-overlay';
                ov.addEventListener('mousedown', e => { if (e.target === ov) closeSignatureModal(); });
                document.body.appendChild(ov);
            }
            ov.innerHTML = `
                <div class="wiz-card">
                    <div class="wiz-head">
                        <span class="wiz-title">✍️ ${label} — ${sheetName}</span>
                        <span class="wiz-prog">${escapeHtml(key)}</span>
                        <button type="button" class="wiz-close" id="sigModalCloseBtn" title="Close">✕</button>
                    </div>
                    <div class="wiz-body">
                        <div class="sig-pad-wrap"><canvas id="sigPad2" class="sig-pad"></canvas></div>
                        <input type="text" id="sigName2" class="sig-name" placeholder="Signer name / initials" value="${nameVal}">
                        <div class="wiz-hint" style="margin-bottom:10px;">Master grower review — sign off on the whole log. The signature date (yyyy/mm/dd) is stamped automatically when you save.</div>
                        <div class="sig-actions"><button type="button" class="sig-clear" id="sigModalClearBtn">🧹 Clear signature</button></div>
                    </div>
                    <div class="wiz-foot">
                        <span class="spacer"></span>
                        <button type="button" class="btn btn-primary" id="sigModalSaveBtn">💾 Save signature</button>
                    </div>
                </div>`;

            document.addEventListener('keydown', sigModalEscHandler);

            // Initialize the draw pad with existing strokes (re-sign view).
            initDrawPad('sigPad2', ar, sigModalCtx.strokes);

            $('sigModalCloseBtn').addEventListener('click', closeSignatureModal);
            $('sigModalClearBtn').addEventListener('click', () => {
                // Mutate in place — the canvas event handlers captured this array reference.
                sigModalCtx.strokes.length = 0;
                const canvas = $('sigPad2');
                if (canvas) {
                    const g = canvas.getContext('2d');
                    g.clearRect(0, 0, canvas.width, canvas.height);
                }
            });
            $('sigModalSaveBtn').addEventListener('click', () => {
                if (readOnlyHere(lotId)) return; // a live update may have made the lot read-only here
                // Look the page up again — a live update from SitkaTools may have replaced the DB
                // while the pad was open.
                const inst = DB.paperWizard?.entries?.[lotId]?.[sheetId]?.instances?.[key];
                if (!inst) { closeSignatureModal(); renderAll(); showToast('This log is no longer on file — nothing saved'); return; }
                const nameEl = $('sigName2');
                const strokes = sigModalCtx.strokes;
                // Stamp the signature date (local YYYY-MM-DD) on every save — re-signing
                // updates it; clearing removes it. Feeds the `signature.date` binding.
                inst.signature = (strokes && strokes.length)
                    ? { name: String(nameEl?.value || '').trim(), strokes, date: todayStr() }
                    : null;
                evaluateCompletion(sheetId, key, inst);
                notifySitkaTools();
                closeSignatureModal();
                renderAll();
                showToast(inst.signature ? 'Signature saved' : 'Signature cleared');
            });
        }

        // Initials-question pad — the draw surface for a wizard question of type 'initials'.
        // Sized to the bound field's aspect ratio (wide/short boxes); strokes live in the
        // question's draft answer ({name, strokes}).
        function initQuestionInitialsPad(ctx, q) {
            const sheet = DB.paperWizard.sheets[ctx.sheetId];
            // The binding lives on the field side — any field carrying this question's id
            // (group members share geometry, so the first match sizes the pad correctly).
            const f = (sheet.fields || []).find(x => x.questionId === q.id);
            // Match the box's on-paper pixel aspect ratio so initials print undistorted.
            const ar = f ? boxPrintAspect(sheet, f) : 3;
            initDrawPad('qInitPad', ar, ctx.draft[q.id].strokes);
        }

        // Rebuild ONLY the Next/Save footer slot (and wire its buttons) based on the
        // current mandatory-gating state. Called from renderRunner and, crucially, from the
        // per-keystroke input handler — a full renderRunner() there would rebuild the focused
        // <input> and reset its caret to position 0, reversing typed text ("will" -> "lliw").
        function updateRunnerFooter() {
            const ctx = runnerCtx;
            if (!ctx) return;
            const isInit = ctx.mode === 'init';
            let qs;
            if (isInit) {
                qs = ctx.steps.map(s => s.q);
            } else {
                const wiz = wizardForSheet(ctx.sheetId);
                const cids = new Set(constantQuestionIds(ctx.sheetId));
                qs = (wiz.questions || []).filter(q => !cids.has(q.id));
            }
            const q = qs[ctx.idx];
            if (!q) return;
            const isLast = ctx.idx === qs.length - 1;
            // Initials count as answered only once strokes are drawn — an empty pad is not an answer.
            const dv = ctx.draft[q.id];
            const stepAnswered = q.type === 'initials'
                ? !!(dv && Array.isArray(dv.strokes) && dv.strokes.length)
                : String(dv ?? '').trim() !== '';
            const blockedByMandatory = !!q.mandatory && !stepAnswered;

            const slot = $('wizFootSlot');
            if (!slot) return;
            slot.innerHTML = blockedByMandatory
                ? `<span class="wiz-hint">⚠️ Answer this mandatory question to continue</span>`
                : isLast
                    ? `<button type="button" class="btn btn-primary" id="wizSaveBtn">${isInit ? '💾 Save constants' : '💾 Save entry'}</button>`
                    : `<button type="button" class="btn btn-primary" id="wizNextBtn">Next →</button>`;
            const nextBtn = $('wizNextBtn');
            if (nextBtn) nextBtn.addEventListener('click', () => runnerGo(1));
            const saveBtn = $('wizSaveBtn');
            if (saveBtn) saveBtn.addEventListener('click', isInit ? saveInitConstants : saveRunnerEntry);
        }

        function renderRunner() {
            const ctx = runnerCtx;
            const isInit = ctx.mode === 'init';
            // Init quiz mode: steps are the lot's constant questions (grouped by sheet), not a
            // wizard's question list. The current step's sheet drives pad sizing / labels —
            // keep ctx.sheetId in sync so shared helpers (initials pad) work unchanged.
            let sheet, wiz, qs;
            if (isInit) {
                const step = ctx.steps[ctx.idx];
                ctx.sheetId = step.sheetId;
                sheet = DB.paperWizard.sheets[step.sheetId];
                wiz = wizardForSheet(step.sheetId);
                qs = ctx.steps.map(s => s.q);
            } else {
                sheet = DB.paperWizard.sheets[ctx.sheetId];
                wiz = wizardForSheet(ctx.sheetId);
                // Constant questions are set once per lot via the Initialize quiz — the daily
                // runner never re-asks them.
                const cids = new Set(constantQuestionIds(ctx.sheetId));
                qs = (wiz.questions || []).filter(q => !cids.has(q.id));
            }
            const totalSteps = qs.length;                    // questions only — no signature step
            const q = qs[ctx.idx];
            const isLast = ctx.idx === totalSteps - 1;

            // Day selector (daily-weekly only, never in the init quiz): the instance's 7-day window.
            let dayChipsHtml = '';
            if (!isInit && sheet.cadence === 'daily-weekly') {
                const chips = [];
                for (let i = 0; i < 7; i++) {
                    const ds = addDaysStr(ctx.key, i);
                    const filled = dayAnswered(ctx.inst, ds, ctx.sheetId);
                    const selCls = ds === ctx.day ? ' sel' : '';
                    chips.push(`<button type="button" class="day-chip${selCls}${filled ? ' filled' : ''}" data-day="${ds}">${fmtShort(ds)}</button>`);
                }
                dayChipsHtml = `<div class="wiz-daychips">${chips.join('')}</div>
                    <div class="wiz-hint">Answers are saved per day — pick a day, answer, then Save.</div>`;
            }

            // Question step body. An initials question renders a draw pad. The master grower's
            // signature is never a wizard step — it is captured only via the cabinet ✍️ Sign button.
            let bodyInner;
            if (q.type === 'initials') {
                const d = ctx.draft[q.id] || { name: '', strokes: [] };
                bodyInner = `
                <div class="wiz-q-label">✍️ ${escapeHtml(q.label)}${q.mandatory ? '<span class="wiz-mandatory" title="This question must be answered before you can continue">⚠️ Mandatory</span>' : ''}</div>
                <div class="sig-pad-wrap"><canvas id="qInitPad" class="sig-pad init-pad"></canvas></div>
                <input type="text" id="qInitName" class="sig-name" placeholder="Who filled this (name / initials)" value="${escapeHtml(d.name ?? '')}">
                <div class="wiz-hint" style="margin-bottom:10px;">Draw your initials — they print in the box at its placed position.${q.mandatory ? ' This question is mandatory — draw something before continuing.' : ''}</div>
                <div class="sig-actions"><button type="button" class="sig-clear" id="qInitClearBtn">🧹 Clear initials</button></div>`;
            } else {
                const val = escapeHtml(ctx.draft[q.id] ?? '');
                let ctl;
                if (q.type === 'select') {
                    const opts = ['<option value="">— select —</option>']
                        .concat((q.options || []).map(o => `<option value="${escapeHtml(o)}"${o === ctx.draft[q.id] ? ' selected' : ''}>${escapeHtml(o)}</option>`));
                    ctl = `<select id="wizCtl">${opts.join('')}</select>`;
                } else if (q.type === 'phase') {
                    // Drop-down of the phase vocabulary. Picking a phase DIFFERENT from the
                    // lot's current one writes it back to the DB and strikes out this log on
                    // save (after the day's entry is complete); picking the current phase just
                    // records it for the day (how the fresh log's first day carries the new
                    // phase in the double entry — no change, no strike-out).
                    const opts = ['<option value="">— no phase change —</option>']
                        .concat(PHASE_OPTIONS.map(o => `<option value="${escapeHtml(o)}"${o === ctx.draft[q.id] ? ' selected' : ''}>${escapeHtml(o)}</option>`));
                    ctl = `<select id="wizCtl">${opts.join('')}</select>`;
                } else if (q.type === 'room') {
                    // Known room names from the DB. Picking a room DIFFERENT from the lot's
                    // current one writes it back and strikes out this log on save (after the
                    // day's entry is complete); picking the current room just records it.
                    const rooms = pickableRoomNames(currentLotRoom(ctx.lotId), ctx.draft[q.id]).sort((a, b) => a.localeCompare(b));
                    const opts = ['<option value="">— select —</option>']
                        .concat(rooms.map(o => `<option value="${escapeHtml(o)}"${o === ctx.draft[q.id] ? ' selected' : ''}>${escapeHtml(o)}</option>`));
                    ctl = `<select id="wizCtl">${opts.join('')}</select>`;
                } else if (q.type === 'number' || q.type === 'plant-count') {
                    ctl = `<input type="number" step="any" id="wizCtl" value="${val}">`;
                } else {
                    ctl = `<input type="text" id="wizCtl" value="${val}">`;
                }
                const anySame = !isInit && qs.some(x => x.sameAsLast);
                const sameSrcs = anySame ? runnerSameSources() : { daySrc: null, instSrc: null };
                const sameEnabled = (qs.some(x => x.sameAsLast && x.rowScoped) && sameSrcs.daySrc)
                    || (qs.some(x => x.sameAsLast && !x.rowScoped) && sameSrcs.instSrc);
                // Strike-out warning for the change questions — shown only when a change is
                // actually selected, so it never nags on an ordinary day.
                let strikeHint = '';
                // Strike-out warnings are daily-runner only — constant values never roll over a log.
                if (!isInit && q.type === 'phase' && ctx.draft[q.id] && ctx.draft[q.id] !== currentLotPhase(ctx.lotId)) {
                    strikeHint = `<div class="wiz-hint">⚠️ Picking <b>${escapeHtml(ctx.draft[q.id])}</b> writes the new phase to the main DB and strikes out this log when you save — after the rest of today's entry is filled in. A fresh 7-day page starts on the same day.</div>`;
                } else if (q.type === 'room' && ctx.draft[q.id] && ctx.draft[q.id] !== currentLotRoom(ctx.lotId)) {
                    strikeHint = `<div class="wiz-hint">⚠️ Picking <b>${escapeHtml(ctx.draft[q.id])}</b> writes the new room to the main DB and strikes out this log when you save — after the rest of today's entry is filled in. A fresh 7-day page starts on the same day.</div>`;
                } else if (q.type === 'plant-count' && String(ctx.draft[q.id] ?? '').trim() === '0') {
                    strikeHint = `<div class="wiz-hint">⚠️ Plant count <b>0</b> means all plants are gone — this log will be struck out when you save, after the rest of today's entry is filled in.</div>`;
                }
                bodyInner = `
                <div class="wiz-q-label">${escapeHtml(q.label)}${q.mandatory ? '<span class="wiz-mandatory" title="This question must be answered before you can continue">⚠️ Mandatory</span>' : ''}</div>
                <div class="wiz-q-ctl">${ctl}</div>
                ${strikeHint}
                ${anySame ? `<button type="button" class="wiz-same" id="wizSameBtn"${sameEnabled ? '' : ' disabled'}>⏪ Same as last time</button>` : ''}`;
            }

            // (Next/Save mandatory gating lives in updateRunnerFooter(), which rewrites only
            // the footer slot so a focused input keeps its caret.)

            const progText = isInit ? `Constant ${ctx.idx + 1} of ${qs.length}` : `Question ${ctx.idx + 1} of ${qs.length}`;
            const cardTitle = isInit
                ? `📋 Initialize paperwork — ${escapeHtml(sheet.name || ctx.sheetId)}`
                : escapeHtml(wiz.name || sheet.name);
            const card = `
            <div class="wiz-head">
                <span class="wiz-title">${cardTitle}</span>
                <span class="wiz-prog">${progText}</span>
                <button type="button" class="wiz-close" id="wizCloseBtn" title="Close">✕</button>
            </div>
            <div class="wiz-body">
                ${isInit ? '<div class="wiz-hint">These values are set once per lot and print on every page of this form — re-run any time to change them.</div>' : ''}
                ${dayChipsHtml}
                ${bodyInner}
            </div>
            <div class="wiz-foot">
                <button type="button" class="btn btn-secondary" id="wizBackBtn"${ctx.idx === 0 ? ' disabled' : ''}>← Back</button>
                <span class="spacer"></span>
                <div id="wizFootSlot"></div>
            </div>`;

            let ov = $('wizOverlay');
            if (!ov) {
                ov = document.createElement('div');
                ov.id = 'wizOverlay';
                ov.className = 'wiz-overlay';
                ov.addEventListener('mousedown', e => { if (e.target === ov) closeRunner(); });
                document.body.appendChild(ov);
                document.addEventListener('keydown', runnerEscHandler);
            }
            ov.innerHTML = `<div class="wiz-card">${card}</div>`;

            $('wizCloseBtn').addEventListener('click', closeRunner);
            $('wizBackBtn').addEventListener('click', () => runnerGo(-1));
            // Next / Save live in #wizFootSlot and are (re)built + wired by updateRunnerFooter().
            // It rewrites ONLY the footer slot, so a focused text input keeps its caret — a full
            // renderRunner() here used to rebuild the input on every keystroke and reverse text.
            updateRunnerFooter();
            const sameBtn = $('wizSameBtn');
            if (sameBtn) sameBtn.addEventListener('click', runnerSameAsLast);

            // Day chips: switch the active day and restart at question 1.
            ov.querySelectorAll('.day-chip').forEach(b => b.addEventListener('click', () => {
                ctx.day = b.dataset.day;
                ctx.idx = 0;
                resetRunnerDraft();
                renderRunner();
            }));

            if (q.type === 'initials') {
                initQuestionInitialsPad(ctx, q);
                // A mandatory initials question unlocks Next/Save as soon as the first stroke
                // lands. Update only the footer — the canvas already shows the stroke live, and a
                // full re-render would reset the name field's caret.
                if (q.mandatory) {
                    const pad = $('qInitPad');
                    pad.addEventListener('pointerup', () => updateRunnerFooter());
                    pad.addEventListener('pointercancel', () => updateRunnerFooter());
                }
                const nameEl = $('qInitName');
                nameEl.addEventListener('input', () => { ctx.draft[q.id].name = nameEl.value; });
                // Enter on the name field advances / saves like Next (same mandatory rules).
                nameEl.addEventListener('keydown', (e) => {
                    if (e.key !== 'Enter') return;
                    e.preventDefault();
                    if (isLast) (isInit ? saveInitConstants : saveRunnerEntry)();
                    else runnerGo(1);
                });
                $('qInitClearBtn').addEventListener('click', () => {
                    ctx.draft[q.id].strokes = [];
                    renderRunner();
                });
            } else {
                const ctlEl = $('wizCtl');
                ctlEl.addEventListener('input', () => {
                    ctx.draft[q.id] = ctlEl.value;
                    // A mandatory question's Next/Save button appears/disappears as the answer
                    // is typed. Update ONLY the footer slot — a full renderRunner() would rebuild
                    // this input and reset its caret to position 0, reversing typed text.
                    if (q.mandatory) updateRunnerFooter();
                });
                ctlEl.addEventListener('change', () => { ctx.draft[q.id] = ctlEl.value; });
                // Enter advances to the next question (or saves on the last one) — same rules
                // as clicking Next: blocked while a mandatory question is unanswered.
                ctlEl.addEventListener('keydown', (e) => {
                    if (e.key !== 'Enter') return;
                    e.preventDefault();
                    if (isLast) (isInit ? saveInitConstants : saveRunnerEntry)();
                    else runnerGo(1);
                });
                ctlEl.focus();
            }
        }

        // Persist the draft answers into the instance, refresh binding snapshots, and
        // re-evaluate completion (spec: snapshots captured at creation AND on every save;
        // completedAt set/cleared after every save — never a flag).
        //
        // Order matters for strike-outs: the day's FULL entry is saved first (every question,
        // including the change question), THEN any phase / room / plant-loss strike-out runs.
        // The user fills out that entire row before the sheet is struck through. A change then
        // closes this instance and starts a fresh 7-day page on the SAME day — the double entry:
        // one full entry under the old value (this log, whose move-day row is stamped with the
        // previous value), one to be filled in under the new value (the fresh page).
        async function saveRunnerEntry() {
            const ctx = runnerCtx;
