            // A live update may have made the lot read-only here since the runner opened (e.g. sent
            // to another building) — refuse like the open did; the draft stays.
            if (readOnlyHere(ctx.lotId)) return;
            const sheet = DB.paperWizard.sheets[ctx.sheetId];
            const wiz = wizardForSheet(ctx.sheetId);
            // Constant questions are never saved from the daily runner — their values live at
            // lot+sheet level (Initialize quiz), not in the instance.
            const cids = new Set(constantQuestionIds(ctx.sheetId));
            // Mandatory questions must be answered before the entry can save — same rule that
            // hides the Save button; this is the guard for direct calls / stale renders.
            for (const q of (wiz.questions || []).filter(x => !cids.has(x.id))) {
                if (!q.mandatory) continue;
                const v = ctx.draft[q.id];
                const empty = q.type === 'initials'
                    ? !(v && Array.isArray(v.strokes) && v.strokes.length)
                    : String(v ?? '').trim() === '';
                if (empty) { showToast(`"${q.label}" is mandatory — answer it before saving`); return; }
            }
            const pw = DB.paperWizard;
            if (!pw.entries[ctx.lotId]) pw.entries[ctx.lotId] = {};
            if (!pw.entries[ctx.lotId][ctx.sheetId]) pw.entries[ctx.lotId][ctx.sheetId] = { instances: {} };
            const sheetData = pw.entries[ctx.lotId][ctx.sheetId];
            if (!sheetData.instances) sheetData.instances = {};
            let inst = sheetData.instances[ctx.key];
            const instIsNew = !inst;
            if (!inst) {
                // Phase snapshot in the form's vocabulary (normalizeStage) — same as openRunner.
                // Storing the raw DB stage ('cloning') here broke instance.phase bindings and
                // checkbox checkValues that use the form words ('Cloning').
                inst = { phase: sheet.cadence === 'daily-weekly' ? normalizeStage(DB.lots[ctx.lotId]?.stage) : null,
                         room: sheet.cadence === 'daily-weekly' ? (DB.lots[ctx.lotId]?.currentRoom || null) : null,
                         header: {}, days: {}, phaseChangeDate: null, strikeInitials: null,
                         snapshots: {}, signature: null, completedAt: null, printedAt: null };
                sheetData.instances[ctx.key] = inst;
            }
            ctx.inst = inst; // keep the runner's reference on the persisted object (rollover reads ctx.inst)

            // Backup of everything this save may touch — if the user cancels at the strike-out
            // initials prompt, the whole save is rolled back (nothing saved, no write-backs,
            // runner stays open with its draft intact). Captured BEFORE any mutation below.
            // The lot record is kept by reference: a rollback restores the object this save wrote to,
            // even if a live update from SitkaTools replaced DB.data meanwhile.
            const lotRec = DB.lots[ctx.lotId] || null;
            const backup = {
                day: inst.days?.[ctx.day] ? { ...inst.days[ctx.day] } : null,
                header: { ...inst.header },
                signature: inst.signature,
                lot: lotRec
                    ? { stage: lotRec.stage, currentRoom: lotRec.currentRoom, plantCount: lotRec.plantCount }
                    : null
            };
            const restoreBackup = () => {
                // Lot write-backs first — a brand-new page has them too ("Cancel = no write-backs")
                if (backup.lot && lotRec) Object.assign(lotRec, backup.lot);
                if (instIsNew) { delete sheetData.instances[ctx.key]; return; } // nothing persisted yet
                if (backup.day) inst.days[ctx.day] = backup.day; else delete inst.days?.[ctx.day];
                inst.header = backup.header;
                inst.signature = backup.signature;
            };

            // Write-back is a property of the question TYPE (implicit — no writesTo field).
            const phaseQ = wiz.questions.find(q => q.type === 'phase');
            const roomQ = wiz.questions.find(q => q.type === 'room');
            const pcQs = wiz.questions.filter(q => q.type === 'plant-count');
            // Comparison targets — the lot's LIVE values, captured BEFORE any write-back below.
            // A change question whose answer differs from these means the lot changed phase /
            // room: write the new value back and flag the strike-out.
            const prevPhase = currentLotPhase(ctx.lotId);
            const prevRoom = currentLotRoom(ctx.lotId);
            const nvPhase = phaseQ ? String(ctx.draft[phaseQ.id] ?? '').trim() : '';
            const nvRoom = roomQ ? String(ctx.draft[roomQ.id] ?? '').trim() : '';
            // A closed log (already struck out) never rolls over again — re-opening it to fix a
            // day just saves answers. openLog gates every strike-out below.
            const openLog = sheet.cadence === 'daily-weekly' && !inst.phaseChangeDate;
            const phaseChanged = !!(openLog && nvPhase && prevPhase && normalizeStage(prevPhase) !== normalizeStage(nvPhase));
            const roomChanged = !!(openLog && nvRoom && prevRoom && String(prevRoom).trim().toLowerCase() !== nvRoom.toLowerCase());

            // Does the instance hold anything from BEFORE this save? When it doesn't (a brand-
            // new or completely empty log), a change recorded on the window's first day can
            // repurpose the instance in place as the fresh page instead of shifting it forward.
            // Computed before step 1 writes the current day.
            const preExisting = !instIsNew && (Object.keys(inst.days || {}).length > 0
                || Object.values(inst.header || {}).some(v => String(v ?? '').trim() !== ''));

            // 1) Save the day's FULL entry — every question as answered, including the change
            //    question. The old log's move-day row is a complete entry under the old value;
            //    the rollover below stamps the previous value onto it (the double entry).
            for (const q of (wiz.questions || []).filter(q => !cids.has(q.id))) {
                let v = ctx.draft[q.id];
                if (q.type === 'initials') {
                    // Drawn initials: store the {name, strokes} object (or null when the pad is
                    // empty, so a re-opened day can be re-signed).
                    v = (v && Array.isArray(v.strokes) && v.strokes.length)
                        ? { name: String(v.name || '').trim(), strokes: v.strokes }
                        : null;
                }
                if (q.rowScoped) {
                    if (!inst.days) inst.days = {};
                    if (!inst.days[ctx.day]) inst.days[ctx.day] = {};
                    // Blank answers are stored as '' (initials as null when the pad is empty) —
                    // the key's presence marks the question as confirmed for that day, which is
                    // what lets a blank-but-confirmed box count toward day completion.
                    inst.days[ctx.day][q.id] = v;
                } else {
                    if (!inst.header) inst.header = {};
                    inst.header[q.id] = v;
                }
            }
            // The master grower's signature is never captured by the daily wizard — it is set
            // only via the cabinet leaf's ✍️ Sign button (openSignatureModal), later, when he
            // reviews the paperwork at the end of a crop. Saving a day's entry leaves any
            // existing signature untouched.

            // Backfill: later days are already on file. A changed plant count / phase / room is
            // compared with what THIS day said before (not the lot's live value) and carried
            // forward through the unsigned logs (see applyBackfill).
            if (sheet.cadence === 'daily-weekly' && ctx.day && isBackfillDay(ctx.lotId, ctx.sheetId, ctx.key, ctx.day)) {
                const done = await applyBackfill(ctx, wiz, inst, backup);
                if (!done) { restoreBackup(); return; } // cancelled — nothing saved, runner stays open
                captureSnapshots(ctx.sheetId, ctx.lotId, ctx.key, inst);
                evaluateCompletion(ctx.sheetId, ctx.key, inst);
                notifySitkaTools();
                closeRunner();
                renderAll();
                showToast(done.message);
                return;
            }

            // 2) Write-backs to the main DB (PaperWizard's special permission).
            if (phaseChanged && DB.lots[ctx.lotId]) DB.lots[ctx.lotId].stage = stageFromForm(nvPhase); // 'Bloom' → 'flower'
            if (roomChanged && DB.lots[ctx.lotId]) DB.lots[ctx.lotId].currentRoom = nvRoom;
            let plantZero = false;
            for (const q of pcQs) {
                const v = String(ctx.draft[q.id] ?? '').trim();
                if (v === '') continue;
                const n = Number(v);
                const prevCount = DB.lots[ctx.lotId] ? Number(DB.lots[ctx.lotId].plantCount) : NaN;
                if (DB.lots[ctx.lotId] && prevCount !== n) DB.lots[ctx.lotId].plantCount = n;
                // Plant count 0 = all plants gone → strike out the open log (no fresh page).
                // Only when the count actually DROPPED to zero — re-saving a closed log at 0
                // must not roll over again.
                if (n === 0 && prevCount !== 0) plantZero = true;
            }

            // 3) Strike-out rollover — AFTER the day's entry is saved. The move day is the
            //    entry's own day (a backfilled entry strikes out on its own day), else today.
            let rolled = null;
            const moveDay = (sheet.cadence === 'daily-weekly' && ctx.day) ? ctx.day : todayStr();
            if (phaseChanged) {
                // Primary rollover: closes this log, stamps its move-day row with the PREVIOUS
                // phase (double entry), and starts a fresh 7-day page on the same day.
                rolled = await phaseRollover(true, moveDay, prevPhase, !preExisting); // drawn strike-initials capture; null = cancelled
                if (!rolled) { restoreBackup(); return; } // cancelled — nothing saved, runner stays open
            } else if (roomChanged) {
                rolled = await roomRollover(true, moveDay, prevRoom, !preExisting);
                if (!rolled) { restoreBackup(); return; } // cancelled — nothing saved, runner stays open
            }
            // Same-save double change: when BOTH phase and room changed, the primary rollover
            // above already ran (phase takes precedence) and its fresh log carries the new room
            // snapshot — only the write-back fired in step 2. No second strike-out (it would
            // create a phantom zero-day log). Plant-loss is skipped too when a rollover just
            // closed the log — it's struck out either way.
            if (plantZero && openLog && !rolled) {
                const pz = await plantZeroRollover(moveDay);
                if (!pz) { restoreBackup(); return; } // cancelled at the initials prompt — nothing saved
            }
            // The closed log ends in the OLD value: an instance-level change question was saved
            // with the new value in step 1 — restore the previous one so the old page records
            // the phase/room it was actually kept in. (Row-scoped answers are stamped by the
            // rollover itself; a reused instance IS the fresh log and keeps the new value.)
            if (rolled && !rolled.reused) {
                if (phaseQ && !phaseQ.rowScoped && prevPhase) inst.header[phaseQ.id] = prevPhase;
                if (roomQ && !roomQ.rowScoped && prevRoom) inst.header[roomQ.id] = prevRoom;
                // Same-save double change: the phase rollover stamped only the phase back on the
                // move-day row — that day was also kept in the previous room.
                if (phaseChanged && roomChanged && roomQ?.rowScoped && prevRoom && inst.days?.[moveDay]) inst.days[moveDay][roomQ.id] = prevRoom;
            }

            captureSnapshots(ctx.sheetId, ctx.lotId, ctx.key, inst);
            evaluateCompletion(ctx.sheetId, ctx.key, inst);
            if (rolled && !rolled.reused) {
                captureSnapshots(ctx.sheetId, ctx.lotId, rolled.newKey, rolled.inst);
                evaluateCompletion(ctx.sheetId, rolled.newKey, rolled.inst);
            }
            notifySitkaTools();
            closeRunner();
            renderAll();
            if (rolled && phaseChanged && roomChanged) {
                showToast(`Entry saved · phase change to ${rolled.value} + room change to ${nvRoom} recorded`);
                if (!rolled.reused && confirm('Start filling the new grow-log now?')) openRunner(ctx.lotId, ctx.sheetId, rolled.newKey);
            } else if (rolled) {
                showToast(phaseChanged
                    ? `Entry saved · phase change to ${rolled.value} recorded`
                    : `Entry saved · room change to ${rolled.value} recorded`);
                // Double entry on the move day: offer to run that day's entry on the fresh page.
                if (!rolled.reused && confirm('Start filling the new grow-log now?')) openRunner(ctx.lotId, ctx.sheetId, rolled.newKey);
            } else if (plantZero) {
                showToast('Entry saved · all plants removed — log struck out');
            } else {
                showToast('Entry saved');
            }
        }

        // ---- Print popup (Step 10) ----

        // Day rows for a daily-weekly sheet — derived from the sheet's explicit daily-entry
        // groups (no grid, no pitch inference). Each group contributes one row per day it has
        // boxes for; a field prints on day n at its own placed position in that group's day-n
        // member. Legacy sheets (pre-grouping: `row` flag + rowGrid) fall back to the old
        // clone-down behavior so already-configured forms keep printing.
        function dayRowsFromGroups(sheet) {
            const groups = new Map();
            for (const f of sheet.fields || []) {
                if (!f.dayGroup) continue;
                if (!groups.has(f.dayGroup)) groups.set(f.dayGroup, []);
                groups.get(f.dayGroup).push(f);
            }
            const rows = [];
            for (const [gid, members] of groups) {
                const byDay = new Map();
                for (const m of members) {
                    const d = m.day || 1;
                    if (!byDay.has(d)) byDay.set(d, []);
                    byDay.get(d).push(m);
                }
                const days = [...byDay.keys()].sort((a, b) => a - b);
                for (const d of days) rows.push({ day: d, fields: byDay.get(d) });
            }
            if (rows.length) return rows;

            // Legacy fallback: `row`-flagged fields cloned down by the stored rowGrid pitch.
            const legacy = (sheet.fields || []).filter(f => f.row && f.page === 1);
            if (!legacy.length) return null;
            const pitch = sheet.rowGrid?.pitch > 0 ? sheet.rowGrid.pitch : Math.max(...legacy.map(f => f.h));
            const count = sheet.rowGrid?.count || 7;
            return Array.from({ length: count }, (_, i) => ({ day: i + 1, fields: legacy.map(f => ({ ...f, y: f.y + i * pitch })) }));
        }

        // What is missing before an instance can be printed — drives the disabled tooltip.
        function printBlockers(sheetId, key, inst, lotId) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet) return ['Sheet not configured'];
            if (!printDoc || printDoc.sheetId !== sheetId) return [`Document "${sheetId}" not loaded this session`];
            if (!inst) return ['No entry yet — fill it first'];
            const out = [];
            // Informational (daily-weekly only): unset constant values print N/A — printing is
            // still allowed, the note just tells the user the copy isn't final.
            if (sheet.cadence === 'daily-weekly' && lotId) {
                const cids = constantQuestionIds(sheetId);
                if (cids.length) {
                    const consts = DB.paperWizard.entries[lotId]?.[sheetId]?.constants || {};
                    const unsetC = cids.filter(qid => !hasAnswer(consts, qid)).length;
                    if (unsetC) out.push(`${unsetC} constant value(s) unset`);
                }
            }
            if (instanceComplete(sheetId, key, inst)) return out;
            if (sheet.cadence === 'daily-weekly') {
                const { start, end } = activeWindow(inst, key);
                const total = daysBetween(start, end);
                let filled = 0;
                for (const d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) if (dayAnswered(inst, dateToStr(d), sheetId)) filled++;
                if (filled < total) out.push(`${total - filled} day(s) left`);
                if (sheet.signature && !inst.signature) out.push('signature missing');
                if (inst.phaseChangeDate && !inst.strikeInitials) out.push('strike initials missing');
            } else {
                const qids = instanceQuestionIds(sheetId);
                const answered = qids.filter(qid => hasAnswer(inst.header, qid)).length;
                if (answered < qids.length) out.push(`${qids.length - answered} field(s) left`);
                if (sheet.signature && !inst.signature) out.push('signature missing');
            }
            return out;
        }

        // MM/DD for the form's Date column.
        function fmtMMDD(dateStr) { const p = String(dateStr).split('-'); return p.length === 3 ? `${p[1]}/${p[2]}` : dateStr; }
        function fmtYYYYMMDD(dateStr) { const p = String(dateStr).split('-'); return p.length === 3 ? `${p[0]}/${p[1]}/${p[2]}` : dateStr; }

        // Resolve what a field prints. Snapshot-first (spec), live binding as fallback for
        // legacy instances without snapshots. Empty/missing → 'N/A' (checkboxes → empty box).
        function printFieldValue(sheet, sheetId, inst, lotId, key, f, dayDate) {
            let v;
            if (f.constant) {
                // Constant field: set once per lot via the Initialize quiz — stored at
                // lot+sheet level, shared by every instance in the chain. The explicit flag
                // wins over any stale source binding, and is checked BEFORE the dayGroup branch
                // so a constant box inside a daily-entry group prints the one lot-level value on
                // every day (that is what "constant" means). Unset → N/A below.
                v = DB.paperWizard.entries[lotId]?.[sheetId]?.constants?.[f.questionId];
            } else if (f.source) {
                // day.date / day.plantsRemoved are derived per row — never snapshotted.
                // sheetId is in the ctx: day.plantsRemoved needs it to find the plant-count question.
                if (f.source === 'day.date' || f.source === 'day.plantsRemoved') v = resolveBinding(f.source, { lotId, sheetId, key, inst, dayDate });
                // Room bindings print the room THIS log was kept in — the instance's own stored
                // room (inst.room), resolved at print time and never from a snapshot. A snapshot
                // would freeze the room as of the last save: after a room change the write-back
                // updates the live lot BEFORE snapshots refresh, so the struck-out page would
                // print the NEW room's designation instead of the old one. inst.room is set at
                // creation and never mutated; fall back to the live lot for legacy instances.
                else if (f.source === 'lot.roomDesignation' || f.source === 'lot.roomBuilding' || f.source === 'lot.currentRoom') {
                    const room = inst?.room || DB.lots[lotId]?.currentRoom;
                    v = f.source === 'lot.roomDesignation' ? roomDesignationFor(room)
                        : f.source === 'lot.roomBuilding' ? roomBuildingFor(room)
                        : (room == null ? null : String(room));
                }
                // signature.date prints the date the log was signed (yyyy/mm/dd) — resolved
                // live from inst.signature at print time, never snapshotted.
                else if (f.source === 'signature.date') v = resolveBinding('signature.date', { lotId, key, inst });
                else v = (inst.snapshots && inst.snapshots[f.source] != null) ? inst.snapshots[f.source] : resolveBinding(f.source, { lotId, key, inst });
            } else if (f.row || f.dayGroup) {
                // Row field (legacy) or daily-entry group member: that day's answer.
                v = inst.days?.[dayDate]?.[f.questionId];
            } else {
                v = inst.header?.[f.questionId];
            }
            const s = (v === null || v === undefined) ? '' : String(v).trim();
            if (f.checkbox) {
                // Match through the stage bridge so a raw DB stage ('cloning') still checks a
                // box whose checkValue is the form word ('Cloning'); fall back to a plain
                // case-insensitive compare for non-phase sources.
                const cv = f.checkValue || '';
                return { checked: !!s && !!cv && (normalizeStage(s) === normalizeStage(cv) || s.toLowerCase() === cv.toLowerCase()), text: '' };
            }
            if (!s) {
                // Unfilled day rows print BLANK, not N/A — a struck-out log's remaining days
                // stay clean under the strike line instead of filling the page with N/A. A day
                // that was saved (even with intentionally blank fields — blank-but-confirmed)
                // still prints N/A for its empty boxes; header / one-shot / event fields keep
                // the N/A default too.
                if ((f.dayGroup || f.row) && dayDate && !dayAnswered(inst, dayDate, sheetId)) return { checked: false, text: '' };
            }
            return { checked: false, text: s || 'N/A' };
        }

        // Signature as an inline SVG polyline set over the box (strokes are normalized 0–1).
        // `box` = sheet.signature geometry; `sig` = inst.signature strokes (normalized 0–1).
        // Drawn strokes (signature / per-day initials / strike-out) as an inline SVG polyline
        // set over a normalized rect. `rect` = {x,y,w,h} in 0–1 page coords; `sig` = {strokes}.
        function strokesSvgHtml(rect, sig) {
            const polys = ((sig && sig.strokes) || [])
                .filter(st => st.length >= 2)
                .map(st => `<polyline points="${st.map(p => `${(p[0] * 100).toFixed(2)},${(p[1] * 100).toFixed(2)}`).join(' ')}"/>`)
                .join('');
            return `<svg class="ov-sig" style="left:${rect.x * 100}%;top:${rect.y * 100}%;width:${rect.w * 100}%;height:${rect.h * 100}%;" viewBox="0 0 100 100" preserveAspectRatio="none">${polys}</svg>`;
        }

        // Signature as an inline SVG polyline set over the box (strokes are normalized 0–1).
        function sigSvgHtml(box, sig) { return strokesSvgHtml(box, sig); }

        // Build + open the self-contained print popup. Light theme (paper preview), one section
        // per page at physical size, %-positioned overlays, signature + strike-out as SVG.
        function openPrintPopup(lotId, sheetId, key) {
            const sheet = DB.paperWizard?.sheets?.[sheetId];
            if (!sheet || !printDoc || printDoc.sheetId !== sheetId) { showToast('Load the matching document first'); return; }
            const inst = DB.paperWizard.entries?.[lotId]?.[sheetId]?.instances?.[key];
            if (!inst) { showToast('No entry to print yet'); return; }

            const isLandscape = printDoc.pages[0].wPx > printDoc.pages[0].hPx;
            const { widthIn: W, heightIn: H } = letterPageSize(isLandscape);
            const wiz = wizardForSheet(sheetId);
            const dayRows = sheet.cadence === 'daily-weekly' ? dayRowsFromGroups(sheet) : null;
            const strike = (sheet.cadence === 'daily-weekly' && inst.phaseChangeDate) ? computeStrikeOut(sheet, inst, key) : null;

            // One overlay span for a field at normalized y.
            const overlaySpan = (f, y, val) => {
                const left = f.x * 100, top = y * 100, w = f.w * 100, h = f.h * 100;
                if (f.checkbox) {
                    // Square box sized to the field's height in inches (the placed box over the form's checkbox).
                    const boxIn = Math.max(0.08, f.h * H);
                    return `<span class="ov-cb${val.checked ? ' on' : ''}" style="left:${left}%;top:${top}%;width:${boxIn}in;height:${boxIn}in;${val.checked ? `font-size:${(boxIn * 0.72).toFixed(3)}in;` : ''}">${val.checked ? '✕' : ''}</span>`;
                }
                const fs = (f.fontSize ?? 10) / 72;
                return `<span class="ov" style="left:${left}%;top:${top}%;width:${w}%;height:${h}%;font-size:${fs}in;text-align:${f.align || 'left'};">${escapeHtml(val.text)}</span>`;
            };

            // Overlay spans for one page.
            const overlayFor = (pageNum) => {
                let html = '';
                for (const f of sheet.fields || []) {
                    if ((f.page ?? 1) !== pageNum) continue;
                    // Initials box: the field is bound to a question of type 'initials'. The drawn
                    // strokes live in that question's answer — per-day when the question is row-
                    // scoped (each group member prints its own day's strokes), instance-level
                    // otherwise. A box with no strokes prints empty.
                    const initQ = wiz.questions.find(x => x.id === f.questionId);
                    if (initQ && initQ.type === 'initials') {
                        const isRow = !!initQ.rowScoped;
                        const dayDate = isRow ? addDaysStr(key, (f.day || 1) - 1) : null;
                        const rec = isRow ? inst.days?.[dayDate]?.[f.questionId] : inst.header?.[f.questionId];
                        if (rec && Array.isArray(rec.strokes) && rec.strokes.length) html += strokesSvgHtml(f, rec);
                        continue;
                    }
                    if (f.dayGroup) {
                        // Daily-entry group member: prints on its OWN day, at its OWN placed
                        // position — no cloning, no pitch math. What you slid is what prints.
                        const dayDate = addDaysStr(key, (f.day || 1) - 1);
                        html += overlaySpan(f, f.y, printFieldValue(sheet, sheetId, inst, lotId, key, f, dayDate));
                    } else if (f.row && dayRows) {
                        // Legacy row field (pre-grouping sheet): clone down by the stored pitch.
                        for (const r of dayRows) {
                            const lf = r.fields.find(x => x.id === f.id);
                            if (!lf) continue;
                            html += overlaySpan(lf, lf.y, printFieldValue(sheet, sheetId, inst, lotId, key, f, addDaysStr(key, r.day - 1)));
                        }
                    } else {
                        html += overlaySpan(f, f.y, printFieldValue(sheet, sheetId, inst, lotId, key, f, null));
                    }
                }
                if (sheet.signature && (sheet.signature.page ?? 1) === pageNum) html += sigSvgHtml(sheet.signature, inst.signature);
                // Strike-out is computed per page — a multi-page daily form strikes each page's
                // own remaining day rows (its diagonal + initials + date in that page's coords).
                const pageStrike = strike && strike[pageNum];
                if (pageStrike && pageStrike.line) {
                    const L = pageStrike.line;
                    const fsIn = 10 / 72;
                    html += `<svg class="ov-strike" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="${L.x1 * 100}" y1="${L.y1 * 100}" x2="${L.x2 * 100}" y2="${L.y2 * 100}"/></svg>`;
                    // Strike-out initials: drawn strokes (new) or a legacy typed string.
                    const si = inst.strikeInitials;
                    if (si && typeof si === 'object' && (si.strokes || []).length) {
                        html += strokesSvgHtml(pageStrike.initialsRect, si);
                    } else if (typeof si === 'string' && si.trim()) {
                        const r = pageStrike.initialsRect;
                        html += `<span class="ov-strike-txt" style="left:${(r.x + r.w / 2) * 100}%;top:${(r.y + r.h / 2) * 100}%;font-size:${fsIn}in;">${escapeHtml(si)}</span>`;
                    }
                    html += `<span class="ov-strike-date" style="left:${pageStrike.date.x * 100}%;top:${pageStrike.date.y * 100}%;font-size:${fsIn}in;">${fmtMMDD(inst.phaseChangeDate)}</span>`;
                }
                return html;
            };

            const pages = printDoc.pages.map((pg, i) => {
                const n = i + 1;
                return `<section class="pp-page" style="width:${W}in;height:${H}in;">
                    <img src="${pg.url}" alt="" draggable="false">
                    ${overlayFor(n)}
                </section>`;
            }).join('');

            const title = `${sheet.name || sheetId} — ${lotId} · ${fmtMMDD(key)}`;
            const html = `<!doctype html><html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; font-family: Arial, Helvetica, sans-serif; }
  .pp-toolbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: #f3f4f6; border-bottom: 1px solid #d1d5db; }
  .pp-toolbar .pp-title { font-size: 13px; font-weight: 700; color: #111827; }
  .pp-print-btn { margin-left: auto; font-size: 14px; font-weight: 700; padding: 6px 16px; border: none; border-radius: 6px; background: #2563eb; color: #fff; cursor: pointer; }
  .pp-print-btn:hover { background: #1d4ed8; }
  .pp-page { position: relative; margin: 0 auto 14px; overflow: hidden; page-break-after: always; }
  .pp-page img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ov { position: absolute; margin: 0; line-height: 1.15; color: #000; overflow: hidden; word-break: break-word; }
  .ov-cb { position: absolute; display: flex; align-items: center; justify-content: center; font-weight: 700; line-height: 1; color: #000; }
  .ov-cb.on { font-size: 0.9em; }
  .ov-sig { position: absolute; overflow: visible; }
  .ov-sig polyline { fill: none; stroke: #000; stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .ov-strike { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .ov-strike line { stroke: #000; stroke-width: 2.5; vector-effect: non-scaling-stroke; }
  .ov-strike-txt, .ov-strike-date { position: absolute; transform: translate(-50%, -50%); color: #000; font-weight: 700; white-space: nowrap; }
  @page { size: ${W}in ${H}in; margin: 0; }
  @media print { .pp-toolbar { display: none; } .pp-page { margin: 0; } }
</style></head>
<body>
  <div class="pp-toolbar"><span class="pp-title">🖨️ ${escapeHtml(title)}</span><button type="button" class="pp-print-btn" onclick="window.print()">🖨️ Print</button></div>
  ${pages}
</body></html>`;

            const win = window.open('', '_blank', 'width=1000,height=1200');
            if (!win) { showToast('Popup blocked — allow popups to print'); return; }
            win.document.open();
            win.document.write(html);
            win.document.close();
            // Informational: record that this instance was rendered for print (re-print always allowed).
            // Not for a lot this building device doesn't fill — its page is in a file this device can't save.
            if (DeviceView.lotVisible(lotId) && !lotElsewhere(lotId)) {
                inst.printedAt = new Date().toISOString();
                notifySitkaTools();
            }
        }

        // The lot whose cabinet is on screen and its section keys, in drawn order — so a redraw of the
        // same lot (a live update from SitkaTools, a save) keeps the sections the user opened / closed.
        let cabDrawn = { lotId: null, keys: [] };

        function renderCabinet() {
            const panel = $('cabinetPanel');
            if (!dbLoaded) {
                panel.innerHTML = emptyStateHtml('🗄️', 'No database loaded',
                    'Open PaperWizard from SitkaTools to receive the database.');
                return;
            }
            if (!activeLotId) {
                panel.innerHTML = emptyStateHtml('🗄️', 'No lots in database',
                    'Create a lot in SitkaTools first — each lot gets its own filing cabinet.');
                return;
            }

            const lot = DB.lots[activeLotId] || null; // orphaned (closed) lots still get a cabinet
            const pw = DB.paperWizard;
            const entries = pw.entries?.[activeLotId] || {};
            const sections = {};
            CAB_SECTIONS.forEach(s => { sections[s.key] = []; });

            // One expected instance per configured one-shot sheet. The section follows the
            // sheet's Document assignment (Configure Sheets toolbar) — else the heuristics.
            for (const [sheetId, sheet] of Object.entries(pw.sheets || {})) {
                if (sheet.cadence !== 'one-shot') continue;
                const inst = entries[sheetId]?.instances?.['single'] || null;
                sections[sheetSection(sheetId) || 'propagation'].push(inst
                    ? { html: cabLeafFill(escapeHtml(sheet.name || sheetId), instanceStatus(sheetId, 'single', inst), sheetId, 'single'), missing: false }
                    : { html: cabLeafFill(escapeHtml(sheet.name || sheetId), { text: '⚠️ missing', cls: 'miss' }, sheetId, 'single'), missing: true });
            }

            // Room Cleans — two parallel trees over the same five rooms (spec): pre-move-in
            // (read-only references to the previous occupant's clean) and post-usage (this lot's
            // own fillable clean forms). Both always list all five roles so they match.
            const ROOM_ROLES = [
                ['clone', 'Clone Room'], ['veg', 'Veg Room'], ['grow', 'Grow Room'],
                ['dry', 'Dry Room'], ['trim', 'Trim Room']
            ];
            const moveIn = moveInDates(activeLotId);
            const roomNameFor = { clone: lot?.cloningRoom, veg: lot?.vegRoom, grow: lot?.destRoom, dry: lot?.dryRoom, trim: lot?.trimRoom };
            // Pre-move-in: one reference leaf per role — proof the room was cleaned before this
            // lot moved in. A room with no qualifying clean on file renders as a ⚠️ warning
            // leaf (informational, never blocks other sheets); an unassigned room is neutral.
            for (const [role, label] of ROOM_ROLES) {
                const name = roomNameFor[role];
                if (!name) {
                    sections['room-clean'].push({ html: cabLeaf(`🧼 ${label}`, { text: '— not assigned', cls: '' }), missing: false });
                    continue;
                }
                const clean = cleanBefore(name, moveIn[role] || todayStr(), activeLotId);
                sections['room-clean'].push(clean
                    ? { html: cabLeaf(`🧼 ${escapeHtml(name)} · ${fmtShort(clean.date)}`, { text: '✓ on file', cls: 'ok' }, { ref: true, from: clean.lotId, print: { lotId: clean.lotId, sheetId: clean.sheetId, key: clean.key } }), missing: false }
                    : { html: cabLeaf(`🧼 ${escapeHtml(name)}`, { text: '⚠️ missing', cls: 'miss' }), missing: true });
            }
            // Post-usage: one fillable leaf per role — this lot's own clean forms, filled when it
            // vacates the room. Each role uses the configured cleaning sheet assigned to it
            // (Document dropdown); instances are event sheets keyed by clean date, plus a
            // "New clean" leaf to start today's. These owned instances are exactly what the next
            // occupant's pre-move-in tree references.
            for (const [role, label] of ROOM_ROLES) {
                const sheetId = Object.keys(pw.sheets || {}).find(id => cleanRoomRole(id) === role) || null;
                if (!sheetId) {
                    sections['room-clean-post'].push({ html: cabLeaf(`🧼 ${label}`, { text: '⚠️ no form configured', cls: 'miss' }), missing: false });
                    continue;
                }
                const insts = entries[sheetId]?.instances || {};
                for (const key of Object.keys(insts).sort()) {
                    sections['room-clean-post'].push({
                        html: cabLeafFill(`🧼 ${label} · ${fmtShort(key)}`, instanceStatus(sheetId, key, insts[key]), sheetId, key),
                        missing: false
                    });
                }
                if (!Object.keys(insts).includes(todayStr())) {
                    sections['room-clean-post'].push({
                        html: cabLeafFill(`📅 New clean · ${label}`, { text: '⏳ due', cls: 'due' }, sheetId, todayStr()),
                        missing: false
                    });
                }
            }
            // Catch-all: cleaning sheets whose room role can't be inferred (legacy single
            // 'room-clean' assignment with no name keywords) still file here by sheet name.
            for (const [sheetId, sheet] of Object.entries(pw.sheets || {})) {
                if (!isRoomCleanSheet(sheetId) || cleanRoomRole(sheetId)) continue;
                const insts = entries[sheetId]?.instances || {};
                for (const key of Object.keys(insts).sort()) {
                    sections['room-clean-post'].push({
                        html: cabLeafFill(`🧼 ${escapeHtml(sheet.name || sheetId)} · ${fmtShort(key)}`, instanceStatus(sheetId, key, insts[key]), sheetId, key),
                        missing: false
                    });
                }
            }

            // Grow Logs — one node per daily-weekly instance, oldest first. When the lot was
            // configured in CropLabourWizard (plantingDate set), every day from planting to
            // today must sit inside some instance's active window; uncovered days get a dashed
            // backfill leaf that starts a fresh 7-day window on that past day. A daily-weekly
            // sheet files under its Document assignment (else the grow-log section).
            const growBySec = {}; // section key -> leaves
            const pushGrow = (sec, leaf) => { (growBySec[sec] ||= []).push(leaf); };
            const plantCfg = lot?._tool_CropLabourWizard || null;
            const plantingDate = (plantCfg?.plantingDate && /^\d{4}-\d{2}-\d{2}$/.test(plantCfg.plantingDate)) ? plantCfg.plantingDate : null;
            for (const [sheetId, sheet] of Object.entries(pw.sheets).filter(([, s]) => s.cadence === 'daily-weekly')) {
                const sec = sheetSection(sheetId) || 'grow-log';
                const insts = entries[sheetId]?.instances || {};
                const keys = Object.keys(insts).sort();
                for (const key of keys) {
                    pushGrow(sec, { key, sort: key, html: cabLeafFill(
                        `${fmtShort(key)}–${fmtShort(addDaysStr(key, 6))}${insts[key].phase ? ' · ' + escapeHtml(insts[key].phase) : ''}`,
                        instanceStatus(sheetId, key, insts[key]), sheetId, key) });
                }
                // Rollover: when today is outside every existing window (or no instances
                // exist yet), offer a fresh 7-day window starting today — the first entry
                // saved in it creates the new instance. With a planting date on file the
                // grow-log coverage leaves below already surface today when it's uncovered, so
                // skip the generic leaf there to avoid a duplicate (drying / trim logs have no
                // coverage leaves, so they always keep it).
                // No log yet (earlier paperwork on paper): start the first one on a chosen day,
                // with a chosen starting phase / plant count / room.
                if (keys.length === 0 && lot) {
                    pushGrow(sec, { key: 'start', sort: '', html: `<div class="cab-leaf" data-startlog="1" data-sheet="${escapeHtml(sheetId)}">
                        <span class="cab-label">📅 Start on a chosen day… · ${escapeHtml(sheet.name || sheetId)}</span>
                        <button type="button" class="cab-fill">Start…</button>
                        <span class="cab-status due">earlier days on paper</span>
                    </div>` });
                }
                const inWindow = keys.some(k => k <= todayStr() && todayStr() <= addDaysStr(k, 6));
                if (!inWindow && !(plantingDate && sec === 'grow-log')) {
                    pushGrow(sec, { key: 'new', sort: todayStr(), html: cabLeafFill(
                        `📅 Start new week · ${escapeHtml(sheet.name || sheetId)}`,
                        { text: '⏳ due', cls: 'due' }, sheetId, todayStr()) });
                }
                // Coverage from the planting date (spec): every day the plant has been around
                // needs a grow-log. Days not inside any instance's active window are grouped
                // into runs; each run becomes one backfill leaf that starts a fresh 7-day
                // window on the run's first day (covering the whole run). The section header
                // counts uncovered days as missing. Grow-logs only — drying/trim logs cover
                // their own end-of-crop windows and have no planting-date coverage rule.
                if (plantingDate && sec === 'grow-log') {
                    const covered = new Set();
                    for (const key of keys) {
                        const { start, end } = activeWindow(insts[key], key);
                        for (let d = new Date(start.getTime()); d <= end; d.setDate(d.getDate() + 1)) covered.add(dateToStr(d));
                    }
                    let runStart = null, runDays = 0;
                    const flushRun = () => {
                        if (!runStart) return;
                        pushGrow(sec, { key: 'cov-' + runStart, sort: runStart, coverage: true, html: cabLeafFill(
                            `🌱 Backfill ${fmtShort(runStart)}${runDays > 1 ? `–${fmtShort(addDaysStr(runStart, runDays - 1))}` : ''} · ${escapeHtml(sheet.name || sheetId)}`,
                            { text: `⚠️ ${runDays} day${runDays === 1 ? '' : 's'} no log`, cls: 'miss' }, sheetId, runStart) });
                        runStart = null; runDays = 0;
                    };
                    // Days before a log started on a chosen day are on paper — not missing
                    const paperBefore = entries[sheetId]?.paperBefore;
                    const coverFrom = paperBefore && paperBefore > plantingDate ? paperBefore : plantingDate;
                    for (let ds = coverFrom; ds <= todayStr(); ds = addDaysStr(ds, 1)) {
                        if (covered.has(ds)) { flushRun(); continue; }
                        if (!runStart) runStart = ds;
                        runDays++;
                    }
                    flushRun();
                }
            }
            for (const [sec, leaves] of Object.entries(growBySec)) {
                leaves.sort((a, b) => a.sort.localeCompare(b.sort));
                sections[sec] = (sections[sec] || []).concat(leaves.map(g => ({ html: g.html, missing: !!g.coverage })));
            }

            const elsewhere = lot ? lotElsewhere(activeLotId) : null; // read-only on this building device

            // IPM / Harvest / Other — event instances (room cleans handled above), plus a
            // "New entry" leaf to start today's (like "New clean"; not on a read-only lot).
            for (const [sheetId, sheet] of Object.entries(pw.sheets || {})) {
                if (sheet.cadence !== 'event') continue;
                const sec = sheetSection(sheetId);
                if (sec === 'room-clean' || !sections[sec]) continue;
                const insts = entries[sheetId]?.instances || {};
                for (const [key, inst] of Object.entries(insts)) {
                    sections[sec].push({ html: cabLeafFill(`${escapeHtml(sheet.name || sheetId)} · ${fmtShort(key)}`, instanceStatus(sheetId, key, inst), sheetId, key), missing: false });
                }
                if (!elsewhere && !Object.keys(insts).includes(todayStr())) {
                    sections[sec].push({ html: cabLeafFill(`📅 New entry · ${escapeHtml(sheet.name || sheetId)}`, { text: '— not started', cls: '' }, sheetId, todayStr()), missing: false });
                }
            }

            // Cabinet header + collapsible sections. The 'other' fallback bucket
            // only renders when it actually holds something.
            let totalDocs = 0, totalMissing = 0;
            // Open / closed as the user left them when this lot's cabinet is redrawn; a lot just
            // switched to (or a section not drawn before) starts from the default below.
            const wasOpen = {};
            if (cabDrawn.lotId === activeLotId) {
                panel.querySelectorAll('details.cab-section').forEach((d, i) => { if (cabDrawn.keys[i]) wasOpen[cabDrawn.keys[i]] = d.open; });
            }
            const shownSections = CAB_SECTIONS.filter(sec => sec.key !== 'other' || sections[sec.key].length > 0);
            const sectionHtml = shownSections.map(sec => {
                const leaves = sections[sec.key];
                const missing = leaves.filter(l => l.missing).length;
                totalDocs += leaves.length;
                totalMissing += missing;
                const countTxt = leaves.length
                    ? `${leaves.length} doc${leaves.length === 1 ? '' : 's'}${missing ? ` · <span class="cab-miss">⚠️ ${missing} missing</span>` : ''}`
                    : 'empty';
                const body = leaves.length
                    ? leaves.map(l => l.html).join('')
                    : `<div class="cab-leaf" style="opacity:.5; justify-content:center;">— none yet</div>`;
                // Default: all sections collapsed except Grow Logs (which stays open).
                const isOpen = (sec.key in wasOpen) ? wasOpen[sec.key] : sec.key === 'grow-log';
                return `<details class="cab-section"${isOpen ? ' open' : ''}>
                    <summary>${sec.icon} ${sec.label}<span class="cab-count">${countTxt}</span></summary>
                    <div class="cab-body">${body}</div>
                </details>`;
            }).join('');

            const strain = lot?.strain ? ` ${escapeHtml(lot.strain)}` : '';
            // Print-document status chip: which sheet's page set is loaded this session.
            const printDocChip = printDoc
                ? `<span class="cab-printdoc" title="Page set loaded for the print popup">📄 ${escapeHtml(printDoc.sheetId)} · ${printDoc.pages.length}p</span>`
                : `<span class="cab-printdoc none" title="No page set loaded — print buttons stay locked">📄 no document</span>`;
            // Initialize paperwork button — shown when any daily-weekly sheet for this lot has
            // constant fields (set once per lot, printed on every page of the chain). A ⚠️ marks
            // that some values are still unset.
            const initSteps = activeLotId && !elsewhere ? initQuizSteps(activeLotId) : [];
            let initBtnHtml = '';
            if (initSteps.length) {
                let unset = 0;
                for (const s of initSteps) {
                    const v = lotConstants(activeLotId, s.sheetId)?.[s.q.id];
                    if (!(v && (Array.isArray(v.strokes) ? v.strokes.length : String(v).trim()))) unset++;
                }
                initBtnHtml = `<button type="button" class="cab-initbtn${unset ? ' pending' : ''}" id="cabInitBtn" title="${unset ? `${unset} constant value(s) not yet set` : 'All constant values set — re-run to change them'}">📋 Initialize paperwork</button>`;
            }
            panel.innerHTML = `
                <div class="cab-head">🗄️ ${escapeHtml(activeLotId)}${strain} — ${totalDocs} doc${totalDocs === 1 ? '' : 's'}${totalMissing ? ` · <span style="color:var(--warning)">⚠️ ${totalMissing} missing</span>` : ''}${lot ? '' : '<div class="cab-sub">Lot no longer in database — history kept for reference.</div>'}</div>
                ${elsewhere ? `<div class="cab-warn">${escapeHtml(elsewhere.banner)}</div>` : ''}
                <div class="cab-toolbar">
                    <button type="button" class="cab-loaddoc" id="cabLoadDocBtn">📂 Load document</button>
                    ${initBtnHtml}
                    ${printDocChip}
                </div>
                ${Object.keys(pw.sheets || {}).length === 0 ? '<div class="cab-hint">No sheets configured yet — load a document and configure it in the <b>Configure Sheets</b> tab.</div>' : ''}
                ${lot && !plantingDate ? `<div class="cab-warn">⚠️ This lot has no planting date on file — run it through the <b>CropLabourWizard</b> first. Grow-log coverage (one log per day since planting) can't be checked until a planting date is set.</div>` : ''}
                ${sectionHtml}`;
            cabDrawn = { lotId: activeLotId, keys: shownSections.map(sec => sec.key) };

            // Read-only lot: no Fill / Start / Sign buttons — view and print only
            if (elsewhere) panel.querySelectorAll('.cab-fill, [data-sign]').forEach(el => el.remove());
            // Fill buttons open the wizard runner for that instance.
            panel.querySelectorAll('[data-fill]').forEach(el => {
                el.querySelector('.cab-fill')?.addEventListener('click', () =>
                    openRunner(activeLotId, el.dataset.sheet, el.dataset.key));
            });
            // "Start on a chosen day…" opens the start dialog (lot with no log yet).
            panel.querySelectorAll('[data-startlog]').forEach(el => {
                el.querySelector('.cab-fill')?.addEventListener('click', () => openStartLogModal(activeLotId, el.dataset.sheet));
            });
            // Print buttons open the print popup (only enabled when complete + doc loaded).
            panel.querySelectorAll('[data-print]').forEach(btn => {
                btn.addEventListener('click', () =>
                    openPrintPopup(btn.dataset.plot, btn.dataset.sheet, btn.dataset.key));
            });
            // Sign buttons open the signature-only modal for that instance.
            panel.querySelectorAll('[data-sign]').forEach(btn => {
                btn.addEventListener('click', () =>
                    openSignatureModal(btn.dataset.plot, btn.dataset.sheet, btn.dataset.key));
            });
            // "Load document" picker — the file base name names the sheet (wrong-revision guard).
            $('cabLoadDocBtn').addEventListener('click', () => $('printImportInput').click());
            // Initialize paperwork quiz — sets this lot's constant values (lot-level storage).
            $('cabInitBtn')?.addEventListener('click', () => openInitQuiz(activeLotId));
        }

        let configureRenderKey = '';
        function configureKey() {
            // The saved-sheet dropdown + document assignment are toolbar state: re-render
            // when the sheet list or the current assignment changes. loadedDoc MUST be in
            // the key — after a delete, reloading the same base name leaves every other
            // value unchanged, and without this the idempotency guard would skip the
            // rebuild and the stage would keep showing "No document loaded".
            return [dbLoaded, configSheetId, cfgName, cfgCadence, cfgDocument,
                loadedDoc ? `${loadedDoc.baseName}:${loadedDoc.pageCount}` : '',
                Object.keys(DB.paperWizard?.sheets || {}).sort().join(',')].join('|');
        }

        function renderConfigure() {
            const panel = $('configurePanel');
            // Idempotent: skip the rebuild (and page image reload) when nothing changed.
            const key = configureKey();
            if (key === configureRenderKey && panel.hasChildNodes()) return;
            configureRenderKey = key;

            if (!dbLoaded) {
                panel.innerHTML = emptyStateHtml('📄', 'No database loaded',
                    'Open PaperWizard from SitkaTools to receive the database.');
                return;
            }

            const loaded = !!loadedDoc;
            // Non-auto-filled columns not yet claimed by a wizard question. A daily-entry
            // column counts once (bindings are per-column), not once per day clone.
            const unboundCount = (() => {
                let n = 0;
                const seenCols = new Set();
                for (const f of cfgFields) {
                    if (f.source) continue; // auto-filled columns aren't question targets
                    if (f.dayGroup) {
                        const colKey = `${f.dayGroup}:${f.x}`;
                        if (seenCols.has(colKey)) continue;
                        seenCols.add(colKey);
                    }
                    if (!findQuestionForField(f.id)) n++;
                }
                return n;
            })();
            // A saved sheet is "selected" when the current configuration belongs to a sheet
            // that's already in the DB — that's when the Document dropdown and 🗑 apply.
            const savedSelected = !!(configSheetId && DB.paperWizard.sheets[configSheetId]);
            panel.innerHTML = `
                <div class="cfg-toolbar">
                    <button type="button" class="btn btn-primary" id="loadDocBtn">⬆️ Load document</button>
                    <div class="form-group">
                        <label for="savedSheetSelect">Configured sheet</label>
                        <select id="savedSheetSelect" title="Open a saved sheet's configuration for editing">
                            <option value="">— Select saved sheet —</option>
                            ${Object.entries(DB.paperWizard.sheets).map(([id, s]) => `<option value="${escapeHtml(id)}"${configSheetId === id ? ' selected' : ''}>${escapeHtml(s.name || id)}</option>`).join('')}
                        </select>
                    </div>
                    <button type="button" class="btn btn-secondary db-btn" id="exportSheetBtn" title="Export the selected sheet's configuration (layout + wizard) as a .json file"${savedSelected ? '' : ' disabled'}>📤 Export</button>
                    <button type="button" class="btn btn-secondary db-btn" id="importSheetBtn" title="Import a sheet configuration from a .json file">📥 Import</button>
                    <button type="button" class="btn btn-danger db-btn" id="delSavedSheetBtn" title="Delete the selected configured sheet (and its wizard) from the database"${savedSelected ? '' : ' disabled'}>🗑</button>
                    ${savedSelected ? `<div class="form-group">
                        <label for="sheetDocSelect">Document</label>
                        <select id="sheetDocSelect" title="Which filing-cabinet document this sheet is assigned to">
                            <option value="">— unassigned —</option>
                            ${SHEET_DOCUMENTS.map(([v, l]) => `<option value="${v}"${cfgDocument === v ? ' selected' : ''}>${l}</option>`).join('')}
                        </select>
                    </div>` : ''}
                    ${loaded ? `<span class="file-chip" id="docChip">📄 ${escapeHtml(loadedDoc.name)} · ${cfgPageCount} page${cfgPageCount > 1 ? 's' : ''} · US Letter ${orientation} · ${letterPageSize(orientation === 'landscape').widthIn} × ${letterPageSize(orientation === 'landscape').heightIn} in</span>` : ''}
                    ${loaded ? `<div class="zoom-ctl" title="Zoom the pages (or Ctrl/⌘ + scroll)">
                        <button type="button" id="zoomOutBtn" title="Zoom out">−</button>
                        <span id="zoomPct">100%</span>
                        <button type="button" id="zoomInBtn" title="Zoom in">+</button>
                        <button type="button" id="zoomFitBtn" title="Fit to width">⤢</button>
                    </div>` : ''}
                </div>
                <div class="cfg-grid">
                    <div class="page-stage" id="pageStage">
                        ${loaded
                            ? `<div class="page-stack">${Array.from({ length: cfgPageCount }, (_, i) => {
                                const n = i + 1;
                                const pg = loadedDoc.pages[n - 1];
                                return `<div>
                                    ${cfgPageCount > 1 ? `<div class="page-label">Page ${n} of ${cfgPageCount}</div>` : ''}
                                    <div class="form-page" data-page="${n}" style="aspect-ratio:${pg.wPx} / ${pg.hPx};"><img src="${pg.url}" alt="" draggable="false">${pageBoxesHtml(n)}</div>
                                </div>`;
                            }).join('')}</div>`
                            : emptyStateHtml('📄', 'No document loaded',
                                'Tap ⬆️ Load document to pick the controlled form pages (WebP, named <base>-p1.webp, -p2.webp…). Held in memory only — never stored (the Golden Rule). The base name becomes the sheet id.')}
                    </div>
                    <div class="cfg-side">
                        <div class="card">
                            <div class="card-title">Sheet</div>
                            <div class="form-group" style="margin-bottom:10px;">
                                <label for="sheetNameInput">Name</label>
                                <input type="text" id="sheetNameInput" value="${escapeHtml(cfgName)}" placeholder="e.g., Weekly Grow-Log">
                            </div>
                            <div class="form-group">
                                <label for="cadenceSelect">Cadence</label>
                                <select id="cadenceSelect">
                                    <option value="one-shot"${cfgCadence === 'one-shot' ? ' selected' : ''}>one-shot — one instance per lot</option>
                                    <option value="daily-weekly"${cfgCadence === 'daily-weekly' ? ' selected' : ''}>daily-weekly — rolling 7-day windows</option>
                                    <option value="event"${cfgCadence === 'event' ? ' selected' : ''}>event — one instance per event date</option>
                                </select>
                            </div>
                            ${cfgCadence === 'daily-weekly' ? `
                            <div id="dayGroupHint" style="margin-top:10px;">
                                <label style="font-size:0.75rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim);">Daily entry (7-day rows)</label>
                                <p class="cfg-hint">Place the day-1 boxes over the form's first day row, then select them all (Shift-click or Shift-drag) and hit <b>🔗 Group as daily entry</b> in the Field properties panel — days 2–N become real boxes you slide into position. Drag a member to move the whole group; hold <b>Ctrl/⌘</b> to move just that day's row, or <b>Alt/⌥</b> to move just that one box (for exact per-row placement); ✂️ Ungroup removes the day 2–N boxes.</p>
                            </div>` : ''}
                            <button type="button" class="btn btn-secondary" id="addSigBtn" style="width:100%; margin-top:12px; min-height:42px;">✍️ Add signature box</button>
                        </div>
                        <div class="card">
                            <div class="card-title">Field properties</div>
                            ${fieldPropertiesPanelHtml()}
                        </div>
                        <div class="card wizard-card">
                            <div class="card-title">Wizard builder</div>
                            <div class="form-group" style="margin-bottom:10px;">
                                <label for="wizNameInput">Wizard name</label>
                                <input type="text" id="wizNameInput" value="${escapeHtml(cfgWizard?.name || '')}" placeholder="e.g., Grow-Log Daily Entry">
                            </div>
                            <p class="cfg-hint" style="margin-bottom:10px;">Ordered questions that fill this sheet's non-auto-filled fields. ${unboundCount} field(s) still waiting for a question.</p>
                            <button type="button" class="btn btn-secondary" id="addQuestionBtn" style="width:100%; min-height:40px;">＋ Add question</button>
                            <div class="q-list" id="wizBody" style="margin-top:12px;"></div>
                        </div>
                        <div class="save-row">
                            <button type="button" class="btn btn-primary" id="saveSheetBtn"${loaded ? '' : ' disabled'} title="Save the sheet + wizard to the database">💾 Save sheet</button>
                            <button type="button" class="btn btn-danger" id="deleteSheetBtn"${loaded ? '' : ' disabled'}>🗑 Delete sheet</button>
                        </div>
                    </div>
                </div>`;

            $('loadDocBtn').addEventListener('click', () => $('pageImportInput').click());
            // Saved-sheet dropdown: open a configured sheet's working copies. Page images
            // are never stored (Golden Rule) — if the loaded document doesn't match, it is
            // revoked and the stage asks for a fresh just-in-time load. Re-selecting the
            // current sheet is a no-op so an accidental touch never discards unsaved edits.
            $('savedSheetSelect').addEventListener('change', () => {
                const id = $('savedSheetSelect').value;
                if (id && id !== configSheetId) openSavedSheet(id);
            });
            // 🗑 beside the dropdown deletes the selected saved sheet — same path as the
            // Save-row delete (enabled only while a saved sheet is the current one).
            $('delSavedSheetBtn').addEventListener('click', deleteSheet);
            // Per-sheet import/export: export bundles the selected sheet's layout + wizard(s)
            // into a .json; import installs such a bundle (page images are never in the file).
            // stopPropagation so the document click handler doesn't close the save popup we just opened.
            $('exportSheetBtn').addEventListener('click', (e) => { e.stopPropagation(); exportSheetConfig(configSheetId); });
            $('importSheetBtn').addEventListener('click', () => $('sheetImportInput').click());
            // Document assignment: persisted immediately (metadata, not layout) so the
            // Filing Cabinet re-files the sheet without waiting for 💾 Save.
            $('sheetDocSelect')?.addEventListener('change', () => {
                cfgDocument = $('sheetDocSelect').value || null;
                if (configSheetId && DB.paperWizard.sheets[configSheetId]) {
                    DB.paperWizard.sheets[configSheetId].document = cfgDocument;
                    notifySitkaTools();
                }
                renderAll();
            });
            $('sheetNameInput').addEventListener('change', () => { cfgName = $('sheetNameInput').value.trim(); });
            // Cadence change re-renders the panel (the daily-entry hint is cadence-specific).
            $('cadenceSelect').addEventListener('change', () => {
                cfgCadence = $('cadenceSelect').value;
                renderConfigure();
            });
            $('addSigBtn').addEventListener('click', addSignatureBox);

            // Wizard builder (Step 4)
            refreshWizardBuilder();
            $('wizNameInput').addEventListener('change', () => { if (cfgWizard) cfgWizard.name = $('wizNameInput').value.trim(); });
            $('addQuestionBtn').addEventListener('click', addCfgQuestion);
            $('saveSheetBtn').addEventListener('click', saveSheet);
            $('deleteSheetBtn').addEventListener('click', deleteSheet);

            if (loaded) {
                attachBoxEditor($('pageStage'));
                wireFieldProperties();
                $('zoomInBtn').addEventListener('click', () => setZoom(cfgZoom + 0.25));
                $('zoomOutBtn').addEventListener('click', () => setZoom(cfgZoom - 0.25));
                $('zoomFitBtn').addEventListener('click', () => setZoom(1));
                const stage = $('pageStage');
                stage.addEventListener('wheel', (e) => {
                    if (!(e.ctrlKey || e.metaKey)) return;   // plain scroll still scrolls the page
                    e.preventDefault();
                    setZoom(cfgZoom + (e.deltaY < 0 ? 0.1 : -0.1));
                }, { passive: false });
                requestAnimationFrame(updateFitWidth);
                applyZoom();
            }
        }

        // ---- Wizard builder (Step 4) ----
        function addCfgQuestion() {
            if (!cfgWizard) return;
            const q = { id: generateFieldId(), label: `Question ${cfgWizard.questions.length + 1}`, type: 'text', options: [], rowScoped: false, sameAsLast: false, mandatory: false, prefillFrom: null };
            cfgWizard.questions.push(q);
            cfgQuestionSel = q.id;
            refreshWizardBuilder();
        }

        // Write-back is implicit by question type (spec): a plant-count question writes
        // lot.plantCount, a phase question writes lot.stage, a room question writes
        // lot.currentRoom. There is no per-question write-back setting to configure.

        // Report metrics (question.metric, unit in question.metricUnit): tag a question so EmployeeWizard's
        // Reports tab can find its answers. Display-only for PaperWizard — nothing here reads it. The same
        // keys live in EmployeeWizard (REPORT_METRICS) — keep the two lists in step (EmployeeWizard/REPORTS.md).
        const REPORT_METRIC_GROUPS = [
            ['Harvest & lab — once per lot', [
                ['harvest.wetWeight', 'Wet weight (drying room, harvest day)', 'weight'],
                ['harvest.dryWeight', 'Dry weight (whole lot after drying)', 'weight'],
                ['harvest.bigs', 'Flower — bigs', 'weight'],
                ['harvest.mids', 'Flower — mids', 'weight'],
                ['harvest.smalls', 'Flower — smalls', 'weight'],
                ['harvest.popcorn', 'Flower — popcorn', 'weight'],
                ['harvest.flowerTotal', 'Flower — total of all grades (only if grades aren’t weighed)', 'weight'],
                ['harvest.trim', 'Trim weight', 'weight'],
                ['harvest.potency', 'Potency — total THC %', 'pct'],
                ['harvest.terpenes', 'Terpenes — total %', 'pct'],
                ['harvest.plantsHarvested', 'Plants harvested', 'count']]],
            ['Grow log — daily', [
                ['env.temp', 'Room temperature', 'temp'], ['env.rh', 'Relative humidity %', 'number'],
                ['env.co2', 'CO₂ (ppm)', 'number'], ['env.par', 'PAR', 'number'],
                ['env.lightPct', 'Light intensity (%) — scales the lighting power estimate day by day', 'number'],
                ['feed.ph', 'Feed pH', 'number'], ['feed.ec', 'Feed EC', 'number'],
                ['feed.nutrient', 'Nutrient used (mL) — several questions add up', 'number'],
                ['water.total', 'Water used (L)', 'number'], ['water.perPlant', 'Irrigation per plant (L)', 'number'],
                ['water.runoff', 'Runoff volume (mL)', 'number'],
                ['runoff.ec', 'Runoff EC — several tests are averaged', 'number'], ['runoff.ph', 'Runoff pH — several tests are averaged', 'number'],
                ['ipm.pests', 'New pests found (YES/NO)', 'yesno'], ['ipm.disease', 'Diseased plants found (YES/NO)', 'yesno'],
                ['ipm.herm', 'Hermaphrodites / males found (YES/NO)', 'yesno'], ['ipm.issue', 'Other issues observed (YES/NO)', 'yesno']]]
        ];
        const REPORT_METRIC_KIND = Object.fromEntries(REPORT_METRIC_GROUPS.flatMap(([, list]) => list.map(([k, , kind]) => [k, kind])));
        const REPORT_METRIC_UNITS = { weight: [['g', 'grams'], ['kg', 'kilograms'], ['lb', 'pounds']], temp: [['F', '°F'], ['C', '°C']] };

        function metricControlsHtml(q) {
            if (q.type === 'plant-count') return `<div class="form-group"><label>Report metric</label><div class="q-bind-indicator">🌱 Plant counts feed the reports automatically</div></div>`;
            if (!['text', 'number', 'select'].includes(q.type)) return '';
            const opts = `<option value="">— none —</option>` + REPORT_METRIC_GROUPS.map(([group, list]) =>
                `<optgroup label="${escapeHtml(group)}">${list.map(([k, l]) => `<option value="${k}"${q.metric === k ? ' selected' : ''}>${escapeHtml(l)}</option>`).join('')}</optgroup>`).join('');
            const units = REPORT_METRIC_UNITS[REPORT_METRIC_KIND[q.metric]];
            const unitSel = units ? `<div class="form-group"><label>Answered in</label><select class="q-metric-unit">${units.map(([v, l]) => `<option value="${v}"${(q.metricUnit || units[0][0]) === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>` : '';
            const stale = q.metric && !REPORT_METRIC_KIND[q.metric] ? `<option value="${escapeHtml(q.metric)}" selected>${escapeHtml(q.metric)} (unknown)</option>` : '';
            return `<div class="form-group" title="Tag this question so the Labour & Cost Wizard's Reports can chart its answers"><label>Report metric</label><select class="q-metric">${opts}${stale}</select></div>${unitSel}${productControlsHtml(q)}`;
        }

        // A fertilizer amount (feed.nutrient, mL) needs its product to be priced: either always the same product
        // (q.metricProduct = { name }), or whatever another question that day says (q.metricProduct = { from: qid } —
        // e.g. "Core or Fade?"). The Labour & Cost Wizard prices it from CropLabourWizard's price list by name.
        function productControlsHtml(q) {
            if (q.metric !== 'feed.nutrient') return '';
            const p = q.metricProduct || {};
            const mode = p.from ? 'from' : p.name != null ? 'fixed' : '';
            const sources = cfgWizard.questions.filter(x => x.id !== q.id && x.type === 'select');
            return `<div class="form-group q-full" title="Which product this amount is — priced from the CropLabourWizard price list by the same name">
                <label>Product (for the cost of each mL)</label>
                <div class="q-product">
                    <select class="q-product-mode">
                        <option value=""${!mode ? ' selected' : ''}>— not set —</option>
                        <option value="fixed"${mode === 'fixed' ? ' selected' : ''}>Always this product</option>
                        <option value="from"${mode === 'from' ? ' selected' : ''}>The answer to another question</option>
                    </select>
                    ${mode === 'fixed' ? `<input type="text" class="q-product-name" value="${escapeHtml(p.name || '')}" placeholder="e.g., Activator">` : ''}
                    ${mode === 'from' ? `<select class="q-product-from">${sources.map(x => `<option value="${x.id}"${p.from === x.id ? ' selected' : ''}>${escapeHtml(x.label || x.id)} (${escapeHtml((x.options || []).join(' / '))})</option>`).join('') || '<option value="">no select questions on this wizard</option>'}</select>` : ''}
                </div>
            </div>`;
        }

        function questionCardHtml(q, i) {
            const n = cfgWizard.questions.length;
            // Read-only binding indicator — the assignment itself lives on the field side
            // (Field properties → "Filled by question"). Fields carrying this question's id,
            // one entry per column: a daily-entry column counts once ("· all days 🔗"); a
            // group may hold several columns, each with its own binding.
            const seenCols = new Set();
            const bindLabels = [];
            for (const f of cfgFields) {
                if (f.questionId !== q.id) continue;
                const colKey = f.dayGroup ? `${f.dayGroup}:${f.x}` : f.id;
                if (seenCols.has(colKey)) continue;
                seenCols.add(colKey);
                bindLabels.push(f.dayGroup ? `${f.label || f.id} · all days 🔗` : (f.label || f.id));
            }
            // Read-only marker: this question fills a constant field, so it is asked in the
            // cabinet's Initialize quiz (once per lot) and skipped by the daily runner.
            const isConstQ = cfgFields.some(f => f.questionId === q.id && f.constant);
            const prefillOpts = `<option value="">— none —</option>` +
                BINDING_OPTIONS.map(([v, l]) => `<option value="${v}"${q.prefillFrom === v ? ' selected' : ''}>${l}</option>`).join('');
            return `
                <div class="q-card" data-qid="${q.id}">
                    <div class="q-head">
                        <span class="q-num">Q${i + 1}</span>
                        <span class="q-id">${escapeHtml(q.id)}</span>
                        <span class="q-spacer"></span>
                        <button type="button" class="q-btn q-up" title="Move up"${i === 0 ? ' disabled' : ''}>↑</button>
                        <button type="button" class="q-btn q-down" title="Move down"${i === n - 1 ? ' disabled' : ''}>↓</button>
                        <button type="button" class="q-btn q-del" title="Delete question">🗑</button>
                    </div>
                    <div class="q-controls">
                        <div class="form-group q-full"><label>Label</label><input type="text" class="q-label" value="${escapeHtml(q.label)}" placeholder="e.g., Temp high (°C)?"></div>
                        <div class="form-group"><label>Type</label><select class="q-type">
                            <option value="text"${q.type === 'text' ? ' selected' : ''}>text</option>
                            <option value="number"${q.type === 'number' ? ' selected' : ''}>number</option>
                            <option value="select"${q.type === 'select' ? ' selected' : ''}>select</option>
                            <option value="initials"${q.type === 'initials' ? ' selected' : ''}>✍️ initials</option>
                            <option value="plant-count"${q.type === 'plant-count' ? ' selected' : ''}>🌱 plant count</option>
                            <option value="phase"${q.type === 'phase' ? ' selected' : ''}>🔄 phase</option>
                            <option value="room"${q.type === 'room' ? ' selected' : ''}>🏠 room</option>
                        </select></div>
                        <div class="form-group q-full"><label>Fills field</label><div class="q-bind-indicator">${bindLabels.length ? bindLabels.map(escapeHtml).join(', ') : 'Not bound to any field (notes only) — assign it in the Field properties panel'}${isConstQ ? ' <span style="color:#f3c14b;">📌 constant — set via Initialize paperwork, skipped by the daily runner</span>' : ''}</div></div>
                        ${q.type === 'select' ? `<div class="form-group q-full"><label>Options (one per line)</label><textarea class="q-options" rows="3" placeholder="Veg&#10;Bloom">${escapeHtml((q.options || []).join('\n'))}</textarea></div>` : ''}
                        ${q.type === 'phase' ? `<p class="cfg-hint" style="margin:6px 0 0;">The runner shows a drop-down of the phases the lot can change TO (the fixed vocabulary minus its current phase). Picking a different phase writes it back to the main DB and strikes out this log once that day's entry is saved — a fresh 7-day page starts on the same day for the double entry.</p>` : ''}
                        ${q.type === 'room' ? `<p class="cfg-hint" style="margin:6px 0 0;">Options are the rooms known to the DB (no custom list). Picking a different room writes lot.currentRoom back to the main DB and strikes out this log once that day's entry is saved — a fresh 7-day page starts on the same day for the double entry.</p>` : ''}
                        <div class="form-group"><label>Prefill from</label><select class="q-prefill">${prefillOpts}</select></div>
                        ${metricControlsHtml(q)}
                    </div>
                    <div class="q-checks">
                        <label class="q-check"><input type="checkbox" class="q-row"${q.rowScoped ? ' checked' : ''}> Row-scoped (per day)</label>
                        <label class="q-check"><input type="checkbox" class="q-same"${q.sameAsLast ? ' checked' : ''}> ⏪ Same-as-last offered</label>
                        <label class="q-check"><input type="checkbox" class="q-mand"${q.mandatory ? ' checked' : ''}> ⚠️ Mandatory response</label>
                    </div>
                </div>`;
        }

        // Light refresh: re-render only the question list (never the page images).
        function refreshWizardBuilder() {
            const body = $('wizBody');
            if (!body || !cfgWizard) return;
            body.innerHTML = cfgWizard.questions.length
                ? cfgWizard.questions.map((q, i) => questionCardHtml(q, i)).join('')
                : '<p class="cfg-hint">No questions yet — add the first one above.</p>';
            wireWizardBuilder();
            // A selected field's "Filled by question" dropdown lists these questions —
            // redraw it so new/renamed/deleted questions show up there too.
            refreshCfgOverlays();
        }

        function wireWizardBuilder() {
            document.querySelectorAll('#wizBody .q-card').forEach(card => {
                const q = cfgWizard.questions.find(x => x.id === card.dataset.qid);
                if (!q) return;
                card.querySelector('.q-label').addEventListener('change', () => { q.label = card.querySelector('.q-label').value.trim(); refreshCfgOverlays(); });
                card.querySelector('.q-type').addEventListener('change', () => {
                    q.type = card.querySelector('.q-type').value;
                    if (!['text', 'number', 'select'].includes(q.type)) { delete q.metric; delete q.metricUnit; delete q.metricProduct; }   // only typed answers feed report metrics
                    refreshWizardBuilder();
                });
                const optsEl = card.querySelector('.q-options');
                if (optsEl) optsEl.addEventListener('change', () => {
                    q.options = optsEl.value.split(/\n|,/).map(s => s.trim()).filter(Boolean);
                    refreshCfgOverlays();
                });
                // No "Fills field" control here — the binding is assigned from the field's
                // properties panel (field.questionId is the single source of truth).
                card.querySelector('.q-prefill').addEventListener('change', () => { q.prefillFrom = card.querySelector('.q-prefill').value || null; refreshCfgOverlays(); });
                // Report metric: saved with the sheet (💾 Save), like every other question setting
                const metricEl = card.querySelector('.q-metric');
                if (metricEl) metricEl.addEventListener('change', () => {
                    if (metricEl.value) q.metric = metricEl.value; else delete q.metric;
                    if (q.metric !== 'feed.nutrient') delete q.metricProduct;
                    const units = REPORT_METRIC_UNITS[REPORT_METRIC_KIND[q.metric]];
