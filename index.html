<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitka</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .logo {
            max-width: 300px;
            margin-bottom: 40px;
        }
        .btn {
            padding: 16px 32px;
            font-size: 18px;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #1558b0;
        }
    </style>
</head>
<body>
    <img src="SitkaTools/sitkablack.png" alt="Sitka Logo" class="logo">
    <a href="SitkaTools/SitkaTools.html" class="btn">Open Sitka Tools</a>

</html>
